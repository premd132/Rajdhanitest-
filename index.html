<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Family Pattern 1.2.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --red: #ff4757; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; box-shadow: 0 0 30px #000; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; }
        .circle-red { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 71, 87, 0.2); }
        .circle-blue { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(0, 132, 255, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); min-height: 150px; }
        .check-item { background: #2d3748; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; border-left: 5px solid var(--green); display: flex; flex-direction: column; transition: 0.2s; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 20px; color: #000; width: 95%; max-width: 450px; max-height: 80vh; overflow-y: auto; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 15px; }
    </style>
</head>
<body>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv-file" style="display:none" accept=".csv">
        <button onclick="document.getElementById('csv-file').click()" style="background:#555; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:var(--green); color:#000;">💾 SAVE</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3 style="color:var(--gold); margin:0 0 10px 0;">✔ Check Line 1.2.3</h3>
            <div id="check-list">Click a (**) cell...</div>
        </div>
        <div class="card">
            <h3 style="color:var(--gold); margin:0 0 10px 0;">🔮 Future AI</h3>
            <div id="future-ai" style="font-size: 20px; color: var(--green); text-align: center; font-weight: 800;">--</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white;">X</button>
    <h3 style="margin: 0 0 15px 0;">Family Pattern Match</h3>
    <div id="popData"></div>
</div>

<script>
const FAMILY = {"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("kalyan_v5")) || [["11","22","33","44","55","66"],["**","**","**","**","**","**"]];
let activeMark = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){ v=String(v).trim(); if(v==""||v=="**") return "**"; return v.length==1?"0"+v:v; }
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || fam(a)===fam(b); }

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let cls = "";
            if(activeMark && isPartOf(ri, ci) === 1) cls = "circle-red";
            if(activeMark && isPartOf(ri, ci) === 2) cls = "circle-blue";
            h+=`<td class="${cls}" onclick="handleCellClick(${ri},${ci})">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activeMark) setTimeout(()=>renderLines("mainCanvas", "tbl"), 50);
}

function handleCellClick(r, c) {
    if(data[r][c] === "**") runAnalysis(r, c);
    else {
        let val = prompt("Edit Value:", data[r][c]);
        if(val !== null) { data[r][c] = norm(val); draw(); }
    }
}

function isPartOf(ri, ci){
    if(!activeMark) return 0;
    let offset = ri - activeMark.start;
    if(offset >= 0 && offset < activeMark.shape.length) return activeMark.shape[offset][ci];
    return 0;
}

function runAnalysis(r, c) {
    let bases = [];
    for(let i=r-1; i>=0; i--){
        if(data[i][c] !== "**" && !bases.includes(fam(data[i][c]))) {
            bases.push(data[i][c]);
            if(bases.length >= 2) break;
        }
    }
    
    let shape = [];
    for(let i=Math.max(0, r-6); i<r; i++){
        let row = [];
        for(let j=0; j<3; j++){
            if(smartMatch(data[i][j], bases[0])) row.push(1);
            else if(smartMatch(data[i][j], bases[1])) row.push(2);
            else row.push(0);
        }
        shape.push(row);
    }

    let matches = [];
    for(let i=0; i < data.length - shape.length; i++){
        let score = 0;
        for(let k=0; k<shape.length; k++){
            for(let j=0; j<3; j++){
                if(shape[k][j]===1 && smartMatch(data[i+k][j], bases[0])) score++;
                if(shape[k][j]===2 && smartMatch(data[i+k][j], bases[1])) score++;
            }
        }
        if(score >= 2) matches.push({index: i, score: score});
    }

    let list = document.getElementById("check-list");
    list.innerHTML = "";
    matches.sort((a,b)=>b.score - a.score).slice(0, 3).forEach((m, idx) => {
        let fut = (m.index + shape.length < data.length) ? data[m.index + shape.length][c] : "??";
        let div = document.createElement("div");
        div.className = "check-item";
        div.innerHTML = `<strong>Check Line ${idx+1}</strong><span>Pattern Score: ${m.score}</span><span style="color:var(--gold)">Future Result: ${fut}</span>`;
        div.onclick = () => {
            activeMark = {start: m.index, shape: shape};
            document.getElementById("future-ai").innerText = fut;
            draw();
            showPopup(m.index, shape);
        };
        list.appendChild(div);
    });
}

function showPopup(start, shape) {
    let h = "<table style='width:100%; border-collapse:collapse; color:#000;'>";
    for(let i=0; i<shape.length; i++){
        h += "<tr>";
        data[start+i].forEach((v, j) => {
            let cls = shape[i][j]===1 ? "circle-red" : (shape[i][j]===2 ? "circle-blue" : "");
            h += `<td style='border:1px solid #ddd; padding:8px; text-align:center;' class='${cls}'>${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popData").innerHTML = h + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function renderLines(cvsId, containerId) {
    const cvs = document.getElementById(cvsId);
    const cont = document.getElementById(containerId);
    const ctx = cvs.getContext("2d");
    cvs.width = cont.offsetWidth; cvs.height = cont.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const drawP = (cls, col) => {
        let dots = cont.querySelectorAll("."+cls);
        if(dots.length < 2) return;
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
        dots.forEach((d, i) => {
            let r = d.getBoundingClientRect(), p = cont.getBoundingClientRect();
            let x = r.left - p.left + r.width/2, y = r.top - p.top + r.height/2;
            if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };
    drawP("circle-red", "#ff4757"); drawP("circle-blue", "#0084ff");
}

document.getElementById("csv-file").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => { data = fr.result.split("\n").filter(l=>l.trim()).map(l=>l.split(",").map(v=>norm(v))); draw(); };
    fr.readAsText(e.target.files[0]);
};
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("kalyan_v5", JSON.stringify(data)); alert("Saved!"); }
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
draw();
</script>
</body>
</html>
