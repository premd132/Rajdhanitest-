<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>DPBossKing Style Pro Pattern Tool</title>
<style>
    body { font-family: 'Segoe UI', Arial; background: #1a1a1a; color: white; margin: 0; text-align: center; }
    .header { background: #b71c1c; padding: 15px; border-bottom: 4px solid #ffd600; font-size: 22px; font-weight: bold; }
    .toolbar { background: #333; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; border-bottom: 1px solid #444; }
    
    .chart-container { position: relative; margin: 20px auto; display: inline-block; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    table { border-collapse: collapse; color: #000; position: relative; z-index: 2; background: transparent; }
    th, td { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-weight: bold; font-size: 18px; cursor: cell; position: relative; }
    th { background: #f0f0f0; font-size: 12px; height: 30px; }

    /* Screenshot Styles */
    .base-box { border: 3px solid red !important; background: rgba(255, 0, 0, 0.1); color: red; }
    .pattern-circle { border: 3px solid blue !important; border-radius: 50%; color: blue; }
    #lineCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }

    button { padding: 10px 20px; cursor: pointer; background: #ffd600; border: none; font-weight: bold; border-radius: 4px; }
    .btn-check { background: #2196F3; color: white; }
    .btn-save { background: #4CAF50; color: white; }
    input[type="file"] { background: #444; color: white; padding: 5px; }
</style>
</head>
<body>

<div class="header">PRO 3rd TOUCH PATTERN - DPBOSS STYLE</div>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" onchange="handleCSV()">
    <select id="daySel">
        <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
        <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
    </select>
    <button class="btn-check" onclick="applyMasterPattern()">RUN CHECK LINE</button>
    <button onclick="clearAll()" style="background:#666; color:white;">RESET</button>
    <button class="btn-save" onclick="saveToLocal()">SAVE DATA</button>
</div>

<div class="chart-container" id="chartBox">
    <canvas id="lineCanvas"></canvas>
    <table id="mainTable">
        <thead>
            <tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
// Family Matching Logic
const families = {
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"], "45":["04","09","40","45","54","59","90","95"]
};

let chartData = JSON.parse(localStorage.getItem('dp_master_data')) || [
    ["12","37","45","67","89","00"],["56","23","11","90","44","33"],
    ["32","82","77","12","05","99"],["10","20","30","40","50","60"],
    ["47","37","14","25","36","47"],["21","73","00","11","22","33"]
];

function getFamily(val) {
    for(let k in families) if(families[k].includes(val)) return families[k];
    return [val, val.split('').reverse().join('')]; 
}

function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = chartData.map((row, rIdx) => `
        <tr>${row.map((cell, cIdx) => `
            <td contenteditable="true" 
                onclick="manualMark(this)" 
                onblur="chartData[${rIdx}][${cIdx}]=this.innerText">${cell}</td>
        `).join('')}</tr>
    `).join('');
    setTimeout(resizeCanvas, 100);
}

// Manual Marking: Click to cycle through Red Box -> Blue Circle -> Clear
function manualMark(td) {
    if (td.classList.contains('base-box')) {
        td.classList.remove('base-box');
        td.classList.add('pattern-circle');
    } else if (td.classList.contains('pattern-circle')) {
        td.classList.remove('pattern-circle');
    } else {
        td.classList.add('base-box');
    }
}

function resizeCanvas() {
    const canvas = document.getElementById('lineCanvas');
    const box = document.getElementById('chartBox');
    canvas.width = box.scrollWidth;
    canvas.height = box.scrollHeight;
}

// THE MAIN TRICK: Apply Master Pattern from Bottom to History
function applyMasterPattern() {
    const day = parseInt(document.getElementById('daySel').value);
    const table = document.getElementById('mainTable');
    const ctx = document.getElementById('lineCanvas').getContext('2d');
    
    // 1. Find the reference (Master) pattern in the current/last rows
    let masterBaseJodi = "";
    for(let r = chartData.length-1; r >= 0; r--) {
        if(table.rows[r+1].cells[day].classList.contains('base-box')) {
            masterBaseJodi = chartData[r][day];
            break;
        }
    }

    if(!masterBaseJodi) {
        alert("Pehle niche 'Current Set' mein kisi jodi par click karke Red Box banayein!");
        return;
    }

    const targetFamily = getFamily(masterBaseJodi);
    ctx.clearRect(0, 0, 10000, 10000);
    ctx.strokeStyle = "blue";
    ctx.lineWidth = 2;

    // 2. Clone pattern to every family occurrence in history
    chartData.forEach((row, rIdx) => {
        if(targetFamily.includes(row[day])) {
            const currentCell = table.rows[rIdx+1].cells[day];
            currentCell.classList.add('base-box');

            // Copying the "One row down" circle pattern
            if(rIdx + 1 < chartData.length) {
                const nextCell = table.rows[rIdx+2].cells[day];
                nextCell.classList.add('pattern-circle');

                // Draw connecting line like screenshots
                ctx.beginPath();
                ctx.moveTo(currentCell.offsetLeft + 30, currentCell.offsetTop + 27);
                ctx.lineTo(nextCell.offsetLeft + 30, nextCell.offsetTop + 27);
                ctx.stroke();
            }
        }
    });
}

function handleCSV() {
    const file = document.getElementById('csvFile').files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        chartData = e.target.result.split("\n")
                    .map(row => row.split(",").map(c => c.trim()))
                    .filter(r => r.length > 1);
        renderTable();
    };
    reader.readAsText(file);
}

function clearAll() {
    document.querySelectorAll('td').forEach(td => td.className = "");
    const ctx = document.getElementById('lineCanvas').getContext('2d');
    ctx.clearRect(0, 0, 10000, 10000);
}

function saveToLocal() {
    localStorage.setItem('dp_master_data', JSON.stringify(chartData));
    alert("Data Saved!");
}

window.onload = renderTable;
window.onresize = resizeCanvas;
</script>
</body>
</html>
