<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – MON-SAT Tool</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --green: #00ff00; --bg: #0a0a0a; }
    body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: #1a1a1a; padding: 15px; border-radius: 10px; display: flex; gap: 8px; justify-content: center; border-bottom: 2px solid var(--gold); margin-bottom: 15px; flex-wrap: wrap; }
    .table-container { position: relative; display: inline-block; background: #fff; padding: 10px; border-radius: 5px; max-height: 55vh; overflow-y: auto; width: 100%; max-width: 600px; }
    table { border-collapse: collapse; font-size: 13px; color: #000; position: relative; z-index: 10; width: 100%; }
    td, th { border: 1px solid #999; width: 16.6%; height: 45px; text-align: center; font-weight: bold; position: relative; }
    th { background: #800; color: #fff; position: sticky; top: 0; font-size: 11px; }
    
    /* Connection Circles */
    .f1 { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); }
    .f2 { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.2); }
    .f-res { border: 3px solid var(--green) !important; background: rgba(0, 255, 0, 0.3); border-radius: 50%; }
    .blank { background: #f0f0f0 !important; cursor: pointer; color: #bbb; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .card { background: #1a1a1a; padding: 12px; border-radius: 10px; border-left: 5px solid var(--gold); }
    button { padding: 10px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
    .check-btn { display: block; width: 100%; margin-top: 8px; padding: 12px; background: #252525; color: var(--gold); border: 1px solid #444; text-align: left; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button onclick="document.getElementById('csvFile').click()" style="background:var(--gold)">📂 CSV Load</button>
    <button onclick="addRow()" style="background:var(--blue); color:#fff">➕ Add Row</button>
    <button onclick="saveToLocal()" style="background:var(--green)">💾 Save Memory</button>
</div>

<center>
    <div class="table-container" id="scrollBox">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>📍 Analysis Lines</h3>
        <div id="checkList">Blank cell (**) par click karein...</div>
    </div>
    <div class="card">
        <h3>🔮 AI Prediction</h3>
        <div id="future" style="font-size: 22px; color: var(--gold); font-weight: bold; text-align: center;">-- | -- | --</div>
    </div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_mon_sat_v1")) || [["**","**","**","**","**","**"]];
let activePattern = null;
let currentClick = null;

function fam(v){ let s = String(v).padStart(2,'0'); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((row, ri) => {
        h += `<tr id="tr-${ri}">`;
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            if(activePattern) {
                let isHistory = (ri >= activePattern.start && ri < activePattern.start + activePattern.shape.length);
                let isPrediction = (currentClick && ri >= currentClick.r - activePattern.shape.length && ri < currentClick.r);
                if(isHistory) {
                    let p = activePattern.shape[ri - activePattern.start][ci];
                    if(p === 1) cls += " f1"; if(p === 2) cls += " f2";
                } 
                if(isPrediction) {
                    let p = activePattern.shape[ri - (currentClick.r - activePattern.shape.length)][ci];
                    if(p === 1) cls += " f1"; if(p === 2) cls += " f2";
                }
                if((ri === activePattern.resR && ci === activePattern.resC) || (currentClick && ri === currentClick.r && ci === currentClick.c)) cls += " f-res";
            }
            h += `<td class="${cls}" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)" onclick="initScan(${ri},${ci})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(renderLines, 100);
}

function updateCell(r, c, v) { data[r][c] = v.trim() || "**"; }

function initScan(r, c) {
    if(data[r][c] !== "**") return;
    currentClick = {r: r, c: c};
    let pool = [];
    // Last 10 weeks constraint
    for(let i=r-1; i>=Math.max(0, r-8); i--) {
        data[i].forEach((v, ci) => { if(v!=="**") pool.push({ri:i, ci:ci, f:fam(v)}); });
    }
    if(pool.length < 4) return alert("Piche ka data dalo (10 weeks)!");

    let familiesInPool = [...new Set(pool.map(p => p.f))];
    let selected = familiesInPool.sort(() => 0.5 - Math.random()).slice(0, 2);
    let p1 = pool.filter(x => x.f === selected[0]).slice(0, 2);
    let p2 = pool.filter(x => x.f === selected[1]).slice(0, 2);
    if(p1.length < 2 || p2.length < 2) return;

    let top = Math.min(p1[0].ri, p1[1].ri, p2[0].ri, p2[1].ri);
    let shape = Array.from({length: r - top}, () => Array(6).fill(0));
    p1.forEach(p => shape[p.ri-top][p.ci] = 1);
    p2.forEach(p => shape[p.ri-top][p.ci] = 2);

    let matches = [];
    for(let i=0; i <= data.length - shape.length - 1; i++) {
        if(i === top) continue;
        let score = 0, total = 0;
        for(let k=0; k<shape.length; k++) {
            for(let j=0; j<6; j++) {
                if(shape[k][j] > 0) {
                    total++;
                    if(fam(data[i+k][j]) === (shape[k][j] === 1 ? selected[0] : selected[1])) score++;
                }
            }
        }
        // 80% similarity scan
        if((score/total) >= 0.75 && data[i+shape.length][c] !== "**") {
            matches.push({start: i, shape: shape, resR: i+shape.length, resC: c, val: data[i+shape.length][c], per: Math.round((score/total)*100)});
        }
    }

    let list = document.getElementById("checkList");
    list.innerHTML = matches.length ? "" : "Koi 80% match nahi mila.";
    matches.slice(0, 3).forEach((m, idx) => {
        let btn = document.createElement("button");
        btn.className = "check-btn";
        btn.innerHTML = `🏁 <b>Match #${idx+1} (${m.per}%)</b><br>History Row: ${m.start+1} | Result: ${m.val}`;
        btn.onclick = () => { activePattern = m; draw(); document.getElementById(`tr-${m.start}`).scrollIntoView({behavior: "smooth", block: "center"}); };
        list.appendChild(btn);
    });
    document.getElementById("future").innerText = matches.slice(0, 3).map(m => m.val).join(" | ") || "-- | -- | --";
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();

    ["f1", "f2", "f-res"].forEach((cls, idx) => {
        let els = Array.from(tbl.querySelectorAll("." + cls));
        let groups = [];
        if(els.length > 0) {
            let tempGroup = [els[0]];
            for(let i=1; i<els.length; i++) {
                let r1 = els[i-1].getBoundingClientRect().top;
                let r2 = els[i].getBoundingClientRect().top;
                if(Math.abs(r1 - r2) < 200) tempGroup.push(els[i]);
                else { groups.push(tempGroup); tempGroup = [els[i]]; }
            }
            groups.push(tempGroup);
        }

        groups.forEach(group => {
            ctx.strokeStyle = idx === 0 ? "#3e84ff" : (idx === 1 ? "#ff3e3e" : "#00aa00");
            ctx.lineWidth = 3; ctx.beginPath();
            group.forEach((el, i) => {
                let r = el.getBoundingClientRect();
                let x = r.left - rect.left + r.width/2;
                let y = r.top - rect.top + r.height/2;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        });
    });
}

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const rows = e.target.result.split('\n').filter(r => r.trim());
        data = rows.map(r => {
            let cols = r.split(',').map(c => c.trim().padStart(2,'0').replace(/^00$/, "**"));
            while(cols.length < 6) cols.push("**");
            return cols.slice(0, 6);
        });
        saveToLocal(); draw();
    };
    reader.readAsText(input.files[0]);
}
function addRow() { data.push(["**","**","**","**","**","**"]); draw(); }
function saveToLocal() { localStorage.setItem("raj_mon_sat_v1", JSON.stringify(data)); alert("Vision Saved!"); }
draw();
</script>
</body>
</html>
