<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Double Set System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue-circle: #0084ff; --green-line: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        #home-screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .hero-title { font-size: 3rem; color: var(--gold); margin: 0; }
        .enter-btn { background: var(--gold); color: #000; padding: 15px 40px; font-size: 1.2rem; font-weight: 800; border: none; border-radius: 50px; cursor: pointer; margin-top: 20px; }
        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; }
        th { background: #1e293b; color: white; font-size: 11px; }
        .circle { border: 3px solid var(--blue-circle) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.15); z-index: 10; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); margin-top: 15px; }
        .card h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 14px; text-transform: uppercase; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 10px; }
        .match-btn { background: #2a2a2a; color:#fff; margin: 5px 0; padding: 10px; border-radius: 6px; border-left: 4px solid var(--green-line); width: 100%; text-align: left; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">Kalyan PRO AI</h1>
    <p style="opacity:0.7">DOUBLE SET (2.2 / 3.3) LOGIC</p>
    <button class="enter-btn" onclick="startApp()">START ANALYSIS</button>
</div>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ CLEAR</button>
    </div>
    <center><div class="table-container"><canvas id="mainCanvas"></canvas><table id="tbl"></table></div></center>
    <div class="card">
        <h3>✔ Strong Set Matches Found</h3>
        <div id="checks">Click on any ** to find set patterns...</div>
    </div>
    <div class="card">
        <h3>🤖 AI Prediction</h3>
        <div id="ai">Wait for analysis...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white;">CLOSE</button>
    <h3 style="margin-bottom:15px; color:#000;">Set Proof View</h3>
    <center><div class="table-container" style="border:1px solid #ddd;"><canvas id="popCanvas"></canvas><div id="popData"></div></div></center>
</div>

<script>
const STORAGE_KEY="pdata_kalyan_double_set";
let targetCol=null;
const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

let data=JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(15).fill().map(()=>Array(6).fill("**"));
let activeMark=null;

function startApp() { document.getElementById('home-screen').style.display='none'; document.getElementById('main-app').style.display='block'; draw(); }
function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA";}
function norm(v){if(v==""||v=="**")return "**"; v=String(v); return v.length==1?"0"+v:v;}

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = isPartOfPattern(ri, ci) ? "circle" : "";
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="${c=='**'?'makePattern('+ri+','+ci+')':'' }">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activeMark) setTimeout(() => drawLines("mainCanvas", document.getElementById("tbl")), 50);
}

function isPartOfPattern(ri, ci){
    if (!activeMark || !activeMark.points) return false;
    return activeMark.points.some(p => p.r === ri && p.c === ci);
}

function drawLines(cvsId, tblEl) {
    const cvs = document.getElementById(cvsId); const ctx = cvs.getContext("2d");
    cvs.width = tblEl.offsetWidth; cvs.height = tblEl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const cells = tblEl.querySelectorAll(".circle");
    if(cells.length < 2) return;
    const tRect = tblEl.getBoundingClientRect();
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3; ctx.beginPath();
    cells.forEach((c, idx) => {
        const r = c.getBoundingClientRect();
        const x = r.left - tRect.left + r.width/2;
        const y = r.top - tRect.top + r.height/2;
        if(idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
}

function edit(r,c,el){ data[r][c]=norm(el.innerText.trim()); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Saved!"); }
function clearData(){ if(confirm("Clear?")){ localStorage.clear(); location.reload(); }}

// --- SMART DOUBLE SET LOGIC ---
function makePattern(r, c) {
    targetCol = c;
    let cluster = [];
    // पिछले 10 हफ्तों में से 4 से 6 मजबूत जोड़ियाँ (2.2 या 3.3 सेट) उठाना
    for (let i = r - 1; i >= Math.max(0, r - 10) && cluster.length < 6; i--) {
        for (let j = 0; j < 6; j++) {
            if (data[i][j] !== "**") {
                cluster.push({ r: i, c: j, val: data[i][j], fKey: fam(data[i][j]), dist: r - i });
            }
        }
    }

    if (cluster.length < 4) return alert("सेट मैच के लिए कम से कम 4 जोड़ियाँ ऊपर होनी चाहिए!");
    
    let matches = [];
    for (let i = 0; i < r - 10; i++) {
        let ok = true; let matchPoints = [];
        cluster.forEach(p => {
            let checkR = i - p.dist;
            if (checkR < 0 || fam(data[checkR][p.c]) !== p.fKey) ok = false;
            else matchPoints.push({r: checkR, c: p.c});
        });
        if (ok) matches.push({ idx: i, points: matchPoints });
    }
    
    let div = document.getElementById("checks");
    div.innerHTML = matches.length ? "" : "No Set-to-Set Match Found.";
    matches.forEach((m, i) => {
        let btn = document.createElement("button"); btn.className = "match-btn";
        btn.innerHTML = `🔥 SET MATCH ${i+1} <span style="float:right">Record Row ${m.idx+1} ➔</span>`;
        btn.onclick = () => { activeMark = { points: m.points }; draw(); showPopup(m); };
        div.appendChild(btn);
    });

    if(matches.length > 0) {
        let res = data[matches[0].idx][targetCol];
        document.getElementById("ai").innerHTML = `<b>Strong Prediction:</b> ${res} (Family: ${fam(res)})`;
    }
}

function showPopup(m) {
    let rows = m.points.map(p => p.r);
    let start = Math.min(...rows) - 1;
    let html = "<table id='popTbl'>";
    for (let i = start; i <= m.idx; i++) {
        html += "<tr>";
        data[i].forEach((v, j) => {
            let isMark = m.points.some(p => p.r === i && p.c === j);
            html += `<td class="${isMark ? 'circle' : ''}">${v}</td>`;
        });
        html += "</tr>";
    }
    document.getElementById("popData").innerHTML = html + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    setTimeout(() => drawLines("popCanvas", document.getElementById("popTbl")), 100);
}

function closePopup() { document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v.trim())));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
