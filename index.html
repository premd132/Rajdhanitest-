<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYAN FIGURE SYSTEM - PRO VIEW</title>

<style>
:root { --gold: #ffd700; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 15px; }
.container { max-width: 600px; margin: 0 auto; }

/* Main Box */
.box { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid #334155; }
h2 { color: var(--gold); text-align: center; margin: 0 0 15px 0; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }

/* Form Elements */
.label { font-size: 12px; color: #94a3b8; margin-bottom: 5px; font-weight: bold; }
input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: #fff; font-size: 15px; box-sizing: border-box; }
button { background: var(--gold); color: #000; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
button:hover { background: #eab308; }

/* Result Area */
.result-box { background: #020617; padding: 15px; border-radius: 10px; border: 1px dashed var(--gold); text-align: center; display: none; margin-bottom: 15px; }
.fig { display: inline-block; background: var(--gold); color: #000; padding: 10px 18px; margin: 5px; border-radius: 6px; font-size: 24px; font-weight: 800; }

/* Record Table View */
.record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.record-card { background: var(--card); border-radius: 10px; padding: 15px; border: 1px solid #334155; }
.history-row { background: #0f172a; border-radius: 6px; padding: 10px; margin-bottom: 10px; display: grid; grid-template-columns: 30px 1fr 60px; align-items: center; gap: 10px; border-left: 4px solid var(--gold); }
.jodi-grid { display: flex; gap: 5px; flex-wrap: wrap; }
.jodi-item { background: #1e293b; color: var(--gold); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 16px; border: 1px solid #334155; font-weight: bold; }
.btn-use { background: #3b82f6; color: white; font-size: 11px; padding: 6px; margin: 0; }
.btn-clear { background: #ef4444; color: white; width: auto; padding: 8px 15px; font-size: 12px; }
</style>
</head>

<body>

<div class="container">
    <div class="box">
        <h2>🔮 Figure Calculation</h2>
        
        <div class="label">UPLOAD CSV (6 JODIS PER ROW)</div>
        <input type="file" id="csvFile" accept=".csv">

        <div class="label">LAST WEEK RECORD (6 JODIS)</div>
        <input id="jodiInput" placeholder="12, 34, 56, 78, 90, 11">

        <div class="label">SELECT SYSTEM</div>
        <select id="mode">
            <option value="1">Manual Base Figure</option>
            <option value="2">Auto (Last Total)</option>
            <option value="3">Auto (Common Total)</option>
            <option value="4">Strong All-Rounder</option>
        </select>
        
        <input id="baseAnk" type="number" placeholder="Enter Base Figure (0-9)" style="display:none">

        <button id="calcBtn">GET FIGURES</button>

        <div id="resultArea" class="result-box">
            <div id="figOutput"></div>
            <div id="detailOutput" style="font-size:12px; color:#94a3b8; margin-top:8px"></div>
        </div>

        <button id="saveBtn" style="background: #22c55e; color: white;">SAVE TO RECORD</button>
    </div>

    <div class="record-card">
        <div class="record-header">
            <span style="font-weight:bold; color:var(--gold)">📊 HISTORY (CSV VIEW)</span>
            <button class="btn-clear" onclick="clearAll()">CLEAR ALL</button>
        </div>
        <div id="historyList">
            </div>
    </div>
</div>

<script>
const DB_KEY = "KALYAN_PRO_DATA";
let historyData = JSON.parse(localStorage.getItem(DB_KEY)) || [];

// UI Elements
const jodiInput = document.getElementById("jodiInput");
const modeSelect = document.getElementById("mode");
const baseAnk = document.getElementById("baseAnk");

// Show/Hide Base Input
modeSelect.onchange = () => {
    baseAnk.style.display = (modeSelect.value === "1") ? "block" : "none";
};

window.onload = renderHistory;

/* --- Core Logic --- */
function getJodis(str) {
    return str.replace(/[^0-9]/g, ",").split(",").filter(v => v.length === 2).slice(0, 6);
}

function getTotal(j) { return (parseInt(j[0]) + parseInt(j[1])) % 10; }

function getNeighbors(n) { return [(n + 1) % 10, (n + 9) % 10, (n + 2) % 10, (n + 8) % 10]; }

/* --- Search Action --- */
document.getElementById("calcBtn").onclick = () => {
    const list = getJodis(jodiInput.value);
    if (list.length < 6) { alert("Please enter 6 Jodis"); return; }

    const totals = list.map(getTotal);
    const mode = modeSelect.value;
    let base;

    if (mode === "1") base = parseInt(baseAnk.value);
    else if (mode === "2") base = totals[5];
    else if (mode === "3") {
        let counts = {};
        totals.forEach(t => counts[t] = (counts[t] || 0) + 1);
        base = parseInt(Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b));
    } else {
        base = totals[5]; // Default for mode 4 logic
    }

    let finalFigs = [...new Set(getNeighbors(base))].sort();
    
    document.getElementById("figOutput").innerHTML = finalFigs.map(f => `<span class="fig">${f}</span>`).join("");
    document.getElementById("detailOutput").innerHTML = `Week Totals: ${totals.join(" - ")}`;
    document.getElementById("resultArea").style.display = "block";
};

/* --- CSV & History --- */
document.getElementById("csvFile").onchange = (e) => {
    const reader = new FileReader();
    reader.onload = (f) => {
        const lines = f.target.result.split(/\r?\n/);
        lines.forEach(line => {
            const jodis = getJodis(line);
            if (jodis.length === 6) historyData.unshift(jodis.join(","));
        });
        saveData();
    };
    reader.readAsText(e.target.files[0]);
};

document.getElementById("saveBtn").onclick = () => {
    const jodis = getJodis(jodiInput.value);
    if (jodis.length === 6) {
        historyData.unshift(jodis.join(","));
        saveData();
        alert("Saved!");
    }
};

function saveData() {
    localStorage.setItem(DB_KEY, JSON.stringify(historyData));
    renderHistory();
}

function renderHistory() {
    const listDiv = document.getElementById("historyList");
    listDiv.innerHTML = historyData.length ? "" : "<div style='text-align:center; padding:20px; opacity:0.5'>No Records Found</div>";
    
    historyData.forEach((row, idx) => {
        const jodis = row.split(",");
        const rowHTML = `
            <div class="history-row">
                <div style="font-size:10px; opacity:0.5">${historyData.length - idx}</div>
                <div class="jodi-grid">
                    ${jodis.map(j => `<span class="jodi-item">${j}</span>`).join("")}
                </div>
                <button class="btn-use" onclick="loadRow('${row}')">USE</button>
            </div>
        `;
        listDiv.innerHTML += rowHTML;
    });
}

function loadRow(str) {
    jodiInput.value = str;
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function clearAll() {
    if (confirm("Delete all history?")) {
        historyData = [];
        saveData();
    }
}
</script>

</body>
</html>
