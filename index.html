<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBK I-Smart Master Engine</title>
    <style>
        :root { --red: #ff0000; --green: #008800; --blue: #0000ff; --gold: #ffd700; }
        body { font-family: 'Segoe UI', Arial; background: #000; color: #fff; margin: 0; overflow: hidden; }
        
        /* Layout */
        header { background: #b71c1c; padding: 12px; border-bottom: 4px solid var(--gold); text-align: center; font-weight: 900; font-size: 20px; }
        .main { display: flex; height: calc(100vh - 55px); }
        
        /* Tools Sidebar */
        .sidebar { width: 320px; background: #1a1a1a; padding: 20px; border-right: 1px solid #333; overflow-y: auto; }
        .tool-btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s; }
        .active-red { background: var(--red); color: #fff; border: 2px solid #fff; }
        .active-green { background: var(--green); color: #fff; border: 2px solid #fff; }
        .active-blue { background: var(--blue); color: #fff; border: 2px solid #fff; }
        
        /* Chart Area */
        .content { flex: 1; padding: 20px; overflow: auto; background: #222; position: relative; display: flex; justify-content: center; }
        .chart-wrapper { position: relative; background: #fff; padding: 15px; border-radius: 5px; height: fit-content; }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 10; }
        td, th { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-size: 20px; font-weight: 900; position: relative; }
        th { background: #eee; font-size: 11px; height: 30px; }

        /* Professional Marks (Demo Video Style) */
        .f-red { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); color: var(--red); }
        .f-green { border: 4px solid var(--green) !important; color: var(--green); }
        .f-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        .scan-master { background: var(--gold); color: #000; width: 100%; padding: 15px; font-size: 18px; font-weight: 900; border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 5px 0 #b89b00; margin-top: 20px; }
    </style>
</head>
<body>

<header>DPBOSS KING I-SMART PATTERN CLONER</header>

<div class="main">
    <div class="sidebar">
        <p style="color:var(--gold); font-size: 12px; font-weight: bold;">[ STEP 1: LOAD HISTORY ]</p>
        <input type="file" id="csvInp" onchange="loadData()" style="color:#fff; margin-bottom:20px;">
        
        <p style="color:var(--gold); font-size: 12px; font-weight: bold;">[ STEP 2: MARK PATTERN ]</p>
        <button id="r-btn" class="tool-btn active-red" onclick="setTool('f-red')">BASE JODI (RED BOX)</button>
        <button id="g-btn" class="tool-btn" style="background:var(--green); color:#fff" onclick="setTool('f-green')">TOUCH 1 (GREEN BOX)</button>
        <button id="b-btn" class="tool-btn" style="background:var(--blue); color:#fff" onclick="setTool('f-blue')">TOUCH 2 (BLUE CIRCLE)</button>

        <p style="color:var(--gold); font-size: 12px; font-weight: bold;">[ STEP 3: SELECT ANCHOR DAY ]</p>
        <select id="dayIdx" style="width:100%; padding:10px; background:#333; color:#fff;">
            <option value="0">MONDAY</option><option value="1">TUESDAY</option>
            <option value="2">WEDNESDAY</option><option value="3">THURSDAY</option>
            <option value="4">FRIDAY</option><option value="5">SATURDAY</option>
        </select>

        <button class="scan-master" onclick="runISmart()">RUN I-SMART SCAN</button>
        <div id="log" style="margin-top:20px; font-size:12px; color:#0f0; font-family:monospace;">System Ready...</div>
    </div>

    <div class="content">
        <div class="chart-wrapper" id="box">
            <canvas id="canvas"></canvas>
            <table id="mainT">
                <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let tool = 'f-red';
let rawData = [["80","30","25","41","51","61"],["12","22","32","42","52","62"],["13","23","33","43","53","63"],["14","24","34","44","54","64"],["85","35","70","**","**","**"]];

// 100% Correct Family Database Logic
function getFamily(v) {
    let n = v.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let set = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => {
        set.add(`${a[0]}${b[0]}`); set.add(`${b[0]}${a[0]}`);
    }));
    return Array.from(set);
}

function init() {
    const b = document.getElementById('tbody');
    b.innerHTML = rawData.map((row, r) => `<tr>${row.map((val, c) => 
        `<td onclick="applyTool(this)" contenteditable="true" onblur="rawData[${r}][${c}]=this.innerText">${val}</td>`).join('')}</tr>`).join('');
    setTimeout(sync, 100);
}

function setTool(t) {
    tool = t;
    document.querySelectorAll('.tool-btn').forEach(btn => btn.style.border = "none");
    event.target.style.border = "2px solid #fff";
}

function applyTool(td) { td.className = td.className === tool ? "" : tool; }

function sync() {
    const c = document.getElementById('canvas'), b = document.getElementById('box');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

// THE I-SMART DNA SCANNER (Based on Demo Videos)
function runISmart() {
    const day = parseInt(document.getElementById('dayIdx').value);
    const table = document.getElementById('mainT');
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0,0,5000,5000);

    let dna = { base: null, touches: [] };
    
    // 1. Identify User Pattern DNA
    for(let r=0; r<rawData.length; r++) {
        if(table.rows[r+1].cells[day].classList.contains('f-red')) {
            dna.base = { val: rawData[r][day], r: r, c: day }; break;
        }
    }

    if(!dna.base) return alert("Pehle niche Base (Red) select karein!");

    document.querySelectorAll('.f-green, .f-blue').forEach(m => {
        let mr = m.parentElement.rowIndex-1, mc = m.cellIndex;
        dna.touches.push({ val: rawData[mr][mc], rd: mr - dna.base.r, cd: mc - dna.base.c, type: m.className });
    });

    const baseF = getFamily(dna.base.val);

    // 2. Scan and Auto-Draw Clones
    rawData.forEach((row, ri) => {
        if(baseF.includes(row[day]) && ri !== dna.base.r) {
            let matches = 0;
            dna.touches.forEach(t => {
                let tr = ri + t.rd, tc = day + t.cd;
                if(rawData[tr] && getFamily(t.val).includes(rawData[tr][tc])) matches++;
            });

            if(matches === dna.touches.length) {
                const bCell = table.rows[ri+1].cells[day];
                bCell.classList.add('f-red');
                dna.touches.forEach(t => {
                    const tCell = table.rows[ri+t.rd+1].cells[day+t.cd];
                    tCell.classList.add(t.type);
                    
                    // Professional Line Drawing (Demo Standard)
                    ctx.strokeStyle = t.type.includes('green') ? 'green' : 'blue';
                    ctx.lineWidth = 3; ctx.beginPath();
                    ctx.moveTo(bCell.offsetLeft+30, bCell.offsetTop+27);
                    ctx.lineTo(tCell.offsetLeft+30, tCell.offsetTop+27); ctx.stroke();
                });
                document.getElementById('log').innerText = "I-SMART MATCH FOUND!";
            }
        }
    });
}

function loadData() {
    const f = document.getElementById('csvInp').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        rawData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        init();
    };
    r.readAsText(f);
}

window.onload = init;
</script>
</body>
</html>
