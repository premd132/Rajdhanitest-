<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – CSV Fix & Real Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        /* --- UI Panels --- */
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; box-shadow: 0 0 30px #000; }
        table { border-collapse: collapse; color: #000; font-size: 15px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 5px; text-align: center; font-weight: 800; width: 46px; height: 46px; cursor: pointer; }
        th { background: #1e293b; color: #fff; font-size: 11px; }
        
        /* Marking & Shapes */
        .circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.25); z-index: 10; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 13px; text-transform: uppercase; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 450px; box-shadow: 0 0 50px #000; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 10px 15px; transition: 0.3s; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div id="main-app">
    <div style="text-align:center; margin-bottom:15px;">
        <h2 style="color:var(--gold); margin:0;">Kalyan Pro AI <small style="color:#888;">v4.0</small></h2>
        <span style="font-size:12px; color:#aaa;">Pradeep Kumar Dehariya System</span>
    </div>

    <div class="toolbar">
        <input type="file" id="csv_input" accept=".csv" style="display:none">
        <button onclick="document.getElementById('csv_input').click()" style="background:#444; color:white;">📂 UPLOAD CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ADD ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE LOCAL</button>
        <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ RESET</button>
    </div>

    <center>
        <div class="table-container" id="mainChartBox">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3>🔍 Shape Matches (3-Row Tircha)</h3>
            <div id="checks">Click any (**) to analyze...</div>
        </div>
        <div class="card">
            <h3>🔮 Future AI (3-Pairs)</h3>
            <div id="future-ai" style="font-size: 26px; color: var(--gold); font-weight: 800; text-align: center; letter-spacing: 5px;">-- -- --</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:#fff;">X</button>
    <h3 style="color:#000; margin-top:0;">Pattern Trace View</h3>
    <div class="table-container" style="width:100%; overflow:auto; background:#eee;">
        <canvas id="popCanvas"></canvas>
        <table id="popTbl" style="width:100%"></table>
    </div>
</div>

<script>
const STORAGE_KEY = "pdata_kalyan_final_sync";
const FAMILY = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["44","49","94","99"],"55":["00","05","50","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(12).fill(["**","**","**","**","**","**"]);
let activePattern = null;

function norm(v){ v=String(v).trim(); if(v==="" || v==="**") return "**"; return v.length===1 ? "0"+v : v; }
function isFamily(a, b){
    if(a==="**" || b==="**") return false;
    if(a===b || a===b.split('').reverse().join('')) return true;
    for(let k in FAMILY) if(FAMILY[k].includes(a) && FAMILY[k].includes(b)) return true;
    return false;
}

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let isMarked = activePattern && activePattern.some(p => p.r === ri && p.c === ci);
            h += `<td class="${isMarked ? 'circle' : ''}" contenteditable onblur="updateCell(${ri},${ci},this.innerText)" onclick="handleScan(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    if(activePattern) setTimeout(() => drawLines("mainCanvas", "tbl"), 50);
}

function updateCell(r,c,v){ data[r][c] = norm(v); }

// --- CSV Logic Fix ---
document.getElementById("csv_input").onchange = e => {
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = function(progressEvent){
        let lines = this.result.split('\n');
        data = lines.filter(l => l.trim() !== "").map(line => {
            // Support both comma and space separated CSV
            let parts = line.includes(',') ? line.split(',') : line.split(/\s+/);
            return parts.slice(0,6).map(v => norm(v));
        });
        draw();
        alert("CSV Loaded Successfully!");
    };
    reader.readAsText(file);
};

// --- Pattern Logic: 3 Row Upar aur Tircha ---
function handleScan(r, c) {
    if(data[r][c] !== "**") return;
    activePattern = null; 
    
    let matches = [];
    let startPoint = r - 3; // Blank cell se 3 row upar se shuru
    if(startPoint < 0) {
        document.getElementById("checks").innerText = "Not enough rows above for 3-row offset.";
        return;
    }

    // Scan range: 10 rows further up from the offset point
    let limitR = Math.max(0, startR = startPoint - 10);

    for(let i = startPoint; i >= limitR; i--) {
        // Diagonal checking (Tircha Logic: c-1, c+1)
        let tirchaCols = [c-1, c+1];
        tirchaCols.forEach(tc => {
            if(tc >= 0 && tc < 6 && data[i][tc] !== "**") {
                // Find family link in history
                for(let oldR = 0; oldR < i; oldR++){
                    for(let oldC=0; oldC<6; oldC++){
                        if(isFamily(data[i][tc], data[oldR][oldC])){
                            matches.push({
                                shape: [{r: i, c: tc}, {r: oldR, c: oldC}],
                                nextVal: data[i+1] ? data[i+1][c] : "**"
                            });
                        }
                    }
                }
            }
        });
    }
    displayResults(matches);
}

function displayResults(matches) {
    let container = document.getElementById("checks");
    container.innerHTML = "";
    matches.slice(0, 5).forEach((m, idx) => {
        let div = document.createElement("div");
        div.style = "background:#334155; padding:12px; margin-bottom:8px; border-radius:8px; cursor:pointer; border-left:5px solid var(--blue); font-size:13px;";
        div.innerHTML = `<b>Match #${idx+1}</b>: Tircha Shape Found <span style="float:right">➔</span>`;
        div.onclick = () => {
            activePattern = m.shape;
            draw();
            showPopup(m.shape);
        };
        container.appendChild(div);
    });
    
    let preds = [...new Set(matches.map(m => m.nextVal))].filter(v => v !== "**").slice(0,3);
    document.getElementById("future-ai").innerHTML = preds.length ? preds.join(" ") : "00 55 11";
}

function showPopup(shape) {
    let minR = Math.min(...shape.map(p => p.r));
    let maxR = Math.max(...shape.map(p => p.r));
    let h = "";
    for(let i = minR; i <= maxR; i++) {
        h += "<tr>";
        data[i].forEach((v, j) => {
            let isCir = shape.some(p => p.r === i && p.c === j);
            h += `<td class="${isCir?'circle':''}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popTbl").innerHTML = h;
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    setTimeout(() => drawLines("popCanvas", "popTbl"), 100);
}

function drawLines(cvsId, tblId) {
    let cvs = document.getElementById(cvsId);
    let tbl = document.getElementById(tblId);
    let ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let dots = tbl.querySelectorAll(".circle");
    if(dots.length < 2) return;
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3;
    ctx.beginPath();
    let pts = Array.from(dots).map(d => ({x: d.offsetLeft + d.offsetWidth/2, y: d.offsetTop + d.offsetHeight/2}));
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
}

function addRow() { data.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); alert("Saved!"); }
function clearData() { if(confirm("Clear Data?")) { localStorage.clear(); location.reload(); } }
function closePopup() { document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

draw();
</script>
</body>
</html>
