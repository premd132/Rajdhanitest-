<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DP-King Logic - Pradeep Advanced System</title>
    <style>
        :root { --main-red: #d32f2f; --main-blue: #1976d2; --bg-gray: #f8f9fa; --border-clr: #bbb; }
        body { font-family: 'Roboto', Arial, sans-serif; background: #e0e0e0; margin: 0; padding: 10px; }
        
        /* Header Style Like Dpboss */
        .top-bar { background: #333; color: gold; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; border-bottom: 3px solid var(--main-red); }
        .action-area { background: #fff; padding: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; border-bottom: 1px solid #ccc; }
        
        /* Chart Design */
        .chart-box { position: relative; background: #fff; margin: auto; max-width: 900px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        th { background: #444; color: #fff; border: 1px solid #222; padding: 8px; font-size: 13px; }
        td { border: 1px solid var(--border-clr); height: 85px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; background: #fff; }
        td:hover { background: #ffffcc; }

        /* Jodi & Panel Elements */
        .p-top, .p-bot { font-size: 12px; color: #555; height: 18px; }
        .jodi-val { font-size: 24px; font-weight: bold; display: block; color: #000; line-height: 30px; }
        .red-digit { color: var(--main-red) !important; }
        
        /* Logic Symbols */
        .source-mark { border: 3px solid var(--main-red) !important; background: rgba(211, 47, 47, 0.1); }
        .target-mark { border: 3px solid var(--main-blue) !important; background: rgba(25, 118, 210, 0.1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 9; }

        /* Tools */
        .tool-box { margin: 20px auto; max-width: 900px; background: #fff; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; cursor: pointer; border: none; font-weight: bold; border-radius: 4px; }
        .btn-green { background: #2e7d32; color: white; }
        .btn-blue { background: var(--main-blue); color: white; }
        input { padding: 10px; width: 100px; border: 1px solid #ccc; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-bar">RAJDHANI NIGHT - ADVANCED LINE TRICK SYSTEM</div>

<div class="action-area">
    <button class="btn-green" onclick="document.getElementById('csvPicker').click()">IMPORT OLD CSV</button>
    <input type="file" id="csvPicker" style="display:none" accept=".csv" onchange="processCSV(this)">
    <button class="btn-blue" onclick="runAutoPredict()">SCAN ALL PATTERNS</button>
    <button style="background:#555; color:white;" onclick="downloadData()">EXPORT CSV</button>
    <button style="background:red; color:white;" onclick="localStorage.clear(); location.reload();">RESET</button>
</div>

<div class="chart-box" id="chartFrame">
    <canvas id="patternCanvas"></canvas>
    <table id="matkaGrid">
        <thead>
            <tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>
        </thead>
        <tbody id="gridBody"></tbody>
    </table>
</div>

<div class="tool-box">
    <h3>Quick Add (Format: 123-45-678)</h3>
    <input type="text" id="i1" placeholder="Mon">
    <input type="text" id="i2" placeholder="Tue">
    <input type="text" id="i3" placeholder="Wed">
    <input type="text" id="i4" placeholder="Thu">
    <input type="text" id="i5" placeholder="Fri">
    <button class="btn-blue" onclick="manualAdd()">ADD RECORD</button>
</div>

<script>
let database = JSON.parse(localStorage.getItem('pradeep_pro_db')) || [];
const rashi = {'0':5,'1':6,'2':7,'3':8,'4':9,'5':0,'6':1,'7':2,'8':3,'9':4};

function refreshChart() {
    const body = document.getElementById('gridBody');
    body.innerHTML = "";
    database.forEach((row, rIdx) => {
        let tr = document.createElement('tr');
        row.forEach((item, cIdx) => {
            let td = document.createElement('td');
            td.id = `cell-${rIdx}-${cIdx}`;
            
            // Dpboss Style Rendering
            let parts = item.split('-');
            if(parts.length === 3) {
                let jodi = parts[1];
                let isRed = jodi[0]===jodi[1] || rashi[jodi[0]] == jodi[1];
                td.innerHTML = `<div class="p-top">${parts[0]}</div>
                                <div class="jodi-val ${isRed?'red-digit':''}">${jodi}</div>
                                <div class="p-bot">${parts[2]}</div>`;
            } else {
                td.innerHTML = `<div class="jodi-val">${item}</div>`;
            }

            td.onclick = () => analyzeFullPattern(rIdx, cIdx);
            tr.appendChild(td);
        });
        body.appendChild(tr);
    });
}

// --- CSV Engine ---
function processCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        let content = e.target.result.trim();
        database = content.split("\n").map(line => line.split(",").map(cell => cell.trim()));
        save(); refreshChart();
        alert("System Updated With Old Records!");
    };
    reader.readAsText(input.files[0]);
}

function downloadData() {
    let content = database.map(r => r.join(",")).join("\n");
    let blob = new Blob([content], {type: 'text/csv'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Pradeep_Master_Records.csv';
    a.click();
}

// --- Dpboss Deep Logic ---
function analyzeFullPattern(r, c) {
    clearLines();
    const cell = document.getElementById(`cell-${r}-${c}`);
    cell.classList.add('target-mark');

    let currentJodi = database[r][c].includes('-') ? database[r][c].split('-')[1] : database[r][c];
    if(!currentJodi || currentJodi == "**") return;

    // Search Logic: Vertical, Horizontal, Diagonal
    for(let i = r - 1; i >= Math.max(0, r - 12); i--) {
        for(let j = 0; j < 5; j++) {
            let oldCell = database[i][j];
            let oldJodi = oldCell.includes('-') ? oldCell.split('-')[1] : oldCell;
            
            if(checkDpbossMatch(currentJodi, oldJodi)) {
                drawProLine(i, j, r, c);
            }
        }
    }
}

function checkDpbossMatch(j1, j2) {
    if(!j1 || !j2 || j2=="**") return false;
    // 1. Total Match
    let t1 = (parseInt(j1[0]) + parseInt(j1[1])) % 10;
    let t2 = (parseInt(j2[0]) + parseInt(j2[1])) % 10;
    // 2. Family Match
    let isFam = getFamily(j1).includes(j2);
    // 3. 01-02-03 sequence
    let diff = Math.abs(parseInt(j1) - parseInt(j2));
    
    return (t1 === t2) || isFam || (diff <= 3);
}

function getFamily(j) {
    let d = j.split('').map(Number);
    let f1 = [d[0], rashi[d[0]]], f2 = [d[1], rashi[d[1]]];
    let fam = [];
    f1.forEach(a => f2.forEach(b => fam.push(`${a}${b}`, `${b}${a}`)));
    return fam;
}

function drawProLine(r1, c1, r2, c2) {
    const s = document.getElementById(`cell-${r1}-${c1}`);
    const e = document.getElementById(`cell-${r2}-${c2}`);
    const canvas = document.getElementById('patternCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = document.getElementById('chartFrame').scrollWidth;
    canvas.height = document.getElementById('chartFrame').scrollHeight;

    s.classList.add('source-mark');

    ctx.beginPath();
    ctx.strokeStyle = (r1 === r2 - 1) ? "#d32f2f" : "#1976d2"; // Red for direct row above, Blue for old
    ctx.lineWidth = 2;
    ctx.moveTo(s.offsetLeft + (s.offsetWidth/2), s.offsetTop + (s.offsetHeight/2));
    ctx.lineTo(e.offsetLeft + (e.offsetWidth/2), e.offsetTop + (e.offsetHeight/2));
    ctx.stroke();
}

function manualAdd() {
    database.push([document.getElementById('i1').value, document.getElementById('i2').value, document.getElementById('i3').value, document.getElementById('i4').value, document.getElementById('i5').value]);
    save(); refreshChart();
}

function save() { localStorage.setItem('pradeep_pro_db', JSON.stringify(database)); }
function clearLines() {
    const canvas = document.getElementById('patternCanvas');
    canvas.getContext('2d').clearRect(0,0,canvas.width, canvas.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('source-mark', 'target-mark'));
}

refreshChart();
</script>
</body>
</html>
