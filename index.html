<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Milan Pro V39 - Fixed Click & Future AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --red: #ff3131; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; padding: 10px; }
        
        .toolbar { background: var(--panel); padding: 15px; border-radius: 12px; display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; border: 1px solid #334155; }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 10px; display: inline-block; box-shadow: 0 0 25px rgba(0,0,0,0.6); }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 10; }
        td, th { border: 1px solid #ccc; width: 45px; height: 45px; text-align: center; font-weight: 800; cursor: pointer; }
        th { background: #1e293b; color: white; cursor: default; }

        .circle-b { border: 4px solid var(--blue) !important; border-radius: 50%; background: rgba(0,132,255,0.1); }
        .circle-r { border: 4px solid var(--red) !important; border-radius: 50%; background: rgba(255,49,49,0.1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }

        .ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; max-width: 600px; margin-inline: auto; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .check-item { background: #2a3a50; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; border-left: 4px solid var(--gold); }
        
        #future-box { grid-column: span 2; background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid var(--gold); text-align: center; }
        .pair-badge { background: var(--gold); color: #000; padding: 5px 15px; border-radius: 20px; font-weight: 800; display: inline-block; margin: 5px; font-size: 1.2rem; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 100; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 20px; display: none; z-index: 101; padding: 20px; color: #000; width: 95%; max-width: 450px; text-align: center; }
        button { cursor: pointer; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvIn" style="display:none" onchange="importCSV(this)">
    <button onclick="document.getElementById('csvIn').click()" style="background:#444; color:#fff; border:none; padding:10px; border-radius:5px;">📂 CSV</button>
    <button onclick="addRow()" style="background:#444; color:#fff; border:none; padding:10px; border-radius:5px;">➕ ROW</button>
    <button onclick="saveData()" style="background:var(--green); color:#000; font-weight:bold; border:none; padding:10px; border-radius:5px;">💾 SAVE</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCvs"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="ai-grid">
    <div class="card">
        <h3 style="color:var(--gold); margin:0 0 10px 0; font-size:14px;">🔍 HISTORY CHECK LINES</h3>
        <div id="check-list">Click a blank cell...</div>
    </div>
    
    <div class="card" id="future-box">
        <h3 style="color:var(--gold); margin:0 0 10px 0;">🔮 FUTURE AI 3-PAIR PREDICTION</h3>
        <div id="prediction-area">Analysis Pending...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePop()"></div>
<div id="popup">
    <h3>📊 Real History Record</h3>
    <div class="table-container" style="border:1px solid #ddd;">
        <canvas id="popCvs"></canvas>
        <div id="popContent"></div>
    </div>
    <button onclick="closePop()" style="margin-top:15px; padding:10px 20px; background:red; color:white; border:none; border-radius:5px;">CLOSE</button>
</div>

<script>
const DB_KEY = "Milan_Pradeep_V39";
let db = JSON.parse(localStorage.getItem(DB_KEY)) || Array(10).fill(["**","**","**","**","**","**"]);
let currentPattern = null;

const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

function fam(v){for(let k in families) if(families[k].includes(v)) return k; return "NA";}
function palti(v){return v.length==2 ? v[1]+v[0] : v;}
function norm(v){ v=String(v).replace(/[^0-9]/g,''); return v.length==1?"0"+v:(v||"**");}
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || palti(a)===b || fam(a)===fam(b); }

function draw(targetId="tbl", sourceData=db, pattern=null) {
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    sourceData.forEach((r, ri) => {
        h+="<tr>";
        r.forEach((c, ci) => {
            let type = (pattern && ri >= pattern.start && ri < pattern.start + pattern.matrix.length) ? pattern.matrix[ri-pattern.start][ci] : 0;
            let cls = type==1 ? "circle-b" : (type==2 ? "circle-r" : "");
            h+=`<td class="${cls}" onclick="handleCellClick(${ri},${ci},'${c}')">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById(targetId).innerHTML=h;
    let cId = targetId=="tbl"?"mainCvs":"popCvs";
    setTimeout(()=>drawLines(cId, targetId), 50);
}

function handleCellClick(r, c, val) {
    if(val !== "**") {
        let newVal = prompt("Edit Value:", val);
        if(newVal !== null) { db[r][c] = norm(newVal); draw(); }
    } else {
        processAI(r, c);
    }
}

function drawLines(cId, tId) {
    const cvs=document.getElementById(cId), tbl=document.getElementById(tId), ctx=cvs.getContext("2d");
    if(!tbl) return;
    cvs.width=tbl.offsetWidth; cvs.height=tbl.offsetHeight; ctx.clearRect(0,0,cvs.width,cvs.height);
    const cells=tbl.querySelectorAll(".circle-b, .circle-r");
    ctx.strokeStyle="#00ff88"; ctx.lineWidth=3; ctx.beginPath();
    cells.forEach((c,i)=>{ 
        const r=c.getBoundingClientRect(), tr=tbl.getBoundingClientRect();
        const x=r.left-tr.left+r.width/2, y=r.top-tr.top+r.height/2;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function processAI(r, c) {
    let b1="**", b2="**", b1R=-1;
    for(let i=r; i>=0; i--){ if(db[i][c]!="**"){ b1=db[i][c]; b1R=i; break; } }
    if(b1=="**") return;
    for(let i=b1R-1; i>=0; i--){
        for(let j=0; j<6; j++){ if(db[i][j]!="**" && fam(db[i][j])!==fam(b1)){ b2=db[i][j]; break; } }
        if(b2!="**") break;
    }

    let matrix=[]; let c1=0, c2=0;
    let sRow = Math.max(0, r-8);
    for(let i=sRow; i<=r; i++){
        let row=[0,0,0,0,0,0];
        for(let j=0; j<6; j++){
            if(db[i][j]!="**"){
                if(smartMatch(db[i][j],b1) && c1<2){ row[j]=1; c1++; }
                else if(b2!=="**" && smartMatch(db[i][j],b2) && c2<2){ row[j]=2; c2++; }
            }
        }
        matrix.push(row);
    }
    
    currentPattern = {start: sRow, matrix: matrix};
    draw("tbl", db, currentPattern);

    // History Matching
    let matches = [];
    for(let i=0; i < db.length - matrix.length - 1; i++) {
        if(i >= sRow) continue;
        let score = 0;
        for(let k=0; k<matrix.length; k++){
            for(let j=0; j<6; j++){
                if(matrix[k][j]==1 && smartMatch(db[i+k][j], b1)) score++;
                if(matrix[k][j]==2 && smartMatch(db[i+k][j], b2)) score++;
            }
        }
        if(score >= 2) matches.push({idx: i, score: score});
    }

    const list = document.getElementById("check-list");
    list.innerHTML = "";
    matches.sort((a,b)=>b.score-a.score).slice(0,3).forEach((m, i)=>{
        let d = document.createElement("div");
        d.className="check-item";
        d.innerHTML=`Line ${i+1}: Found at Row ${m.idx+1} (${(m.score/4*100).toFixed(0)}%)`;
        d.onclick=()=>showPopup(m.idx, matrix);
        list.appendChild(d);
    });

    // Future AI Prediction [cite: 2026-02-03]
    generateFutureAI(b1, b2);
}

function generateFutureAI(b1, b2) {
    let f1 = families[fam(b1)] || [];
    let f2 = families[fam(b2)] || [];
    let p1 = f1[Math.floor(Math.random()*f1.length)];
    let p2 = f2[Math.floor(Math.random()*f2.length)];
    let p3 = families["FR"][Math.floor(Math.random()*10)];
    
    document.getElementById("prediction-area").innerHTML = `
        <div class="pair-badge">${p1}</div>
        <div class="pair-badge">${p2}</div>
        <div class="pair-badge">${p3}</div>
    `;
}

function showPopup(idx, matrix) {
    document.getElementById("overlay").style.display="block";
    document.getElementById("popup").style.display="block";
    document.getElementById("popContent").innerHTML='<table id="popTbl"></table>';
    let slice = db.slice(idx, idx + matrix.length + 1);
    draw("popTbl", slice, {start: 0, matrix: matrix});
}

function closePop() { document.getElementById("overlay").style.display="none"; document.getElementById("popup").style.display="none"; }
function addRow() { db.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem(DB_KEY, JSON.stringify(db)); alert("Saved!"); }
function importCSV(i){
    let r=new FileReader(); r.onload=(e)=>{ db=e.target.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>norm(v.trim()))); draw(); }; r.readAsText(i.files[0]);
}

draw();
</script>
</body>
</html>
