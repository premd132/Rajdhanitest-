<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dpbossking Style - PRO AI TOOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; --red: #ff4757; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; padding-bottom: 50px; }
        
        /* Navigation & Tool Tabs */
        .nav-tabs { display: flex; background: var(--panel); border-bottom: 2px solid var(--gold); position: sticky; top:0; z-index: 1000; overflow-x: auto; }
        .tab { padding: 15px 20px; cursor: pointer; font-weight: 600; white-space: nowrap; opacity: 0.6; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--gold); color: var(--gold); }

        /* Toolbar Controls */
        .controls { padding: 15px; display: flex; gap: 10px; flex-wrap: wrap; background: rgba(255,255,255,0.05); }
        input, select { background: #0f172a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; }
        
        /* Table Geometry */
        .table-wrapper { position: relative; background: #fff; border-radius: 8px; padding: 5px; display: inline-block; margin: 20px auto; }
        table { border-collapse: collapse; color: #000; font-size: 13px; }
        td, th { border: 1px solid #ccc; width: 42px; height: 42px; text-align: center; font-weight: bold; cursor: pointer; position: relative; }
        th { background: #1e293b; color: white; font-size: 10px; }
        
        /* Dpbossking Highlight Styles */
        .circle-match { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(0, 132, 255, 0.2); z-index: 5; }
        .cross-match { background: rgba(255, 71, 87, 0.3); border: 2px solid var(--red) !important; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        /* Dashboard & Predictions */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .check-btn { background: #0f172a; padding: 12px; margin: 5px 0; border-radius: 8px; border-left: 4px solid var(--gold); cursor: pointer; display: flex; justify-content: space-between; }

        /* Advanced Snippet Popup */
        #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; justify-content:center; align-items:center; }
        .modal-body { background:#fff; padding:20px; border-radius:15px; max-width:95%; color:#000; position:relative; }
        .close-btn { position:absolute; top:-15px; right:-15px; background:var(--red); color:#fff; border-radius:50%; width:35px; height:35px; border:none; cursor:pointer; font-weight:bold; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <div class="tab active" onclick="showView('chart')">📈 MAIN CHART</div>
    <div class="tab" onclick="showView('logic')">🔍 LOGIC TOOL</div>
    <div class="tab" onclick="showView('search')">📡 SMART SEARCH</div>
</div>

<div class="controls">
    <input type="file" id="csv" hidden>
    <button onclick="csv.click()" style="background:#444; border:none; color:#fff; padding:10px 15px; cursor:pointer;">📂 IMPORT CSV</button>
    <button onclick="addRow()" style="background:#444; border:none; color:#fff; padding:10px 15px; cursor:pointer;">➕ ADD WEEK</button>
    <button onclick="saveData()" style="background:var(--green); border:none; color:#000; padding:10px 15px; cursor:pointer; font-weight:bold;">💾 SAVE RECORD</button>
</div>

<center>
    <div class="table-wrapper" id="main-wrap">
        <canvas id="mainCvs"></canvas>
        <table id="mainTbl"></table>
    </div>
</center>

<div class="grid">
    <div class="card">
        <h3>✔ PATTERN LINES (HISTORY)</h3>
        <div id="check-list">Click any blank cell (**) to scan history...</div>
    </div>
    <div class="card">
        <h3>🔮 FUTURE AI PREDICTION</h3>
        <div id="ai-future" style="font-size: 30px; color: var(--green); text-align: center; font-weight: 800;">-- --</div>
    </div>
</div>

<div id="modal">
    <div class="modal-body">
        <button class="close-btn" onclick="closePopup()">X</button>
        <h3 style="margin:0 0 10px 0; font-size:14px;">Historical Pattern Found</h3>
        <div class="table-wrapper" style="border:1px solid #ccc;">
            <canvas id="popCvs"></canvas>
            <div id="popContent"></div>
        </div>
    </div>
</div>

<script>
const STORAGE = "dpboss_style_pro";
const FAMILY = {"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data = JSON.parse(localStorage.getItem(STORAGE)) || Array(15).fill().map(()=>Array(6).fill("**"));
let currentPat = null;
let lastTarget = {r:0, c:0};

const norm = v => (!v || v=="**") ? "**" : v.toString().padStart(2,"0").slice(-2);
function getFam(v) { for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; }

function render(targetId, cvsId, pat, viewData, offset=0) {
    let html = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    viewData.forEach((row, ri) => {
        let actualRow = ri + offset;
        html += "<tr>";
        row.forEach((cell, ci) => {
            let cls = "";
            if(pat && actualRow >= pat.start && actualRow < pat.start + pat.shape.length) {
                if(pat.shape[actualRow - pat.start][ci]) cls = "circle-match";
            }
            html += `<td class="${cls}" onclick="handleCell(${actualRow},${ci})">${cell}</td>`;
        });
        html += "</tr>";
    });
    document.getElementById(targetId).innerHTML = html;
    if(pat) setTimeout(() => drawLines(cvsId, targetId), 50);
}

function handleCell(r, c) {
    if(data[r][c] === "**") {
        lastTarget = {r, c};
        autoAnalyze(r, c);
    } else {
        let v = prompt("Edit Value:", data[r][c]);
        if(v !== null) { data[r][c] = norm(v); currentPat = null; render("mainTbl", "mainCvs", null, data); }
    }
}

// Logic like Dpbossking - Auto captures family patterns
function autoAnalyze(ri, ci) {
    let lookback = 8;
    let limit = Math.max(0, ri - lookback);
    let shape = Array(ri - limit).fill().map(()=>Array(6).fill(0));
    let fams = [];

    for(let i = ri - 1; i >= limit; i--) {
        for(let j = 0; j < 6; j++) {
            let f = getFam(data[i][j]);
            if(f) {
                if(!fams.includes(f)) fams.push(f);
                if(fams.length <= 2) shape[i - limit][j] = 1;
            }
        }
    }

    currentPat = {start: limit, shape: shape, keys: fams.slice(0, 2)};
    render("mainTbl", "mainCvs", currentPat, data);
    searchHistory(currentPat);
}

function searchHistory(pat) {
    let matches = [];
    for(let i = 0; i < pat.start; i++) {
        let score = 0;
        for(let r = 0; r < pat.shape.length; r++) {
            for(let c = 0; c < 6; c++) {
                if(pat.shape[r][c]) {
                    if(pat.keys.includes(getFam(data[i+r][c]))) score++;
                }
            }
        }
        if(score >= 3) matches.push(i);
    }

    let list = document.getElementById("check-list");
    list.innerHTML = "";
    matches.forEach((mIdx, i) => {
        let div = document.createElement("div");
        div.className = "check-btn";
        div.innerHTML = `<span>📋 Check Line ${i+1}</span> <small>Row ${mIdx+1}</small>`;
        div.onclick = () => {
            let snippet = data.slice(mIdx, mIdx + pat.shape.length + 1);
            document.getElementById("modal").style.display = "flex";
            render("popContent", "popCvs", {start: mIdx, shape: pat.shape}, snippet, mIdx);
        };
        list.appendChild(div);
    });

    let res = matches.map(m => data[m + pat.shape.length] ? data[m + pat.shape.length][lastTarget.c] : null).filter(v => v && v !== "**");
    document.getElementById("ai-future").innerText = res.length ? [...new Set(res)].join(" - ") : "??";
}

function drawLines(cvsId, tblId) {
    const cvs = document.getElementById(cvsId);
    const table = document.getElementById(tblId);
    const ctx = cvs.getContext("2d");
    cvs.width = table.offsetWidth; cvs.height = table.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const dots = table.querySelectorAll(".circle-match");
    if(dots.length < 2) return;
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3; ctx.beginPath();
    dots.forEach((d, i) => {
        let x = d.offsetLeft + d.offsetWidth/2;
        let y = d.offsetTop + d.offsetHeight/2;
        i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function closePopup() { document.getElementById("modal").style.display = "none"; }
function addRow() { data.push(Array(6).fill("**")); render("mainTbl", "mainCvs", null, data); }
function saveData() { localStorage.setItem(STORAGE, JSON.stringify(data)); alert("Data Saved Locally!"); }

csv.onchange = e => {
    let r = new FileReader();
    r.onload = () => {
        data = r.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v.trim())));
        render("mainTbl", "mainCvs", null, data);
    };
    r.readAsText(e.target.files[0]);
};

render("mainTbl", "mainCvs", null, data);
</script>
</body>
</html>
