<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI – Per-Cell Pattern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --red: #ff4757; --blue: #2e86de; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; }
        
        .toolbar { background: var(--panel); padding: 12px; border-bottom: 2px solid var(--gold); display: flex; gap: 10px; justify-content: center; position: sticky; top: 0; z-index: 100; }
        .table-container { position: relative; background: #fff; border-radius: 8px; padding: 5px; margin: 20px auto; display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; }
        
        .circle-red { border: 3px solid var(--red) !important; border-radius: 50% !important; background: rgba(255, 71, 87, 0.2); }
        .circle-blue { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(46, 134, 222, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 4px solid var(--gold); }
        .check-line { background: #262f3f; padding: 10px; margin: 8px 0; border-radius: 8px; border-left: 5px solid var(--gold); cursor: pointer; display: flex; justify-content: space-between; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 1000; padding: 20px; color: #000; width: 95%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 999; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 8px 12px; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csv" style="display:none">
    <button onclick="document.getElementById('csv').click()" style="background:var(--blue); color:white;">📂 CSV</button>
    <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE</button>
    <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ RESET</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>✔ Historical Check Lines (Matches)</h3>
        <div id="checks">Click any blank cell (**) to start</div>
    </div>
    <div class="card">
        <h3>🔮 AI Future 3-Pair</h3>
        <div id="future" style="font-size: 22px; color: #00ff88; font-weight: 800;">...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:black; color:white;">X</button>
    <h3 style="margin-top:0;">Pattern Trace View</h3>
    <div class="table-container" style="border:1px solid #ddd; display: block;">
        <canvas id="popCanvas"></canvas>
        <div id="popData"></div>
    </div>
</div>

<script>
const FAMILY = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["00","05","50","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem("Pradeep_V5")) || Array(12).fill().map(()=>Array(5).fill("**"));
let currentPatternMatches = [];

function fam(v){ v=String(v).padStart(2,'0'); for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA"; }
function smartMatch(a,b){ if(a=="**"||b=="**"||!a||!b) return false; return fam(a)===fam(b); }

function draw() {
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = "";
            // Unique marking for each cell click logic
            currentPatternMatches.forEach(m => {
                let off = ri - m.start;
                if(off >= 0 && off < m.shape.length && m.shape[off][ci] > 0) {
                    cls = m.shape[off][ci] === 1 ? "circle-red" : "circle-blue";
                }
            });
            h += `<td class="${cls}" contenteditable="true" oninput="data[${ri}][${ci}]=this.innerText.trim()" onclick="analyzeCell(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(() => drawGlobalLines(), 50);
}

function analyzeCell(r, c) {
    if (data[r][c] !== "**" && data[r][c] !== "") return;

    // Har cell par click karne se purana match saaf hoga aur naya dhoonda jayega
    currentPatternMatches = [];
    let b1 = "**", b2 = "**";
    let lookback = 7; // Har cell apne upar ke 7 rows scan karega
    let shape = Array(lookback + 1).fill().map(() => Array(5).fill(0));

    // Dynamic pattern formation for THIS cell
    for (let i = r - 1; i >= Math.max(0, r - lookback); i--) {
        for (let j = 0; j < 5; j++) {
            let v = data[i][j];
            if (v !== "**") {
                if (b1 === "**") { b1 = v; shape[i - (r - lookback)][j] = 1; }
                else if (smartMatch(v, b1)) { shape[i - (r - lookback)][j] = 1; }
                else if (b2 === "**" && !smartMatch(v, b1)) { b2 = v; shape[i - (r - lookback)][j] = 2; }
                else if (smartMatch(v, b2)) { shape[i - (r - lookback)][j] = 2; }
            }
        }
    }

    if (b1 === "**") return alert("Not enough data above this cell to form a pattern!");

    let matches = [];
    for (let i = 0; i <= data.length - shape.length; i++) {
        if (i === (r - lookback)) continue; // Skip current pattern
        let ok = true;
        for (let k = 0; k < shape.length; k++) {
            for (let j = 0; j < 5; j++) {
                if (shape[k][j] === 1 && !smartMatch(data[i+k][j], b1)) { ok = false; break; }
                if (shape[k][j] === 2 && !smartMatch(data[i+k][j], b2)) { ok = false; break; }
            }
            if(!ok) break;
        }
        if (ok) matches.push({ start: i, shape: shape, col: c });
    }

    currentPatternMatches = matches;
    updateUI(matches, c);
    draw();
}

function updateUI(matches, col) {
    let listHtml = "";
    let preds = [];
    matches.forEach((m, idx) => {
        let resRow = m.start + m.shape.length;
        let resVal = data[resRow] ? data[resRow][col] : "**";
        if(resVal !== "**") preds.push(resVal);

        listHtml += `<div class="check-line" onclick="openPopupView(${idx})">
            <span>Pattern Match ${idx+1}</span>
            <b style="color:var(--gold)">➔ ${resVal}</b>
        </div>`;
    });
    document.getElementById("checks").innerHTML = listHtml || "No historical match found for this cell.";
    let final = [...new Set(preds)].slice(0, 3);
    document.getElementById("future").innerHTML = final.length ? final.join(" - ") : "...";
}

function openPopupView(idx) {
    let m = currentPatternMatches[idx];
    let h = "<table>";
    for(let i=0; i<m.shape.length; i++) {
        h += "<tr>";
        data[m.start + i].forEach((v, j) => {
            let cls = m.shape[i][j] === 1 ? "circle-red" : (m.shape[i][j] === 2 ? "circle-blue" : "");
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popData").innerHTML = h + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    setTimeout(() => renderCanvasLines("popCanvas", "popData"), 100);
}

function drawGlobalLines() {
    let cv = document.getElementById("mainCanvas"), ctx = cv.getContext("2d"), tbl = document.getElementById("tbl");
    cv.width = tbl.offsetWidth; cv.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cv.width,cv.height);
    let tRect = tbl.getBoundingClientRect();
    renderGroupLines(ctx, tbl, ".circle-red", "#ff4757", tRect);
    renderGroupLines(ctx, tbl, ".circle-blue", "#2e86de", tRect);
}

function renderGroupLines(ctx, container, selector, color, tRect) {
    let cells = container.querySelectorAll(selector);
    if(cells.length < 2) return;
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.beginPath();
    cells.forEach((c, idx) => {
        let r = c.getBoundingClientRect();
        let x = r.left - tRect.left + r.width/2;
        let y = r.top - tRect.top + r.height/2;
        if(idx === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function renderCanvasLines(cvId, containerId) {
    let cv = document.getElementById(cvId), ctx = cv.getContext("2d");
    let container = document.getElementById(containerId);
    cv.width = container.offsetWidth; cv.height = container.offsetHeight;
    ctx.clearRect(0,0,cv.width,cv.height);
    let tRect = container.getBoundingClientRect();
    renderGroupLines(ctx, container, ".circle-red", "#ff4757", tRect);
    renderGroupLines(ctx, container, ".circle-blue", "#2e86de", tRect);
}

function saveData(){ localStorage.setItem("Pradeep_V5", JSON.stringify(data)); alert("Saved!"); }
function clearData(){ if(confirm("Reset?")){ localStorage.clear(); location.reload(); }}
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => v.trim()).slice(0,5));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};

window.onload = draw;
</script>
</body>
</html>
