<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Premium System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; 
            --blue-circle: #0084ff; 
            --orange-circle: #ff8800;
            --green-line: #00ff88; 
            --orange-line: #ff8800;
            --bg: #0f172a; 
            --panel: #1e293b; 
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        #home-screen {
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .hero-title { font-size: 3rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .hero-sub { opacity: 0.7; letter-spacing: 2px; margin-bottom: 30px; }
        .enter-btn {
            background: var(--gold); color: #000; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 800; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; }
        th { background: #1e293b; color: white; font-size: 11px; }
        
        /* Marking Styles */
        .circle { border: 3px solid var(--blue-circle) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.15); z-index: 10; }
        .circle2 { border: 3px solid var(--orange-circle) !important; border-radius: 50% !important; background: rgba(255, 136, 0, 0.15); z-index: 10; }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .card h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 14px; text-transform: uppercase; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 90%; max-width: 400px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 15px; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">Kalyan PRO AI</h1>
    <p class="hero-sub">DUAL PATTERN ENGINE</p>
    <button class="enter-btn" onclick="startApp()">START ANALYSIS</button>
</div>

<div id="main-app">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
        <h2 style="color:var(--gold); margin:0;">Kalyan</h2>
        <button onclick="location.reload()" style="background:none; color:white; border:1px solid #444;">Logout</button>
    </div>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE DATA</button>
        <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3>✔ Matches Found</h3>
            <div id="checks"></div>
        </div>
        <div class="card">
            <h3>🤖 AI Analysis</h3>
            <div id="ai">Wait for input...</div>
        </div>
        <div class="card">
            <h3>🔮 Future Prediction</h3>
            <div id="future">Select a match...</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white;">CLOSE</button>
    <h3 style="margin: 0 0 15px 0;">Sequence View</h3>
    <center>
        <div class="table-container" style="border: 1px solid #ddd;">
            <canvas id="popCanvas"></canvas>
            <div id="popData"></div>
        </div>
    </center>
</div>

<script>
const STORAGE_KEY="pdata_Kalyan_v2";
let targetCol=null;
let activeMark=null;  // Blue Pattern
let activeMark2=null; // Orange Pattern

const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};
    
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)) || [["10","20","30","40","50","60"],["**","**","**","**","**","**"]];

function norm(v) {
    if (!v || v.trim() === "" || v === "**") return "**";
    let n = v.replace(/[^0-9]/g, "");
    if (n === "") return "**";
    if (n.length === 1) n = "0" + n;
    return n.substring(0, 2);
}

function startApp() {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    draw();
}

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA";}
function palti(v){return v.length==2 ? v[1]+v[0] : v;}
function smartMatch(a1,b1){ if(a1=="**"||b1=="**") return false; return a1===b1 || palti(a1)===b1 || fam(a1)===fam(b1); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = "";
   if(activeMark && isPartOfPattern(ri, ci, activeMark)) cls = "circle";
   else if(activeMark2 && isPartOfPattern(ri, ci, activeMark2)) cls = "circle2";
   
   if(c=="**") cls += " blank";
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="${c=='**'?'makePattern('+ri+','+ci+')':'' }">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activeMark || activeMark2) {
    setTimeout(() => {
        const cvs = document.getElementById("mainCanvas");
        const tbl = document.getElementById("tbl");
        cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
        const ctx = cvs.getContext("2d");
        ctx.clearRect(0,0,cvs.width,cvs.height);
        drawLines("mainCanvas", tbl, ".circle", "#00ff88"); // Green line for Blue circles
        drawLines("mainCanvas", tbl, ".circle2", "#ff8800"); // Orange line for Orange circles
    }, 50);
 }
}

function isPartOfPattern(ri, ci, mark){
    if(!mark) return false;
    let i = ri - mark.start;
    return (i >= 0 && i < mark.shape.length && mark.shape[i][ci]);
}

function drawLines(cvsId, tblEl, selector, color) {
    const cvs = document.getElementById(cvsId);
    const ctx = cvs.getContext("2d");
    const cells = tblEl.querySelectorAll(selector);
    if(cells.length < 2) return;
    const tRect = tblEl.getBoundingClientRect();
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.beginPath();
    cells.forEach((c, idx) => {
        const r = c.getBoundingClientRect();
        const x = r.left - tRect.left + r.width/2;
        const y = r.top - tRect.top + r.height/2;
        if(idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
}

function edit(r,c,el){ data[r][c] = norm(el.innerText.trim()); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Data Saved!"); }
function clearData(){ if(confirm("Clear All?")){ localStorage.clear(); location.reload(); }}

function makePattern(r,c){
  targetCol=c; let base="**";
  for(let i=r;i>=0;i--){ if(data[i][c]!="**"){base=data[i][c]; break;}}
  if(base=="**") return;

  let s1 = Array(9).fill(0).map(() => Array(6).fill(0));
  let s2 = Array(9).fill(0).map(() => Array(6).fill(0));
  let m1 = 0, m2 = 0;
  let startRow = Math.max(0, r-8);

  for(let i = r; i >= startRow; i--){
    for(let j = 0; j < 6; j++){
      let v = data[i][j];
      if(v != "**"){
        // Pattern 1: Blue (Exact/Palti)
        if(m1 < 3 && (v === base || v === palti(base))){
          s1[i - startRow][j] = 1; m1++;
        } 
        // Pattern 2: Orange (Family only)
        else if(m2 < 3 && fam(v) === fam(base)){
          s2[i - startRow][j] = 1; m2++;
        }
      }
    }
  }
  searchPattern(s1, s2, base);
}

// --- Is Section ko apne code ke Script me replace karein ---

function makePattern(r,c){
  targetCol=c; let base="**";
  // Base jodi dhoondhna
  for(let i=r; i>=0; i--){ if(data[i][c]!="**"){base=data[i][c]; break;}}
  if(base=="**") return;

  let s1 = Array(10).fill(0).map(() => Array(6).fill(0)); // Blue Pattern Frame
  let s2 = Array(10).fill(0).map(() => Array(6).fill(0)); // Orange Pattern Frame
  let m1 = 0, m2 = 0;
  let startRow = Math.max(0, r-9);

  // Current Pattern Build karna (Last 10 rows me)
  for(let i = r; i >= startRow; i--){
    for(let j = 0; j < 6; j++){
      let v = data[i][j];
      if(v != "**"){
        // Priority 1: Exact/Palti (Blue)
        if(m1 < 3 && (v === base || v === palti(base))){
          s1[i - startRow][j] = 1; m1++;
        } 
        // Priority 2: Family (Orange) - Sirf tab jab wo s1 me na ho
        else if(m2 < 3 && fam(v) === fam(base) && !s1[i - startRow][j]){
          s2[i - startRow][j] = 1; m2++;
        }
      }
    }
  }
  searchCombinedPattern(s1, s2, base);
}

function searchCombinedPattern(s1, s2, base){
 let matches = [];
 // Purane records me dono patterns ko ek saath dhoondhna
 for(let i=0; i <= data.length - 10; i++){
  let ok = true;
  for(let k=0; k<10; k++){
   for(let j=0; j<6; j++){
    // Agar s1 (Blue) hai toh exact/palti/fam match hona chahiye
    if(s1[k][j] && !smartMatch(data[i+k][j], base)) { ok = false; break; }
    // Agar s2 (Orange) hai toh sirf family match hona chahiye
    if(s2[k][j] && fam(data[i+k][j]) !== fam(base)) { ok = false; break; }
   }
   if(!ok) break;
  }
  // Current position ko matches me nahi dikhana hai
  if(ok && i < (data.length - 11)) matches.push({index:i});
 }
 
 activeMark = {start: data.length-10, shape: s1}; 
 activeMark2 = {start: data.length-10, shape: s2};
 draw();
 showChecks(s1, s2, matches);
}

function updateAI(s1, s2, matches){
 let jc = {};
 matches.forEach(m => {
  let nextR = m.index + 10; // Pattern ke theek neeche wali row
  if(nextR < data.length && data[nextR][targetCol] != "**"){
   let v = data[nextR][targetCol];
   jc[v] = (jc[v] || 0) + 1;
  }
 });

 // Result display
 let topJodis = Object.keys(jc).sort((a,b) => jc[b] - jc[a]).slice(0,3);
 document.getElementById("future").innerHTML = topJodis.length ? 
    `<b>AI Prediction:</b> ${topJodis.join(" , ")}` : 
    "No strong future match found.";
                              }

function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        let lines = fr.result.split(/\r?\n/);
        data = lines.filter(l=>l.trim()).map(l => {
            let r = l.split(',').map(v => norm(v.trim()));
            while(r.length < 6) r.push("**");
            return r.slice(0,6);
        });
        draw();
        alert("CSV Loaded!");
    };
    fr.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
