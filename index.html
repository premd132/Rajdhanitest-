<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Pradeep Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:Poppins}
body{margin:0;background:var(--bg);color:#fff;overflow-x:hidden}
#home{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#home h1{color:var(--gold);font-size:3.5rem;margin:0}
#home button{background:var(--gold);border:none;padding:15px 45px;border-radius:40px;font-weight:800;font-size:1.2rem;cursor:pointer;margin-top:25px;box-shadow: 0 5px 20px rgba(255,215,0,0.4)}
#app{display:none;padding:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;justify-content:center}
.toolbar button{background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer}
.table-box{position:relative;background:#fff;border-radius:12px;padding:8px;display:inline-block;box-shadow: 0 10px 40px rgba(0,0,0,0.6)}
table{border-collapse:collapse;color:#000}
td,th{border:1px solid #cbd5e1;width:50px;height:50px;text-align:center;font-weight:800;font-size:18px;cursor:pointer;position:relative}
th{background:#1e293b;color:#fff;font-size:12px}
.circle-red{border:4px solid var(--red)!important;border-radius:50%;background:rgba(255,71,87,0.3)}
.circle-blue{border:4px solid var(--blue)!important;border-radius:50%;background:rgba(46,134,222,0.3)}
.marked-origin{background: #fef08a !important; color: #000 !important; border: 2px solid #ca8a04 !important; font-style: italic;}
canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:5}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:20px;margin-top:20px}
.card{background:var(--panel);padding:18px;border-radius:15px;border-top:5px solid var(--gold)}
.card b{display:block;margin-bottom:12px;color:var(--gold);font-size:14px;letter-spacing:1px}
#checks{max-height:250px;overflow-y:auto}
.match-btn{background:#2d3748;padding:12px;margin:6px 0;border-radius:8px;border-left:5px solid var(--gold);cursor:pointer;font-size:14px;transition:0.2s}
.match-btn:hover{background:#3d4a5d;transform:translateX(5px)}
</style>
</head>
<body>

<div id="home">
 <h1>Rajdhani PRO AI</h1>
 <p style="opacity:0.8">STRICT 2+2 & 1-2-3 PATTERN SYSTEM</p>
 <button onclick="start()">START ANALYSIS</button>
</div>

<div id="app">
 <div class="toolbar">
  <input type="file" id="csvFile" accept=".csv" style="display:none">
  <button onclick="csvFile.click()">📂 LOAD CSV</button>
  <button onclick="addRow()">➕ NEW WEEK</button>
  <button onclick="saveData()" style="background:#059669">💾 SAVE DATA</button>
  <button onclick="location.reload()" style="background:#dc2626">🔄 RESET</button>
 </div>
 
 <center><div class="table-box"><canvas id="mainCanvas"></canvas><table id="tbl"></table></div></center>
 
 <div class="dashboard">
  <div class="card"><b>✔ CHECK LINES (HISTORY)</b><div id="checks">Click on (**) to scan history records...</div></div>
  <div class="card"><b>🔮 FUTURE AI PREDICTION</b><div id="future" style="font-size:2rem;font-weight:800;text-align:center;color:var(--gold);padding:10px">--</div></div>
 </div>
</div>

<script>
const FAMILY={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"11":["11","66","16","61"],"22":["22","77","27","72"],"33":["33","88","38","83"],"44":["44","99","49","94"],"55":["55","00","05","50"]};
let data = JSON.parse(localStorage.getItem("rajdhani_data")) || Array(12).fill().map(()=>Array(5).fill("**"));
let activeMark=null;

function fam(v){for(let k in FAMILY)if(FAMILY[k].includes(v))return k; return "NA";}
function norm(v){if(!v||v=="**")return"**"; v=String(v); return v.length==1?"0"+v:v;}
function start(){document.getElementById("home").style.display="none";document.getElementById("app").style.display="block";draw();}

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls="";
   if(activeMark && activeMark.map[i] && activeMark.map[i][j]) cls = activeMark.map[i][j]===1 ? "circle-red" : "circle-blue";
   if(activeMark && activeMark.originRow === i && activeMark.originCol === j) cls += " marked-origin";
   h+=`<td class="${cls}" contenteditable onblur="updateCell(${i},${j},this.innerText)" onclick="cellClick(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 setTimeout(drawLines, 50);
}

function updateCell(r,c,val){ data[r][c]=norm(val); saveData(); }

function cellClick(r,c){
 if(data[r][c] === "**") scanPattern(r,c);
 else findOrigin(r,c);
}

// Find where this jodi came from (Mark Origin)
function findOrigin(r,c){
 let currentFam = fam(data[r][c]);
 let origin = {r: -1, c: -1};
 for(let i=r-1; i>=0; i--){
    for(let j=0; j<5; j++){
        if(fam(data[i][j]) === currentFam){ origin = {r:i, c:j}; break; }
    }
    if(origin.r !== -1) break;
 }
 if(origin.r !== -1){
    activeMark = { map: [], originRow: origin.r, originCol: origin.c };
    draw();
 }
}

function scanPattern(r,c){
 let rel = [];
 let b1=null, b2=null, c1=0, c2=0;

 // Find last 10 weeks pairs
 for(let i=r-1; i>=Math.max(0, r-10); i--){
  for(let j=0; j<5; j++){
   let f=fam(data[i][j]); if(f=="NA")continue;
   if(!b1) { b1=f; rel.push({dr:i-r, dc:j, type:1}); c1++; }
   else if(f==b1 && c1<2) { rel.push({dr:i-r, dc:j, type:1}); c1++; }
   else if(!b2 && f!=b1) { b2=f; rel.push({dr:i-r, dc:j, type:2}); c2++; }
   else if(f==b2 && c2<2) { rel.push({dr:i-r, dc:j, type:2}); c2++; }
   if(c1==2 && c2==2) break;
  }
  if(c1==2 && c2==2) break;
 }

 if(rel.length < 2) return alert("Pichla data bharein pattern scan karne ke liye.");

 // Search history
 let matches = [];
 for(let i=0; i<data.length; i++){
  if(i === r) continue;
  let score = 0;
  rel.forEach(p=>{
   let rr=i+p.dr, cc=p.dc;
   if(rr>=0 && rr<data.length && fam(data[rr][cc]) !== "NA") {
      if(fam(data[rr][cc]) === (p.type==1?b1:b2)) score++;
   }
  });
  if(score >= 2) matches.push({row:i, rel, score});
 }

 let div=document.getElementById("checks"); div.innerHTML="";
 matches.sort((a,b)=>b.score - a.score).forEach(m=>{
  let d=document.createElement("div"); d.className="match-btn";
  d.innerText = `Pattern Match (Row ${m.row+1}) - Score: ${m.score}`;
  d.onclick = () => {
    let map=Array(data.length).fill().map(()=>Array(5).fill(0));
    let o1=[], o2=[];
    m.rel.forEach(p=>{
        let nr=m.row+p.dr; if(nr>=0 && nr<data.length){
            map[nr][p.dc]=p.type;
            if(p.type==1)o1.push({r:nr,c:p.dc}); else o2.push({r:nr,c:p.dc});
        }
    });
    activeMark = {map, o1, o2, originRow: m.row, originCol: c};
    draw();
  };
  div.appendChild(d);
 });

 if(matches.length > 0){
    let val = data[matches[0].row][c];
    document.getElementById("future").innerText = val !== "**" ? val + " - " + norm(String(parseInt(val)+10)) + " - " + norm(String(Math.abs(parseInt(val)-1))) : "00-11-22";
 }
}

function drawLines(){
 const cvs=document.getElementById("mainCanvas"), ctx=cvs.getContext("2d"), table=document.getElementById("tbl");
 if(!table.rows.length) return;
 cvs.width=table.offsetWidth; cvs.height=table.offsetHeight;
 ctx.clearRect(0,0,cvs.width,cvs.height);
 if(!activeMark || (!activeMark.o1 && !activeMark.o2)) return;
 const rect=table.getBoundingClientRect();
 function drawPath(pts, col){
  if(!pts || pts.length<2)return;
  pts.sort((a,b)=>a.r-b.r);
  ctx.strokeStyle=col; ctx.lineWidth=4; ctx.lineJoin="round"; ctx.beginPath();
  pts.forEach((p,i)=>{
   let c=table.rows[p.r].cells[p.c].getBoundingClientRect();
   let x=r.left-rect.left+r.width/2, y=r.top-rect.top+r.height/2; // Fix: rect reference
   x=c.left-rect.left+c.width/2; y=c.top-rect.top+c.height/2;
   i==0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();
 }
 drawPath(activeMark.o1, "#ff4757"); drawPath(activeMark.o2, "#2e86de");
}

function saveData(){ localStorage.setItem("rajdhani_data", JSON.stringify(data)); }
function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
document.getElementById("csvFile").onchange=e=>{
 let reader=new FileReader();
 reader.onload=()=>{
  data = reader.result.split("\n").filter(x=>x.trim()).map(l=>l.split(",").slice(0,5).map(v=>norm(v.trim())));
  draw(); saveData();
 };
 reader.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
