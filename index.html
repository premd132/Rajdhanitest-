<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYAN SMART SYSTEM V5</title>
<style>
:root { --gold: #ffd700; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; }
.container { max-width: 500px; margin: 0 auto; }
.box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 15px; }
h2 { color: var(--gold); text-align: center; font-size: 18px; text-transform: uppercase; margin: 5px 0; }
.label { font-size: 11px; color: #94a3b8; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #475569; background: #334155; color: #fff; box-sizing: border-box; }
button { background: var(--gold); color: #000; font-weight: bold; border: none; cursor: pointer; }
.result-box { background: #020617; padding: 15px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; display: none; margin-top: 15px; position: relative; }
.fig { display: inline-block; background: var(--gold); color: #000; padding: 8px 15px; margin: 4px; border-radius: 6px; font-size: 24px; font-weight: 800; }
.jodi-suggest { background: #1e293b; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 14px; color: #00ff88; font-weight: bold; line-height: 1.8; }
.record-card { background: var(--card); border-radius: 10px; padding: 12px; border: 1px solid #334155; }
.history-row { background: #0f172a; border-radius: 6px; padding: 8px; margin-bottom: 8px; display: grid; grid-template-columns: 30px 1fr 55px; align-items: center; gap: 8px; border-left: 3px solid var(--gold); }
.jodi-grid { display: flex; gap: 5px; flex-wrap: wrap; }
.jodi-item { background: #1e293b; color: var(--gold); padding: 2px 6px; border-radius: 3px; font-size: 14px; border: 1px solid #475569; font-family: monospace; }
</style>
</head>
<body>

<div class="container">
    <div class="box">
        <h2>🔮 Kalyan Smart System V5</h2>
        
        <div class="label">Step 1: Upload Any CSV/Text File</div>
        <input type="file" id="csvFile" accept=".csv, .txt">

        <div class="label">Step 2: Current Week Jodis</div>
        <input id="jodiInput" placeholder="11,22,33,44,55,66">

        <div class="label">Step 4: Calculation Mode</div>
        <select id="mode">
            <option value="2">Auto (Last Total)</option>
            <option value="3">Auto (Common Total)</option>
            <option value="4">Strong All-Rounder</option>
        </select>

        <button id="calcBtn">GET TARGET FIGURES</button>

        <div id="resultArea" class="result-box">
            <div style="color:var(--gold); font-size:12px; font-weight:bold;">TARGET: NEXT DAY OTC</div>
            <div id="figOutput"></div>
            <div class="label">Crossing Jodis</div>
            <div id="jodiOutput" class="jodi-suggest"></div>
        </div>

        <button id="saveBtn" style="background: #22c55e; color: white; margin-top:10px;">SAVE TO HISTORY</button>
    </div>

    <div class="record-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <span style="font-size:13px; font-weight:bold; color:var(--gold)">📊 SAVED RECORDS</span>
            <button onclick="clearAll()" style="width:auto; padding:5px 10px; background:#ef4444; font-size:10px">CLEAR</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<script>
const DB_KEY = "KALYAN_V5_FINAL";
let historyData = JSON.parse(localStorage.getItem(DB_KEY)) || [];

window.onload = renderHistory;

// फाइल से डेटा निकालने का सबसे बेहतरीन तरीका
function smartExtract(text) {
    // फाइल में जहाँ भी 2 अंकों वाले नंबर हैं उन्हें ढूंढो
    const allNumbers = text.match(/\b\d{2}\b/g);
    if (!allNumbers) return [];

    let results = [];
    // 6-6 के ग्रुप में बांटो
    for (let i = 0; i < allNumbers.length; i += 6) {
        let chunk = allNumbers.slice(i, i + 6);
        if (chunk.length === 6) {
            results.push(chunk.join(","));
        }
    }
    return results;
}

// फाइल अपलोड इवेंट
document.getElementById("csvFile").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const text = event.target.result;
        const processedRows = smartExtract(text);

        if (processedRows.length > 0) {
            // पुराने डेटा में नया डेटा जोड़ें (बिना डुप्लिकेट के)
            processedRows.reverse().forEach(row => {
                if(!historyData.includes(row)) historyData.unshift(row);
            });
            saveData();
            alert("✅ " + processedRows.length + " हफ़्तों का रिकॉर्ड लोड हो गया!");
        } else {
            alert("❌ फाइल में सही जोड़ियाँ नहीं मिलीं।");
        }
    };
    reader.readAsText(file);
    this.value = "";
});

// कैलकुलेशन लॉजिक
document.getElementById("calcBtn").onclick = () => {
    const val = document.getElementById("jodiInput").value;
    const jodis = val.match(/\b\d{2}\b/g);
    
    if (!jodis || jodis.length < 6) {
        alert("कम से कम 6 जोड़ियाँ डालें!");
        return;
    }

    const lastJodi = jodis[jodis.length - 1];
    const total = (parseInt(lastJodi[0]) + parseInt(lastJodi[1])) % 10;
    
    // OTC Formula
    let a = (total + 1) % 10, b = (total + 9) % 10;
    let finalFigs = [...new Set([a, b, (a+5)%10, (b+5)%10])].sort();

    // Jodi Crossing
    let cross = [];
    finalFigs.forEach(f1 => finalFigs.forEach(f2 => cross.push(""+f1+f2)));

    document.getElementById("figOutput").innerHTML = finalFigs.map(f => `<span class="fig">${f}</span>`).join("");
    document.getElementById("jodiOutput").innerHTML = cross.join(" ");
    document.getElementById("resultArea").style.display = "block";
};

document.getElementById("saveBtn").onclick = () => {
    const val = document.getElementById("jodiInput").value;
    const jodis = val.match(/\b\d{2}\b/g);
    if (jodis && jodis.length >= 6) {
        const row = jodis.slice(0,6).join(",");
        if(!historyData.includes(row)) {
            historyData.unshift(row);
            saveData();
            alert("Saved!");
        }
    }
};

function saveData() {
    localStorage.setItem(DB_KEY, JSON.stringify(historyData));
    renderHistory();
}

function renderHistory() {
    const listDiv = document.getElementById("historyList");
    listDiv.innerHTML = historyData.length ? "" : "<div style='text-align:center; padding:10px; opacity:0.5'>No Data</div>";
    historyData.forEach((row, idx) => {
        const jodis = row.split(",");
        listDiv.innerHTML += `
            <div class="history-row">
                <div style="font-size:10px; opacity:0.6">${historyData.length - idx}</div>
                <div class="jodi-grid">${jodis.map(j => `<span class="jodi-item">${j}</span>`).join("")}</div>
                <button style="background:#3b82f6; color:#fff; border:none; border-radius:4px; font-size:10px; padding:5px;" onclick="loadRow('${row}')">USE</button>
            </div>`;
    });
}

function loadRow(str) { document.getElementById("jodiInput").value = str; window.scrollTo(0,0); }
function clearAll() { if(confirm("सब डिलीट करें?")) { historyData = []; saveData(); } }
</script>
</body>
</html>
