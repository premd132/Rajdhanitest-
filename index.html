<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI – Full History Pattern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; --red-circle: #ff4757; --blue-circle: #2e86de; 
            --green-line: #00ff88; --bg: #0f172a; --panel: #1e293b; 
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; }
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; }
        
        /* Table Style */
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; }
        
        /* Pattern Markers */
        .circle-red { border: 3px solid var(--red-circle) !important; border-radius: 50%; background: rgba(255, 71, 87, 0.2); }
        .circle-blue { border: 3px solid var(--blue-circle) !important; border-radius: 50%; background: rgba(46, 134, 222, 0.2); }
        .source-mark { background-color: #fffa90 !important; border: 2px solid #ff9f43 !important; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        
        /* Check Line Design */
        .check-line { background: #2d3436; margin: 5px 0; padding: 12px; border-radius: 8px; border-left: 5px solid var(--gold); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .check-line:hover { background: #3d4446; transform: translateX(5px); }

        /* Popup */
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 20px; color: #000; width: 95%; max-width: 500px; box-shadow: 0 0 50px rgba(0,0,0,1); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 90; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
    </style>
</head>
<body>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 Load History CSV</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 Save</button>
    </div>

    <center>
        <div class="table-container">
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3>🔍 History Check Lines (1, 2, 3 Pattern)</h3>
            <div id="checks" style="max-height: 300px; overflow-y: auto;">Click blank cell...</div>
        </div>
        <div class="card">
            <h3>🔮 Future AI Predictions</h3>
            <div id="future-prediction" style="font-size: 2rem; color: var(--gold); text-align: center; font-weight: 800; letter-spacing: 5px;">-- -- --</div>
            <p style="text-align:center; font-size: 12px; opacity: 0.6;">(Based on full history matches)</p>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <h3 style="margin-top:0">Historical Pattern Record</h3>
    <div id="popData" style="position:relative; background:#fff; padding:10px; border-radius:10px;"></div>
    <button onclick="closePopup()" style="width:100%; margin-top:15px; padding:10px; background:#000; color:#fff; border:none; border-radius:5px; cursor:pointer;">CLOSE VIEW</button>
</div>

<script>
const STORAGE_KEY = "Rajdhani_Pro_Data";
const FAMILY = {
    "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], 
    "99":["99","44","49","94"], "55":["50","00","05","55"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],
    "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"],
    "24":["24","29","42","47","74","79","92","97"], "25":["02","07","20","25","52","57","70","75"],
    "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],
    "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(15).fill().map(()=>Array(5).fill("**"));

function fam(v){ for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA"; }
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return fam(a)===fam(b); }
function norm(v){ v=String(v).trim(); return (v.length==1 && v!=="*")?"0"+v:v; }

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            h+=`<td contenteditable="true" oninput="edit(${ri},${ci},this)" onclick="handleCell(${ri},${ci})">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("History Saved!"); }

function handleCell(r, c) {
    if(data[r][c] !== "**") {
        markSource(r,c);
        return;
    }
    scanFullHistory(r, c);
}

// पूरे पुराने डेटा से पैटर्न ढूँढना
function scanFullHistory(targetRow, targetCol) {
    let b1 = "**", b2 = "**";
    let patternRowsCount = 5; // पिछले 5 हफ्तों का पैटर्न शेप
    let startIdx = Math.max(0, targetRow - patternRowsCount);

    // वर्तमान पैटर्न का बेस (जोड़ी 1 और जोड़ी 2) ढूँढना
    for (let i = targetRow - 1; i >= startIdx; i--) {
        for (let j = 0; j < 5; j++) {
            if (data[i][j] !== "**") {
                if (b1 === "**") b1 = data[i][j];
                else if (b2 === "**" && fam(data[i][j]) !== fam(b1)) b2 = data[i][j];
            }
        }
    }

    if(b1=="**" || b2=="**") { alert("Not enough data above to form a pattern."); return; }

    // पैटर्न का नक्शा (Shape) बनाना
    let shape = [];
    for (let i = startIdx; i < targetRow; i++) {
        let rowMap = [];
        for (let j = 0; j < 5; j++) {
            if (smartMatch(data[i][j], b1)) rowMap.push(1);
            else if (smartMatch(data[i][j], b2)) rowMap.push(2);
            else rowMap.push(0);
        }
        shape.push(rowMap);
    }

    // पूरी हिस्ट्री (0 से लेकर अंत तक) में सर्च करना
    let matches = [];
    for (let i = 0; i < data.length - shape.length; i++) {
        if (i >= startIdx - 1) break; // वर्तमान पोजीशन तक ही सर्च करें
        
        let matchCount = 0;
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < 5; c++) {
                if (shape[r][c] === 1 && smartMatch(data[i+r][c], b1)) matchCount++;
                if (shape[r][c] === 2 && smartMatch(data[i+r][c], b2)) matchCount++;
            }
        }
        // अगर पैटर्न की कम से कम 3 जोड़ियाँ मैच हो रही हैं (1,2,3 pattern)
        if (matchCount >= 3) {
            matches.push({ index: i, result: data[i + shape.length][targetCol] });
        }
    }

    renderCheckLines(matches, shape, b1, b2);
}

function renderCheckLines(matches, shape, b1, b2) {
    const container = document.getElementById("checks");
    const predBox = document.getElementById("future-prediction");
    container.innerHTML = "";
    
    if(matches.length === 0) {
        container.innerHTML = "No historical matches found in old records.";
        predBox.innerText = "-- -- --";
        return;
    }

    let results = [];
    matches.forEach((m, i) => {
        let div = document.createElement("div");
        div.className = "check-line";
        div.innerHTML = `<span>Record Row: ${m.index + 1}</span> <b>View Pattern ➔</b>`;
        div.onclick = () => showPopup(m.index, shape, b1, b2);
        container.appendChild(div);
        if(m.result !== "**") results.push(m.result);
    });

    // Advanced Prediction: ऐतिहासिक रिजल्ट्स को दिखाना
    let unique = [...new Set(results)].slice(0, 3);
    predBox.innerText = unique.length > 0 ? unique.join(" - ") : "No Data";
}

function showPopup(idx, shape, b1, b2) {
    let h = "<table id='popTbl' style='width:100%'>";
    for(let i=0; i < shape.length; i++) {
        h += "<tr>";
        for(let j=0; j < 5; j++) {
            let val = data[idx+i][j];
            let cls = smartMatch(val, b1) ? "circle-red" : (smartMatch(val, b2) ? "circle-blue" : "");
            h += `<td class="${cls}">${val}</td>`;
        }
        h += "</tr>";
    }
    // ऐतिहासिक रिजल्ट वाली लाइन
    h += "<tr style='background:#f1f2f6'><td>Res:</td>";
    data[idx+shape.length].forEach(v => h += `<td style="color:red">${v}</td>`);
    h += "</tr></table><canvas id='popCanvas'></canvas>";

    document.getElementById("popData").innerHTML = h;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
}

function markSource(r, c) {
    draw(); // clear previous
    let cells = document.querySelectorAll("#tbl td");
    let idx = (r * 5) + c;
    if(cells[idx]) cells[idx].classList.add("source-mark");
}

function closePopup() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("popup").style.display = "none";
}

// CSV Load Logic
document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v.trim())).slice(0,5));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};

window.onload = draw;
</script>
</body>
</html>
