<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Rajdhani Pro AI - Final Family Connect</title>
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
body{margin:0; background:var(--bg); color:#fff; font-family: sans-serif; display:flex; flex-direction:column; align-items:center; padding:10px;}
.toolbar{display:flex; gap:10px; margin-bottom:15px;}
button{background:#1e293b; color:white; border:1px solid var(--gold); padding:8px 12px; border-radius:5px; cursor:pointer; font-weight:bold;}
.table-box{position:relative; background:white; padding:5px; border-radius:5px; display:inline-block;}
table{border-collapse:collapse; color:black; position:relative; z-index:5;}
td, th{border:1px solid #ccc; width:45px; height:45px; text-align:center; font-weight:bold; font-size:18px; cursor:pointer;}
th{background:#1e293b; color:white; font-size:10px;}
.circle-red { border: 4px solid var(--red) !important; border-radius: 50%; }
.circle-blue { border: 4px solid var(--blue) !important; border-radius: 50%; }
.marked-result { background: #facc15 !important; border: 2px solid #000 !important; }
canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
#overlay{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center; }
.popup-box{ background:#fff; padding:15px; border-radius:10px; width:95%; max-width:550px; color: black; }
.card{ background:var(--panel); padding:10px; border-radius:8px; border-top:3px solid var(--gold); margin-top:15px; width:100%; max-width:900px;}
.check-item{ background:#2d3748; padding:10px; margin:5px 0; border-radius:5px; border-left:4px solid var(--gold); cursor:pointer; color:white;}
</style>
</head>
<body>

<div class="toolbar">
    <button onclick="addRow()">➕ ADD ROW</button>
    <button onclick="exportCSV()">💾 SAVE CSV</button>
</div>

<div class="table-box">
    <canvas id="mainCanvas"></canvas>
    <table id="tblMain"></table>
</div>

<div class="card">
    <b>✔ FAMILY CONNECTION CHECK (HISTORY)</b>
    <div id="checkList">Click (**) cell to scan Family Patterns...</div>
</div>

<div id="overlay">
    <div class="popup-box">
        <button style="float:right; background:red; color:white; border:none; padding:5px; border-radius:5px;" onclick="closePopup()">CLOSE</button>
        <h3>Historical Family Connection</h3>
        <div style="position:relative; overflow:auto; max-height:400px;">
            <canvas id="popupCanvas"></canvas>
            <table id="tblPopup"></table>
        </div>
    </div>
</div>

<script>
// Family Groups Definition
const FAM = {
    "1":["01","06","10","15","51","56","60","65"], "2":["02","07","20","25","52","57","70","75"],
    "3":["03","08","30","35","53","58","80","85"], "4":["04","09","40","45","54","59","90","95"],
    "0":["00","05","50","55"], "11":["11","16","61","66"], "22":["22","27","72","77"],
    "33":["33","38","83","88"], "44":["44","49","94","99"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "34":["34","39","43","48","84","89","93","98"]
};

let data = JSON.parse(localStorage.getItem('pData')) || Array(30).fill().map(()=>Array(5).fill("**"));

function getF(v) { if(!v || v==="**") return null; for(let k in FAM) if(FAM[k].includes(v)) return k; return null; }

function render(tid, tdata, p = null){
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    tdata.forEach((row, r)=>{
        h += "<tr>";
        row.forEach((cell, c)=>{
            let cls = (p && p.yR===r && p.yC===c) ? "marked-result" : "";
            if(p && p.reds.some(pt=>pt.r===r && pt.c===c)) cls += " circle-red";
            if(p && p.blues.some(pt=>pt.r===r && pt.c===c)) cls += " circle-blue";
            h += `<td class="${cls}" contenteditable onblur="upd(${r},${c},this.innerText)" onclick="cellClick(${r},${c})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById(tid).innerHTML = h;
    if(tid === "tblMain") setTimeout(() => drawLines("mainCanvas", "tblMain", p), 50);
}

function upd(r,c,v){ data[r][c]=v.trim(); localStorage.setItem('pData', JSON.stringify(data)); }

function cellClick(r,c){
    if(data[r][c] !== "**") return;
    
    // Scan up to 10 rows for Family Matches
    let reds = [], blues = [];
    for(let i=1; i<=10; i++){
        // Example logic: Find family connection from rows above
        if(getF(data[r-i]?.[c-1])) reds.push({r: r-i, c: c-1});
        if(getF(data[r-i]?.[c+1])) blues.push({r: r-i, c: c+1});
    }

    let p = { yR: r, yC: c, reds: reds.slice(0,2), blues: blues.slice(0,2) };
    render("tblMain", data, p);

    let list = document.getElementById('checkList');
    list.innerHTML = "";
    
    // Check line logic: Finding where same family connection happened in history
    for(let i=10; i<data.length; i++){
        if(i !== r && data[i][c] !== "**"){
            let match = false;
            p.reds.forEach(pr => {
                if(getF(data[i-(r-pr.r)]?.[pr.c]) === getF(data[pr.r][pr.c])) match = true;
            });
            if(match){
                let div = document.createElement('div');
                div.className = "check-item";
                div.innerText = `Family Connection Match: Week ${i+1}`;
                div.onclick = () => openPopup(i, c, p.reds.map(pr=>r-pr.r), p.blues.map(pb=>r-pb.r));
                list.appendChild(div);
            }
        }
    }
}

function openPopup(mR, mC, rOff, bOff){
    document.getElementById('overlay').style.display = 'flex';
    let p = {
        yR: mR, yC: mC,
        reds: rOff.map(o => ({r: mR-o, c: mC-1})),
        blues: bOff.map(o => ({r: mR-o, c: mC+1}))
    };
    let start = Math.max(0, mR - 10);
    let subData = data.slice(start, mR + 2);
    let adjP = {
        yR: mR - start, yC: mC,
        reds: p.reds.map(pt => ({r: pt.r - start, c: pt.c})),
        blues: p.blues.map(pt => ({r: pt.r - start, c: pt.c}))
    };
    render("tblPopup", subData, adjP);
    setTimeout(() => drawLines("popupCanvas", "tblPopup", adjP), 100);
}

function drawLines(canId, tblId, p){
    const canvas = document.getElementById(canId), table = document.getElementById(tblId), ctx = canvas.getContext('2d');
    if(!p) return;
    canvas.width = table.offsetWidth; canvas.height = table.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const rect = table.getBoundingClientRect();
    const tCell = table.rows[p.yR+1].cells[p.yC].getBoundingClientRect();
    const tx = tCell.left-rect.left+tCell.width/2, ty = tCell.top-rect.top+tCell.height/2;

    const drawLine = (pts, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 3;
        pts.forEach(pt => {
            if(pt.r<0 || pt.r >= table.rows.length-1) return;
            const cRect = table.rows[pt.r+1].cells[pt.c].getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(cRect.left-rect.left+cRect.width/2, cRect.top-rect.top+cRect.height/2);
            ctx.lineTo(tx, ty);
            ctx.stroke();
        });
    }
    drawLine(p.reds, "#ff4757"); drawLine(p.blues, "#2e86de");
}

function addRow(){ data.push(["**","**","**","**","**"]); render("tblMain", data); }
function closePopup(){ document.getElementById('overlay').style.display='none'; }
function exportCSV(){ let csv = data.map(r => r.join(",")).join("\n"); let a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download="rajdhani.csv"; a.click(); }
render("tblMain", data);
</script>
</body>
</html>
