<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Final CSV</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Poppins}
table{border-collapse:collapse;background:#fff;color:#000}
td,th{border:1px solid #ccc;width:45px;height:45px;text-align:center;font-weight:700}
th{background:#1e293b;color:#fff}
.circle-red{border:3px solid #ff4757;border-radius:50%}
.circle-blue{border:3px solid #2e86de;border-radius:50%}
.match{background:#111;padding:8px;margin:6px 0;border-left:4px solid #2e86de;cursor:pointer}
#popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#popup .box{background:#fff;color:#000;padding:10px;border-radius:10px}
</style>
</head>

<body>

<h2 style="padding:10px">Rajdhani Pro AI</h2>

<input type="file" id="csvFile">
<button onclick="saveCSV()">Save CSV</button>

<div style="display:flex;gap:20px;padding:10px">
 <div>
  <table id="tbl"></table>
 </div>
 <div>
  <h3>✔ Check Lines</h3>
  <div id="checks"></div>
 </div>
</div>

<div id="popup" onclick="this.style.display='none'">
 <div class="box" onclick="event.stopPropagation()">
  <table id="popTbl"></table>
 </div>
</div>

<script>
/* FAMILY */
const FAMILY={
"12":["12","17","21","26","62","67","71","76"],
"13":["13","18","31","36","63","68","81","86"],
"14":["14","19","41","46","64","69","91","96"],
"15":["01","06","10","15","51","56","60","65"],
"23":["23","28","32","37","73","78","82","87"],
"24":["24","29","42","47","74","79","92","97"],
"25":["02","07","20","25","52","57","70","75"],
"34":["34","39","43","48","84","89","93","98"],
"35":["03","08","30","35","53","58","80","85"],
"45":["04","09","40","45","54","59","90","95"]
};
const fam=v=>{for(let k in FAMILY)if(FAMILY[k].includes(v))return k;};

let data=Array(50).fill().map(()=>Array(5).fill("**"));
let basePattern=null;

const tbl=document.getElementById("tbl");
const checks=document.getElementById("checks");
const popTbl=document.getElementById("popTbl");

/* DRAW */
function draw(){
 let h="<tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls=basePattern?.map[i]?.[j]==1?"circle-red":
           basePattern?.map[i]?.[j]==2?"circle-blue":"";
   h+=`<td class="${cls}" onclick="clickCell(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
}

/* BUILD PATTERN */
function clickCell(r,c){
 if(data[r][c]!=="**")return;

 let map=Array(data.length).fill().map(()=>Array(5).fill(0));
 let f1=null,f2=null,o1=[],o2=[],cols=new Set();

 for(let i=r;i>=0&&i>r-8;i--){
  for(let dc=-1;dc<=1;dc++){
   let j=c+dc;if(j<0||j>=5)continue;
   let f=fam(data[i][j]); if(!f)continue;
   if(!f1){f1=f;map[i][j]=1;o1.push({r:i,c:j});cols.add(j);}
   else if(f===f1&&o1.length<3){map[i][j]=1;o1.push({r:i,c:j});cols.add(j);}
   else if(!f2){f2=f;map[i][j]=2;o2.push({r:i,c:j});cols.add(j);}
   else if(f===f2&&o2.length<3){map[i][j]=2;o2.push({r:i,c:j});cols.add(j);}
  }
 }
 if(o1.length<2||o2.length<2){alert("Pattern nahi mila");return;}

 basePattern={fam1:f1,fam2:f2,cols:[...cols],map};
 draw();
 findCheckLines();
}

/* CHECK LINES FROM OLD RECORDS */
function findCheckLines(){
 checks.innerHTML="";
 let count=1;
 for(let r=0;r<data.length-6&&count<=4;r++){
  let s1=new Set(),s2=new Set();
  for(let i=r;i<r+6;i++){
   for(let col of basePattern.cols){
    let f=fam(data[i][col]);
    if(f===basePattern.fam1)s1.add(data[i][col]);
    if(f===basePattern.fam2)s2.add(data[i][col]);
   }
  }
  if(s1.size>=2&&s2.size>=2){
   let d=document.createElement("div");
   d.className="match";
   d.innerText=(count<10?"0":"")+count+". Row "+(r+1);
   d.onclick=()=>openPopup(r);
   checks.appendChild(d);
   count++;
  }
 }
}

/* POPUP */
function openPopup(r){
 document.getElementById("popup").style.display="flex";
 popTbl.innerHTML="";
 [r-1,r,r+1].forEach(i=>{
  if(i<0||i>=data.length)return;
  let tr="<tr>";
  for(let j=0;j<5;j++){
   let cls=basePattern.map[i]?.[j]==1?"circle-red":
           basePattern.map[i]?.[j]==2?"circle-blue":"";
   tr+=`<td class="${cls}">${data[i][j]}</td>`;
  }
  tr+="</tr>";
  popTbl.innerHTML+=tr;
 });
}

/* CSV */
csvFile.onchange=e=>{
 let r=new FileReader();
 r.onload=()=>{data=r.result.trim().split("\n").map(x=>x.split(","));draw();};
 r.readAsText(e.target.files[0]);
};
function saveCSV(){
 let csv=data.map(r=>r.join(",")).join("\n");
 let a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([csv]));
 a.download="rajdhani.csv";a.click();
}

draw();
</script>
</body>
</html>
