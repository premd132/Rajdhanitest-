<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan AI - Reverse Pattern Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --f1: #0084ff; --f2: #ff4757; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; }
        #app { padding: 10px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; margin-bottom: 10px; display: flex; gap: 8px; justify-content: center; }
        .table-container { position: relative; background: #fff; border-radius: 8px; padding: 5px; display: inline-block; box-shadow: 0 0 25px #000; }
        table { border-collapse: collapse; color: #000; font-size: 13px; position: relative; z-index: 5; }
        td, th { border: 1px solid #eee; width: 42px; height: 42px; text-align: center; font-weight: bold; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 9px; }
        .f1-mark { border: 3px solid var(--f1) !important; border-radius: 50%; background: rgba(0,132,255,0.2); }
        .f2-mark { border: 3px solid var(--f2) !important; border-radius: 50%; background: rgba(255,71,87,0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; margin-top: 10px; border-top: 3px solid var(--gold); }
        .check-btn { background: #2d3748; padding: 10px; margin: 5px 0; border-radius: 8px; cursor: pointer; border-left: 5px solid #00ff88; font-size: 12px; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 10px; color: #000; width: 95%; max-width: 400px; border: 4px solid var(--gold); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 90; }
        .future-box { font-size: 20px; font-weight: 800; color: #00ff88; text-align: center; letter-spacing: 5px; }
    </style>
</head>
<body>

<div id="app">
    <div class="toolbar">
        <button onclick="addRow()" style="background:#444; color:#fff;">➕ ROW</button>
        <button onclick="saveData()" style="background:#00ff88; color:#000;">💾 SAVE</button>
        <button onclick="document.getElementById('csv').click()" style="background:var(--gold); color:#000;">📂 CSV</button>
        <input type="file" id="csv" style="display:none">
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="margin-top:0">🔮 Future AI 3-Pair</h3>
        <div id="future-ai" class="future-box">-- -- --</div>
    </div>

    <div class="card">
        <h3>✔ History Check Lines</h3>
        <div id="check-list">Click a blank cell to find Day-to-Day matches...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:red; color:white; border:none; padding:5px 10px; cursor:pointer;">X</button>
    <h3 style="margin:0; font-size:14px;">Historical Pattern Match</h3>
    <center><div id="popContent" style="margin-top:10px;"></div></center>
</div>

<script>
const FAMILY = {"00":["00","05","50","55"],"11":["11","16","61","66"],"22":["22","27","72","77"],"33":["33","38","83","88"],"44":["44","49","94","99"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["10","15","01","06","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["20","25","02","07","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["30","35","03","08","53","58","80","85"],"45":["40","45","04","09","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem("kalyan_rev_v1")) || [["88","40","03","12","45","33"],["**","**","**","**","**","**"]];
let activePattern = null;

function getFam(v){ for(let k in FAMILY) if(FAMILY[k].includes(String(v))) return k; return v; }
function norm(v){ v=String(v).trim(); return v=="**"?"**":(v.length==1?"0"+v:v); }

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let cls = "";
            if(activePattern && ri >= activePattern.start && ri < activePattern.start + 6){
                if(getFam(c) === activePattern.f1) cls = "f1-mark";
                else if(getFam(c) === activePattern.f2) cls = "f2-mark";
            }
            h+=`<td class="${cls}" onclick="handleCell(${ri},${ci})">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activePattern) setTimeout(()=>renderLines("mainCanvas", "tbl"), 50);
}

function handleCell(r,c){
    if(data[r][c]=="**") runReverseAI(r,c);
    else { let v=prompt("Edit:", data[r][c]); if(v!==null){data[r][c]=norm(v); draw();}}
}

function runReverseAI(r, c) {
    let startRow = Math.max(0, r - 6);
    let colFamilies = [];
    
    // Find top 2 families in this column (max 6 weeks back)
    for(let i=r-1; i>=startRow; i--){
        let f = getFam(data[i][c]);
        if(f!=="**" && !colFamilies.includes(f)) colFamilies.push(f);
        if(colFamilies.length >= 2) break;
    }
    if(colFamilies.length < 2) return;

    // Create a strict day-wise map of these families
    let patternMap = []; 
    for(let i=0; i<6; i++){
        let curR = startRow + i;
        if(curR >= r) break;
        data[curR].forEach((val, dayIdx) => {
            let f = getFam(val);
            if(f === colFamilies[0]) patternMap.push({ weekOff: i, day: dayIdx, type: 1 });
            else if(f === colFamilies[1]) patternMap.push({ weekOff: i, day: dayIdx, type: 2 });
        });
    }

    // Search History for same sequence
    let matches = [];
    for(let i=0; i < data.length - 10; i++){
        let score = 0;
        let foundFamilies = {f1: 0, f2: 0};
        
        patternMap.forEach(p => {
            let histVal = getFam(data[i + p.weekOff][p.day]);
            if(p.type === 1 && histVal === colFamilies[0]) { score++; foundFamilies.f1++; }
            if(p.type === 2 && histVal === colFamilies[1]) { score++; foundFamilies.f2++; }
        });

        // Strict: Max 3 jodi per family in pattern
        if(score >= 2 && foundFamilies.f1 <= 3 && foundFamilies.f2 <= 3){
            matches.push({ idx: i, score: score });
        }
    }

    let list = document.getElementById("check-list");
    list.innerHTML = "";
    matches.sort((a,b)=>b.score - a.score).slice(0,5).forEach((m, idx) => {
        let d = document.createElement("div");
        d.className = "check-btn";
        d.innerHTML = `Line ${idx+1}: Found at Row ${m.idx+1} (Match: ${m.score})`;
        d.onclick = () => {
            activePattern = { start: m.idx, f1: colFamilies[0], f2: colFamilies[1] };
            draw();
            showPopup(m.idx, colFamilies);
            // Future Prediction Logic
            let nextRow = m.idx + 6;
            if(data[nextRow]) {
                let pred = FAMILY[getFam(data[nextRow][c])];
                document.getElementById("future-ai").innerText = pred ? pred.slice(0,3).join(" ") : "-- -- --";
            }
        };
        list.appendChild(d);
    });
}

function showPopup(start, fams){
    let h = "<table id='popTbl'>";
    for(let i=start; i<start+6; i++){
        h += "<tr>";
        data[i].forEach(v => {
            let cls = (getFam(v)===fams[0]) ? "f1-mark" : (getFam(v)===fams[1] ? "f2-mark" : "");
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popContent").innerHTML = h+"</table>";
    document.getElementById("popup").style.display="block";
    document.getElementById("overlay").style.display="block";
    setTimeout(()=>renderLines("popCanvas", "popContent"), 100);
}

function renderLines(cvsId, containerId) {
    const cvs = document.getElementById(cvsId);
    const cont = (containerId==="tbl") ? document.getElementById(containerId) : document.querySelector("#popContent table");
    const ctx = cvs.getContext("2d");
    cvs.width = cont.offsetWidth; cvs.height = cont.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const drawF = (cls, col) => {
        let dots = cont.querySelectorAll("."+cls);
        if(dots.length < 2) return;
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
        dots.forEach((d,i)=>{
            let r=d.getBoundingClientRect(), p=cont.getBoundingClientRect();
            let x=r.left-p.left+r.width/2, y=r.top-p.top+r.height/2;
            if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };
    drawF("f1-mark", "#0084ff"); drawF("f2-mark", "#ff4757");
}

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => { data = fr.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>norm(v))); draw(); };
    fr.readAsText(e.target.files[0]);
};
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("kalyan_rev_v1", JSON.stringify(data)); alert("Saved!"); }
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
draw();
</script>
</body>
</html>
