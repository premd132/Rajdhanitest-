<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI – Dual Pattern System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; --red-circle: #ff4757; --blue-circle: #2e86de; 
            --green-line: #00ff88; --bg: #0f172a; --panel: #1e293b; 
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        #home-screen {
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .hero-title { font-size: 3rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .enter-btn {
            background: var(--gold); color: #000; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 800; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-top: 20px;
        }

        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 11px; }
        
        /* Marking Colors */
        .mark-1 { border: 3px solid var(--red-circle) !important; border-radius: 50% !important; background: rgba(255, 71, 87, 0.2); }
        .mark-2 { border: 3px solid var(--blue-circle) !important; border-radius: 50% !important; background: rgba(46, 134, 222, 0.2); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .card h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 14px; text-transform: uppercase; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 12px; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">Rajdhani PRO AI</h1>
    <p style="opacity:0.7">ADVANCED DUAL-COLOR TRACING</p>
    <button class="enter-btn" onclick="startApp()">ENTER SYSTEM</button>
</div>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container" id="chartArea">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card"><h3>✔ Check Lines</h3><div id="checks">Click a blank cell (**) to scan</div></div>
        <div class="card"><h3>🤖 AI Logic Tool</h3><div id="ai">Ready...</div></div>
        <div class="card"><h3>🔮 Future AI (3-Pair)</h3><div id="future">...</div></div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white;">X</button>
    <h3>Old Record Pattern</h3>
    <div class="table-container" style="width:100%; overflow:auto;">
        <canvas id="popCanvas"></canvas>
        <div id="popData"></div>
    </div>
</div>

<script>
const FAMILY = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["44","49","94","99"],"55":["00","05","50","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem("pdata_Rajdhani_v3")) || Array(15).fill().map(()=>Array(5).fill("**"));
let activeMark = null;

function startApp() { document.getElementById('home-screen').style.display='none'; document.getElementById('main-app').style.display='block'; draw(); }
function fam(v){ for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA"; }
function smartMatch(a,b){ return fam(a)===fam(b); }

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((r,ri)=>{
        h+=`<tr>`;
        r.forEach((c,ci)=>{
            let cls = "";
            if(activeMark && ri >= activeMark.start && ri < activeMark.start + activeMark.shape.length){
                let type = activeMark.shape[ri-activeMark.start][ci];
                if(type === 1) cls = "mark-1";
                if(type === 2) cls = "mark-2";
            }
            h+=`<td class="${cls}" contenteditable oninput="data[${ri}][${ci}]=this.innerText" onclick="${c=='**'?'makePattern('+ri+','+ci+')':''}">${c}</td>`;
        });
        h+=`</tr>`;
    });
    document.getElementById("tbl").innerHTML=h;
    if(activeMark) setTimeout(()=>drawLines("mainCanvas", "tbl"), 50);
}

function makePattern(r, c) {
    let b1 = "**", b2 = "**", b1count = 0, b2count = 0;
    let shape = Array(11).fill().map(()=>Array(5).fill(0));
    let startScan = Math.max(0, r-10);

    // Build pattern: Sirf 2 jodi per family
    for(let i=r-1; i>=startScan; i--){
        for(let j=0; j<5; j++){
            let v = data[i][j];
            if(v!=="**"){
                if(b1==="**"){ b1=v; b1count=1; shape[i-startScan][j]=1; }
                else if(smartMatch(v,b1) && b1count < 2){ b1count++; shape[i-startScan][j]=1; }
                else if(b2==="**" && fam(v)!=fam(b1)){ b2=v; b2count=1; shape[i-startScan][j]=2; }
                else if(b2!=="**" && smartMatch(v,b2) && b2count < 2){ b2count++; shape[i-startScan][j]=2; }
            }
        }
    }

    if(b1==="**") return alert("Data kam hai!");

    let matches = [];
    let patternRows = r - startScan;
    for(let i=0; i<=data.length - patternRows - 1; i++){
        let ok = true;
        for(let k=0; k<patternRows; k++){
            for(let j=0; j<5; j++){
                if(shape[k][j]===1 && !smartMatch(data[i+k][j], b1)) ok=false;
                if(shape[k][j]===2 && !smartMatch(data[i+k][j], b2)) ok=false;
            }
        }
        if(ok && i !== startScan) matches.push({index: i, res: data[i+patternRows][c]});
    }

    activeMark = {start: startScan, shape: shape};
    draw();
    showMatches(shape, matches);
}

function showMatches(shape, matches){
    let checks = document.getElementById("checks");
    checks.innerHTML = matches.map(m => `
        <div style="background:#334155; padding:8px; margin-bottom:5px; border-radius:5px; cursor:pointer;" onclick="showPopup(${m.index}, ${JSON.stringify(shape)})">
            Row ${m.index+1} Match Found ➔ <b style="color:var(--gold)">${m.res}</b>
        </div>
    `).join("") || "No matches in last 10 weeks.";

    // Advanced AI Logic
    let results = matches.map(m => m.res).filter(v => v!=="**");
    document.getElementById("ai").innerHTML = `Best Result: <span style="color:var(--green-line)">${results[0] || 'N/A'}</span>`;
    
    // Future AI (3-Pair)
    let top3 = [...new Set(results)].slice(0,3);
    document.getElementById("future").innerHTML = top3.length ? 
        `<div style="font-size:1.2rem; color:var(--gold)">${top3.join(" - ")}</div>` : "Searching...";
}

function showPopup(idx, shape){
    let h = "<table>";
    for(let i=0; i<shape.length; i++){
        h += "<tr>";
        data[idx+i].forEach((v, j) => {
            let cls = shape[i][j]===1 ? "mark-1" : (shape[i][j]===2 ? "mark-2" : "");
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popData").innerHTML = h + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    setTimeout(()=>drawLines("popCanvas", "popData"), 100);
}

function drawLines(cvId, parentId) {
    let cv = document.getElementById(cvId), ctx = cv.getContext("2d"), parent = document.getElementById(parentId);
    cv.width = parent.offsetWidth; cv.height = parent.offsetHeight;
    ctx.clearRect(0,0,cv.width,cv.height);
    let rect = parent.getBoundingClientRect();

    const drawForClass = (cls, color) => {
        let dots = parent.querySelectorAll("."+cls);
        if(dots.length < 2) return;
        ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
        dots.forEach((d, i) => {
            let r = d.getBoundingClientRect();
            let x = r.left - rect.left + r.width/2;
            let y = r.top - rect.top + r.height/2;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };

    drawForClass("mark-1", "#ff4757"); // Red lines
    drawForClass("mark-2", "#2e86de"); // Blue lines
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("pdata_Rajdhani_v3", JSON.stringify(data)); alert("Data Saved!"); }
function clearData(){ if(confirm("Clear everything?")){ localStorage.clear(); location.reload(); }}
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
</script>
</body>
</html>
