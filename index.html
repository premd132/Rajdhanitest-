<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan AI - Strict Pattern Pro</title>
<style>
    :root { --gold: #ffd700; --red: #ff3e3e; --green: #00ff00; --blue: #0084ff; --bg: #121212; --panel: #1e1e1e; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; text-align: center; }
    h2 { color: var(--gold); text-transform: uppercase; margin: 5px 0; font-size: 1.2rem; }
    .toolbar { background: var(--panel); padding: 10px; border-radius: 8px; border: 1px solid #444; margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .table-container { position: relative; display: inline-block; background: #fff; border-radius: 5px; box-shadow: 0 0 15px #000; max-width: 100%; }
    table { border-collapse: collapse; font-size: 13px; position: relative; z-index: 2; color: #000; }
    td, th { border: 1px solid #ccc; width: 40px; height: 40px; text-align: center; font-weight: bold; }
    th { background: #800000; color: white; font-size: 11px; }
    .blank { background: #d4d4d4 !important; cursor: pointer; border: 2px dashed #666 !important; }
    
    /* Strict Circles */
    .c1 { border: 3px solid var(--red); border-radius: 50%; background: rgba(255,0,0,0.1); }
    .c2 { border: 3px solid var(--green); border-radius: 50%; background: rgba(0,255,0,0.1); }
    .c3 { border: 3px solid var(--blue); border-radius: 50%; background: rgba(0,132,255,0.1); }
    
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 3; }
    .card { background: var(--panel); padding: 10px; border-radius: 8px; border-left: 4px solid var(--gold); margin: 10px; text-align: left; }
    button { background: var(--gold); color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<h2>🏆 Kalyan AI: Record Matcher</h2>

<div class="toolbar">
    <input type="file" id="csv" style="display:none">
    <button onclick="document.getElementById('csv').click()">📂 LOAD CSV</button>
    <button onclick="addRow()">➕ ROW</button>
    <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE</button>
    <button onclick="location.reload()" style="background:#555; color:white;">🔄 REFRESH</button>
</div>

<div class="table-container">
    <canvas id="mainCanvas"></canvas>
    <table id="tbl"></table>
</div>

<div class="card">
    <h3 id="status" style="color:var(--gold); margin:0;">Status: Click on a grey (blank) cell to find record matches.</h3>
</div>

<script>
const STORAGE_KEY="kalyan_strict_v1";
const families={  
    "25":["02","07","20","25","52","57","70","75"],
    "35":["03","08","30","35","53","58","80","85"],
    "13":["13","18","31","36","63","68","81","86"],
    // ... baki families wahi rahengi
};

function fam(v){for(let k in families) if(families[k].includes(v)) return k; return v;}
function norm(v){ v=String(v).trim(); if(!v || v=="**") return "**"; return v.length==1?"0"+v:v;}
function isMatch(a, b){ if(a=="**" || b=="**") return false; return fam(a) === fam(b); }

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [["07","**","**","**","**","**"],["**","**","**","**","**","70"],["**","**","**","**","**","**"]];
data = data.map(r => r.map(norm));

let activeMark = null;

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let cls = "";
            if(activeMark && activeMark.row == ri && activeMark.col == ci) cls = "c1";
            if(activeMark && activeMark.matches){
                activeMark.matches.forEach(m => { if(m.r == ri && m.c == ci) cls = "c2"; });
            }
            if(c=="**") cls += " blank";
            h+=`<td class="${cls}" contenteditable onblur="update(${ri},${ci},this.innerText)" onclick="${c=='**'?'findPattern('+ri+','+ci+')':'' }">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activeMark) setTimeout(drawConnections, 50);
}

function update(r,c,v){ data[r][c]=norm(v); saveData(); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// REAL RECORD MATCHING LOGIC
function findPattern(r, c){
    let historySequence = [];
    // 1. Current column mein pichle 15 hafton ki jodis dekho
    for(let i=r-1; i>=Math.max(0, r-15); i--){
        if(data[i][c] !== "**") historySequence.push({ val: data[i][c], gap: r-i });
    }

    if(historySequence.length < 1){
        document.getElementById("status").innerText = "Pehle upar jodi bhariye!";
        return;
    }

    // 2. Pure record mein waisa hi GAP aur FAMILY dhoondho
    let foundPatterns = [];
    for(let i=0; i < data.length - 1; i++){
        let matchPoints = [];
        historySequence.forEach(seq => {
            let checkRow = i - seq.gap;
            if(checkRow >= 0 && isMatch(data[i][c], data[checkRow][c])){
                // Agar history mein bhi wahi family aur wahi gap hai
                matchPoints.push({r: checkRow, c: c});
            }
        });
        
        if(matchPoints.length > 0){
            foundPatterns.push({r: i, c: c, matches: matchPoints});
        }
    }

    if(foundPatterns.length > 0){
        activeMark = foundPatterns[foundPatterns.length-1]; // Latest match dikhao
        document.getElementById("status").innerText = "Match Found in History!";
        draw();
    } else {
        alert("Record mein aisa pattern nahi mila.");
    }
}

function drawConnections(){
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    const cells = tbl.querySelectorAll(".c1, .c2");
    if(cells.length < 2) return;
    
    ctx.strokeStyle = "blue"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    const rect = tbl.getBoundingClientRect();
    
    for(let i=0; i<cells.length-1; i++){
        const r1 = cells[i].getBoundingClientRect();
        const r2 = cells[i+1].getBoundingClientRect();
        ctx.beginPath();
        ctx.moveTo(r1.left-rect.left+20, r1.top-rect.top+20);
        ctx.lineTo(r2.left-rect.left+20, r2.top-rect.top+20);
        ctx.stroke();
    }
}

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l).map(l => l.split(',').map(norm));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};

draw();
</script>
</body>
</html>
