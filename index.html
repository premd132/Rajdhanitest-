<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jodi Family CSV System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  margin:10px;
}
h2{text-align:center}
button,input{padding:6px;margin:5px}

#wrap{
  background:#fff;
  padding:10px;
  overflow:auto;
}

table{
  border-collapse:collapse;
  font-size:14px;
}
td,th{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:55px;
}
td[contenteditable]{
  background:#fffbe6;
}

/* family highlight */
.family{
  background:#e6f0ff;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>Jodi Family CSV System</h2>

<input type="file" id="csvFile" accept=".csv">
<button onclick="addRow()">➕ Add Row</button>
<button onclick="applyFamily()">🔁 Apply Family</button>
<button onclick="clearAll()">🗑 Clear</button>

<div id="wrap">
  <table id="chart"></table>
</div>

<script>
// ================= FAMILY DATA =================
const FAMILY = {
 "22":["22","27","72","77"],
 "11":["11","61","66","16"],
 "33":["33","83","88","38"],
 "99":["99","44","49","94"],
 "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"],  
 "13":["13","18","31","36","63","68","81","86"],  
 "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"],  
 "23":["23","28","32","37","73","78","82","87"],  
 "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"],  
 "34":["34","39","43","48","84","89","93","98"],  
 "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

const table=document.getElementById("chart");

// ================= LOAD LOCAL =================
const saved=localStorage.getItem("jodiData");
if(saved) buildTable(JSON.parse(saved));

// ================= SAVE =================
function save(){
  const data=[];
  [...table.rows].forEach(r=>{
    let row=[];
    [...r.cells].forEach(c=>row.push(c.innerText.trim()));
    data.push(row);
  });
  localStorage.setItem("jodiData",JSON.stringify(data));
}

// ================= BUILD TABLE =================
function buildTable(data){
  table.innerHTML="";
  data.forEach(row=>{
    const tr=document.createElement("tr");
    row.forEach(val=>{
      const td=document.createElement("td");
      td.innerText=val;
      td.contentEditable=true;
      td.oninput=save;
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
}

// ================= CSV UPLOAD =================
document.getElementById("csvFile").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;

  const reader=new FileReader();
  reader.onload=()=>{
    const rows=reader.result
      .trim()
      .split(/\r?\n/)
      .map(l=>l.split(",").map(v=>v.trim()));
    buildTable(rows);
    save();
  };
  reader.readAsText(file);
});

// ================= ADD ROW =================
function addRow(){
  const tr=document.createElement("tr");
  for(let i=0;i<6;i++){
    const td=document.createElement("td");
    td.contentEditable=true;
    td.oninput=save;
    tr.appendChild(td);
  }
  table.appendChild(tr);
  save();
}

// ================= FAMILY APPLY =================
function applyFamily(){
  // clear old
  [...table.querySelectorAll("td")].forEach(td=>td.classList.remove("family"));

  [...table.rows].forEach(row=>{
    [...row.cells].forEach(cell=>{
      const v=cell.innerText.trim();
      if(!v) return;

      for(const key in FAMILY){
        if(FAMILY[key].includes(v)){
          cell.classList.add("family");
          break;
        }
      }
    });
  });
}

// ================= CLEAR =================
function clearAll(){
  if(confirm("Delete all data?")){
    table.innerHTML="";
    localStorage.removeItem("jodiData");
  }
}
</script>

</body>
</html>
