<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
    body { font-family: 'Segoe UI', Arial; background: #121212; color: white; margin: 0; padding: 10px; }
    .header { background: #b71c1c; padding: 10px; text-align: center; border-bottom: 3px solid #ffd600; font-weight: bold; }
    
    .control-panel { background: #212121; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; border-bottom: 1px solid #444; }
    input, select, button { padding: 10px; border-radius: 4px; border: 1px solid #555; font-weight: bold; }
    button { cursor: pointer; background: #ffd600; color: black; border: none; }
    .btn-check { background: #4caf50; color: white; }

    .chart-box { position: relative; margin: 20px auto; display: inline-block; background: white; padding: 5px; border-radius: 4px; }
    table { border-collapse: collapse; color: black; position: relative; z-index: 2; background: transparent; }
    td, th { border: 1px solid #ccc; width: 50px; height: 45px; text-align: center; font-weight: bold; position: relative; }
    th { background: #f5f5f5; font-size: 11px; }

    /* Highlighting */
    .base-highlight { border: 3px solid red !important; background: rgba(255,0,0,0.1); color: red; }
    .pattern-circle { border: 3px solid blue !important; border-radius: 50%; color: blue; }
    
    #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
    #checkList { margin: 20px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
    .check-item { background: #333; padding: 10px; width: 80%; cursor: pointer; border-left: 5px solid #ffd600; text-align: left; }
</style>
</head>
<body>

<div class="header">PRO 3rd TOUCH & FAMILY PATTERN SYSTEM</div>

<div class="control-panel">
    <input type="file" id="csvInp" accept=".csv" onchange="loadCSV()">
    <select id="daySel">
        <option value="0">Mon</option><option value="1">Tue</option><option value="2">Wed</option>
        <option value="3">Thu</option><option value="4">Fri</option><option value="5">Sat</option>
    </select>
    <input type="text" id="targetJodi" placeholder="Base Jodi" size="8">
    <button onclick="findFamilyTouch()">SEARCH FAMILY TOUCH</button>
    <button class="btn-check" onclick="generateCheckLines()">GENERATE CHECK LINES</button>
</div>

<div class="chart-box" id="chartContainer">
    <canvas id="canvas"></canvas>
    <table id="mainTable">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div id="checkList"></div>

<script>
let data = [
    ["12","37","45","67","89","00"],["56","23","11","90","44","33"],
    ["32","82","77","12","05","99"],["10","20","30","40","50","60"],
    ["87","37","14","25","36","47"],["21","73","00","11","22","33"]
];

const families = {
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"], "45":["04","09","40","45","54","59","90","95"]
};

function getFamily(j) {
    for(let k in families) if(families[k].includes(j)) return families[k];
    return [j, j.split('').reverse().join('')]; // Default Palti
}

function loadTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = data.map((row, r) => `<tr>${row.map((c, i) => `<td contenteditable onblur="data[${r}][${i}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    resizeCanvas();
}

function resizeCanvas() {
    const c = document.getElementById('canvas');
    const box = document.getElementById('chartContainer');
    c.width = box.clientWidth; c.height = box.clientHeight;
}

function drawTouch(r1, c1, r2, c2) {
    const ctx = document.getElementById('canvas').getContext('2d');
    const table = document.getElementById('mainTable');
    const b1 = table.rows[r1+1].cells[c1];
    const b2 = table.rows[r2+1].cells[c2];
    
    ctx.strokeStyle = "blue"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b1.offsetLeft + 25, b1.offsetTop + 22);
    ctx.lineTo(b2.offsetLeft + 25, b2.offsetTop + 22);
    ctx.stroke();
    
    b1.classList.add('base-highlight');
    b2.classList.add('pattern-circle');
}

function findFamilyTouch() {
    clearStyles();
    const target = document.getElementById('targetJodi').value;
    const day = parseInt(document.getElementById('daySel').value);
    const familyMembers = getFamily(target);
    
    data.forEach((row, rIdx) => {
        if(familyMembers.includes(row[day])) {
            // Pattern: Current row (Base) to Next Row (Pattern)
            if(rIdx + 1 < data.length) drawTouch(rIdx, day, rIdx + 1, day);
        }
    });
}

function generateCheckLines() {
    const list = document.getElementById('checkList');
    list.innerHTML = "";
    // Real data se pattern uthana (Last row logic)
    const lastRow = data.length - 1;
    const currentDay = parseInt(document.getElementById('daySel').value);
    
    let item = document.createElement('div');
    item.className = "check-item";
    item.innerText = `View Real Data Pattern (Touch at Day ${currentDay})`;
    item.onclick = () => {
        findFamilyTouch(); 
        alert("Check Line Active: Sabhi family touches draw ho gaye hain.");
    };
    list.appendChild(item);
}

function clearStyles() {
    document.querySelectorAll('td').forEach(td => td.className = "");
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0, 0, 10000, 10000);
}

function loadCSV() {
    const file = document.getElementById('csvInp').files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        data = e.target.result.split("\n").map(r => r.split(",").map(c => c.trim()));
        loadTable();
    };
    reader.readAsText(file);
}

window.onload = loadTable;
</script>
</body>
</html>
