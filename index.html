<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Fixed System</title>
    <style>
        :root { --gold: #ffd700; --red: #ff4757; --blue: #0084ff; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; text-align: center; }
        .toolbar { background: var(--panel); padding: 15px; display: flex; gap: 10px; justify-content: center; }
        .table-container { position: relative; background: #fff; border-radius: 8px; padding: 5px; display: inline-block; margin-top: 20px; }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 5; }
        td { border: 1px solid #ddd; width: 45px; height: 45px; font-weight: bold; cursor: pointer; }
        .circle-red { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255,71,87,0.2); }
        .circle-blue { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(0,132,255,0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .card { background: var(--panel); margin: 10px; padding: 15px; border-radius: 10px; border-top: 3px solid var(--gold); }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; display: none; z-index: 100; color: #000; border-radius: 10px; box-shadow: 0 0 20px #000; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 90; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="addRow()">➕ Add Row</button>
    <button onclick="saveData()" style="background:green; color:white;">💾 Save</button>
    <button onclick="localStorage.clear(); location.reload();" style="background:red; color:white;">🗑️ Reset</button>
</div>

<div class="table-container">
    <canvas id="mainCanvas"></canvas>
    <table id="tbl"></table>
</div>

<div class="card">
    <h3>✔ Check Lines (History)</h3>
    <div id="checks">Click a blank cell (**) to start...</div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right;">X</button>
    <h3>Historical Match</h3>
    <div id="popContent"></div>
</div>

<script>
const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data = JSON.parse(localStorage.getItem("pdata_kalyan")) || Array(15).fill().map(()=>Array(6).fill("**"));
let activeMark = null;

function fam(v){for(let k in families) if(families[k].includes(v)) return k; return "NA";}
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || fam(a)===fam(b); }

function draw() {
    let h = "<tr><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr>";
    data.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = "";
            if (activeMark && ri >= activeMark.start && ri < activeMark.start + activeMark.shape.length) {
                let type = activeMark.shape[ri - activeMark.start][ci];
                if (type === 1) cls = "circle-red";
                if (type === 2) cls = "circle-blue";
            }
            h += `<td class="${cls}" contenteditable oninput="updateData(${ri},${ci},this)" onclick="handleCell(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    if(activeMark) drawLines("mainCanvas", "tbl");
}

function handleCell(ri, ci) {
    if (data[ri][ci] === "**") {
        activeMark = null; // Reset current pattern
        makeDualPattern(ri, ci);
    }
}

function makeDualPattern(r, c) {
    let f1="**", f2="**", f1c=[], f2c=[];
    let look = Math.max(0, r-10);

    for(let i=r-1; i>=look; i--) {
        for(let j=0; j<6; j++) {
            let v = data[i][j];
            if(v!=="**") {
                if(f1=="**") { f1=v; f1c.push({ri:i, ci:j}); }
                else if(smartMatch(v, f1) && f1c.length<2 && !f1c.some(x=>x.ri==i && x.ci==j)) f1c.push({ri:i, ci:j});
                else if(f2=="**" && fam(v)!=fam(f1)) { f2=v; f2c.push({ri:i, ci:j}); }
                else if(f2!="**" && smartMatch(v, f2) && f2c.length<2 && !f2c.some(x=>x.ri==i && x.ci==j)) f2c.push({ri:i, ci:j});
            }
        }
    }

    if(f1c.length<2 || f2c.length<2) { alert("Data कम है!"); return; }

    let shape = Array(r - look).fill().map(()=>Array(6).fill(0));
    f1c.forEach(x => shape[x.ri - look][x.ci] = 1);
    f2c.forEach(x => shape[x.ri - look][x.ci] = 2);

    activeMark = { start: look, shape: shape, targetCol: c };
    draw();
    searchHistory(shape, f1, f2, look);
}

function searchHistory(shape, f1, f2, limit) {
    let matches = [];
    for(let i=0; i < limit; i++) {
        let score = 0;
        for(let k=0; k<shape.length; k++) {
            for(let j=0; j<6; j++) {
                if(shape[k][j]==1 && smartMatch(data[i+k][j], f1)) score++;
                if(shape[k][j]==2 && smartMatch(data[i+k][j], f2)) score++;
            }
        }
        if(score === 4) matches.push(i);
    }
    
    let html = "";
    matches.slice(-3).forEach((idx, count) => {
        html += `<button onclick="showPop(${idx})" style="margin:5px; background:var(--panel); color:var(--gold); border:1px solid var(--gold);">Check Line ${count+1} (Row ${idx+1})</button>`;
    });
    document.getElementById("checks").innerHTML = html || "No matches found.";
}

function showPop(idx) {
    let shape = activeMark.shape;
    let h = "<table border='1' style='background:#fff; color:#000;'>";
    for(let i=0; i<shape.length; i++) {
        h += "<tr>";
        data[idx+i].forEach((v, j) => {
            let cls = shape[i][j]==1 ? "circle-red" : (shape[i][j]==2 ? "circle-blue" : "");
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popContent").innerHTML = h + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function drawLines(cvsId, tblId) {
    let cvs = document.getElementById(cvsId);
    let tbl = document.getElementById(tblId);
    let ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    let rect = tbl.getBoundingClientRect();
    
    [[".circle-red", "#ff4757"], [".circle-blue", "#0084ff"]].forEach(cfg => {
        let cells = document.querySelectorAll(cfg[0]);
        if(cells.length < 2) return;
        ctx.strokeStyle = cfg[1]; ctx.lineWidth = 2; ctx.beginPath();
        cells.forEach((c, i) => {
            let r = c.getBoundingClientRect();
            let x = r.left - rect.left + r.width/2;
            let y = r.top - rect.top + r.height/2;
            if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    });
}

function updateData(r,c,el){ data[r][c]=el.innerText; }
function addRow(){ data.push(Array(6).fill("**")); draw(); }
function saveData(){ localStorage.setItem("pdata_kalyan", JSON.stringify(data)); alert("Saved!"); }
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

draw();
</script>
</body>
</html>
