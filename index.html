<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Fixed System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue-circle: #0084ff; --green-line: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; }
        th { background: #1e293b; color: white; font-size: 11px; }
        .circle { border: 3px solid var(--blue-circle) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.15); z-index: 10; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); margin-top: 15px; }
        #future { font-size: 24px; color: var(--green-line); letter-spacing: 5px; font-weight: 800; text-align: center; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 12px; }
    </style>
</head>
<body>

<div id="main-app">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
        <h2 style="color:var(--gold); margin:0;">Kalyan AI</h2>
        <button onclick="location.reload()" style="background:none; color:white; border:1px solid #444;">Logout</button>
    </div>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
        <button onclick="document.getElementById('csv').click()" style="background:#0084ff; color:white;">📂 UPLOAD CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); font-size:12px;">MATCH LOG</h3>
        <div id="checks" style="font-size:11px; max-height:80px; overflow-y:auto;"></div>
    </div>

    <div class="card">
        <h3 style="color:var(--gold); font-size:12px;">🔮 FUTURE PREDICTION (MAX 3)</h3>
        <div id="future">-- -- --</div>
    </div>
</div>

<script>
const KEY="pdata_v2_final";
let data=JSON.parse(localStorage.getItem(KEY)) || [["10","20","30","40","50","60"],["**","**","**","**","**","**"]];
let activePattern = null;

const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA";}
function norm(v){ v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let isMarked = activePattern && ( (activePattern.oldR==ri && activePattern.oldC==ci) || (activePattern.curR==ri && activePattern.curC==ci) );
   h+=`<td class="${isMarked?'circle':''}" contenteditable oninput="edit(${ri},${ci},this)" onclick="makePattern(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activePattern) setTimeout(drawLines, 50);
}

function drawLines() {
    const cvs = document.getElementById("mainCanvas"), tbl = document.getElementById("tbl"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const cells = tbl.querySelectorAll(".circle");
    if(cells.length < 2) return;
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3;
    const tRect = tbl.getBoundingClientRect();
    ctx.beginPath();
    cells.forEach((c, i) => {
        const r = c.getBoundingClientRect();
        const x = r.left - tRect.left + r.width/2;
        const y = r.top - tRect.top + r.height/2;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function makePattern(r,c){
    if(data[r][c] !== "**") return;
    let lastVal = "**";
    for(let i=r-1; i>=0; i--){ if(data[i][c] !== "**"){ lastVal = data[i][c]; break; }}
    if(lastVal === "**") return;

    let fKey = fam(lastVal);
    let matchIdx = -1;
    // पिछले 10 हफ्तों (Rows) में फैमिली मैच ढूंढना
    let startLimit = Math.max(0, r - 10);
    for(let i=r-1; i>=startLimit; i--){
        if(i !== r-1 && fam(data[i][c]) === fKey){ matchIdx = i; break; }
    }

    if(matchIdx !== -1){
        activePattern = { oldR: matchIdx, oldC: c, curR: r, curC: c };
        draw();
        let p1 = norm((parseInt(lastVal)+10)%100);
        let p2 = lastVal.split('').reverse().join('');
        let p3 = FAMILY[fKey] ? FAMILY[fKey][0] : "00";
        document.getElementById("future").innerText = `${p1} - ${p2} - ${p3}`;
        document.getElementById("checks").innerHTML = `<div style='color:var(--green-line)'>Family Match Found: Row ${matchIdx+1} & Row ${r+1}</div>`;
    } else {
        alert("No pattern match in last 10 rows.");
    }
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(KEY,JSON.stringify(data)); alert("Data Saved!"); }
function clearData(){ if(confirm("Clear All?")){ localStorage.clear(); location.reload(); }}
function importCSV(e){
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v)));
        localStorage.setItem(KEY, JSON.stringify(data));
        draw();
    };
    fr.readAsText(e.target.files[0]);
}
draw();
</script>
</body>
</html>
