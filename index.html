<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pattern Engine</title>

<style>

body{
    font-family:Arial;
    background:#111;
    color:white;
}

#topbar{
    background:#222;
    padding:10px;
}

button{
    padding:6px;
    margin:4px;
}

#tableBox{
    height:80vh;
    overflow:auto;
    border:1px solid #555;
}

table{
    border-collapse:collapse;
}

td{
    width:50px;
    height:40px;
    border:1px solid #444;
    text-align:center;
    cursor:pointer;
    font-size:18px;
}

.blank{
    background:#333;
}

.line{
    background:red !important;
}

.diag{
    background:blue !important;
}

.cross{
    background:green !important;
}

.family{
    background:orange !important;
}

</style>
</head>


<body>

<div id="topbar">

<input type="file" id="file">

<button onclick="loadCSV()">Upload</button>

<button onclick="mode('line')">Line</button>
<button onclick="mode('diag')">Diagonal</button>
<button onclick="mode('cross')">Cross</button>
<button onclick="mode('family')">Family</button>

<button onclick="clearDraw()">Clear</button>

</div>


<div id="tableBox">

<table id="grid"></table>

</div>



<script>

let data=[]

let selected=[]

let drawMode="line"



function loadCSV(){

    let f=document.getElementById("file").files[0]

    if(!f) return

    let r=new FileReader()

    r.onload=function(e){

        parseCSV(e.target.result)

        drawTable()

    }

    r.readAsText(f)

}



function parseCSV(text){

    data=[]

    let rows=text.split(/\r?\n/)

    for(let row of rows){

        if(row.trim()=="") continue

        let cols=row.trim().split(".")

        while(cols.length<6) cols.push("**")

        data.push(cols)

    }

}



function drawTable(){

    let g=document.getElementById("grid")

    g.innerHTML=""

    for(let r=0;r<data.length;r++){

        let tr=document.createElement("tr")

        for(let c=0;c<6;c++){

            let td=document.createElement("td")

            let v=data[r][c]

            td.innerText=v

            if(v=="**") td.classList.add("blank")

            td.onclick=function(){

                cellClick(r,c)

            }

            tr.appendChild(td)

        }

        g.appendChild(tr)

    }

}



function mode(m){

    drawMode=m

    selected=[]

}



function cellClick(r,c){

    selected.push({r,c})

    if(selected.length==2){

        drawPattern()

    }

}



function drawPattern(){

    let t=document.getElementById("grid")

    let a=selected[0]

    let b=selected[1]

    let c1=t.rows[a.r].cells[a.c]

    let c2=t.rows[b.r].cells[b.c]

    if(drawMode=="line"){

        c1.classList.add("line")

        c2.classList.add("line")

    }

    if(drawMode=="diag"){

        c1.classList.add("diag")

        c2.classList.add("diag")

    }

    if(drawMode=="cross"){

        c1.classList.add("cross")

        c2.classList.add("cross")

    }

    if(drawMode=="family"){

        c1.classList.add("family")

        c2.classList.add("family")

    }

    selected=[]

}



function clearDraw(){

    let td=document.querySelectorAll("td")

    td.forEach(x=>{

        x.classList.remove(
            "line",
            "diag",
            "cross",
            "family"
        )

    })

}


</script>


</body>
</html>
