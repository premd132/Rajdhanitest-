<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI - Family Flow Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --red: #ff4757; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        #app { padding: 10px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; margin-bottom: 10px; display: flex; gap: 8px; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Table Design */
        .table-container { position: relative; background: #fff; border-radius: 8px; padding: 5px; display: inline-block; box-shadow: 0 0 25px #000; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #eee; width: 45px; height: 45px; text-align: center; font-weight: bold; cursor: pointer; position: relative; }
        th { background: #1e293b; color: white; font-size: 10px; }
        
        /* Strict Family Marking */
        .f1-circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.15); z-index: 6; }
        .f2-circle { border: 3px solid var(--red) !important; border-radius: 50% !important; background: rgba(255, 71, 87, 0.15); z-index: 6; }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; margin-top: 10px; border-top: 3px solid var(--gold); }
        .check-btn { background: #2d3748; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; border-left: 5px solid var(--green); display: flex; justify-content: space-between; font-size: 13px; }
        
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 420px; border: 5px solid var(--gold); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border: none; border-radius: 5px; font-weight: bold; padding: 8px 15px; }
    </style>
</head>
<body>

<div id="app">
    <div class="toolbar">
        <button onclick="addRow()" style="background:#444; color:#fff;">➕ ADD ROW</button>
        <button onclick="saveData()" style="background:var(--green); color:#000;">💾 SAVE DATA</button>
        <button onclick="document.getElementById('csv').click()" style="background:var(--gold); color:#000;">📂 CSV</button>
        <input type="file" id="csv" style="display:none">
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3>✔ Check Lines (Only Family Matches)</h3>
        <div id="check-list">Click a blank cell (**) to start family scan...</div>
    </div>

    <div class="card">
        <h3 style="color:var(--green)">🔮 Future AI (3-Pair)</h3>
        <div id="future-ai" style="font-size: 22px; font-weight: 800; text-align: center; color: var(--green);">-- -- --</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:red; color:white;">CLOSE</button>
    <h3 style="margin:0; color:#000;">Family Flow View</h3>
    <center><div id="popContent" style="margin-top:10px;"></div></center>
</div>

<script>
// Family Definition
const FAMILY = {"00":["00","05","50","55"],"11":["11","16","61","66"],"22":["22","27","72","77"],"33":["33","38","83","88"],"44":["44","49","94","99"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["10","15","01","06","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["20","25","02","07","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["30","35","03","08","53","58","80","85"],"45":["40","45","04","09","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem("kalyan_fix_v2")) || [["88","40","01","12","45","33"],["**","**","**","**","**","**"]];
let activeMark = null;

function getFamKey(v){
    for(let k in FAMILY) if(FAMILY[k].includes(String(v))) return k;
    return v;
}
function norm(v){ v=String(v).trim(); return v=="**"?"**":(v.length==1?"0"+v:v); }

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let cls = "";
            if(activeMark && isPartOf(ri,ci)===1) cls="f1-circle";
            if(activeMark && isPartOf(ri,ci)===2) cls="f2-circle";
            h+=`<td class="${cls}" onclick="handleCell(${ri},${ci})">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activeMark) setTimeout(()=>renderLines("mainCanvas", "tbl"), 50);
}

function handleCell(r,c){
    if(data[r][c]=="**") runStrictAnalysis(r,c);
    else { let v=prompt("Edit:", data[r][c]); if(v!==null){data[r][c]=norm(v); draw();}}
}

function isPartOf(ri,ci){
    if(!activeMark) return 0;
    let off = ri - activeMark.start;
    if(off>=0 && off<activeMark.shape.length) return activeMark.shape[off][ci];
    return 0;
}

function runStrictAnalysis(r, c) {
    let bases = [];
    // 1. Pick 2 families from the history of THIS column
    for(let i=r-1; i>=0; i--){
        let val = data[i][c];
        if(val!=="**" && !bases.some(b => getFamKey(b)===getFamKey(val))) {
            bases.push(val);
            if(bases.length >= 2) break;
        }
    }
    if(bases.length < 2) return;

    // 2. Build Shape - STRICT FAMILY CHECK ONLY
    let shape = [];
    let lookback = 10;
    for(let i=Math.max(0, r-lookback); i<r; i++){
        let row = [];
        for(let j=0; j<6; j++){
            let cellVal = data[i][j];
            if(cellVal !== "**") {
                if(getFamKey(cellVal) === getFamKey(bases[0])) row.push(1);
                else if(getFamKey(cellVal) === getFamKey(bases[1])) row.push(2);
                else row.push(0);
            } else row.push(0);
        }
        shape.push(row);
    }

    // 3. Find Matches in History
    let matches = [];
    for(let i=0; i<data.length-shape.length; i++){
        let f1_match = false, f2_match = false;
        for(let k=0; k<shape.length; k++){
            for(let j=0; j<6; j++){
                if(shape[k][j]===1 && getFamKey(data[i+k][j])===getFamKey(bases[0])) f1_match = true;
                if(shape[k][j]===2 && getFamKey(data[i+k][j])===getFamKey(bases[1])) f2_match = true;
            }
        }
        if(f1_match && f2_match) matches.push({index:i});
    }

    let list = document.getElementById("check-list");
    list.innerHTML = "";
    matches.slice(0,3).forEach((m,idx)=>{
        let d = document.createElement("div");
        d.className = "check-btn";
        d.innerHTML = `<span>Family Sequence Match ${idx+1}</span> ➔`;
        d.onclick = () => {
            activeMark = {start: m.index, shape: shape};
            draw();
            showPopup(m.index, shape);
            // Future AI Prediction
            let nextRow = m.index + shape.length;
            if(nextRow < data.length) {
                let res = data[nextRow][c];
                let fK = getFamKey(res);
                document.getElementById("future-ai").innerText = FAMILY[fK] ? FAMILY[fK].slice(0,3).join("  ") : res;
            }
        };
        list.appendChild(d);
    });
}

function showPopup(start, shape){
    let h = "<table id='popTbl' style='background:#fff; color:#000; border:1px solid #ccc;'>";
    for(let i=0; i<shape.length; i++){
        h += "<tr>";
        data[start+i].forEach((v,j)=>{
            let cls = shape[i][j]===1 ? "f1-circle" : (shape[i][j]===2 ? "f2-circle" : "");
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popContent").innerHTML = h+"</table>";
    document.getElementById("popup").style.display="block";
    document.getElementById("overlay").style.display="block";
    setTimeout(()=>renderLines("popCanvas", "popContent"), 100);
}

function renderLines(cvsId, containerId) {
    const cvs = document.getElementById(cvsId);
    const cont = (containerId==="tbl") ? document.getElementById(containerId) : document.querySelector("#popContent table");
    const ctx = cvs.getContext("2d");
    cvs.width = cont.offsetWidth; cvs.height = cont.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    const drawLine = (cls, col) => {
        let dots = cont.querySelectorAll("."+cls);
        if(dots.length < 2) return;
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.beginPath();
        dots.forEach((d,i)=>{
            let r=d.getBoundingClientRect(), p=cont.getBoundingClientRect();
            let x = r.left - p.left + r.width/2, y = r.top - p.top + r.height/2;
            if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };
    drawLine("f1-circle", "#0084ff"); 
    drawLine("f2-circle", "#ff4757");
}

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => { data = fr.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>norm(v))); draw(); };
    fr.readAsText(e.target.files[0]);
};
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("kalyan_fix_v2", JSON.stringify(data)); alert("Saved!"); }
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
draw();
</script>
</body>
</html>
