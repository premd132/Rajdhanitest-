<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI Master Pattern</title>
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; padding: 10px; text-align: center; }
        .table-wrap { position: relative; background: #fff; border-radius: 8px; padding: 10px; display: inline-block; margin-top: 20px; }
        table { border-collapse: collapse; color: #000; }
        td, th { border: 1px solid #ccc; width: 45px; height: 45px; text-align: center; font-weight: bold; cursor: pointer; }
        th { background: #1e293b; color: #fff; font-size: 11px; }
        .circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; border-top: 3px solid var(--gold); margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .jodi-box { font-size: 30px; color: var(--gold); font-weight: bold; margin: 10px 0; letter-spacing: 5px; }
        button { background: #444; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-green { background: #28a745; }
    </style>
</head>
<body>

    <h2 style="color:var(--gold);">प्रदीप कुमार देहरिया: AI पैटर्न सिस्टम</h2>
    <p style="font-size: 12px; opacity: 0.8;">डेटा भरें और पैटर्न स्कैन करने के लिए खाली सेल (**) पर क्लिक करें</p>

    <div>
        <button onclick="addRow()">+ ADD ROW</button>
        <button onclick="saveData()" class="btn-green">SAVE (सुरक्षित करें)</button>
        <button onclick="downloadCSV()" style="background:#0984e3;">DOWNLOAD CSV</button>
        <button onclick="loadDemoData()" style="background:#6c5ce7;">DEMO DATA (चेक करने के लिए)</button>
        <button onclick="clearAll()" style="background:#dc3545;">CLEAR</button>
    </div>

    <div class="table-wrap">
        <canvas id="canvas"></canvas>
        <table id="mainTable"></table>
    </div>

    <div class="card">
        <h3>🤖 AI Prediction (Next 3)</h3>
        <div id="prediction" class="jodi-box">-- -- --</div>
        <p id="info" style="font-size:12px; color:var(--green);">पैटर्न ढूंढने के लिए तैयार...</p>
    </div>

<script>
const KEY = "pradeep_final_v5";
// अगर लोकल स्टोरेज खाली है, तो खाली टेबल दिखाओ
let data = JSON.parse(localStorage.getItem(KEY)) || [["12","25","36","48","50","60"],["**","**","**","**","**","**"]];
let activeMatch = null;

function render() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((row, rIdx) => {
        h += "<tr>";
        row.forEach((val, cIdx) => {
            let isCircle = activeMatch && isMarked(rIdx, cIdx);
            h += `<td class="${isCircle ? 'circle' : ''}" contenteditable oninput="update(${rIdx},${cIdx},this)" onclick="scan(${rIdx},${cIdx})">${val}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("mainTable").innerHTML = h;
    if(activeMatch) setTimeout(drawLines, 50);
}

function update(r,c,el) { data[r][c] = el.innerText.trim(); }

function isMarked(r, c) {
    if(!activeMatch) return false;
    let dr = r - activeMatch.start;
    return (dr >= 0 && dr < activeMatch.shape.length && activeMatch.shape[dr][c]);
}

function scan(r, c) {
    if(data[r][c] !== "**") return;
    let colData = []; // उस कॉलम का पिछला डेटा
    for(let i=r-1; i>=0; i--) if(data[i][c] !== "**") colData.push({v: data[i][c], row: i});
    
    if(colData.length < 1) { alert("स्कैन के लिए ऊपर कम से कम एक जोड़ी होनी चाहिए।"); return; }
    
    let target = colData[0].v; // सबसे ताज़ा जोड़ी
    let matches = [];
    
    // पिछले 10 हफ्तों में इसी जोड़ी को ढूंढना
    for(let i=0; i < r - 1; i++) {
        if(data[i][c] === target) {
            matches.push(i);
        }
    }

    if(matches.length > 0) {
        let matchRow = matches[matches.length-1]; // सबसे करीबी पिछला मैच
        activeMatch = { start: matchRow, shape: [[0,0,0,0,0,0]] };
        activeMatch.shape[0][c] = 1; // उसी सेल को मार्क करो
        render();
        
        // Prediction Logic (Last Value + Lucky Numbers)
        let p1 = (parseInt(target) + 5) % 100;
        let p2 = (parseInt(target) + 3) % 100;
        let p3 = target.split('').reverse().join(''); // पलटी
        
        document.getElementById("prediction").innerText = `${p1.toString().padStart(2,'0')} ${p2.toString().padStart(2,'0')} ${p3}`;
        document.getElementById("info").innerText = "मैच मिल गया! पुरानी चाल के आधार पर 3 जोड़ियाँ तैयार हैं।";
    } else {
        alert("पुराने रिकॉर्ड में कोई मैच नहीं मिला। और डेटा भरें।");
    }
}

function drawLines() {
    const cvs = document.getElementById("canvas"), tbl = document.getElementById("mainTable"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const dots = tbl.querySelectorAll(".circle");
    if(dots.length < 1) return;
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3;
    const rect = tbl.getBoundingClientRect();
    ctx.beginPath();
    dots.forEach((d, i) => {
        const r = d.getBoundingClientRect();
        ctx.arc(r.left - rect.left + r.width/2, r.top - rect.top + r.height/2, 5, 0, Math.PI*2);
    });
    ctx.stroke();
}

function addRow() { data.push(["**","**","**","**","**","**"]); render(); }
function saveData() { localStorage.setItem(KEY, JSON.stringify(data)); alert("डेटा फोन में सुरक्षित हो गया है!"); }
function clearAll() { if(confirm("सब डिलीट करें?")) { localStorage.clear(); location.reload(); } }
function loadDemoData() {
    data = [
        ["12","25","36","45","89","70"],
        ["14","22","33","44","55","66"],
        ["12","90","45","36","11","22"], // 12 यहाँ रिपीट हुआ
        ["**","**","**","**","**","**"]
    ];
    render();
    alert("डेमो डेटा लोड हो गया। सोमवार (MON) के खाली सेल पर क्लिक करके देखें!");
}
function downloadCSV() {
    let content = "MON,TUE,WED,THU,FRI,SAT\n" + data.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], {type:'text/csv'}));
    a.download = "MyRecords.csv"; a.click();
}

render();
</script>
</body>
</html>
