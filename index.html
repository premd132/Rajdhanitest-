<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI - Final Fixed v6</title>
    <style>
        :root { --dark: #0a0a0a; --gold: #ffd700; --red: #ff4d4d; --blue: #00d2ff; --white: #ffffff; }
        body { background: var(--dark); color: var(--white); font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        .header { background: #1a1a1a; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); }
        .main-flex { display: flex; padding: 20px; gap: 20px; flex-wrap: wrap; }
        
        /* Table Style */
        .table-wrap { background: var(--white); padding: 10px; border-radius: 8px; position: relative; flex: 1; min-width: 600px; }
        table { border-collapse: collapse; width: 100%; color: #000; }
        th { background: #333; color: gold; padding: 10px; border: 1px solid #555; }
        td { border: 1px solid #ccc; width: 60px; height: 60px; text-align: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; position: relative; }
        
        /* Pattern Markers */
        .dot-red { border: 4px solid var(--red); border-radius: 50%; width: 45px; height: 45px; margin: auto; display: flex; align-items: center; justify-content: center; color: var(--red); }
        .dot-blue { border: 4px solid var(--blue); border-radius: 50%; width: 45px; height: 45px; margin: auto; display: flex; align-items: center; justify-content: center; color: var(--blue); }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        /* Sidebar */
        .sidebar { width: 320px; }
        .box { background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        .check-btn { background: #222; border-left: 5px solid var(--gold); padding: 12px; margin: 10px 0; cursor: pointer; border-radius: 4px; }
        .check-btn:hover { background: #333; }
        .ai-digit { display: inline-block; background: var(--gold); color: #000; padding: 5px 15px; border-radius: 50px; font-weight: 900; margin: 5px; }

        /* Popup */
        #pop { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 999; }
        .pop-in { background: #fff; padding: 20px; border-radius: 10px; color: #000; max-width: 500px; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0">RAJDHANI <span style="color:var(--gold)">PRO AI</span> v6.0</h1>
    <p style="margin:5px 0 0; font-size:12px; opacity:0.7">Pradeep Kumar Dehariya Special Edition</p>
</div>

<div class="main-flex">
    <div class="table-wrap" id="wrap">
        <svg id="lines"></svg>
        <table id="tbl"></table>
    </div>

    <div class="sidebar">
        <div class="box">
            <h3 style="color:var(--gold); margin-top:0">🤖 FUTURE AI (3 PAIRS)</h3>
            <div id="ai-res">Click on ** to predict</div>
        </div>
        <div class="box">
            <h3 style="margin-top:0">🎯 CHECK LINES (MAX 4)</h3>
            <div id="check-list">Analysis result will appear here.</div>
        </div>
        <button onclick="addRow()" style="width:100%; padding:15px; background:var(--gold); border:none; border-radius:5px; font-weight:bold; cursor:pointer">ADD NEW WEEK (ROW)</button>
    </div>
</div>

<div id="pop" onclick="this.style.display='none'">
    <div class="pop-in" onclick="event.stopPropagation()">
        <h3>Historical Match Found</h3>
        <div style="position:relative" id="pop-wrap">
            <svg id="pop-lines"></svg>
            <table id="pop-tbl"></table>
        </div>
    </div>
</div>

<script>
const FAMILY = {
    "01":["01","06","10","15","51","56","60","65"], "02":["02","07","20","25","52","57","70","75"],
    "03":["03","08","30","35","53","58","80","85"], "04":["04","09","40","45","54","59","90","95"],
    "05":["00","05","50","55"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"]
};

let mainData = JSON.parse(localStorage.getItem("raj_ai_v6")) || Array(25).fill().map(()=>Array(5).fill("**"));
let activePat = null;

function getF(v) { for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; }
function cleanV(v) { v=v.trim(); if(v==="**"||v==="") return "**"; return v.length===1?"0"+v:v; }

function render() {
    const table = document.getElementById("tbl");
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    mainData.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = "";
            if(activePat) {
                if(activePat.p1.some(p => p.r===ri && p.c===ci)) cls = "dot-red";
                if(activePat.p2.some(p => p.r===ri && p.c===ci)) cls = "dot-blue";
            }
            h += `<td onclick="doAnalysis(${ri},${ci})" contenteditable="true" onblur="update(${ri},${ci},this.innerText)">
                  <div class="${cls}">${cell}</div></td>`;
        });
        h += "</tr>";
    });
    table.innerHTML = h;
    draw("lines", "tbl", activePat);
}

function update(r,c,v) { mainData[r][c]=cleanV(v); localStorage.setItem("raj_ai_v6", JSON.stringify(mainData)); render(); }
function addRow() { mainData.push(["**","**","**","**","**"]); render(); }

function doAnalysis(r, c) {
    if(mainData[r][c] !== "**") return;
    let p1 = [], p2 = [], f1 = null, f2 = null;

    // Scan last 12 weeks for patterns
    for(let i=r-1; i>=0 && i>=r-12; i--) {
        for(let j=0; j<5; j++) {
            let val = mainData[i][j];
            if(val === "**") continue;
            let fam = getF(val);
            if(!f1) { f1 = fam; p1.push({r:i, c:j, v:val}); }
            else if((fam === f1 || val === p1[0].v) && p1.length < 3) p1.push({r:i, c:j, v:val});
            else if(!f2 && fam !== f1) { f2 = fam; p2.push({r:i, c:j, v:val}); }
            else if((fam === f2 || val === p2[0].v) && p2.length < 3) p2.push({r:i, c:j, v:val});
        }
    }

    if(p1.length > 0) {
        activePat = { p1, p2, f1, f2 };
        render();
        findCheckLines(r);
        futureAI(f1, f2);
    }
}

function draw(svgId, tblId, pat) {
    const svg = document.getElementById(svgId);
    const tbl = document.getElementById(tblId);
    svg.innerHTML = "";
    if(!pat) return;

    const mkL = (pts, col) => {
        if(pts.length < 2) return;
        let d = "";
        pts.forEach((p, i) => {
            const td = tbl.rows[p.r + 1].cells[p.c];
            const x = td.offsetLeft + td.offsetWidth/2;
            const y = td.offsetTop + td.offsetHeight/2;
            d += (i===0 ? "M " : " L ") + x + " " + y;
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", col);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-width", "4");
        path.setAttribute("stroke-dasharray", "6");
        svg.appendChild(path);
    };
    mkL(pat.p1, "#ff4d4d");
    mkL(pat.p2, "#00d2ff");
}

function findCheckLines(r) {
    const list = document.getElementById("check-list");
    list.innerHTML = "";
    let found = 0;

    for(let i=0; i < r - 4; i++) {
        // Broad Matching Logic: Match Family OR Exact Number
        let hasMatch = mainData[i].some(v => v === activePat.p1[0].v || getF(v) === activePat.f1);
        if(hasMatch) {
            found++;
            let d = document.createElement("div");
            d.className = "check-btn";
            d.innerHTML = `<b>MATCH #${found}</b><br><small>Historical Week: ${i+1}</small>`;
            d.onclick = () => showPop(i);
            list.appendChild(d);
        }
        if(found >= 4) break;
    }
    if(found === 0) list.innerHTML = "No historical matches found.";
}

function showPop(rowIdx) {
    document.getElementById("pop").style.display = "flex";
    const popTbl = document.getElementById("pop-tbl");
    let h = "", hp1 = [];
    for(let i=0; i<4; i++) {
        let r = rowIdx + i;
        if(!mainData[r]) continue;
        h += "<tr>";
        mainData[r].forEach((v, c) => {
            let cls = "";
            if(v === activePat.p1[0].v || getF(v) === activePat.f1) { cls="dot-red"; hp1.push({r:i, c}); }
            h += `<td><div class="${cls}">${v}</div></td>`;
        });
        h += "</tr>";
    }
    popTbl.innerHTML = h;
    setTimeout(() => draw("pop-lines", "pop-tbl", {p1:hp1, p2:[]}), 50);
}

function futureAI(f1, f2) {
    const box = document.getElementById("ai-res");
    const pool = FAMILY[f1] || ["01","11","21"];
    const pairs = pool.sort(()=>0.5-Math.random()).slice(0,3);
    box.innerHTML = pairs.map(p => `<span class="ai-digit">${p}</span>`).join("");
}

render();
</script>
</body>
</html>
