<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan Pro AI - Sarala Edition</title>
<style>
    :root { --gold: #ffd700; --red: #ff3e3e; --green: #00ff00; --blue: #0084ff; --bg: #000; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    h2 { color: var(--gold); text-align: center; text-transform: uppercase; margin: 10px 0; }
    
    .toolbar { background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    
    .table-container { position: relative; display: inline-block; background: #fff; padding: 5px; border-radius: 8px; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
    td, th { border: 1px solid #bbb; width: 42px; height: 42px; text-align: center; font-weight: 900; position: relative; }
    th { background: #600; color: #fff; font-size: 11px; height: 30px; }
    
    .blank { background: #eee !important; cursor: crosshair; color: #aaa; font-size: 10px; }
    
    /* Dynamic Circle Colors */
    .target-red { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255,0,0,0.1); }
    .target-green { border: 3px solid var(--green) !important; border-radius: 50%; background: rgba(0,255,0,0.1); }
    .target-blue { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(0,0,255,0.1); }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
    button { background: var(--gold); color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
    button:hover { transform: scale(1.05); }
    #status { background: #222; color: var(--gold); padding: 10px; border-radius: 5px; margin-top: 10px; font-family: monospace; }
</style>
</head>
<body>

<h2>🏆 KALYAN SMART AI ENGINE</h2>

<div class="toolbar">
    <input type="file" id="csv" style="display:none">
    <button onclick="document.getElementById('csv').click()">📁 UPLOAD CSV</button>
    <button onclick="addRow()">➕ ADD ROW</button>
    <button onclick="saveData()" style="background:#28a745; color:#fff;">💾 SAVE DATA</button>
    <button onclick="clearAll()" style="background:#d32f2f; color:#fff;">🗑️ RESET</button>
</div>

<div class="table-container" id="container">
    <canvas id="canvas"></canvas>
    <table id="mainTable"></table>
</div>

<div id="status">System Ready: Upload CSV or enter data to start scanning.</div>

<script>
const KEY = "KALYAN_SARALA_V3";
const families = {
    "11":["11","16","61","66"],"22":["22","27","72","77"],"33":["33","38","83","88"],"44":["44","49","94","99"],"55":["00","05","50","55"],
    "12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],
    "15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],
    "45":["04","09","40","45","54","59","90","95"]
};

function getFam(v) { for(let k in families) if(families[k].includes(v)) return k; return v; }
function norm(v) { v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }

let chartData = JSON.parse(localStorage.getItem(KEY)) || [["**","**","**","**","**","**"]];

function render() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    chartData.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = (cell == "**") ? "blank" : "";
            h += `<td id="c-${ri}-${ci}" class="${cls}" contenteditable onblur="update(${ri},${ci},this.innerText)" onclick="${cell=='**'?'scanPattern('+ri+','+ci+')':'' }">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("mainTable").innerHTML = h;
    syncCanvas();
}

function update(r, c, v) { chartData[r][c] = norm(v); saveData(); }
function addRow() { chartData.push(["**","**","**","**","**","**"]); render(); }
function saveData() { localStorage.setItem(KEY, JSON.stringify(chartData)); }
function clearAll() { if(confirm("Clear everything?")) { localStorage.clear(); location.reload(); } }

function syncCanvas() {
    const cvs = document.getElementById("canvas"), box = document.getElementById("container");
    cvs.width = box.offsetWidth; cvs.height = box.offsetHeight;
}

// THE "SARALA" SCAN LOGIC (SCREENSHOT STYLE)
function scanPattern(r, c) {
    document.querySelectorAll('td').forEach(td => td.className = td.className.replace(/target-\w+/g, "").trim());
    const ctx = document.getElementById("canvas").getContext("2d");
    ctx.clearRect(0,0,5000,5000);

    // 1. Capture the "Local Neighborhood" (8 weeks area around the click)
    let targets = [];
    for(let i = r-1; i >= Math.max(0, r-8); i--) {
        for(let j = 0; j < 6; j++) {
            if(chartData[i][j] !== "**") {
                targets.push({ val: chartData[i][j], rOff: r-i, cOff: c-j, fKey: getFam(chartData[i][j]) });
            }
        }
    }

    if(targets.length < 2) return alert("Pehle record mein jodi bhariye!");

    // 2. Scan whole history for this "Geometric Shape"
    let matchFound = false;
    for(let i = 0; i < chartData.length; i++) {
        for(let j = 0; j < 6; j++) {
            if(i === r && j === c) continue; // Skip current spot

            let currentMatches = [];
            targets.forEach(t => {
                let checkR = i - t.rOff, checkC = j - t.cOff;
                if(checkR >= 0 && checkC >= 0 && checkC < 6) {
                    if(getFam(chartData[checkR][checkC]) === t.fKey) {
                        currentMatches.push({r: checkR, c: checkC});
                    }
                }
            });

            // If at least 2 families match in the same shape/gap
            if(currentMatches.length >= 2) {
                matchFound = true;
                currentMatches.forEach((m, idx) => {
                    let colorCls = (idx % 3 == 0) ? "target-red" : (idx % 3 == 1) ? "target-green" : "target-blue";
                    document.getElementById(`c-${m.r}-${m.c}`).classList.add(colorCls);
                });
                document.getElementById(`c-${i}-${j}`).classList.add("target-red");
                drawDashedLines(currentMatches, {r: i, c: j});
                document.getElementById("status").innerText = `PATTERN MATCH: Found at Row ${i+1}, Day ${j+1}`;
                return; // Stop at first strong match
            }
        }
    }
    if(!matchFound) alert("No matching shape found in history.");
}

function drawDashedLines(points, base) {
    const ctx = document.getElementById("canvas").getContext("2d");
    ctx.strokeStyle = "#00f"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    const box = document.getElementById("container").getBoundingClientRect();
    const bCell = document.getElementById(`c-${base.r}-${base.c}`).getBoundingClientRect();

    points.forEach(p => {
        const pCell = document.getElementById(`c-${p.r}-${p.c}`).getBoundingClientRect();
        ctx.beginPath();
        ctx.moveTo(bCell.left - box.left + 21, bCell.top - box.top + 21);
        ctx.lineTo(pCell.left - box.left + 21, pCell.top - box.top + 21);
        ctx.stroke();
    });
}

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        chartData = fr.result.split('\n').filter(l=>l).map(l => l.split(',').map(norm));
        render();
    };
    fr.readAsText(e.target.files[0]);
};

render();
</script>
</body>
</html>
