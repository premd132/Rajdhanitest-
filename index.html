<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI – Pradeep Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffcc00; 
            --blue-circle: #00d4ff; 
            --green-line: #00ff88; 
            --bg: #0b0f1a; 
            --panel: #161e2d; 
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        #home-screen {
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            background: radial-gradient(circle at center, #161e2d 0%, #0b0f1a 100%);
        }
        .hero-title { font-size: 2.8rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(255,204,0,0.3); }
        .hero-sub { opacity: 0.7; letter-spacing: 3px; margin-bottom: 30px; font-size: 0.9rem; }
        .enter-btn {
            background: var(--gold); color: #000; padding: 15px 45px;
            font-size: 1.1rem; font-weight: 800; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }
        .enter-btn:hover { transform: scale(1.05); background: #fff; }

        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.05); }
        
        .table-container { position: relative; background: #fff; border-radius: 12px; padding: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.6); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 15px; position: relative; z-index: 5; }
        td, th { border: 1px solid #e2e8f0; padding: 5px; text-align: center; font-weight: 700; width: 50px; height: 50px; }
        th { background: #161e2d; color: #cbd5e1; font-size: 10px; border: 1px solid #334155; }
        
        .circle { 
            border: 3px solid var(--blue-circle) !important; 
            border-radius: 50% !important; 
            background: rgba(0, 212, 255, 0.2); 
            z-index: 10;
        }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 15px; border-bottom: 4px solid var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .card h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 13px; font-weight: 800; letter-spacing: 1px; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 20px; display: none; z-index: 100; padding: 20px; color: #000; width: 92%; max-width: 380px; box-shadow: 0 0 100px #000; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 90; }
        
        button { cursor: pointer; border-radius: 8px; border: none; font-weight: bold; transition: 0.2s; }
        .btn-action { padding: 10px 15px; font-size: 12px; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">RAJDHANI AI</h1>
    <p class="hero-sub">5-DAY MASTER PATTERN SYSTEM</p>
    <button class="enter-btn" onclick="startApp()">OPEN CHART</button>
</div>

<div id="main-app">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:15px;">
        <h2 style="color:var(--gold); margin:0; font-weight: 800;">Rajdhani Night</h2>
        <button onclick="location.reload()" style="background:#dc3545; color:white; padding:5px 12px; font-size: 11px;">Reset App</button>
    </div>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button class="btn-action" onclick="document.getElementById('csv').click()" style="background:#334155; color:white;">📂 LOAD CSV</button>
        <button class="btn-action" onclick="addRow()" style="background:#334155; color:white;">➕ ADD ROW</button>
        <button class="btn-action" onclick="saveData()" style="background:#15803d; color:white;">💾 SAVE</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3>🔍 History Matches</h3>
            <div id="checks" style="max-height: 150px; overflow-y: auto;"></div>
        </div>
        <div class="card">
            <h3>📊 Analysis</h3>
            <div id="ai" style="font-size: 14px; line-height: 1.6;">Enter data to analyze...</div>
        </div>
        <div class="card">
            <h3>🚀 Prediction</h3>
            <div id="future" style="font-size: 18px; font-weight: 800; color: var(--green-line);">-- --</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#ff4444; color:white; padding:6px 12px; border-radius: 5px;">X</button>
    <h3 style="margin: 0 0 15px 0; font-size: 16px;">Mirror Record (5-Day)</h3>
    <center>
        <div class="table-container" style="border: 1px solid #eee; width: 100%;">
            <canvas id="popCanvas"></canvas>
            <div id="popData"></div>
        </div>
    </center>
</div>

<script>
const STORAGE_KEY="Rajdhani_Pro_Data_v1";
let targetCol=null;
let activeMark=null;

// Normalize: 2-digit format
function norm(v) {
    if (!v || v.trim() === "" || v === "**") return "**";
    let n = v.replace(/[^0-9]/g, "");
    if (n === "") return "**";
    if (n.length === 1) n = "0" + n;
    return n.substring(0, 2);
}

const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};
    
// Initial data for Rajdhani (5 Columns)
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)) || [["12","34","56","78","90"],["**","**","**","**","**"]];

function startApp() {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    draw();
}

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA";}
function palti(v){return v[1]+v[0];}
function smartMatch(a1,b1){ if(a1=="**"||b1=="**") return false; return a1===b1 || palti(a1)===b1 || fam(a1)===fam(b1); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = (activeMark && isPartOfPattern(ri, ci)) ? "circle" : "";
   if(c=="**") cls += " blank";
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="${c=='**'?'makePattern('+ri+','+ci+')':'' }">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activeMark) setTimeout(() => drawLines("mainCanvas", document.getElementById("tbl")), 50);
}

function isPartOfPattern(ri, ci){
    if(!activeMark) return false;
    let i = ri - activeMark.start;
    return (i >= 0 && i < activeMark.shape.length && activeMark.shape[i][ci]);
}

function drawLines(cvsId, tblEl) {
    const cvs = document.getElementById(cvsId);
    const ctx = cvs.getContext("2d");
    cvs.width = tblEl.offsetWidth; cvs.height = tblEl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const cells = tblEl.querySelectorAll(".circle");
    if(cells.length < 2) return;
    
    const tRect = tblEl.getBoundingClientRect();
    ctx.strokeStyle = "#00d4ff"; 
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    
    ctx.beginPath();
    cells.forEach((c, idx) => {
        const r = c.getBoundingClientRect();
        const x = r.left - tRect.left + r.width/2;
        const y = r.top - tRect.top + r.height/2;
        if(idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();
}

function edit(r,c,el){ 
    data[r][c] = norm(el.innerText.trim()); 
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Rajdhani Data Saved!"); }

function makePattern(r,c){
  targetCol=c; let base="**";
  for(let i=r;i>=0;i--){ if(data[i][c]!="**"){base=data[i][c]; break;}}
  if(base=="**") return;

  let shape = Array(10).fill(0).map(() => Array(5).fill(0)); 
  let matchCount = 0;
  let startRow = Math.max(0, r-9);

  for(let i = r; i >= startRow; i--){
    for(let j = 0; j < 5; j++){
      if(data[i][j] != "**" && smartMatch(data[i][j], base)){
        if(matchCount < 3){ 
          shape[i - startRow][j] = 1;
          matchCount++;
        }
      }
    }
    if(matchCount >= 3) break; 
  }
  searchPattern(shape, base);
}

function searchPattern(shape,base){
 let lastMatches=[];
 for(let i=0; i<=data.length-shape.length; i++){
  let ok=true;
  for(let k=0; k<shape.length; k++){
   for(let j=0; j<5; j++){ if(shape[k][j] && !smartMatch(data[i+k][j],base)){ok=false; break;}}
   if(!ok) break;
  }
  if(ok) lastMatches.push({index:i});
 }
 showChecks(shape, lastMatches);
}

function showChecks(shape, matches){
 document.getElementById("checks").innerHTML="";
 matches.forEach((m,i)=>{
  let d = document.createElement("div");
  d.style = "background:rgba(255,255,255,0.05); margin:8px 0; padding:10px; cursor:pointer; border-radius:8px; font-size:12px; border-left:4px solid var(--blue-circle); color:#cbd5e1;";
  d.innerHTML = `<b>Match #${i+1}</b> (Line at Row ${m.index + 1})`;
  d.onclick = () => { activeMark={start:m.index, shape:shape}; draw(); showOne(shape, m.index); };
  document.getElementById("checks").appendChild(d);
 });
 updateAI(shape, matches);
}

function showOne(shape, idx){
 let html="<table id='popTbl' style='color:#000; width:100%'>";
 for(let i=0; i<shape.length; i++){
  html+="<tr>";
  data[idx+i].forEach((v,j)=>{
   html+=`<td class="${shape[i][j]?'circle':''}">${v}</td>`;
  });
  html+="</tr>";
 }
 document.getElementById("popData").innerHTML=html+"</table>";
 document.getElementById("popup").style.display="block";
 document.getElementById("overlay").style.display="block";
 setTimeout(()=>drawLines("popCanvas", document.getElementById("popTbl")), 100);
}

function updateAI(shape, matches){
 let jc={}, pool = [];
 matches.forEach(m=>{
  for(let i=0; i<shape.length; i++){
   for(let j=0; j<5; j++){
    if(shape[i][j]){
     let v = data[m.index+i][j];
     jc[v]=(jc[v]||0)+1;
    }
   }
  }
  let nextR = m.index + shape.length;
  if(nextR < data.length && data[nextR][targetCol] != "**") pool.push(data[nextR][targetCol]);
 });
 
 document.getElementById("ai").innerHTML = `<b>High Power:</b> ${Object.keys(jc).slice(0,3).join(", ") || "No Data"}`;
 document.getElementById("future").innerHTML = pool.length ? pool.slice(0,3).join(" , ") : "-- --";
}

function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        let lines = fr.result.split('\n');
        data = lines.filter(l=>l.trim()).map(l => {
            let row = l.split(',').map(v => norm(v.trim()));
            while(row.length < 5) row.push("**"); 
            return row.slice(0,5);
        });
        draw();
        alert("Rajdhani CSV Loaded!");
    };
    fr.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
