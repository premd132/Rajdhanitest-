<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pradeep AI - Dynamic Base System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; --yellow: #ffff00; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; padding: 10px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 10px; }
        .base-jodi { background-color: var(--yellow) !important; color: #000 !important; border: 2px solid #000 !important; }
        .circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); margin-top: 15px; text-align: center; }
        #future { font-size: 26px; color: var(--green); font-weight: 800; letter-spacing: 5px; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 10px 15px; color: white; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
        <button onclick="document.getElementById('csv').click()" style="background:#0084ff;">📂 UPLOAD CSV</button>
        <button onclick="addRow()" style="background:#444;">➕ ADD ROW</button>
        <button onclick="saveData()" style="background:#28a745;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); font-size:12px; margin-bottom:5px;">🤖 AI PREDICTION (MAX 3)</h3>
        <div id="future">-- -- --</div>
        <div id="matchLog" style="font-size:11px; color:#aaa; margin-top:5px;">Click on any blank cell (**) to scan pattern</div>
    </div>

<script>
const KEY="pradeep_dynamic_v2";
const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(KEY)) || [["12","25","36","48","50","60"],["**","**","**","**","**","**"]];
let activePattern = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){ v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let isBase = activePattern && activePattern.baseR == ri && activePattern.baseC == ci;
   let isCircle = activePattern && ((activePattern.matchR == ri && activePattern.matchC == ci) || (activePattern.curR == ri && activePattern.curC == ci));
   let cls = isBase ? "base-jodi" : (isCircle ? "circle" : "");
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="processPattern(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activePattern) setTimeout(drawConnectionLines, 50);
}

function processPattern(r, c) {
    if(data[r][c] !== "**") return;
    
    // 1. DYNAMIC BASE: Cell ke theek upar wali jodi (r-1, same column c)
    let baseRow = r - 1;
    if(baseRow < 0) return;
    let baseJodi = data[baseRow][c];
    if(baseJodi == "**") return;

    let targetFam = fam(baseJodi);
    let foundMatch = null;
    let startLimit = Math.max(0, r - 12); // Scan pichle 12 hafte

    // 2. Search records for same family base jodi
    for(let i = r-2; i >= startLimit; i--) {
        if(fam(data[i][c]) === targetFam) {
            if(data[i+1] && data[i+1][c] !== "**") {
                foundMatch = { oldBaseR: i, oldResultR: i+1 };
                break; 
            }
        }
    }

    if(foundMatch) {
        activePattern = {
            baseR: baseRow, baseC: c,      // Yellow Base (Just above click)
            curR: r, curC: c,              // Blue Circle (Today)
            matchR: foundMatch.oldResultR, matchC: c // Blue Circle (Old Match)
        };
        draw();
        
        let oldVal = data[foundMatch.oldResultR][c];
        // Prediction: Old Match + Family + Reverse
        let p1 = norm((parseInt(oldVal)+5)%100);
        let p2 = oldVal.split('').reverse().join('');
        let p3 = FAMILY[fam(oldVal)] ? FAMILY[fam(oldVal)][0] : "05";
        
        document.getElementById("future").innerText = `${p1} - ${p2} - ${p3}`;
        document.getElementById("matchLog").innerText = `Match Found at Row ${foundMatch.oldResultR + 1}`;
    } else {
        alert("Is Base Jodi ki Family pichle 12 hafton mein nahi mili.");
    }
}

function drawConnectionLines() {
    const cvs = document.getElementById("mainCanvas"), tbl = document.getElementById("tbl"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    const circles = tbl.querySelectorAll(".circle");
    if(circles.length < 2) return;

    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 4;
    const rect = tbl.getBoundingClientRect();
    
    let p1 = circles[0].getBoundingClientRect();
    let p2 = circles[1].getBoundingClientRect();

    // Check Line only between blue circles
    ctx.beginPath();
    ctx.moveTo(p1.left - rect.left + p1.width/2, p1.top - rect.top + p1.height/2);
    ctx.lineTo(p2.left - rect.left + p2.width/2, p2.top - rect.top + p2.height/2);
    ctx.stroke();
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(KEY,JSON.stringify(data)); alert("Data Saved Locally!"); }
function clearData(){ if(confirm("Clear Data?")){ localStorage.clear(); location.reload(); }}
function importCSV(e){
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v)));
        localStorage.setItem(KEY, JSON.stringify(data));
        draw();
    };
    fr.readAsText(e.target.files[0]);
}
draw();
</script>
</body>
</html>
