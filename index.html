<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro Master AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --red: #ff4757; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; }
        #main-app { padding: 10px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .table-container { position: relative; background: #fff; border-radius: 8px; padding: 5px; display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 13px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ccc; width: 42px; height: 42px; text-align: center; font-weight: bold; cursor: pointer; }
        th { background: #1e293b; color: #fff; font-size: 10px; }
        
        /* Patterns */
        .circle-main { border: 3px solid var(--blue); border-radius: 50%; background: rgba(0, 132, 255, 0.1); }
        .circle-source { border: 3px solid var(--red); border-radius: 50%; background: rgba(255, 71, 87, 0.1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .card { background: var(--panel); padding: 15px; border-radius: 12px; margin-top: 10px; border-top: 3px solid var(--gold); }
        .check-line { background: #2d3748; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 5px solid var(--green); cursor: pointer; }
        
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 400px; box-shadow: 0 0 50px #000; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 90; }
        button { cursor: pointer; border: none; border-radius: 5px; font-weight: bold; padding: 8px 12px; }
    </style>
</head>
<body>

<div id="main-app">
    <div class="toolbar">
        <button onclick="addRow()" style="background:#444; color:#fff;">➕ ADD</button>
        <button onclick="saveData()" style="background:var(--green);">💾 SAVE</button>
        <button onclick="document.getElementById('csv').click()" style="background:var(--gold);">📂 CSV</button>
        <input type="file" id="csv" style="display:none" accept=".csv">
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3>✔ Check Lines (1.2.3 Pattern)</h3>
        <div id="check-list">Click a blank cell to scan old records...</div>
    </div>

    <div class="card" style="display: flex; justify-content: space-between;">
        <div><h4>🤖 Advanced AI</h4><div id="adv-ai">--</div></div>
        <div><h4>🔮 Future AI</h4><div id="fut-ai">--</div></div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:red; color:white;">X</button>
    <h3 style="margin-top:0">Pattern Match View</h3>
    <div id="popContent"></div>
</div>

<script>
const FAMILY = {"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("p_master_v1")) || [["11","22","33","44","55","66"],["**","**","**","**","**","**"]];
let activePattern = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){v=String(v).trim(); return v=="**"?"**":(v.length==1?"0"+v:v);}
function isMatch(a,b){return a!=="**" && b!=="**" && (a===b || fam(a)===fam(b));}

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let cls = "";
            if(activePattern && activePattern.coords.some(p => p.r===ri && p.c===ci)) cls="circle-main";
            if(activePattern && activePattern.source && activePattern.source.r===ri && activePattern.source.c===ci) cls="circle-source";
            h+=`<td class="${cls}" onclick="cellClick(${ri},${ci})">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activePattern) setTimeout(()=>renderLines("mainCanvas", "tbl"), 50);
}

function cellClick(r, c) {
    if(data[r][c] === "**") {
        findPatterns(r, c);
    } else {
        let v = prompt("Edit Value:", data[r][c]);
        if(v !== null) { 
            data[r][c] = norm(v);
            // Mark where this pair came from (Row above logic)
            if(r > 0) {
                activePattern = { source: {r: r-1, c: c}, coords: [{r: r, c: c}] };
            }
            draw();
        }
    }
}

function findPatterns(r, c) {
    let list = document.getElementById("check-list");
    list.innerHTML = "Scanning last 10 weeks...";
    
    // Logic: Monday to Friday Pattern from row directly above
    let patternCoords = [];
    for(let i=r-1; i>=Math.max(0, r-10); i--) {
        if(data[i][c] !== "**") {
            // Find similar 1,2,3 patterns in old records
            let matches = [];
            for(let m=0; m<i; m++) {
                if(isMatch(data[m][c], data[i][c])) {
                    matches.push(m);
                }
            }
            
            list.innerHTML = "";
            matches.slice(0, 3).forEach((mIdx, idx) => {
                let d = document.createElement("div");
                d.className = "check-line";
                d.innerHTML = `Check Line ${idx+1}: Match found at Week ${mIdx+1}`;
                d.onclick = () => {
                    activePattern = { 
                        start: mIdx, 
                        coords: [{r: mIdx, c: c}, {r: i, c: c}],
                        source: {r: mIdx-1, c: c}
                    };
                    draw();
                    showPopup(mIdx, c);
                    predict(mIdx, c);
                };
                list.appendChild(d);
            });
            break;
        }
    }
}

function predict(mIdx, c) {
    let res = (mIdx+1 < data.length) ? data[mIdx+1][c] : "??";
    document.getElementById("adv-ai").innerText = res;
    document.getElementById("fut-ai").innerText = fam(res) + " Family";
}

function showPopup(mIdx, col) {
    let h = "<table style='width:100%'>";
    for(let i=Math.max(0, mIdx-2); i<=mIdx+1; i++) {
        h += "<tr>";
        data[i].forEach((v, j) => {
            let cls = (i===mIdx && j===col) ? "circle-main" : "";
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popContent").innerHTML = h + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function renderLines(cvsid, tbid) {
    const cvs = document.getElementById(cvsid);
    const tbl = document.getElementById(tbid);
    const ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3;
    let dots = tbl.querySelectorAll(".circle-main, .circle-source");
    ctx.beginPath();
    dots.forEach((d, i) => {
        let r = d.getBoundingClientRect(), p = tbl.getBoundingClientRect();
        let x = r.left - p.left + r.width/2, y = r.top - p.top + r.height/2;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function addRow() { data.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem("p_master_v1", JSON.stringify(data)); alert("Data Saved!"); }
function closePopup() { document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => { data = fr.result.split("\n").filter(l=>l.trim()).map(l=>l.split(",").map(v=>norm(v))); draw(); };
    fr.readAsText(e.target.files[0]);
};

draw();
</script>
</body>
</html>
