<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBK I-Smart Guessing System</title>
    <style>
        :root { --red: #ff1111; --blue: #1177ff; --green: #00aa00; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; }
        
        /* I-Smart UI */
        .smart-nav { background: #b71c1c; padding: 15px; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; }
        .container { display: flex; height: calc(100vh - 65px); }
        
        /* Control Panel */
        .i-smart-sidebar { width: 350px; background: #151515; padding: 20px; border-right: 2px solid #333; overflow-y: auto; }
        .dna-card { background: #222; border: 1px solid #444; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .dna-tag { color: var(--gold); font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        
        /* Markers */
        .tool-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .t-btn { padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: 800; font-size: 12px; }
        .t-red { background: var(--red); color: #fff; }
        .t-blue { background: var(--blue); color: #fff; }
        .t-green { background: var(--green); color: #fff; }
        .active { outline: 3px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4); }

        /* Chart Area */
        .chart-workspace { flex: 1; padding: 30px; background: #111; overflow: auto; display: flex; justify-content: center; }
        .chart-frame { position: relative; background: #fff; padding: 10px; border-radius: 5px; box-shadow: 0 0 50px #000; height: fit-content; }
        
        table { border-collapse: collapse; color: #000; z-index: 10; position: relative; }
        td, th { border: 1px solid #ddd; width: 60px; height: 55px; text-align: center; font-size: 20px; font-weight: 900; cursor: pointer; }
        th { background: #f0f0f0; font-size: 11px; height: 30px; }
        
        /* I-Smart Shapes */
        .s-red { border: 4px solid var(--red) !important; color: var(--red); background: rgba(255,0,0,0.1); }
        .s-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
        .s-green { border: 4px solid var(--green) !important; background: rgba(0,255,0,0.1); color: var(--green); }
        
        #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        .scan-btn { background: var(--gold); color: #000; width: 100%; padding: 18px; font-size: 18px; font-weight: 900; border: none; margin-top: 20px; cursor: pointer; border-radius: 5px; box-shadow: 0 5px 0 #b89b00; }
    </style>
</head>
<body>

<div class="smart-nav">
    <div style="font-weight: 900; font-size: 22px;">DPBK <span style="color:var(--gold)">I-SMART</span> V3.0</div>
    <div id="msg" style="color:#0f0; font-family: monospace;">AI ENGINE: ACTIVE</div>
</div>

<div class="container">
    <div class="i-smart-sidebar">
        <div class="dna-card">
            <span class="dna-tag">PATTERN DNA INPUT</span>
            <div class="tool-box">
                <button class="t-btn t-red active" onclick="setMode('s-red', this)">BASE (RED)</button>
                <button class="t-btn t-green" onclick="setMode('s-green', this)">TOUCH 1</button>
                <button class="t-btn t-blue" onclick="setMode('s-blue', this)">TOUCH 2</button>
            </div>
            <input type="file" id="csv" onchange="loadCSV()" style="margin-top:20px; width:100%; font-size: 12px; color:#aaa;">
        </div>

        <div class="dna-card">
            <span class="dna-tag">SMART SETTINGS</span>
            <select id="anchorDay" style="width:100%; padding:10px; margin-top:10px; background:#333; color:#fff;">
                <option value="0">MONDAY</option><option value="1">TUESDAY</option>
                <option value="2">WEDNESDAY</option><option value="3">THURSDAY</option>
                <option value="4">FRIDAY</option><option value="5">SATURDAY</option>
            </select>
        </div>

        <button class="scan-btn" onclick="iSmartScan()">RUN I-SMART GUESSING</button>
        <p id="log" style="font-size: 11px; color: #888; margin-top: 15px; text-align: center;">I-Smart Engine scans family-to-family relations across 500+ weeks.</p>
    </div>

    <div class="chart-workspace">
        <div class="chart-frame" id="box">
            <canvas id="canvas"></canvas>
            <table id="itbl">
                <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let mode = 's-red';
let chart = [["10","20","30","40","50","60"],["15","25","35","45","55","65"],["11","22","33","44","55","66"],["80","35","41","67","89","00"],["67","17","90","**","**","**"]];

// Internal I-Smart Family Logic
function getFamily(v) {
    let n = v.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let res = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => {
        res.add(`${a[0]}${b[0]}`); res.add(`${b[0]}${a[0]}`);
    }));
    return Array.from(res);
}

function render() {
    const b = document.getElementById('tbody');
    b.innerHTML = chart.map((row, r) => `<tr>${row.map((val, c) => 
        `<td onclick="mark(this)" contenteditable="true" onblur="chart[${r}][${c}]=this.innerText">${val}</td>`).join('')}</tr>`).join('');
    setTimeout(sync, 100);
}

function setMode(m, btn) {
    mode = m;
    document.querySelectorAll('.t-btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
}

function mark(td) { td.className = td.className === mode ? "" : mode; }

function sync() {
    const c = document.getElementById('canvas'), box = document.getElementById('box');
    c.width = box.scrollWidth; c.height = box.scrollHeight;
}

// I-SMART DEEP SCAN ENGINE
function iSmartScan() {
    const day = parseInt(document.getElementById('anchorDay').value);
    const table = document.getElementById('itbl');
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0,0,5000,5000);

    let dna = { base: null, relatives: [] };
    for(let r=0; r<chart.length; r++) {
        if(table.rows[r+1].cells[day].classList.contains('s-red')) {
            dna.base = { val: chart[r][day], r: r, c: day }; break;
        }
    }

    if(!dna.base) return alert("Select RED Base first!");

    document.querySelectorAll('.s-green, .s-blue').forEach(td => {
        let r = td.parentElement.rowIndex-1, c = td.cellIndex;
        dna.relatives.push({ val: chart[r][c], rd: r-dna.base.r, cd: c-dna.base.c, type: td.className });
    });

    const bFam = getFamily(dna.base.val);
    chart.forEach((row, ri) => {
        if(bFam.includes(row[day]) && ri !== dna.base.r) {
            let match = 0;
            dna.relatives.forEach(rel => {
                let tr = ri+rel.rd, tc = day+rel.cd;
                if(chart[tr] && getFamily(rel.val).includes(chart[tr][tc])) match++;
            });

            if(match === dna.relatives.length) {
                const bCell = table.rows[ri+1].cells[day];
                bCell.classList.add('s-red');
                dna.relatives.forEach(rel => {
                    const tCell = table.rows[ri+rel.rd+1].cells[day+rel.cd];
                    tCell.classList.add(rel.type);
                    ctx.strokeStyle = rel.type.includes('green') ? 'green' : '#1177ff';
                    ctx.lineWidth = 3; ctx.beginPath();
                    ctx.moveTo(bCell.offsetLeft+30, bCell.offsetTop+27);
                    ctx.lineTo(tCell.offsetLeft+30, tCell.offsetTop+27); ctx.stroke();
                });
                document.getElementById('log').innerText = "I-Smart Found Match at Week " + (ri+1);
            }
        }
    });
}

function loadCSV() {
    const f = document.getElementById('csv').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        chart = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        render();
    };
    r.readAsText(f);
}

window.onload = render;
</script>
</body>
</html>
