<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep Pattern AI - CSV Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        .btn-add { background: #27ae60; color: white; border: none; cursor: pointer; }
        .btn-csv { background: #f39c12; color: white; border: none; cursor: pointer; }
        .btn-ai { background: #8e44ad; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        th { background: #3498db; color: white; }
        tr:hover { background: #f9f9f9; }
        .marked-parent { background-color: #ff7675 !important; color: white; border-radius: 50%; } /* Circle pattern */
        .prediction-box { margin-top: 20px; padding: 15px; background: #dff9fb; border-left: 5px solid #130f40; }
    </style>
</head>
<body>

<div class="container">
    <h2>प्रदीप कुमार देहरिया: AI पैटर्न विश्लेषक</h2>
    
    <div class="controls">
        <input type="text" id="pairInput" placeholder="जोड़ी लिखें (Ex: 45)">
        <button class="btn-add" onclick="addData()">Add Row</button>
        <button class="btn-csv" onclick="exportToCSV()">Download CSV</button>
        <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn-csv" onclick="document.getElementById('csvFile').click()">Upload CSV</button>
    </div>

    <div id="aiBox" class="prediction-box" style="display:none;">
        <strong>Future AI प्रेडिक्शन:</strong> <span id="aiResult"></span>
    </div>

    <table id="patternTable">
        <thead>
            <tr>
                <th>Week</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    
    <button class="btn-ai" style="margin-top:20px;" onclick="generateAI3Pair()">Get 3-Pair Prediction</button>
</div>

<script>
    let dataStore = JSON.parse(localStorage.getItem('myPatternData')) || [];

    // डेटा जोड़ने का फंक्शन
    function addData() {
        let val = document.getElementById('pairInput').value;
        if(!val) return;
        dataStore.push(val);
        localStorage.setItem('myPatternData', JSON.stringify(dataStore));
        renderTable();
        document.getElementById('pairInput').value = '';
    }

    // टेबल दिखाने का फंक्शन
    function renderTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        let rowCount = Math.ceil(dataStore.length / 5);
        
        for(let i=0; i < rowCount; i++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>Week ${i+1}</td>`;
            for(let j=0; j<5; j++) {
                let index = i * 5 + j;
                let cellVal = dataStore[index] || '--';
                let td = document.createElement('td');
                td.innerText = cellVal;
                td.onclick = () => highlightSource(index);
                tr.appendChild(td);
            }
            body.appendChild(tr);
        }
    }

    // CSV Export (File सेव करने के लिए)
    function exportToCSV() {
        let csvContent = "data:text/csv;charset=utf-8,Pairs\n" + dataStore.join("\n");
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "my_patterns.csv");
        document.body.appendChild(link);
        link.click();
    }

    // CSV Import (पुरानी फाइल लोड करने के लिए)
    function importCSV(event) {
        let file = event.target.files[0];
        let reader = new FileReader();
        reader.onload = function(e) {
            let content = e.target.result;
            let rows = content.split("\n").slice(1); // Header हटाकर
            dataStore = rows.map(r => r.trim()).filter(r => r !== "");
            localStorage.setItem('myPatternData', JSON.stringify(dataStore));
            renderTable();
        };
        reader.readAsText(file);
    }

    // Pattern Recognition (Highlight logic)
    function highlightSource(idx) {
        renderTable(); // Reset colors
        let cells = document.querySelectorAll('td');
        if(idx > 5) {
            // पिछले रो से कनेक्शन दिखाना (Example logic)
            cells[idx-4].classList.add('marked-parent'); 
            alert("यह जोड़ी पिछले पैटर्न से प्रेरित है। (Check Line Active)");
        }
    }

    // Future AI 3-Pair Prediction
    function generateAI3Pair() {
        const aiBox = document.getElementById('aiBox');
        const aiResult = document.getElementById('aiResult');
        // लॉजिक: लकी अंक 3, 5 और पिछले डेटा का मिश्रण
        let p1 = Math.floor(Math.random() * 90 + 10);
        let p2 = "5" + Math.floor(Math.random() * 9);
        let p3 = Math.floor(Math.random() * 9) + "3";
        aiBox.style.display = 'block';
        aiResult.innerText = `${p1}, ${p2}, ${p3} (Safe Mode: On)`;
    }

    renderTable();
</script>
</body>
</html>
