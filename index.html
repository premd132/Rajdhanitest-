<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ULTRA AI Pattern Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f4f4;margin:10px}
h2{text-align:center}
button,input{padding:6px;margin:5px}

#wrap{
  position:relative;
  background:#fff;
  padding:10px;
  overflow:auto;
}

table{border-collapse:collapse}
td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:55px;
  position:relative;
}
td[contenteditable]{background:#fffbe6}

.circle{
  border:3px solid blue;
  border-radius:50%;
}

#draw{
  position:absolute;
  top:0;
  left:0;
  pointer-events:none;
}

#aiPanel{
  margin-top:15px;
  padding:10px;
  background:#e6f2ff;
  border:1px solid #99c2ff;
}
</style>
</head>

<body>

<h2>ULTRA AI Family Engine</h2>

<input type="file" id="csvFile" accept=".csv">
<button onclick="addRow()">➕ Add Row</button>
<button onclick="runUltraAI()">🚀 Run Ultra AI</button>
<button onclick="clearAll()">🗑 Clear</button>

<div id="wrap">
  <canvas id="draw"></canvas>
  <table id="chart"></table>
</div>

<div id="aiPanel">
  <b>AI Result:</b>
  <div id="aiOutput">No scan yet.</div>
</div>

<script>

// ===== FAMILY MAP =====
const FAMILY={
 "22":["22","27","72","77"],
 "11":["11","61","66","16"],
 "33":["33","83","88","38"],
 "99":["99","44","49","94"],
 "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"],  
 "13":["13","18","31","36","63","68","81","86"],  
 "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"],  
 "23":["23","28","32","37","73","78","82","87"],  
 "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"],  
 "34":["34","39","43","48","84","89","93","98"],  
 "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

const table=document.getElementById("chart");
const canvas=document.getElementById("draw");
const ctx=canvas.getContext("2d");

const saved=localStorage.getItem("jodiData");
if(saved) buildTable(JSON.parse(saved));

function save(){
  const data=[];
  [...table.rows].forEach(r=>{
    let row=[];
    [...r.cells].forEach(c=>{
      let v=c.innerText.trim();
      if(v.length===1) v="0"+v;
      row.push(v);
    });
    data.push(row);
  });
  localStorage.setItem("jodiData",JSON.stringify(data));
}

function buildTable(data){
  table.innerHTML="";
  data.forEach(row=>{
    const tr=document.createElement("tr");
    row.forEach(val=>{
      const td=document.createElement("td");
      td.innerText=val;
      td.contentEditable=true;
      td.oninput=save;
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  resizeCanvas();
}

document.getElementById("csvFile").addEventListener("change",e=>{
  const reader=new FileReader();
  reader.onload=()=>{
    const rows=reader.result.trim().split(/\r?\n/)
      .map(l=>l.split(",").map(v=>v.trim()));
    buildTable(rows);
    save();
  };
  reader.readAsText(e.target.files[0]);
});

function addRow(){
  const tr=document.createElement("tr");
  for(let i=0;i<6;i++){
    const td=document.createElement("td");
    td.contentEditable=true;
    td.oninput=save;
    tr.appendChild(td);
  }
  table.appendChild(tr);
  save();
  resizeCanvas();
}

function clearAll(){
  table.innerHTML="";
  localStorage.removeItem("jodiData");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById("aiOutput").innerText="No scan yet.";
}

function resizeCanvas(){
  canvas.width=table.offsetWidth;
  canvas.height=table.offsetHeight;
}

function getFamily(val){
  for(const key in FAMILY){
    if(FAMILY[key].includes(val)) return key;
  }
  return null;
}

function center(td){
  const r=td.getBoundingClientRect();
  const t=table.getBoundingClientRect();
  return {x:r.left-t.left+r.width/2,y:r.top-t.top+r.height/2};
}

// ===== ULTRA AI =====
function runUltraAI(){

  ctx.clearRect(0,0,canvas.width,canvas.height);
  [...table.querySelectorAll("td")].forEach(td=>td.classList.remove("circle"));

  const rows=table.rows.length;
  if(rows<8){ alert("Need at least 8 rows"); return; }

  const start=rows-7;
  let template=[];
  let familyScore={};

  // Extract Template
  for(let r=start;r<rows-1;r++){
    for(let c=0;c<6;c++){
      let val=table.rows[r].cells[c].innerText.trim();
      let fam=getFamily(val);
      if(!fam) continue;

      for(let nc=c-1;nc<=c+1;nc++){
        if(nc<0||nc>=6) continue;

        let nextVal=table.rows[r+1].cells[nc].innerText.trim();
        let nextFam=getFamily(nextVal);

        if(nextFam===fam){
          template.push({fam,dc:nc-c});
          familyScore[fam]=(familyScore[fam]||0)+1;

          let cell1=table.rows[r].cells[c];
          let cell2=table.rows[r+1].cells[nc];

          cell1.classList.add("circle");
          cell2.classList.add("circle");

          let p1=center(cell1);
          let p2=center(cell2);

          ctx.beginPath();
          ctx.moveTo(p1.x,p1.y);
          ctx.lineTo(p2.x,p2.y);
          ctx.strokeStyle="blue";
          ctx.lineWidth=2;
          ctx.stroke();
        }
      }
    }
  }

  // History Scan
  let historyMatch=0;
  for(let r=0;r<rows-7;r++){
    template.forEach(t=>{
      let val=table.rows[r].cells[0].innerText.trim();
      if(getFamily(val)===t.fam) historyMatch++;
    });
  }

  let sorted=Object.entries(familyScore)
    .sort((a,b)=>b[1]-a[1]);

  let top3=sorted.slice(0,3).map(x=>x[0]);

  let probability=Math.min(95,
      Math.round((historyMatch/template.length)*100));

  let nextGuess=top3.length?FAMILY[top3[0]].join(", "):"None";

  document.getElementById("aiOutput").innerHTML=
    "Top Families: <b>"+top3.join(", ")+"</b><br>"+
    "Probability: <b>"+probability+"%</b><br>"+
    "Next Smart Guess: <b>"+nextGuess+"</b>";
}
</script>
</body>
</html>
