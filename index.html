<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI – Unique Column Pattern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --red: #ff4757; --blue: #2e86de; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; }
        #main-app { padding: 15px; }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; }
        th { background: #1e293b; color: white; }
        .circle-red { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 71, 87, 0.2); }
        .circle-blue { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(46, 134, 222, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; margin-top: 15px; border-top: 3px solid var(--gold); }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 15px; background: var(--gold); color: #000; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 450px; box-shadow: 0 0 50px #000; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 90; }
    </style>
</head>
<body>

<div id="main-app">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:15px;">
        <h2 style="color:var(--gold); margin:0;">Rajdhani AI Pro</h2>
        <button onclick="addRow()" style="background:#444; color:white;">+ Row</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); margin:0 0 10px 0;">✔ Check Lines (History Matches)</h3>
        <div id="checks">Click a blank cell to analyze...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right;">CLOSE</button>
    <h3>Historical Match View</h3>
    <div id="popData"></div>
</div>

<script>
const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],
 "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem("rj_data")) || Array(12).fill().map(()=>Array(5).fill("**"));
let activePattern = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA";}
function smartMatch(a,b){ return (a!=="**" && b!=="**" && fam(a)===fam(b)); }

function draw() {
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let cls = "";
            if(activePattern && ri >= activePattern.start && ri < activePattern.start + activePattern.shape.length) {
                let type = activePattern.shape[ri - activePattern.start][ci];
                if(type === 1) cls = "circle-red";
                if(type === 2) cls = "circle-blue";
            }
            h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="${c=='**'?'makePattern('+ri+','+ci+')':'' }">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activePattern) setTimeout(()=>drawLines("mainCanvas", "tbl"), 50);
}

function edit(ri, ci, el) { data[ri][ci] = el.innerText.trim(); localStorage.setItem("rj_data", JSON.stringify(data)); }
function addRow() { data.push(["**","**","**","**","**"]); draw(); }

function makePattern(r, c) {
    let lookback = 8; 
    let startIdx = Math.max(0, r - lookback);
    let shape = Array(r - startIdx).fill().map(() => Array(5).fill(0));
    let familiesFound = [];

    // Ab ye har column ka alag pattern banayega
    for (let i = r - 1; i >= startIdx; i--) {
        let val = data[i][c]; // Jis column pe click kiya sirf uska reference
        if (val !== "**") {
            let f = fam(val);
            if (!familiesFound.includes(f)) familiesFound.push(f);
            
            let type = familiesFound.indexOf(f) + 1;
            if (type <= 2) {
                // Poore row mein check karo ki ye family aur kahan kahan hai (CROSS logic)
                for(let j=0; j<5; j++) {
                    if(smartMatch(data[i][j], val)) shape[i - startIdx][j] = type;
                }
            }
        }
    }
    
    findMatches(shape, familiesFound);
}

function findMatches(shape, families) {
    let matches = [];
    for (let i = 0; i <= data.length - shape.length - 1; i++) {
        let ok = true;
        for (let k = 0; k < shape.length; k++) {
            for (let j = 0; j < 5; j++) {
                if (shape[k][j] === 1 && !smartMatch(data[i+k][j], FAMILY[families[0]][0])) { ok=false; break; }
                if (shape[k][j] === 2 && !smartMatch(data[i+k][j], FAMILY[families[1]][0])) { ok=false; break; }
            }
            if(!ok) break;
        }
        if(ok) matches.push(i);
    }
    displayChecks(shape, matches);
}

function displayChecks(shape, matches) {
    let container = document.getElementById("checks");
    container.innerHTML = matches.length === 0 ? "No matches found." : "";
    matches.forEach(mIdx => {
        let btn = document.createElement("div");
        btn.style = "background:#2d3748; padding:10px; margin-bottom:5px; border-radius:5px; cursor:pointer; border-left:4px solid var(--gold);";
        btn.innerHTML = `Match Found at Row ${mIdx + 1} ➔ Click to View`;
        btn.onclick = () => {
            activePattern = { start: mIdx, shape: shape };
            draw();
            showPopupTable(shape, mIdx);
        };
        container.appendChild(btn);
    });
}

function showPopupTable(shape, start) {
    let h = "<table border='1' style='width:100%; border-collapse:collapse;'>";
    for(let i=0; i<shape.length; i++) {
        h += "<tr>";
        for(let j=0; j<5; j++) {
            let type = shape[i][j];
            let cls = type === 1 ? "circle-red" : (type === 2 ? "circle-blue" : "");
            h += `<td class="${cls}" style="height:40px; text-align:center; font-weight:bold;">${data[start+i][j]}</td>`;
        }
        h += "</tr>";
    }
    document.getElementById("popData").innerHTML = h + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function drawLines(cvsId, tblId) {
    const cvs = document.getElementById(cvsId);
    const tbl = document.getElementById(tblId);
    const ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    const tRect = tbl.getBoundingClientRect();
    const drawGrp = (sel, col) => {
        let cells = tbl.querySelectorAll(sel);
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
        cells.forEach((c, i) => {
            let r = c.getBoundingClientRect();
            let x = r.left - tRect.left + r.width/2;
            let y = r.top - tRect.top + r.height/2;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };
    drawGrp(".circle-red", "#ff4757");
    drawGrp(".circle-blue", "#2e86de");
}

function closePopup() { document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
draw();
</script>
</body>
</html>
