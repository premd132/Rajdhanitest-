<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBK I-Smart Fixed Engine</title>
    <style>
        :root { --red: #ff0000; --green: #00aa00; --blue: #0000ff; --gold: #ffd700; }
        body { font-family: 'Arial', sans-serif; background: #000; color: #fff; margin: 0; padding-bottom: 50px; }
        .nav { background: #b71c1c; padding: 15px; border-bottom: 4px solid var(--gold); font-weight: 900; font-size: 20px; }
        .controls { background: #1a1a1a; padding: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #333; }
        
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; font-weight: bold; }
        .btn { padding: 10px 15px; border: none; font-weight: 900; cursor: pointer; border-radius: 4px; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-blue { background: #1e88e5; color: #fff; }
        .btn-green { background: #4caf50; color: #fff; }
        .btn-red { background: #d32f2f; color: #fff; }

        .chart-container { position: relative; display: inline-block; background: #fff; padding: 15px; margin-top: 20px; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; color: #000; z-index: 10; position: relative; }
        td, th { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-size: 20px; font-weight: 900; }
        th { background: #eee; font-size: 11px; height: 30px; }
        
        /* Marker Shapes */
        .s-red { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); }
        .s-green { border: 4px solid var(--green) !important; color: var(--green); }
        .s-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        #status { color: #0f0; margin: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div class="nav">DPBK I-SMART MASTER ENGINE (FIXED)</div>

<div class="controls">
    <input type="file" id="csvInp" accept=".csv" onchange="importCSV(this)">
    <button class="btn btn-green" onclick="addSampleData()">Load Demo Data</button>
    <button class="btn btn-blue" onclick="addRow()">+ Nayi Row</button>
    <div>
        <input type="text" id="j1" placeholder="Jodi 1" style="width:50px">
        <input type="text" id="j2" placeholder="Jodi 2" style="width:50px">
        <input type="text" id="j3" placeholder="Jodi 3" style="width:50px">
    </div>
    <select id="dayIdx">
        <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
    </select>
    <button class="btn btn-gold" onclick="runISmart()">RUN I-SMART SCAN</button>
    <button class="btn btn-red" onclick="resetAll()">Clear All</button>
</div>

<div id="status">Status: Waiting for Data...</div>

<div class="chart-container" id="box">
    <canvas id="canvas"></canvas>
    <table id="itbl">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
let chartData = [];
const KEY = 'DPBK_DATA_V7';

window.onload = () => {
    const saved = localStorage.getItem(KEY);
    if(saved) {
        chartData = JSON.parse(saved);
        render();
        document.getElementById('status').innerText = "Saved Data Loaded.";
    }
};

function render() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = chartData.map((row, ri) => `<tr>${row.map((j, ci) => 
        `<td contenteditable="true" onblur="updateCell(${ri}, ${ci}, this.innerText)">${j}</td>`).join('')}</tr>`).join('');
    setTimeout(sync, 100);
}

function updateCell(r, c, val) {
    chartData[r][c] = val || "**";
    localStorage.setItem(KEY, JSON.stringify(chartData));
}

function addRow() {
    chartData.push(["**","**","**","**","**","**"]);
    render();
}

function addSampleData() {
    chartData = [
        ["10","20","30","40","50","60"],
        ["11","22","33","44","55","66"],
        ["80","35","70","12","23","34"], // Historical Match
        ["99","88","77","66","55","44"],
        ["35","80","25","**","**","**"]  // Current Base
    ];
    render();
    document.getElementById('status').innerText = "Demo Data Loaded. Try J1:35, J2:80, J3:25 on Monday!";
}

function importCSV(input) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        chartData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        localStorage.setItem(KEY, JSON.stringify(chartData));
        render();
        document.getElementById('status').innerText = "CSV Loaded Successfully!";
    };
    reader.readAsText(file);
}

function sync() {
    const c = document.getElementById('canvas'), b = document.getElementById('box');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

function getFam(v) {
    if(!v || v === "**") return [];
    let n = v.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let s = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => { s.add(`${a[0]}${b[0]}`); s.add(`${b[0]}${a[0]}`); }));
    return Array.from(s);
}

function runISmart() {
    const j1 = document.getElementById('j1').value;
    const j2 = document.getElementById('j2').value;
    const j3 = document.getElementById('j3').value;
    const day = parseInt(document.getElementById('dayIdx').value);
    const table = document.getElementById('itbl');
    const ctx = document.getElementById('canvas').getContext('2d');
    
    document.querySelectorAll('td').forEach(t => t.className = "");
    ctx.clearRect(0,0,5000,5000);

    const f1 = getFam(j1), f2 = getFam(j2), f3 = getFam(j3);
    const lastRow = chartData.length - 1;

    chartData.forEach((row, ri) => {
        if(ri < lastRow - 1) {
            // Triple DNA Check
            if(f1.includes(row[day]) && f2.includes(row[day+1]) && f3.includes(row[day+2])) {
                document.getElementById('status').innerText = "PATTERN MATCH FOUND!";
                
                // Drawing Patterns
                let patterns = [{rd: -2, cd: 0, type: 's-green'}, {rd: -1, cd: 2, type: 's-blue'}];
                patterns.forEach(p => {
                    let tr = ri + p.rd, tc = day + p.cd;
                    if(chartData[tr]) {
                        table.rows[ri+1].cells[day].className = "s-red";
                        table.rows[tr+1].cells[tc].className = p.type;
                        
                        ctx.strokeStyle = p.type.includes('green') ? 'green' : 'blue';
                        ctx.lineWidth = 3; ctx.setLineDash([5, 5]); ctx.beginPath();
                        ctx.moveTo(table.rows[ri+1].cells[day].offsetLeft + 30, table.rows[ri+1].cells[day].offsetTop + 27);
                        ctx.lineTo(table.rows[tr+1].cells[tc].offsetLeft + 30, table.rows[tr+1].cells[tc].offsetTop + 27);
                        ctx.stroke();
                    }
                });
            }
        }
    });
}

function resetAll() {
    if(confirm("Sab clear karun?")) {
        localStorage.removeItem(KEY);
        location.reload();
    }
}
</script>
</body>
</html>
