<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBK - Smart Pattern Engine (Internal)</title>
    <style>
        :root { --red: #ff0000; --green: #008000; --blue: #0000ff; --gold: #ffd700; }
        body { font-family: 'Roboto', sans-serif; background: #050505; color: #eee; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Dashboard Layout */
        .smart-header { background: #b71c1c; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); box-shadow: 0 2px 10px #000; }
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Smart Sidebar */
        .internal-tools { width: 320px; background: #151515; border-right: 2px solid #333; padding: 20px; overflow-y: auto; }
        .section-tag { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin: 20px 0 10px 0; display: block; }
        
        .mode-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; text-align: left; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .mode-btn:hover { background: #333; }
        .mode-btn.active { border-color: var(--gold); background: #333; box-shadow: inset 0 0 10px rgba(255,215,0,0.2); }
        .color-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 10px; }

        /* Chart Workspace */
        .workspace { flex: 1; padding: 20px; overflow: auto; background: radial-gradient(circle, #222 0%, #050505 100%); display: flex; justify-content: center; }
        .chart-container { position: relative; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,1); align-self: flex-start; }
        
        table { border-collapse: collapse; color: #000; position: relative; z-index: 10; }
        td, th { border: 1px solid #bbb; width: 55px; height: 50px; text-align: center; font-weight: 900; font-size: 19px; cursor: cell; transition: all 0.1s; }
        th { background: #eee; font-size: 11px; height: 25px; color: #555; }
        td:hover { background: #f9f9f9; transform: scale(1.05); z-index: 15; box-shadow: 0 0 10px rgba(0,0,0,0.2); }

        /* Internal Shapes */
        .s-red { border: 4px solid var(--red) !important; color: var(--red); background: rgba(255,0,0,0.1); }
        .s-green { border: 4px solid var(--green) !important; color: var(--green); background: rgba(0,128,0,0.1); }
        .s-blue { border: 4px solid var(--blue) !important; color: var(--blue); border-radius: 50% !important; }
        
        #drawLayer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        .run-engine { background: var(--gold); color: #000; width: 100%; padding: 15px; font-weight: 900; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 0 #b89b00; }
        .run-engine:active { transform: translateY(2px); box-shadow: 0 2px 0 #b89b00; }
    </style>
</head>
<body>

<div class="smart-header">
    <div style="font-weight: 900; font-size: 20px;">DPBK <span style="color:var(--gold)">SMART-V3</span> INTERNAL</div>
    <div id="status" style="font-size: 12px; color: #0f0;">ENGINE CORE: LOADED</div>
</div>

<div class="main-wrapper">
    <div class="internal-tools">
        <span class="section-tag">Database Source</span>
        <input type="file" id="csv" onchange="loadExternalData()" style="color: #fff; font-size: 12px;">

        <span class="section-tag">Smart Markers</span>
        <button class="mode-btn active" onclick="setMode('s-red', this)"><span class="color-dot" style="background:var(--red)"></span>BASE DNA (RED)</button>
        <button class="mode-btn" onclick="setMode('s-green', this)"><span class="color-dot" style="background:var(--green)"></span>MATCH 1 (GREEN)</button>
        <button class="mode-btn" onclick="setMode('s-blue', this)"><span class="color-dot" style="background:var(--blue)"></span>MATCH 2 (BLUE)</button>

        <span class="section-tag">Anchor Logic</span>
        <select id="daySelect" style="width:100%; padding:10px; background:#333; color:#fff; border:1px solid #444;">
            <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
            <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
        </select>

        <button class="run-engine" onclick="smartMatchExecution()">RUN SMART SEARCH</button>
        <div id="console" style="margin-top:20px; font-size:11px; color:#888; font-family:monospace;">Waiting for Input DNA...</div>
    </div>

    <div class="workspace">
        <div class="chart-container" id="chartBox">
            <canvas id="drawLayer"></canvas>
            <table id="smartTable">
                <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
                <tbody id="smartBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let currentMode = 's-red';
let chartData = [["10","20","30","40","50","60"],["15","25","35","45","55","65"],["11","22","33","44","55","66"],["12","37","45","67","89","00"],["67","17","90","**","**","**"]];

// Internal 100% Family Matrix
function getFamilySet(v) {
    let n = v.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let res = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => {
        res.add(`${a[0]}${b[0]}`); res.add(`${b[0]}${a[0]}`);
    }));
    return Array.from(res);
}

function initChart() {
    const tbody = document.getElementById('smartBody');
    tbody.innerHTML = chartData.map((row, r) => `<tr>${row.map((val, c) => 
        `<td onclick="markSmart(this)" contenteditable="true" onblur="chartData[${r}][${c}]=this.innerText">${val}</td>`).join('')}</tr>`).join('');
    setTimeout(adjustCanvas, 100);
}

function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function markSmart(td) { td.className = td.className === currentMode ? "" : currentMode; }

function adjustCanvas() {
    const c = document.getElementById('drawLayer'), box = document.getElementById('chartBox');
    c.width = box.scrollWidth; c.height = box.scrollHeight;
}

// THE SMART ENGINE LOGIC (Internal Clone)
function smartMatchExecution() {
    const day = parseInt(document.getElementById('daySelect').value);
    const table = document.getElementById('smartTable');
    const ctx = document.getElementById('drawLayer').getContext('2d');
    ctx.clearRect(0,0,5000,5000);

    let dna = { base: null, relatives: [] };
    
    // Scan User's Manual Pattern
    for(let r=0; r<chartData.length; r++) {
        if(table.rows[r+1].cells[day].classList.contains('s-red')) {
            dna.base = { val: chartData[r][day], r: r, c: day };
            break;
        }
    }

    if(!dna.base) { document.getElementById('console').innerText = "FAIL: No Red Base Found"; return; }

    document.querySelectorAll('.s-green, .s-blue').forEach(cell => {
        let r = cell.parentElement.rowIndex-1, c = cell.cellIndex;
        dna.relatives.push({ val: chartData[r][c], rGap: r - dna.base.r, cGap: c - dna.base.c, type: cell.className });
    });

    const bFam = getFamilySet(dna.base.val);

    // Deep Search in Database
    chartData.forEach((row, ri) => {
        if(bFam.includes(row[day]) && ri !== dna.base.r) {
            let matchesFound = 0;
            dna.relatives.forEach(rel => {
                let tr = ri + rel.rGap, tc = day + rel.cGap;
                if(chartData[tr] && getFamilySet(rel.val).includes(chartData[tr][tc])) matchesFound++;
            });

            if(matchesFound === dna.relatives.length) {
                const baseCell = table.rows[ri+1].cells[day];
                baseCell.classList.add('s-red');
                
                dna.relatives.forEach(rel => {
                    const targetCell = table.rows[ri+rel.rGap+1].cells[day+rel.cGap];
                    targetCell.classList.add(rel.type);
                    ctx.strokeStyle = rel.type.includes('green') ? 'green' : 'blue';
                    ctx.lineWidth = 3; ctx.beginPath();
                    ctx.moveTo(baseCell.offsetLeft + 27, baseCell.offsetTop + 25);
                    ctx.lineTo(targetCell.offsetLeft + 27, targetCell.offsetTop + 25); ctx.stroke();
                });
                document.getElementById('console').innerText = "SUCCESS: Pattern Cloned from Week " + (ri+1);
            }
        }
    });
}

function loadExternalData() {
    const f = document.getElementById('csv').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        chartData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        initChart();
    };
    r.readAsText(f);
}

window.onload = initChart;
</script>
</body>
</html>
