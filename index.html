<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>DPBossKing Official Pattern Tool</title>
<style>
    :root { --red-box: #ff0000; --blue-circle: #0000ff; --header-bg: #b71c1c; }
    body { font-family: 'Segoe UI', Arial; background: #121212; color: white; margin: 0; user-select: none; }
    
    /* Toolbar Style */
    .toolbar { background: #222; padding: 15px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; border-bottom: 3px solid #ffd600; sticky: top; }
    button { padding: 10px 18px; cursor: pointer; background: #ffd600; border: none; font-weight: bold; border-radius: 4px; transition: 0.2s; }
    button:hover { transform: scale(1.05); }
    .btn-run { background: #2196F3; color: white; }
    .btn-reset { background: #f44336; color: white; }

    /* Chart Layout */
    .chart-area { position: relative; margin: 25px auto; display: inline-block; background: white; padding: 8px; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
    table { border-collapse: collapse; color: black; position: relative; z-index: 5; background: transparent; }
    th, td { border: 1px solid #bbb; width: 55px; height: 50px; text-align: center; font-weight: bold; font-size: 17px; cursor: crosshair; }
    th { background: #eeeeee; font-size: 11px; color: #444; height: 30px; }
    
    /* Drawing Elements */
    .base-box { border: 3px solid var(--red-box) !important; background: rgba(255,0,0,0.08); color: var(--red-box); z-index: 10; }
    .mark-circle { border: 3px solid var(--blue-circle) !important; border-radius: 50% !important; color: var(--blue-circle); z-index: 10; }
    #lineCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }

    .status-bar { position: fixed; bottom: 0; width: 100%; background: #000; color: #00ff00; padding: 5px; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvInp" accept=".csv" onchange="handleCSV()" style="color:white">
    <select id="searchDay">
        <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
        <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
    </select>
    <button class="btn-run" onclick="executePatternMatch()">RUN CHECK LINE</button>
    <button class="btn-reset" onclick="resetAll()">CLEAR ALL</button>
    <button onclick="addRow()">+ ADD ROW</button>
    <span style="font-size:12px; align-self:center;">Tip: Click cell to mark Base (Red) or Pattern (Blue)</span>
</div>

<div class="chart-area" id="wrapper">
    <canvas id="lineCanvas"></canvas>
    <table id="chartTable">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="chartBody"></tbody>
    </table>
</div>

<div class="status-bar" id="status">System Ready... Waiting for Master Pattern.</div>

<script>
let chartData = JSON.parse(localStorage.getItem('dp_king_data')) || [
    ["12","37","45","67","89","00"],["56","23","11","90","44","33"],
    ["32","82","77","12","05","99"],["10","20","30","40","50","60"],
    ["47","37","14","25","36","47"],["21","73","00","11","22","33"]
];

const families = {
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"], "45":["04","09","40","45","54","59","90","95"]
};

function getFamily(jodi) {
    for(let k in families) if(families[k].includes(jodi)) return families[k];
    return [jodi, jodi.split('').reverse().join('')];
}

function init() {
    const body = document.getElementById('chartBody');
    body.innerHTML = chartData.map((row, r) => `<tr>${row.map((c, i) => 
        `<td contenteditable="true" onclick="applyMarker(this)" onblur="chartData[${r}][${i}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    syncCanvas();
}

// Marker Logic: Base (Red) -> Pattern (Blue) -> None
function applyMarker(td) {
    if (td.classList.contains('base-box')) {
        td.classList.remove('base-box');
        td.classList.add('mark-circle');
    } else if (td.classList.contains('mark-circle')) {
        td.classList.remove('mark-circle');
    } else {
        td.classList.add('base-box');
    }
}

function syncCanvas() {
    const c = document.getElementById('lineCanvas');
    const wrap = document.getElementById('wrapper');
    c.width = wrap.scrollWidth;
    c.height = wrap.scrollHeight;
}

function executePatternMatch() {
    const dayIdx = parseInt(document.getElementById('searchDay').value);
    const table = document.getElementById('chartTable');
    const ctx = document.getElementById('lineCanvas').getContext('2d');
    
    // 1. Scan for the Master Pattern (The Red Box you clicked)
    let masterInfo = null;
    for(let r = chartData.length-1; r >= 0; r--) {
        if(table.rows[r+1].cells[dayIdx].classList.contains('base-box')) {
            masterInfo = { val: chartData[r][dayIdx], row: r, day: dayIdx };
            // Find relative circles to this base
            masterInfo.offsets = [];
            document.querySelectorAll('.mark-circle').forEach(circle => {
                let cRow = circle.parentElement.rowIndex - 1;
                let cCol = circle.cellIndex;
                masterInfo.offsets.push({ dr: cRow - r, dc: cCol - dayIdx });
            });
            break;
        }
    }

    if(!masterInfo) { document.getElementById('status').innerText = "Error: Please mark a Base Jodi (Red Box) first."; return; }

    const family = getFamily(masterInfo.val);
    ctx.clearRect(0, 0, 10000, 10000);
    ctx.strokeStyle = "rgba(0, 0, 255, 0.6)"; ctx.lineWidth = 2.5;

    // 2. Clone Pattern to History
    chartData.forEach((row, rIdx) => {
        if(family.includes(row[dayIdx])) {
            const baseCell = table.rows[rIdx+1].cells[dayIdx];
            baseCell.classList.add('base-box');

            masterInfo.offsets.forEach(off => {
                let targetRow = rIdx + off.dr;
                let targetCol = dayIdx + off.dc;
                if(table.rows[targetRow+1] && table.rows[targetRow+1].cells[targetCol]) {
                    const resCell = table.rows[targetRow+1].cells[targetCol];
                    resCell.classList.add('mark-circle');

                    // Drawing the connecting line (Diagonal support)
                    ctx.beginPath();
                    ctx.moveTo(baseCell.offsetLeft + 28, baseCell.offsetTop + 25);
                    ctx.lineTo(resCell.offsetLeft + 28, resCell.offsetTop + 25);
                    ctx.stroke();
                }
            });
        }
    });
    document.getElementById('status').innerText = "Pattern successfully cloned to all family matches!";
}

function handleCSV() {
    const file = document.getElementById('csvInp').files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        chartData = e.target.result.split("\n").map(r => r.split(",").map(c => c.trim())).filter(r => r.length > 1);
        init();
    };
    reader.readAsText(file);
}

function resetAll() {
    document.querySelectorAll('td').forEach(t => t.className = "");
    document.getElementById('lineCanvas').getContext('2d').clearRect(0,0,10000,10000);
}

function addRow() { chartData.push(["**","**","**","**","**","**"]); init(); }
window.onload = init;
</script>
</body>
</html>
