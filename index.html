<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milan PRO AI – Stable</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
 --gold:#ffd700;
 --bg:#0f172a;
 --panel:#1e293b;
}
*{box-sizing:border-box;font-family:Poppins}
body{margin:0;background:var(--bg);color:#fff}

/* HOME */
#home-screen{
 height:100vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center
}
.hero-title{font-size:3rem;color:var(--gold)}
.enter-btn{
 padding:15px 40px;
 border:none;
 border-radius:40px;
 background:var(--gold);
 font-weight:800;
 cursor:pointer
}

/* APP */
#main-app{display:none;padding:10px}
.toolbar{
 background:var(--panel);
 padding:10px;
 border-radius:10px;
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 justify-content:center
}
button{padding:6px 10px;border-radius:6px;border:none;font-weight:bold}

/* TABLE */
.table-container{background:#fff;padding:5px;border-radius:10px;overflow:auto}
table{border-collapse:collapse;color:#000}
td,th{
 border:1px solid #ccc;
 width:45px;height:45px;
 text-align:center;
 font-weight:bold
}
th{background:#1e293b;color:#fff;font-size:11px}
.blank{background:#eee;color:#999}

/* DASHBOARD */
.card{
 margin-top:15px;
 background:var(--panel);
 padding:12px;
 border-radius:10px;
 border-top:3px solid var(--gold)
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home-screen">
 <h1 class="hero-title">Milan PRO AI</h1>
 <button class="enter-btn" id="startBtn">START</button>
</div>

<!-- APP -->
<div id="main-app">

 <div class="toolbar">
  <input type="file" id="csv" accept=".csv" style="display:none">
  <button id="csvBtn">CSV</button>
  <button id="rowBtn">ROW</button>
  <button id="saveBtn" style="background:#28a745">SAVE</button>
  <button id="clearBtn" style="background:#dc3545">CLEAR</button>
 </div>

 <center>
  <div class="table-container">
   <table id="tbl"></table>
  </div>
 </center>

 <div class="card">
  <h3>🤖 AI BLANK PREDICTION</h3>
  <div id="ai">Blank (** ) cell par tap karo</div>
 </div>

</div>

<script>
/* ================= SAFE INIT ================= */
document.addEventListener("DOMContentLoaded",()=>{

/* ---------- CONFIG ---------- */
const STORAGE_KEY="milan_ai_safe";

/* ---------- FAMILY ---------- */
const families={
"12":["12","17","21","26","62","67","71","76"],
"13":["13","18","31","36","63","68","81","86"],
"14":["14","19","41","46","64","69","91","96"],
"15":["01","06","10","15","51","56","60","65"],
"23":["23","28","32","37","73","78","82","87"],
"24":["24","29","42","47","74","79","92","97"],
"25":["02","07","20","25","52","57","70","75"],
"34":["34","39","43","48","84","89","93","98"],
"35":["03","08","30","35","53","58","80","85"],
"45":["04","09","40","45","54","59","90","95"],
"HR":["05","16","27","38","49","50","61","72","83","94"],
"FR":["00","11","22","33","44","55","66","77","88","99"]
};

/* ---------- DATA ---------- */
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
 ["51","91","41","57","19","95"],
 ["05","90","74","06","19","63"],
 ["90","34","82","09","28","19"],
 ["**","**","**","**","**","**"]
];

/* ---------- HELPERS ---------- */
const norm=v=>v==="**"?"**":String(v||"").padStart(2,"0");
const palti=v=>v[1]+v[0];
const fam=v=>{for(let k in families)if(families[k].includes(v))return k;return""};

/* ---------- START ---------- */
document.getElementById("startBtn").onclick=()=>{
 document.getElementById("home-screen").style.display="none";
 document.getElementById("main-app").style.display="block";
 draw();
};

/* ---------- DRAW ---------- */
function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls=c==="**"?"blank":"";
   h+=`<td class="${cls}" data-r="${i}" data-c="${j}" contenteditable>${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
}

/* ---------- TABLE CLICK (EVENT DELEGATION) ---------- */
document.getElementById("tbl").addEventListener("click",e=>{
 let td=e.target.closest("td");
 if(!td) return;
 let r=+td.dataset.r, c=+td.dataset.c;
 if(data[r][c]!=="**") return;

 let score={};
 for(let i=0;i<data.length;i++){
  let v=data[i][c];
  if(v!=="**"){
   score[v]=(score[v]||0)+3;
   let f=fam(v);
   families[f]?.forEach(j=>score[j]=(score[j]||0)+1);
   score[palti(v)]=(score[palti(v)]||0)+1;
  }
 }

 let top=Object.entries(score)
  .sort((a,b)=>b[1]-a[1])
  .map(v=>v[0])
  .slice(0,4);

 document.getElementById("ai").innerHTML=
  `<b>${["MON","TUE","WED","THU","FRI","SAT"][c]}</b><br>
   🔥 Top 4 Jodi:<br>
   <span style="color:#ffd700;font-size:18px">${top.join(" , ")}</span>`;
});

/* ---------- EDIT SAVE ---------- */
document.getElementById("tbl").addEventListener("input",e=>{
 let td=e.target.closest("td");
 if(!td) return;
 let r=+td.dataset.r, c=+td.dataset.c;
 data[r][c]=norm(td.innerText);
});

/* ---------- CSV ---------- */
document.getElementById("csvBtn").onclick=()=>csv.click();
document.getElementById("csv").onchange=e=>{
 let f=new FileReader();
 f.onload=()=>{
  data=f.result.split("\n")
   .filter(l=>l.trim())
   .map(l=>l.split(",").map(v=>norm(v.trim())));
  draw();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
 };
 f.readAsText(e.target.files[0]);
};

/* ---------- BUTTONS ---------- */
rowBtn.onclick=()=>{data.push(["**","**","**","**","**","**"]);draw()};
saveBtn.onclick=()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));alert("Saved")};
clearBtn.onclick=()=>{localStorage.removeItem(STORAGE_KEY);location.reload()};

});
</script>

</body>
</html>
