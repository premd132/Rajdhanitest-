<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kalyan Exact Pattern – CSV Save</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial}
table{border-collapse:collapse;margin:auto}
td,th{
 border:1px solid #555;width:45px;height:45px;
 text-align:center;font-weight:bold;cursor:pointer;
 background:#fff;color:#000
}
th{background:#1e293b;color:#fff;font-size:11px}
.f1{border:3px solid #0084ff;border-radius:50%}
.f2{border:3px solid #ff4757;border-radius:50%}

.box{
 background:#1e293b;margin:10px;padding:10px;border-radius:10px
}
.btn{
 background:#00ff88;color:#000;padding:10px 14px;
 margin:5px;border-radius:8px;
 cursor:pointer;font-weight:bold;display:inline-block
}
</style>
</head>

<body>

<div class="box" style="text-align:center">
<span class="btn" onclick="addRow()">➕ ADD ROW</span>
<span class="btn" onclick="saveData()">💾 SAVE</span>
<span class="btn" onclick="csvInput.click()">📂 CSV LOAD</span>
<input type="file" id="csvInput" hidden>
</div>

<div class="box">
<table id="tbl"></table>
</div>

<div class="box">
<h3>✔ Check Lines (Exact Same Pattern)</h3>
<div id="checks">Bottom ** cell click karo</div>
</div>

<script>
/* ================= FAMILY ================= */

const FAMILY={
"00":["00","05","50","55"],"11":["11","16","61","66"],
"22":["22","27","72","77"],"33":["33","38","83","88"],
"44":["44","49","94","99"],
"12":["12","17","21","26","62","67","71","76"],
"13":["13","18","31","36","63","68","81","86"],
"14":["14","19","41","46","64","69","91","96"],
"15":["01","06","10","15","51","56","60","65"],
"23":["23","28","32","37","73","78","82","87"],
"24":["24","29","42","47","74","79","92","97"],
"25":["02","07","20","25","52","57","70","75"],
"34":["34","39","43","48","84","89","93","98"],
"35":["03","08","30","35","53","58","80","85"],
"45":["04","09","40","45","54","59","90","95"]
};

const getFamily=v=>{
 for(let k in FAMILY) if(FAMILY[k].includes(v)) return k;
 return null;
};

const norm=v=>v=="**"?"**":v.padStart(2,"0");

/* ================= DATA ================= */

let data = JSON.parse(localStorage.getItem("kalyan_exact_data")) || [
 ["12","34","56","78","90","11"],
 ["17","39","51","83","94","66"],
 ["21","43","65","38","49","16"],
 ["26","48","60","88","99","61"],
 ["62","84","01","33","44","00"],
 ["**","**","**","**","**","**"]
];

/* ================= DRAW ================= */

function draw(){
 let h="<tr><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   h+=`<td onclick="cellClick(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
}
draw();

/* ================= ADD ROW ================= */

function addRow(){
 data.push(["**","**","**","**","**","**"]);
 draw();
}

/* ================= SAVE ================= */

function saveData(){
 localStorage.setItem("kalyan_exact_data",JSON.stringify(data));
 alert("✅ Data Saved Successfully");
}

/* ================= CSV LOAD ================= */

csvInput.onchange=e=>{
 let fr=new FileReader();
 fr.onload=()=>{
  data = fr.result
   .split("\n")
   .filter(r=>r.trim())
   .map(r=>r.split(",").map(v=>norm(v.trim())));
  draw();
 };
 fr.readAsText(e.target.files[0]);
};

/* ================= CORE STEP 1: BUILD BLUEPRINT ================= */

function buildBlueprint(row,col){
 let bp=[];
 for(let i=row-1;i>=0 && bp.length<6;i--){
  let v=data[i][col];
  if(v!=="**"){
   bp.push({offset:bp.length,fam:getFamily(v)});
  }
 }
 return bp;
}

/* ================= CORE STEP 2: FIND EXACT MATCH ================= */

function findExactMatches(bp,col){
 let matches=[];
 for(let start=0;start<=data.length-6;start++){
  let hit=0;
  bp.forEach(p=>{
   let r=start+(5-p.offset);
   let fam=getFamily(data[r][col]);
   if(fam===p.fam) hit++;
  });
  if(hit===bp.length) matches.push(start);
 }
 return matches;
}

/* ================= CELL CLICK ================= */

function cellClick(r,c){
 if(data[r][c]!=="**"){
  let v=prompt("Enter Jodi",data[r][c]);
  if(v!=null){data[r][c]=norm(v);draw();}
  return;
 }

 let bp=buildBlueprint(r,c);
 if(bp.length<4){
  alert("⚠ Minimum 4 pattern required");
  return;
 }

 let res=findExactMatches(bp,c);
 showChecks(res,c);
}

/* ================= SHOW CHECK LINES ================= */

function showChecks(list,col){
 let box=document.getElementById("checks");
 box.innerHTML="";
 if(!list.length){
  box.innerHTML="❌ Same pattern history me nahi mila";
  return;
 }
 list.forEach((s,i)=>{
  let b=document.createElement("div");
  b.className="btn";
  b.innerHTML=`Check Line ${i+1} → Row ${s+1}`;
  b.onclick=()=>highlight(s,col);
  box.appendChild(b);
 });
}

/* ================= HIGHLIGHT ================= */

function highlight(start,col){
 document.querySelectorAll("td").forEach(td=>td.className="");
 for(let i=0;i<6;i++){
  let td=tbl.rows[start+i+1].cells[col];
  td.className=i%2?"f1":"f2";
 }
}
</script>
</body>
</html>
