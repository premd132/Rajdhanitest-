<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Bottom Pattern Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; 
            --blue-circle: #0084ff; 
            --green-line: #00ff88; 
            --bg: #0f172a; 
            --panel: #1e293b; 
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        #home-screen {
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .hero-title { font-size: 3rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .hero-sub { opacity: 0.7; letter-spacing: 2px; margin-bottom: 30px; }
        .enter-btn {
            background: var(--gold); color: #000; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 800; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .enter-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255,215,0,0.2); }

        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; }
        th { background: #1e293b; color: white; font-size: 11px; }
        
        .circle { 
            border: 3px solid var(--blue-circle) !important; 
            border-radius: 50% !important; 
            background: rgba(0, 132, 255, 0.15); 
            z-index: 10;
        }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .card h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 14px; text-transform: uppercase; }

        .auto-detected-btn {
            background: #1e293b; color: #fff; margin: 6px 0; padding: 12px; 
            cursor: pointer; border-radius: 8px; font-size: 13px; 
            border-left: 4px solid var(--green-line); border: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .auto-detected-btn:hover { background: #2d3748; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 90%; max-width: 400px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">Kalyan PRO AI</h1>
    <p class="hero-sub">LIVE BOTTOM PATTERN MATCH ENGINE</p>
    <button class="enter-btn" onclick="startApp()">START LIVE SCAN</button>
</div>

<div id="main-app">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
        <h2 style="color:var(--gold); margin:0;">Kalyan Bottom Scan AI</h2>
        <button onclick="location.reload()" style="background:none; color:white; border:1px solid #444; padding:5px 10px;">Logout</button>
    </div>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE DATA</button>
        <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3>🤖 Bottom Live Patterns Found</h3>
            <div id="auto-patterns" style="max-height: 250px; overflow-y: auto;">Analyzing bottom lines...</div>
        </div>
        <div class="card">
            <h3>✔ Old Records Matches</h3>
            <div id="checks">Select a live pattern to trace old records...</div>
        </div>
        <div class="card">
            <h3>🔮 Future Prediction</h3>
            <div id="future">Select a match line...</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white; padding:5px 10px;">CLOSE</button>
    <h3 style="margin: 0 0 15px 0;">Sequence View</h3>
    <center>
        <div class="table-container" style="border: 1px solid #ddd;">
            <canvas id="popCanvas"></canvas>
            <div id="popData"></div>
        </div>
    </center>
</div>

<script>
const STORAGE_KEY="pdata_Kalyan_v2";
let targetCol=null;
let activeMark=null;

function norm(v) {
    if (!v || v.trim() === "" || v === "**") return "**";
    let n = v.replace(/[^0-9]/g, "");
    if (n === "") return "**";
    if (n.length === 1) n = "0" + n;
    return n.substring(0, 2);
}

const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};
    
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)) || [["10","20","30","40","50","60"],["**","**","**","**","**","**"]];

function startApp() {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    draw();
    scanBottomLivePattern();
}

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA"; }
function palti(v){return v[1]+v[0];}
function smartMatch(a1,b1){ if(a1=="**"||b1=="**") return false; return a1===b1 || palti(a1)===b1 || fam(a1)===fam(b1); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = (activeMark && isPartOfPattern(ri, ci)) ? "circle" : "";
   if(c=="**") cls += " blank";
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activeMark) setTimeout(() => drawLines("mainCanvas", document.getElementById("tbl")), 50);
}

function isPartOfPattern(ri, ci){
    if(!activeMark) return false;
    let i = ri - activeMark.start;
    return (i >= 0 && i < activeMark.shape.length && activeMark.shape[i][ci]);
}

function drawLines(cvsId, tblEl) {
    const cvs = document.getElementById(cvsId);
    if (!cvs) return;
    const ctx = cvs.getContext("2d");
    cvs.width = tblEl.offsetWidth; cvs.height = tblEl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const cells = tblEl.querySelectorAll(".circle");
    if(cells.length < 2) return;
    
    const tRect = tblEl.getBoundingClientRect();
    ctx.strokeStyle = "#00ff88"; 
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    
    ctx.beginPath();
    cells.forEach((c, idx) => {
        const r = c.getBoundingClientRect();
        const x = r.left - tRect.left + r.width/2;
        const y = r.top - tRect.top + r.height/2;
        if(idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();
}

function edit(r,c,el){ 
    data[r][c] = norm(el.innerText.trim());
    scanBottomLivePattern();
}

function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); scanBottomLivePattern(); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Data Saved Successfully!"); }
function clearData(){ if(confirm("Permanently clear all data?")){ localStorage.clear(); location.reload(); }}

function scanBottomLivePattern() {
    let container = document.getElementById("auto-patterns");
    if (!container) return;
    container.innerHTML = "";
    let detectedList = [];

    let lastRowIdx = data.length - 1;

    for (let c = 0; c < 6; c++) {
        let base = "**";
        let targetRow = lastRowIdx;
        for (let i = lastRowIdx; i >= 0; i--) {
            if (data[i][c] !== "**") {
                base = data[i][c];
                targetRow = i;
                break;
            }
        }
        if (base === "**") continue;

        let shape = Array(9).fill(0).map(() => Array(6).fill(0));
        let matchCount = 0;
        let startRow = Math.max(0, targetRow - 8);

        for (let i = targetRow; i >= startRow; i--) {
            for (let j = 0; j < 6; j++) {
                if (data[i][j] !== "**" && smartMatch(data[i][j], base)) {
                    if (matchCount < 3) {
                        shape[i - startRow][j] = 1;
                        matchCount++;
                    }
                }
            }
            if (matchCount >= 3) break;
        }

        let matches = [];
        let historicalEnd = Math.max(0, targetRow - shape.length); 
        for (let i = 0; i <= historicalEnd; i++) {
            let ok = true;
            for (let k = 0; k < shape.length; k++) {
                for (let j = 0; j < 6; j++) {
                    if (shape[k][j] && !smartMatch(data[i + k][j], base)) { ok = false; break; }
                }
                if (!ok) break;
            }
            if (ok) matches.push({ index: i });
        }

        if (matches.length > 0) {
            let famKey = fam(base);
            detectedList.push({ famKey: famKey, count: matches.length, shape: shape, base: base, matches: matches, col: c, liveStart: startRow });
        }
    }

    if (detectedList.length === 0) {
        container.innerHTML = "<div style='color:#94a3b8; font-size:12px;'>Bottom blank cell ke liye koi purana record match nahi mila. Naya data add karein.</div>";
        return;
    }

    detectedList.forEach(item => {
        let btn = document.createElement("div");
        btn.className = "auto-detected-btn";
        btn.innerHTML = `<div><strong>Bottom Pattern (Col: ${item.col + 1})</strong> <br><small>Family: ${item.famKey}</small></div> <span style='background:#0084ff; padding:4px 8px; border-radius:4px; font-size:11px;'>History: ${item.count}x Found</span>`;
        btn.onclick = () => {
            targetCol = item.col;
            activeMark = { start: item.liveStart, shape: item.shape };
            draw();
            showChecks(item.shape, item.matches);
        };
        container.appendChild(btn);
    });
}

function showChecks(shape, matches){
 let checksDiv = document.getElementById("checks");
 if(!checksDiv) return;
 checksDiv.innerHTML="";
 matches.forEach((m,i)=>{
  let d = document.createElement("div");
  d.style = "background:#2a2a2a; margin:5px 0; padding:10px; cursor:pointer; border-radius:6px; font-size:12px; border-left:4px solid #ffd700; display:flex; justify-content:space-between;";
  d.innerHTML = `<span>Old Match Line ${i + 1} (Row ${m.index + 1})</span> ➔`;
  d.onclick = () => { 
      activeMark={start:m.index, shape:shape}; 
      draw(); 
      showOne(shape, m.index); 
  };
  checksDiv.appendChild(d);
 });
 updateAI(shape, matches);
}

function showOne(shape, idx){
 let html="<table id='popTbl' style='color:#000'>";
 for(let i=0; i<shape.length; i++){
  html+="<tr>";
  data[idx+i].forEach((v,j)=>{
   html
