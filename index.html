<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Pradeep Edition</title>
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box; font-family: sans-serif;}
body{margin:0; background:var(--bg); color:#fff; display:flex; flex-direction:column; align-items:center; padding:10px;}

.toolbar{display:flex; gap:10px; margin-bottom:15px;}
button{background:#1e293b; color:white; border:1px solid var(--gold); padding:8px 12px; border-radius:5px; cursor:pointer; font-weight:bold;}

/* Table Styles */
.table-box{position:relative; background:white; padding:5px; border-radius:5px; display:inline-block;}
table{border-collapse:collapse; color:black; position:relative; z-index:5;}
td, th{border:1px solid #ccc; width:45px; height:45px; text-align:center; font-weight:bold; font-size:18px; cursor:pointer;}
th{background:#1e293b; color:white; font-size:11px;}

/* Patterns */
.circle-red { border: 3px solid var(--red) !important; border-radius: 50%; background:rgba(255,71,87,0.1); }
.circle-blue { border: 3px solid var(--blue) !important; border-radius: 50%; background:rgba(46,134,222,0.1); }
.marked-yellow { background: #facc15 !important; border: 2px solid #854d0e !important; }
canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }

/* Popup (Dual View) */
#overlay{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center; }
.popup-box{ background:#fff; padding:15px; border-radius:10px; width:95%; max-width:400px; position:relative; }
.close-btn{ background:#ff4757; color:white; border:none; padding:5px 10px; border-radius:5px; float:right; cursor:pointer; }

/* Check Line List */
.card{ background:var(--panel); padding:10px; border-radius:8px; border-top:3px solid var(--gold); width:100%; max-width:400px; margin-top:15px; }
.check-item{ background:#2d3748; padding:10px; margin:5px 0; border-radius:5px; border-left:4px solid var(--gold); cursor:pointer; font-size:13px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvInp" style="display:none" accept=".csv">
    <button onclick="document.getElementById('csvInp').click()">📂 UPLOAD CSV</button>
    <button onclick="addRow()">➕ ADD ROW</button>
    <button onclick="exportCSV()">💾 SAVE CSV</button>
</div>

<div class="table-box">
    <canvas id="mainCanvas"></canvas>
    <table id="tblMain"></table>
</div>

<div class="card">
    <b>✔ CHECK LINES (DUAL VIEW)</b>
    <div id="checkList">Click on any result to scan history...</div>
</div>

<div id="overlay">
    <div class="popup-box">
        <button class="close-btn" onclick="closePopup()">CLOSE</button>
        <h3 style="color:#000; margin:0 0 10px 0;">Dual-Pattern View</h3>
        <div style="position:relative; overflow:auto;">
            <canvas id="popupCanvas"></canvas>
            <table id="tblPopup"></table>
        </div>
    </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('pData')) || Array(15).fill().map(()=>Array(5).fill("**"));
let currentPattern = null;

function render(tid, tdata, p = null){
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    tdata.forEach((row, r)=>{
        h += "<tr>";
        row.forEach((cell, c)=>{
            let cls = "";
            if(p){
                if(p.yR===r && p.yC===c) cls="marked-yellow";
                if(p.reds.some(pt=>pt.r===r && pt.c===c)) cls="circle-red";
                if(p.blues.some(pt=>pt.r===r && pt.c===c)) cls="circle-blue";
            }
            h += `<td class="${cls}" contenteditable onblur="upd(${r},${c},this.innerText)" onclick="cellClick(${r},${c})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById(tid).innerHTML = h;
}

function upd(r,c,v){ data[r][c]=v.trim(); localStorage.setItem('pData', JSON.stringify(data)); }

function cellClick(r,c){
    if(data[r][c] === "**") return;
    let list = document.getElementById('checkList');
    list.innerHTML = "";
    
    // Scan history for same result
    for(let i=0; i<data.length; i++){
        if(i !== r && data[i][c] !== "**"){
            let div = document.createElement('div');
            div.className = "check-item";
            div.innerText = `Pattern Match Found: Row ${i+1} (Click to View)`;
            div.onclick = () => openPopup(i, c);
            list.appendChild(div);
        }
    }
}

function openPopup(mR, mC){
    document.getElementById('overlay').style.display = 'flex';
    // Tircha Pattern Logic
    let p = {
        yR: mR, yC: mC,
        reds: [{r: mR-1, c: mC-1}, {r: mR-2, c: mC-2}],
        blues: [{r: mR-1, c: mC+1}, {r: mR-2, c: mC+2}]
    };
    render("tblPopup", data, p);
    setTimeout(() => drawLines("popupCanvas", "tblPopup", p), 100);
}

function drawLines(canId, tblId, p){
    const canvas = document.getElementById(canId), table = document.getElementById(tblId), ctx = canvas.getContext('2d');
    canvas.width = table.offsetWidth; canvas.height = table.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const rect = table.getBoundingClientRect();
    const tRect = table.rows[p.yR+1].cells[p.yC].getBoundingClientRect();
    const tx = tRect.left-rect.left+tRect.width/2, ty = tRect.top-rect.top+tRect.height/2;

    const draw = (pts, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 3;
        pts.forEach(pt => {
            if(pt.r<0 || pt.c<0 || pt.c>4) return;
            const cRect = table.rows[pt.r+1].cells[pt.c].getBoundingClientRect();
            ctx.beginPath(); ctx.moveTo(cRect.left-rect.left+cRect.width/2, cRect.top-rect.top+cRect.height/2);
            ctx.lineTo(tx, ty); ctx.stroke();
        });
    }
    draw(p.reds, "#ff4757"); draw(p.blues, "#2e86de");
}

function exportCSV(){
    let csv = data.map(r => r.join(",")).join("\n");
    let a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download="data.csv"; a.click();
}

document.getElementById('csvInp').onchange = e => {
    let r = new FileReader();
    r.onload = () => { data=r.result.split("\n").map(l=>l.split(",").map(v=>v.trim())); render("tblMain",data); };
    r.readAsText(e.target.files[0]);
};

function addRow(){ data.push(["**","**","**","**","**"]); render("tblMain", data); }
function closePopup(){ document.getElementById('overlay').style.display='none'; }
render("tblMain", data);
</script>
</body>
</html>
