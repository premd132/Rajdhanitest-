<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan AI - Tircha & Shape Pattern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; --yellow: #ffff00; --red: #ff4757; --purple: #a4b0be; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; padding: 10px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 8px; justify-content: center; }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 10px; }
        
        /* Markers */
        .base { background-color: var(--yellow) !important; color: #000; }
        .slant-1 { background-color: var(--red) !important; color: #fff; }
        .slant-2 { background-color: var(--purple) !important; color: #fff; }
        .target { border: 4px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); }
        .old-match { border: 4px solid var(--green) !important; border-radius: 50% !important; }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); margin-top: 15px; text-align: center; }
        #future { font-size: 26px; color: var(--green); font-weight: 800; letter-spacing: 5px; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 10px 15px; color: white; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
        <button onclick="document.getElementById('csv').click()" style="background:#0084ff;">📂 UPLOAD CSV</button>
        <button onclick="addRow()" style="background:#444;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); font-size:12px;">📈 तिरछा पैटर्न (TIRCHA) + CHECK LINE</h3>
        <div id="future">-- -- --</div>
        <div id="matchLog" style="font-size:11px; color:var(--green); margin-top:5px;">Check Line match from records</div>
    </div>

<script>
const KEY="pradeep_tircha_v1";
const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(KEY)) || [["10","20","30","40","50","60"],["15","25","35","45","55","65"],["**","**","**","**","**","**"]];
let activeSet = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){ v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = "";
   if(activeSet){
       if(ri==activeSet.cur.r && ci==activeSet.cur.c) cls="target";
       else if(ri==activeSet.base.r && ci==activeSet.base.c) cls="base";
       else if(ri==activeSet.s1.r && ci==activeSet.s1.c) cls="slant-1";
       else if(ri==activeSet.s2.r && ci==activeSet.s2.c) cls="slant-2";
       else if(ri==activeSet.oldMatch.r && ci==activeSet.oldMatch.c) cls="old-match";
   }
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="processTircha(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activeSet) setTimeout(drawCheckLine, 50);
}

function processTircha(r, c) {
    if(data[r][c] !== "**") return;
    
    // Tircha Pattern (diagonal points)
    let base = {r: r-1, c: c};
    let s1 = {r: r-2, c: (c>0 ? c-1 : c+1)}; // तिरछा 1
    let s2 = {r: r-1, c: (c>0 ? c-1 : c+1)}; // तिरछा 2
    
    if(base.r < 0 || s1.r < 0) return;
    let bVal = data[base.r][base.c];
    if(bVal == "**") return;

    let bFam = fam(bVal);
    let found = -1;

    // Scan records for same base family in Tircha position
    for(let i = r-2; i >= Math.max(0, r-12); i--) {
        if(fam(data[i][base.c]) === bFam) {
            if(data[i+1] && data[i+1][c] !== "**") {
                found = i; break;
            }
        }
    }

    if(found !== -1) {
        activeSet = { cur: {r, c}, base, s1, s2, oldMatch: {r: found+1, c: c} };
        draw();
        let val = data[found+1][c];
        document.getElementById("future").innerText = `${norm((parseInt(val)+5)%100)} - ${val.split('').reverse().join('')} - ${val}`;
        document.getElementById("matchLog").innerText = `CHECK LINE: Match found in Row ${found+2}`;
    } else {
        alert("तिरछा पैटर्न पुराने रिकॉर्ड में नहीं मिला।");
    }
}

function drawCheckLine() {
    const cvs = document.getElementById("mainCanvas"), tbl = document.getElementById("tbl"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    const elements = [".old-match", ".slant-1", ".slant-2", ".base", ".target"];
    const rect = tbl.getBoundingClientRect();
    let pts = [];

    elements.forEach(sel => {
        let el = tbl.querySelector(sel);
        if(el) {
            let r = el.getBoundingClientRect();
            pts.push({x: r.left - rect.left + r.width/2, y: r.top - rect.top + r.height/2});
        }
    });

    if(pts.length < 2) return;

    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 4;
    ctx.setLineDash([5, 5]); // Check Line Dash Style
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    
    // Draw numbers on points
    ctx.setLineDash([]); ctx.fillStyle = "white";
    pts.forEach((p, i) => {
        ctx.fillText(i+1, p.x+5, p.y-5);
    });
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(KEY,JSON.stringify(data)); alert("Saved!"); }
function clearData(){ if(confirm("Clear?")){ localStorage.clear(); location.reload(); }}
function importCSV(e){
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v)));
        localStorage.setItem(KEY, JSON.stringify(data));
        draw();
    };
    fr.readAsText(e.target.files[0]);
}
draw();
</script>
</body>
</html>
