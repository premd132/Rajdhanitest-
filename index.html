<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>PRADEEP PREMIUM AI v11</title>
<style>
    :root { --bg: #0f172a; --card: #1e293b; --gold: #fbbf24; --red: #f43f5e; --blue: #38bdf8; --text: #f1f5f9; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; overflow-x: hidden; }
    
    .nav { background: var(--card); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .nav h1 { font-size: 1.5rem; margin: 0; letter-spacing: 1px; }
    
    .container { display: grid; grid-template-columns: 1fr 360px; gap: 25px; padding: 25px; max-width: 1600px; margin: auto; }
    
    .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .btn-up { background: var(--blue); color: #000; }
    .btn-add { background: var(--gold); color: #000; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }

    /* Chart Styling */
    .chart-card { background: #ffffff; padding: 25px; border-radius: 16px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    table { border-collapse: collapse; width: 100%; color: #1e293b; position: relative; z-index: 10; }
    th { background: #334155; color: #fff; padding: 14px; border: 1px solid #475569; font-size: 14px; }
    td { border: 1px solid #e2e8f0; width: 60px; height: 60px; text-align: center; font-weight: 800; font-size: 1.2rem; cursor: pointer; position: relative; padding: 0; }
    
    /* Markers */
    .circle-red, .circle-blue { border-radius: 50%; width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 11; }
    .circle-red { border: 4px solid var(--red); color: var(--red); background: rgba(244, 63, 94, 0.1); }
    .circle-blue { border: 4px solid var(--blue); color: var(--blue); background: rgba(56, 189, 248, 0.1); }
    
    svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

    /* Panels */
    .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .panel h3 { margin: 0 0 15px 0; color: var(--gold); border-bottom: 1px solid #334155; padding-bottom: 8px; font-size: 16px; }
    .check-card { background: #0f172a; border-left: 4px solid var(--gold); padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 4px; transition: 0.2s; }
    .check-card:hover { background: #1e293b; border-left-width: 8px; }
    
    .ai-badge { background: var(--gold); color: #000; padding: 6px 14px; border-radius: 6px; font-weight: 900; margin: 5px; display: inline-block; font-size: 15px; }

    #pop { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000; }
</style>
</head>
<body>

<div class="nav">
    <h1>PRADEEP <span style="color:var(--gold)">PREMIUM AI</span> <small style="font-size:12px; opacity:0.6">v11.0</small></h1>
    <div style="display:flex; gap:12px;">
        <input type="file" id="fileIn" style="display:none" onchange="importCSV(this)">
        <button class="btn btn-up" onclick="fileIn.click()">📁 IMPORT CSV</button>
        <button class="btn btn-add" onclick="addRow()">+ ADD ROW</button>
    </div>
</div>

<div class="container">
    <div class="chart-card">
        <svg id="mainSvg"></svg>
        <table id="mainTbl"></table>
    </div>

    <div>
        <div class="panel">
            <h3>🤖 FUTURE AI (3 PAIRS)</h3>
            <div id="aiDisp" style="text-align:center;">Analyze blank cell...</div>
        </div>

        <div class="panel">
            <h3>🎯 CHECK LINES (MAX 4)</h3>
            <div id="checkDisp">Matching records will appear here.</div>
        </div>
    </div>
</div>

<div id="pop" onclick="this.style.display='none'">
    <div style="background:white; padding:30px; border-radius:20px; color:#1e293b; max-width:500px; width:90%;" onclick="event.stopPropagation()">
        <h2 style="margin-top:0; color:#0f172a">History Connection Match</h2>
        <div style="position:relative; background:#f8fafc; border-radius:10px; padding:10px;">
            <svg id="popSvg"></svg>
            <table id="popTbl" style="width:100%"></table>
        </div>
    </div>
</div>

<script>
const FAMILY = {
    "01":["01","06","10","15","51","56","60","65"], "02":["02","07","20","25","52","57","70","75"],
    "03":["03","08","30","35","53","58","80","85"], "04":["04","09","40","45","54","59","90","95"],
    "05":["00","05","50","55"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"]
};

let tableData = JSON.parse(localStorage.getItem("p_premium_v11")) || Array(18).fill().map(()=>Array(5).fill("**"));
let currentPat = null;

const getFam = v => { for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; };
const fixVal = v => { v=v.trim(); return (v==="**" || v==="") ? "**" : (v.length===1 ? "0"+v : v); };

function render() {
    const tbl = document.getElementById("mainTbl");
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    tableData.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let inner = cell;
            if(currentPat) {
                if(currentPat.p1.some(p=>p.r===ri && p.c===ci)) inner = `<div class="circle-red">${cell}</div>`;
                if(currentPat.p2.some(p=>p.r===ri && p.c===ci)) inner = `<div class="circle-blue">${cell}</div>`;
            }
            h += `<td onclick="analyze(${ri},${ci})" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">${inner}</td>`;
        });
        h += "</tr>";
    });
    tbl.innerHTML = h;
    setTimeout(() => drawSVG("mainSvg", "mainTbl", currentPat), 10);
}

function updateCell(r, c, v) { 
    tableData[r][c] = fixVal(v); 
    localStorage.setItem("p_premium_v11", JSON.stringify(tableData)); 
    render(); 
}

function addRow() { tableData.push(["**","**","**","**","**"]); render(); }

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = () => {
        tableData = reader.result.trim().split("\n").map(r => r.split(",").map(c => fixVal(c)));
        render();
    };
    reader.readAsText(input.files[0]);
}

function analyze(r, c) {
    if(tableData[r][c] !== "**") return;
    let p1 = [], p2 = [], f1 = null, f2 = null;

    // Search last 10 weeks for 2 pairs from 2 families
    for(let i=r-1; i>=0 && i>=r-10; i--) {
        for(let j=0; j<5; j++) {
            let v = tableData[i][j]; if(v==="**") continue;
            let fam = getFam(v);
            if(!f1) { f1=fam; p1.push({r:i, c:j}); }
            else if(fam===f1 && p1.length < 2) p1.push({r:i, c:j});
            else if(!f2 && fam!==f1) { f2=fam; p2.push({r:i, c:j}); }
            else if(fam===f2 && p2.length < 2) p2.push({r:i, c:j});
        }
        if(p1.length===2 && p2.length===2) break;
    }

    if(p1.length > 0) {
        currentPat = { p1, p2, f1, f2 };
        render();
        findCheck(r);
        futureAI(f1, f2);
    }
}

function findCheck(targetR) {
    const disp = document.getElementById("checkDisp");
    disp.innerHTML = "";
    let count = 0;
    // History scan for matching families
    for(let i=0; i < targetR - 4; i++) {
        let match1 = tableData[i].some(v => getFam(v) === currentPat.f1);
        let match2 = tableData[i+1]?.some(v => getFam(v) === currentPat.f2);
        
        if(match1 && match2) {
            count++;
            let div = document.createElement("div");
            div.className = "check-card";
            div.innerHTML = `<b>MATCH FOUND #${count}</b><br><small>Historical Week ${i+1}</small>`;
            div.onclick = () => showPop(i);
            disp.appendChild(div);
        }
        if(count >= 4) break;
    }
    if(count===0) disp.innerHTML = "No historical 2-family match found.";
}

function showPop(idx) {
    const pop = document.getElementById("pop");
    pop.style.display = "flex";
    const popTbl = document.getElementById("popTbl");
    let h = "", pts1 = [], pts2 = [];
    
    for(let i=0; i<3; i++) {
        let r = idx + i; if(!tableData[r]) continue;
        h += "<tr>";
        tableData[r].forEach((v, ci) => {
            let cls = "";
            if(getFam(v)===currentPat.f1) { cls="circle-red"; pts1.push({r:i, c:ci}); }
            else if(getFam(v)===currentPat.f2) { cls="circle-blue"; pts2.push({r:i, c:ci}); }
            h += `<td><div class="${cls}">${v}</div></td>`;
        });
        h += "</tr>";
    }
    popTbl.innerHTML = h;
    setTimeout(() => drawSVG("popSvg", "popTbl", {p1:pts1, p2:pts2}), 50);
}

function drawSVG(sid, tid, pat) {
    const svg = document.getElementById(sid);
    const tbl = document.getElementById(tid);
    svg.innerHTML = "";
    if(!pat) return;

    const drawLine = (pts, col) => {
        if(pts.length < 2) return;
        let d = "";
        pts.forEach((p, i) => {
            const td = tbl.rows[p.r + (tid==="mainTbl"?1:0)].cells[p.c];
            let x = td.offsetLeft + td.offsetWidth/2;
            let y = td.offsetTop + td.offsetHeight/2;
            d += (i===0 ? "M " : " L ") + x + " " + y;
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d); path.setAttribute("stroke", col);
        path.setAttribute("fill", "none"); path.setAttribute("stroke-width", "4");
        path.setAttribute("stroke-dasharray", "6");
        svg.appendChild(path);
    };
    drawLine(pat.p1, "#f43f5e");
    drawLine(pat.p2, "#38bdf8");
}

function futureAI(f1, f2) {
    const disp = document.getElementById("aiDisp");
    let pairs = [...(FAMILY[f1]||[]), ...(FAMILY[f2]||[])];
    disp.innerHTML = pairs.sort(()=>0.5-Math.random()).slice(0,3).map(n => `<span class="ai-badge">${n}</span>`).join("");
}

render();
</script>
</body>
</html>
