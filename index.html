<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Milan Pro AI – Fixed System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        #home-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #1e293b, #0f172a); }
        .enter-btn { background: var(--gold); padding: 15px 40px; border-radius: 50px; font-weight: 800; cursor: pointer; border:none; }
        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; box-shadow: 0 0 20px #000; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; }
        .circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); margin-top: 10px; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        .check-btn { background: #2d3748; color: white; padding: 10px; margin: 5px 0; border-radius: 8px; cursor: pointer; display: block; border-left: 4px solid var(--green); }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 style="color:var(--gold)">Milan PRO AI</h1>
    <button class="enter-btn" onclick="startApp()">START ANALYSIS</button>
</div>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#555; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:var(--green); color:#000;">💾 SAVE</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3>✔ Check Lines (1.2.3)</h3>
        <div id="checks">Click (**) to scan...</div>
    </div>
    
    <div class="card">
        <h3>🔮 Future AI (3-Pair)</h3>
        <div id="future" style="font-size:18px; color:var(--green); font-weight:800;">--</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white;">CLOSE</button>
    <h3>Sequence Pattern View</h3>
    <center><div id="popData"></div></center>
</div>

<script>
const FAMILY = {"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("milan_v2")) || [["10","20","30","40","50","60"],["**","**","**","**","**","**"]];
let activeMark = null; 

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){v=String(v).trim(); return v=="**"?"**":(v.length==1?"0"+v:v);}
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || fam(a)===fam(b); }

function startApp() { document.getElementById('home-screen').style.display='none'; document.getElementById('main-app').style.display='block'; draw(); }

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let cls = (activeMark && isPartOf(ri,ci)) ? "circle" : "";
            h+=`<td class="${cls}" onclick="handleCell(${ri},${ci})">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activeMark) setTimeout(()=>renderLines("mainCanvas", "tbl"), 50);
}

function handleCell(r,c){
    if(data[r][c]=="**") runAI(r,c);
    else { let v=prompt("Edit:", data[r][c]); if(v!==null){data[r][c]=norm(v); draw();}}
}

function isPartOf(ri,ci){
    if(!activeMark) return false;
    let off = ri - activeMark.start;
    return (off>=0 && off<activeMark.shape.length && activeMark.shape[off][ci]);
}

function runAI(r, c) {
    let base = "**";
    for(let i=r-1; i>=0; i--){ if(data[i][c]!="**"){base=data[i][c]; break;}}
    if(base=="**") return;

    let shape = [];
    for(let i=Math.max(0,r-6); i<r; i++){
        let row = [];
        for(let j=0; j<6; j++){ row.push(smartMatch(data[i][j], base)?1:0); }
        shape.push(row);
    }

    let matches = [];
    for(let i=0; i<=data.length-shape.length-1; i++){
        let score = 0;
        for(let k=0; k<shape.length; k++){
            for(let j=0; j<6; j++){ if(shape[k][j] && smartMatch(data[i+k][j], base)) score++; }
        }
        if(score >= 1) matches.push({index:i, score:score});
    }

    let list = document.getElementById("checks");
    list.innerHTML = "";
    matches.sort((a,b)=>b.score-a.score).slice(0,3).forEach((m,idx)=>{
        let btn = document.createElement("div");
        btn.className = "check-btn";
        btn.innerHTML = `Check Line ${idx+1} (Match Score: ${m.score})`;
        btn.onclick = () => {
            activeMark = {start: m.index, shape: shape};
            draw();
            showPopup(m.index, shape);
            let pred = (m.index+shape.length < data.length) ? data[m.index+shape.length][c] : "??";
            document.getElementById("future").innerHTML = `Best Prediction: ${pred}`;
        };
        list.appendChild(btn);
    });
}

function showPopup(start, shape){
    let h = "<table style='background:#fff; color:#000'>";
    for(let i=0; i<shape.length; i++){
        h += "<tr>";
        data[start+i].forEach((v,j)=>{
            h += `<td class="${shape[i][j]?'circle':''}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popData").innerHTML = h+"</table>";
    document.getElementById("popup").style.display="block";
    document.getElementById("overlay").style.display="block";
}

function renderLines(cvsId, containerId) {
    const cvs = document.getElementById(cvsId);
    const cont = document.getElementById(containerId);
    const ctx = cvs.getContext("2d");
    cvs.width = cont.offsetWidth; cvs.height = cont.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3; ctx.beginPath();
    let dots = cont.querySelectorAll(".circle");
    dots.forEach((d,i)=>{
        let r=d.getBoundingClientRect(), p=cont.getBoundingClientRect();
        let x=r.left-p.left+r.width/2, y=r.top-p.top+r.height/2;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => { data = fr.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>norm(v))); draw(); };
    fr.readAsText(e.target.files[0]);
};
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("milan_v2", JSON.stringify(data)); alert("Saved!"); }
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
draw();
</script>
</body>
</html>
