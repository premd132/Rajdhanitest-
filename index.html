<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI - DPBOSS Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #1a73e8; --green: #2ecc71; --bg: #121212; --panel: #1e1e1e; --yellow: #ffff00; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; padding: 10px; }
        
        .toolbar { background: var(--panel); padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; border: 1px solid #333; }
        
        .table-container { position: relative; background: #fff; border-radius: 4px; padding: 0; display: inline-block; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        table { border-collapse: collapse; color: #000; font-size: 15px; position: relative; z-index: 5; }
        td, th { border: 1px solid #bbb; padding: 10px 5px; text-align: center; font-weight: bold; width: 50px; height: 50px; cursor: pointer; }
        th { background: #333; color: white; font-size: 11px; }
        
        /* DPBOSS Colors */
        .base-node { background-color: var(--yellow) !important; color: #000 !important; font-weight: 900; position: relative; }
        .pattern-node { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(26, 115, 232, 0.1); }
        .old-hit-node { border: 3px solid var(--green) !important; border-radius: 50%; font-weight: 900; }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
        
        .card { background: var(--panel); padding: 15px; border-radius: 10px; margin-top: 15px; border-left: 5px solid var(--gold); }
        #future { font-size: 28px; color: var(--green); font-weight: 900; letter-spacing: 4px; text-align: center; }
        button { cursor: pointer; border: none; font-weight: bold; padding: 10px 15px; border-radius: 4px; color: white; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addRow()" style="background:#444;">➕ ROW</button>
        <button onclick="saveData()" style="background:var(--green);">💾 SAVE</button>
        <button onclick="document.getElementById('csv').click()" style="background:var(--blue);">📂 UPLOAD</button>
        <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
    </div>

    <center>
        <div class="table-container">
            <canvas id="lineCanvas"></canvas>
            <table id="mainTable"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); margin:0 0 10px 0; font-size:12px;">🔮 DPBOSS STYLE PREDICTION</h3>
        <div id="future">-- -- --</div>
        <div id="log" style="font-size:11px; color:#888; margin-top:5px; text-align:center;">Click to reveal hidden pattern line</div>
    </div>

<script>
const KEY="dpboss_king_style";
const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(KEY)) || [["10","20","30","40","50","60"],["22","33","44","55","66","77"],["**","**","**","**","**","**"]];
let currentPattern = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){ v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }

function render(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = "";
   if(currentPattern){
       if(ri==currentPattern.target.r && ci==currentPattern.target.c) cls="pattern-node";
       else if(ri==currentPattern.base.r && ci==currentPattern.base.c) cls="base-node";
       else if(ri==currentPattern.old.r && ci==currentPattern.old.c) cls="old-hit-node";
   }
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="findDpbossPattern(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("mainTable").innerHTML=h;
 if(currentPattern) setTimeout(drawDpbossLines, 50);
}

function findDpbossPattern(r, c) {
    if(data[r][c] !== "**") return;
    
    // Logic: Current Base is above. We find same family in records.
    let base = {r: r-1, c: c};
    if(base.r < 0) return;
    let bVal = data[base.r][base.c];
    if(bVal == "**") return;

    let targetFam = fam(bVal);
    let matchRow = -1;

    // Scan records for family match
    for(let i = r-2; i >= 0; i--) {
        if(fam(data[i][c]) === targetFam) {
            if(data[i+1] && data[i+1][c] !== "**") {
                matchRow = i; break;
            }
        }
    }

    if(matchRow !== -1) {
        currentPattern = {
            target: {r, c},
            base: base,
            old: {r: matchRow+1, c: c}
        };
        render();
        let val = data[matchRow+1][c];
        document.getElementById("future").innerText = `${val} - ${val.split('').reverse().join('')} - ${norm((parseInt(val)+5)%100)}`;
        document.getElementById("log").innerText = `LINE DETECTED: ROW ${matchRow+2} CONNECTS TO ROW ${r+1}`;
    } else {
        alert("No pattern match found in records.");
    }
}

function drawDpbossLines() {
    const cvs = document.getElementById("lineCanvas"), tbl = document.getElementById("mainTable"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    const nodes = [".old-hit-node", ".base-node", ".pattern-node"];
    const rect = tbl.getBoundingClientRect();
    let pts = [];

    nodes.forEach(sel => {
        let el = tbl.querySelector(sel);
        if(el) {
            let r = el.getBoundingClientRect();
            pts.push({x: r.left - rect.left + r.width/2, y: r.top - rect.top + r.height/2});
        }
    });

    if(pts.length < 2) return;

    // DPBOSS Style Thick Green Line
    ctx.strokeStyle = "#2ecc71";
    ctx.lineWidth = 5;
    ctx.lineJoin = "round";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#2ecc71";

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // Secondary Blue Connection for Pattern
    ctx.strokeStyle = "#1a73e8";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**","**"]); render(); }
function saveData(){ localStorage.setItem(KEY,JSON.stringify(data)); alert("DPBOSS Data Saved!"); }
function clearData(){ if(confirm("Clear All?")){ localStorage.clear(); location.reload(); }}
function importCSV(e){
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v)));
        localStorage.setItem(KEY, JSON.stringify(data));
        render();
    };
    fr.readAsText(e.target.files[0]);
}
render();
</script>
</body>
</html>
