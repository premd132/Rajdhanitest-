<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rajdhani Pro AI – Strict Family Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#ffd700; --blue:#0084ff; --red:#ff4757; --green:#00ff88; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:Poppins,sans-serif}
body{margin:0;background:var(--bg);color:#fff; overflow-x: hidden; padding-bottom: 60px;}
.toolbar{ background:var(--panel);padding:10px; display:flex;gap:8px;justify-content:center; border-bottom: 2px solid var(--gold); position: sticky; top:0; z-index:100; }
.table-wrap{position:relative;background:#fff;border-radius:8px;padding:5px; display: inline-block; margin-top: 15px;}
table{border-collapse:collapse;color:#000}
td,th{ border:1px solid #ccc; width:45px;height:45px; text-align:center;font-weight:bold; cursor: pointer; position: relative; font-size: 13px;}
th{background:#1e293b;color:#fff; font-size: 10px;}
.circle-red { border:3px solid var(--red)!important; border-radius:50%; background:rgba(255,71,87,.3); }
.circle-blue { border:3px solid var(--blue)!important; border-radius:50%; background:rgba(0,132,255,.3); }
canvas{position:absolute;top:0;left:0;pointer-events:none; z-index: 4;}
.dashboard{ padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
.card{ background:var(--panel);padding:15px;border-radius:12px; border-top:3px solid var(--gold); }
.check-btn { background: #0f172a; color: #fff; border: 1px solid #444; padding: 12px; margin: 5px 0; width: 100%; text-align: left; border-radius: 8px; cursor: pointer; font-weight: 600;}
.future-box { font-size: 26px; font-weight: 800; color: var(--green); text-align: center; letter-spacing: 3px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;}
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csv" hidden>
    <button onclick="csv.click()" style="background:#444; color:white;">📂 CSV</button>
    <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
    <button onclick="save()" style="background:#28a745; color:white;">💾 SAVE</button>
    <button onclick="clearAll()" style="background:#dc3545; color:white;">🗑 CLEAR</button>
</div>

<center>
    <div class="table-wrap">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>✔ CHECK LINES <span id="match-count" style="font-size:10px; color:#aaa;">0 Found</span></h3>
        <div id="checks">Click a blank cell...</div>
    </div>
    <div class="card" style="border-top-color: var(--green);">
        <h3>🔮 FUTURE AI (3-PAIR)</h3>
        <div id="future" class="future-box">— — —</div>
        <p id="ai-logic" style="font-size: 11px; opacity: 0.7; margin-top: 10px;">Status: Waiting for pattern...</p>
    </div>
</div>

<script>
const STORE="rajdhani_v105";
const family={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data = JSON.parse(localStorage.getItem(STORE)) || Array(15).fill().map(()=>Array(5).fill("**"));
let active=null, targetCol=null;

const norm=v=> (!v || v=="**") ? "**" : v.toString().padStart(2,"0").slice(-2);
function getFam(v){ for(let k in family) if(family[k].includes(v)) return k; return null; }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls=[];
   if(active && ri >= active.start && ri < active.start + active.shape.length){
       let type = active.shape[ri-active.start][ci];
       if(type === 1) cls.push("circle-red");
       if(type === 2) cls.push("circle-blue");
   }
   h+=`<td class="${cls.join(' ')}" onclick="cellAction(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
 if(active) setTimeout(drawLines, 50);
}

function cellAction(ri, ci) {
    if(data[ri][ci] === "**") {
        active = null; targetCol = ci;
        findDynamicPattern(ri, ci);
    } else {
        let v = prompt("Edit Result:", data[ri][ci]);
        if(v !== null) data[ri][ci] = norm(v);
        draw();
    }
}

function findDynamicPattern(ri, ci) {
    let f1=null, f2=null, p1=[], p2=[];
    let lookBack = 10; 
    let scanLimit = Math.max(0, ri - lookBack);

    // 1. सबसे पहले वर्तमान पैटर्न के लिए 2 अलग-अलग फैमिली चुनें
    for(let i=ri-1; i>=scanLimit; i--){
        for(let j=0; j<5; j++){
            let val = data[i][j];
            if(val=="**") continue;
            let cf = getFam(val);
            if(!f1) { f1 = cf; p1.push({r:i, c:j}); }
            else if(cf === f1 && p1.length < 2 && !p1.some(p=>p.r==i)) p1.push({r:i, c:j});
            else if(!f2 && cf !== f1) { f2 = cf; p2.push({r:i, c:j}); }
            else if(cf === f2 && p2.length < 2 && !p2.some(p=>p.r==i)) p2.push({r:i, c:j});
        }
        if(p1.length==2 && p2.length==2) break;
    }

    if(p1.length < 2 || p2.length < 2) return;

    let shape = Array(ri-scanLimit).fill().map(()=>Array(5).fill(0));
    p1.forEach(p => shape[p.r-scanLimit][p.c] = 1);
    p2.forEach(p => shape[p.r-scanLimit][p.c] = 2);

    active = {start: scanLimit, shape: shape, f1: f1, f2: f2};
    draw();
    searchHistory(shape, f1, f2, scanLimit);
}

function searchHistory(shape, f1, f2, limit) {
    let matches = [];
    // 2. पुराने रिकॉर्ड्स में वही SAME FAMILY पैटर्न ढूँढना
    for(let i=0; i < limit; i++) {
        let score = 0;
        let totalDots = 0;
        for(let r=0; r < shape.length; r++) {
            for(let c=0; c<5; c++) {
                if(shape[r][c] === 0) continue;
                totalDots++;
                let currentVal = data[i+r] ? data[i+r][c] : "**";
                let currentFam = getFam(currentVal);
                
                // लाल घेरा (1) वाली जगह पर f1 फैमिली ही होनी चाहिए
                if(shape[r][c] === 1 && currentFam === f1) score++;
                // नीला घेरा (2) वाली जगह पर f2 फैमिली ही होनी चाहिए
                if(shape[r][c] === 2 && currentFam === f2) score++;
            }
        }
        // अगर 3 या 4 पॉइंट मैच होते हैं तो उसे 'Check Line' मानेंगे
        if(score >= 3) matches.push(i);
    }

    const checksDiv = document.getElementById("checks");
    checksDiv.innerHTML = "";
    document.getElementById("match-count").innerText = matches.length + " Found";

    matches.forEach((mIdx, idx) => {
        let b = document.createElement("button");
        b.className = "check-btn";
        b.innerHTML = `📋 Check Line ${idx+1} <span style="float:right; font-size:10px;">Row ${mIdx+1}</span>`;
        b.onclick = () => {
            active = {start: mIdx, shape: shape};
            draw();
            window.scrollTo({top: 0, behavior: 'smooth'});
        };
        checksDiv.appendChild(b);
    });

    let pred = [];
    matches.forEach(m => {
        let nr = m + shape.length;
        if(data[nr] && data[nr][targetCol] !== "**") pred.push(data[nr][targetCol]);
    });
    
    let finalAI = [...new Set(pred)].slice(0,3);
    document.getElementById("future").innerText = finalAI.length ? finalAI.join(" - ") : "No History";
    document.getElementById("ai-logic").innerText = "Strict matching based on Families: " + f1 + " & " + f2;
}

function drawLines(){
    const cvs=mainCanvas, ctx=cvs.getContext("2d");
    const tRect = tbl.getBoundingClientRect();
    cvs.width=tbl.offsetWidth; cvs.height=tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);

    [[".circle-red", "#ff4757"], [".circle-blue", "#0084ff"]].forEach(cfg => {
        let pts = [...tbl.querySelectorAll(cfg[0])];
        if(pts.length < 2) return;
        ctx.strokeStyle = cfg[1]; ctx.lineWidth = 3; ctx.beginPath();
        pts.forEach((p, i) => {
            let r = p.getBoundingClientRect();
            let x = r.left - tRect.left + r.width/2;
            let y = r.top - tRect.top + r.height/2;
            i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
        });
        ctx.stroke();
    });
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function save(){ localStorage.setItem(STORE, JSON.stringify(data)); alert("System Updated!"); }
function clearAll(){ if(confirm("Clear Everything?")){ localStorage.clear(); location.reload(); }}

csv.onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split("\n").filter(l=>l.trim()).map(l=>l.split(",").map(v=>norm(v.trim())).slice(0,5));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};

draw();
</script>
</body>
</html>
