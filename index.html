<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBossKing - Professional Master Suite</title>
    <style>
        :root { --red: #ff0000; --blue: #0000ff; --green: #008000; --gold: #ffd600; --panel: #1a1a1a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }

        /* Header & Navigation */
        .top-nav { background: #b71c1c; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; }

        /* Sidebar Tools */
        .main-container { display: flex; height: calc(100vh - 70px); }
        .sidebar { width: 320px; background: var(--panel); border-right: 1px solid #333; padding: 25px; overflow-y: auto; }
        .tool-title { font-size: 13px; color: var(--gold); text-transform: uppercase; margin-bottom: 15px; display: block; letter-spacing: 1px; border-left: 3px solid var(--gold); padding-left: 10px; }
        
        .btn { width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; text-align: left; position: relative; }
        .btn-red { background: var(--red); color: #fff; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-blue { background: var(--blue); color: #fff; }
        .active-btn { outline: 3px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* Work Area & Chart */
        .workspace { flex: 1; padding: 30px; background: #222; overflow: auto; display: flex; flex-direction: column; align-items: center; }
        .chart-box { position: relative; background: #fff; padding: 10px; border-radius: 4px; display: inline-block; box-shadow: 0 0 50px #000; }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 10; }
        td, th { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-size: 20px; font-weight: 900; }
        th { background: #f0f0f0; font-size: 11px; height: 30px; color: #333; font-weight: bold; }

        /* Marks */
        .f-red { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); color: var(--red); }
        .f-green { border: 4px solid var(--green) !important; background: rgba(0,128,0,0.1); color: var(--green); }
        .f-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }

        #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        .execute-bar { background: var(--gold); color: #000; padding: 18px; width: 100%; font-size: 18px; font-weight: 900; text-align: center; margin-top: 20px; box-shadow: 0 5px 0 #b89b00; cursor: pointer; }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="logo">DPBOSS KING <span style="color:var(--gold)">PREMIUM</span></div>
    <div style="font-size: 13px;">ADMIN: ACTIVE | ENGINE: V2.1</div>
</div>

<div class="main-container">
    <div class="sidebar">
        <span class="tool-title">CSV DATA LOADER</span>
        <input type="file" id="csv" onchange="readData()" style="color:#fff; margin-bottom:20px; font-size: 12px;">

        <span class="tool-title">PATTERN MARKERS</span>
        <button class="btn btn-red active-btn" onclick="setT('f-red', this)">RED BASE (BOX)</button>
        <button class="btn btn-green" onclick="setT('f-green', this)">GREEN TOUCH (SQUARE)</button>
        <button class="btn btn-blue" onclick="setT('f-blue', this)">BLUE TOUCH (CIRCLE)</button>

        <span class="tool-title">ANCHOR SETTINGS</span>
        <select id="dayIdx" style="width:100%; padding:10px; background:#333; color:#fff; border:1px solid #555;">
            <option value="0">MONDAY</option><option value="1">TUESDAY</option>
            <option value="2">WEDNESDAY</option><option value="3">THURSDAY</option>
            <option value="4">FRIDAY</option><option value="5">SATURDAY</option>
        </select>

        <div class="execute-bar" onclick="masterSearch()">SEARCH FULL HISTORY</div>
        <p style="font-size: 11px; color: #777; margin-top: 15px; text-align: center;">Pattern Engine scans 100+ tricks automatically based on family-set DNA.</p>
    </div>

    <div class="workspace">
        <div class="chart-box" id="box">
            <canvas id="canvas"></canvas>
            <table id="mainT">
                <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let tool = 'f-red';
let chartData = [["10","20","30","40","50","60"],["11","21","31","41","51","61"],["12","22","32","42","52","62"],["13","23","33","43","53","63"],["85","35","25","**","**","**"]];

// Dynamic Family Generator
function getFam(val) {
    let n = val.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let set = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => {
        set.add(`${a[0]}${b[0]}`); set.add(`${b[0]}${a[0]}`);
    }));
    return Array.from(set);
}

function render() {
    const b = document.getElementById('tbody');
    b.innerHTML = chartData.map((row, r) => `<tr>${row.map((c, d) => 
        `<td onclick="applyT(this)" contenteditable="true" onblur="chartData[${r}][${d}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    setTimeout(sync, 100);
}

function setT(t, btn) {
    tool = t;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active-btn'));
    btn.classList.add('active-btn');
}

function applyT(td) { td.className = td.className === tool ? "" : tool; }

function sync() {
    const c = document.getElementById('canvas'), b = document.getElementById('box');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

// THE SEARCH CLONE LOGIC
function masterSearch() {
    const day = parseInt(document.getElementById('dayIdx').value);
    const table = document.getElementById('mainT');
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0,0,5000,5000);

    let dna = { base: null, relatives: [] };
    for(let r=0; r<chartData.length; r++) {
        if(table.rows[r+1].cells[day].classList.contains('f-red')) {
            dna.base = { val: chartData[r][day], r: r, c: day };
            break;
        }
    }

    if(!dna.base) return alert("Pehle niche Base (Red) select karein!");

    document.querySelectorAll('.f-green, .f-blue').forEach(m => {
        let mr = m.parentElement.rowIndex-1, mc = m.cellIndex;
        dna.relatives.push({ val: chartData[mr][mc], rd: mr - dna.base.r, cd: mc - dna.base.c, type: m.className });
    });

    const baseF = getFam(dna.base.val);
    chartData.forEach((row, ri) => {
        if(baseF.includes(row[day]) && ri !== dna.base.r) {
            let match = 0;
            dna.relatives.forEach(rel => {
                let tr = ri + rel.rd, tc = day + rel.cd;
                if(chartData[tr] && getFam(rel.val).includes(chartData[tr][tc])) match++;
            });

            if(match === dna.relatives.length) {
                const bCell = table.rows[ri+1].cells[day];
                bCell.classList.add('f-red');
                dna.relatives.forEach(rel => {
                    const tCell = table.rows[ri+rel.rd+1].cells[day+rel.cd];
                    tCell.classList.add(rel.type);
                    ctx.strokeStyle = rel.type.includes('green') ? 'green' : 'blue';
                    ctx.lineWidth = 2.5; ctx.beginPath();
                    ctx.moveTo(bCell.offsetLeft+28, bCell.offsetTop+25);
                    ctx.lineTo(tCell.offsetLeft+28, tCell.offsetTop+25); ctx.stroke();
                });
            }
        }
    });
}

function readData() {
    const f = document.getElementById('csv').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        chartData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        render();
    };
    r.readAsText(f);
}

window.onload = render;
</script>
</body>
</html>
