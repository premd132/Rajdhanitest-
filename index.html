<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI - Fam to Fam Check Line</title>
    <style>
        :root { --fam-clr: #ff00ff; --check-clr: #00ff00; --bg: #0a0a0a; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        
        /* Dpboss Style Grid */
        .chart-box { position: relative; background: #000; border: 2px solid #444; display: inline-block; }
        table { border-collapse: collapse; position: relative; z-index: 10; }
        td { border: 1px solid #333; width: 75px; height: 60px; text-align: center; cursor: pointer; font-size: 1.5em; font-weight: bold; }
        
        /* Fam to Fam Visuals */
        .fam-circle { position: relative; color: var(--fam-clr) !important; }
        .fam-circle::after { content: ''; position: absolute; width: 50px; height: 50px; border: 3px solid var(--fam-clr); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        
        .panel { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-bottom: 3px solid var(--fam-clr); }
        button { padding: 12px 20px; cursor: pointer; background: var(--fam-clr); color: white; border: none; font-weight: bold; border-radius: 5px; }
        input { padding: 10px; width: 80px; text-align: center; background: #000; color: #00ff00; border: 1px solid #444; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="panel">
    <h1>FAM TO FAM - CHECK LINE ENGINE</h1>
    <p>Pradeep ji, yahan sirf <b>2.2 Jodi</b> family matches ki <b>Check Line</b> dikhegi.</p>
    <button onclick="document.getElementById('fileIn').click()">IMPORT CSV</button>
    <input type="file" id="fileIn" style="display:none" onchange="importCSV(this)">
    <button onclick="exportCSV()" style="background:#444; margin-left:10px;">SAVE CSV</button>
</div>

<div class="chart-box" id="container">
    <canvas id="lineCanvas"></canvas>
    <table id="mainTable">
        <tbody id="gridBody"></tbody>
    </table>
</div>

<div class="panel" style="margin-top:20px;">
    <h3>Nayi Row Add Karein</h3>
    <input type="text" id="m1" placeholder="Mon">
    <input type="text" id="m2" placeholder="Tue">
    <input type="text" id="m3" placeholder="Wed">
    <input type="text" id="m4" placeholder="Thu">
    <input type="text" id="m5" placeholder="Fri">
    <button onclick="addRow()" style="background:#0088ff;">ADD ROW</button>
</div>

<script>
let records = JSON.parse(localStorage.getItem('pradeep_fam_db')) || [];
const rashi = {'0':5, '1':6, '2':7, '3':8, '4':9, '5':0, '6':1, '7':2, '8':3, '9':4};

// 1. Family Calculation (2.2 Jodi Logic)
function getFamilySet(jodi) {
    if(!jodi || jodi.length < 2) return [];
    let d1 = jodi[0], d2 = jodi[1];
    let r1 = rashi[d1], r2 = rashi[d2];
    
    // Family components: Direct, Palat, Half-Cut, Full-Cut
    let set = [
        `${d1}${d2}`, `${d2}${d1}`, // Direct & Palat
        `${r1}${d2}`, `${d1}${r2}`, // Half Cut
        `${r1}${r2}`, `${r2}${r1}`, // Full Cut & Palat
        `${d2}${r1}`, `${r2}${d1}`  // Cross Cut
    ];
    return [...new Set(set)];
}

function render() {
    const body = document.getElementById('gridBody');
    body.innerHTML = "";
    records.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.id = `c-${r}-${c}`;
            td.innerText = cell || "**";
            td.onclick = () => scanFamToFam(r, c);
            tr.appendChild(td);
        });
        body.appendChild(tr);
    });
}

// 2. Fam to Fam Scanner & Check Line
function scanFamToFam(r, c) {
    clearUI();
    let current = records[r][c];
    if(!current || current == "**") return;

    let myFamily = getFamilySet(current);
    document.getElementById(`c-${r}-${c}`).style.color = "#00ff00";

    // Scan last 10 weeks
    for(let i = r - 1; i >= Math.max(0, r - 10); i--) {
        for(let j = 0; j < 5; j++) {
            let old = records[i][j];
            if(myFamily.includes(old) && old !== "**") {
                drawFamLine(i, j, r, c);
            }
        }
    }
}

function drawFamLine(r1, c1, r2, c2) {
    const s = document.getElementById(`c-${r1}-${c1}`);
    const e = document.getElementById(`c-${r2}-${c2}`);
    const cvs = document.getElementById('lineCanvas');
    const ctx = cvs.getContext('2d');
    
    cvs.width = document.getElementById('container').offsetWidth;
    cvs.height = document.getElementById('container').offsetHeight;

    s.classList.add('fam-circle'); // Circle on Old Record

    ctx.beginPath();
    ctx.strokeStyle = "#ff00ff"; // Pink Fam-to-Fam Line
    ctx.lineWidth = 3;
    ctx.moveTo(s.offsetLeft + 37, s.offsetTop + 30);
    ctx.lineTo(e.offsetLeft + 37, e.offsetTop + 30);
    ctx.stroke();
}

// --- CSV & Data Management ---
function importCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        records = e.target.result.trim().split("\n").map(l => l.split(",").map(v => v.trim()));
        localStorage.setItem('pradeep_fam_db', JSON.stringify(records));
        render();
        alert("Family Data Loaded Successfully!");
    };
    reader.readAsText(input.files[0]);
}

function exportCSV() {
    let csv = records.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'Pradeep_Fam_Records.csv';
    a.click();
}

function addRow() {
    records.push([document.getElementById('m1').value, document.getElementById('m2').value, document.getElementById('m3').value, document.getElementById('m4').value, document.getElementById('m5').value]);
    localStorage.setItem('pradeep_fam_db', JSON.stringify(records));
    render();
}

function clearUI() {
    const cvs = document.getElementById('lineCanvas');
    cvs.getContext('2d').clearRect(0,0,cvs.width, cvs.height);
    document.querySelectorAll('td').forEach(t => {
        t.classList.remove('fam-circle');
        t.style.color = "#fff";
    });
}

render();
</script>
</body>
</html>
