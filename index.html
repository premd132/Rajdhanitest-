<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYAN / MAIN Figure System</title>

<style>
body{background:#0f172a;color:#fff;font-family:Arial;margin:0}
.box{max-width:450px;margin:15px auto;background:#1e293b;padding:15px;border-radius:12px}
h2{color:#ffd700;text-align:center;margin:5px 0}
input,button,select{width:100%;padding:10px;margin:6px 0;border:none;border-radius:6px;font-size:15px}
button{background:#ffd700;font-weight:bold;cursor:pointer}
.result{background:#020617;padding:10px;border-radius:8px;margin-top:10px}
.fig{display:inline-block;background:#000;color:#00ff88;padding:8px 10px;margin:4px;border-radius:6px;font-size:18px}
.small{font-size:12px;opacity:.8}
.error{color:#ff6b6b;font-size:13px}
</style>
</head>

<body>

<div class="box">
<h2>🔮 KALYAN / MAIN<br>FIGURE SYSTEM</h2>

<div class="small">CSV Upload</div>
<input type="file" id="csv" accept=".csv">

<div class="small">Last Week Jodi (6)</div>
<input id="jodi" placeholder="51,80,90,41,73,72">

<div class="small">Search Option</div>
<select id="mode">
 <option value="1">1️⃣ Manual Base Figure</option>
 <option value="2">2️⃣ Auto (Last Jodi Total)</option>
 <option value="3">3️⃣ Auto (Common Total)</option>
 <option value="4">4️⃣ All Possible (Strong)</option>
</select>

<div class="small">Base Figure (Option-1 ke liye)</div>
<input id="base" type="number" min="0" max="9" placeholder="6">

<button id="searchBtn">SEARCH FIGURE</button>

<div id="err" class="error"></div>

<div id="out" class="result" style="display:none">
 <div class="small">Result Figure</div>
 <div id="fig"></div>
 <div id="info" class="small"></div>
</div>

<button id="addRow">ADD ROW</button>
<button id="save">SAVE</button>

</div>

<script>
/* ================= STORAGE ================= */
const KEY="kalyan_figure_data";
let rows = JSON.parse(localStorage.getItem(KEY)) || [];

/* ================= HELPERS ================= */
function cleanJodiList(raw){
 return raw
  .replace(/\s+/g,",")
  .split(",")
  .map(v=>v.trim())
  .filter(v=>/^\d{2}$/.test(v));
}
function totalAnk(j){ return (+j[0] + +j[1]) % 10; }
function pm(n){ return [(n+1)%10,(n+9)%10]; }

/* ================= CSV UPLOAD (FIXED) ================= */
document.getElementById("csv").addEventListener("change",function(e){
 const file = e.target.files[0];
 if(!file) return;

 const reader = new FileReader();
 reader.onload = function(){
  const lines = reader.result
    .split(/\r?\n/)
    .filter(l=>l.trim());

  if(!lines.length){
    err.innerHTML="❌ CSV empty hai";
    return;
  }

  // last non-empty line use karenge
  const lastLine = lines[lines.length-1];
  const list = cleanJodiList(lastLine);

  if(list.length !== 6){
    err.innerHTML="❌ CSV me 6 valid jodi nahi mili";
    return;
  }

  jodi.value = list.join(",");
  rows.push(list.join(","));
  localStorage.setItem(KEY,JSON.stringify(rows));

  err.innerHTML="✅ CSV loaded successfully";
 };
 reader.readAsText(file);
});

/* ================= BUTTONS ================= */
document.getElementById("addRow").onclick=function(){
 const v = prompt("6 jodi dalo (comma ya space se)");
 if(!v) return;
 const c = cleanJodiList(v);
 if(c.length!==6){
  alert("Sirf 6 valid jodi (2 digit)");
  return;
 }
 rows.push(c.join(","));
 jodi.value = c.join(",");
};

document.getElementById("save").onclick=function(){
 localStorage.setItem(KEY,JSON.stringify(rows));
 alert("Saved");
};

/* ================= MAIN LOGIC ================= */
document.getElementById("searchBtn").onclick=function(){
 err.innerHTML="";
 out.style.display="none";

 const list = cleanJodiList(jodi.value);
 if(list.length!==6){
  err.innerHTML="❌ Sirf 6 valid jodi dalo";
  return;
 }

 const totals = list.map(totalAnk);
 const modeVal = document.getElementById("mode").value;
 let figures=[], info="";

 if(modeVal==="1"){
  const b = +base.value;
  if(isNaN(b)||b<0||b>9){
    err.innerHTML="❌ Base figure 0–9";
    return;
  }
  const [a,c]=pm(b);
  figures=[a,c,(a+1)%10,(c+9)%10];
  info="Manual Base: "+b;
 }

 if(modeVal==="2"){
  const b = totals[totals.length-1];
  const [a,c]=pm(b);
  figures=[a,c,(a+1)%10,(c+9)%10];
  info="Auto Base (Last Total): "+b;
 }

 if(modeVal==="3"){
  const freq={};
  totals.forEach(t=>freq[t]=(freq[t]||0)+1);
  const b = +Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
  const [a,c]=pm(b);
  figures=[a,c,(a+1)%10,(c+9)%10];
  info="Auto Base (Common Total): "+b;
 }

 if(modeVal==="4"){
  [...new Set(totals)].slice(0,2).forEach(b=>{
    const [a,c]=pm(b);
    figures.push(a,c,(a+1)%10,(c+9)%10);
  });
  info="All Strong Base";
 }

 fig.innerHTML = figures.map(f=>`<span class="fig">${f}</span>`).join("");
 info.innerHTML = `Totals: ${totals.join(", ")}<br>${info}`;
 out.style.display="block";
};
</script>

</body>
</html>
