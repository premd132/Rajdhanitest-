<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Master Pattern Scanner - Pradeep AI</title>
    <style>
        :root { --primary: #0984e3; --accent: #d63031; --bg: #f5f6fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 10px; }
        .master-container { max-width: 1200px; margin: auto; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        .header { background: var(--primary); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        
        .scan-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border: 2px solid #dfe6e9; }
        th, td { border: 1px solid #b2bec3; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; position: relative; }
        th { background: #636e72; color: white; }
        
        /* पैटर्न विजुअल */
        .match-circle { border: 3px solid var(--accent) !important; border-radius: 50%; background: rgba(214, 48, 49, 0.2); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
        
        .prediction-panel { background: #2d3436; color: #00cec9; padding: 20px; border-radius: 10px; border-left: 8px solid #00cec9; }
        .btn { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-scan { background: #6c5ce7; color: white; width: 100%; margin-top: 10px; font-size: 18px; }
        input { padding: 10px; border: 2px solid #ddd; border-radius: 5px; width: 100px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

<div class="master-container">
    <div class="header">
        <h1>PRADEEP AI: मास्टर पैटर्न स्कैनर & फ्यूचर प्रिडिक्टर</h1>
        <p>संपूर्ण रिकॉर्ड स्कैनिंग और वर्तमान चाल विश्लेषण</p>
    </div>

    <div class="scan-grid">
        <div class="table-section">
            <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">
                <input type="text" id="jodiInput" placeholder="जोड़ी">
                <button class="btn" style="background: #00b894; color:white;" onclick="addJodi()">Add Row</button>
                <button class="btn" style="background: #fab1a0;" onclick="exportCSV()">Download Records (CSV)</button>
                <button class="btn" style="background: #74b9ff;" onclick="document.getElementById('fileIn').click()">Upload CSV</button>
                <input type="file" id="fileIn" style="display:none" onchange="importCSV(event)">
            </div>

            <table id="patternTable">
                <thead>
                    <tr>
                        <th>Week</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="ai-section">
            <div class="prediction-panel">
                <h3 style="color: white; margin-top: 0;">📡 Live AI Scanner</h3>
                <div id="scanStatus">डेटा स्कैन करें...</div>
                <hr style="border: 0.5px solid #444;">
                <div style="font-size: 14px; color: #aaa;">अगली संभावित 3-जोड़ियाँ:</div>
                <div id="futurePairs" style="font-size: 28px; letter-spacing: 5px; margin: 10px 0;">-- -- --</div>
                <div id="confidence" style="font-size: 12px; color: #00b894;">Confidence: 0%</div>
            </div>
            
            <button class="btn btn-scan" onclick="runMasterScan()">RUN FULL SCAN</button>
            
            <div style="margin-top: 20px; font-size: 13px; color: #636e72;">
                <strong>नोट:</strong> "Check Line" सक्रिय करने के लिए टेबल के किसी भी नंबर पर क्लिक करें।
            </div>
        </div>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('pradeep_master_data')) || [];

    function addJodi() {
        let val = document.getElementById('jodiInput').value;
        if(!val) return;
        data.push(val);
        localStorage.setItem('pradeep_master_data', JSON.stringify(data));
        document.getElementById('jodiInput').value = '';
        render();
    }

    function render() {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        let rowCount = Math.ceil(data.length / 5);

        for (let i = 0; i < rowCount; i++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>W${i+1}</td>`;
            for (let j = 0; j < 5; j++) {
                let idx = i * 5 + j;
                let td = document.createElement('td');
                td.innerText = data[idx] || '--';
                if(data[idx]) {
                    td.onclick = () => checkLine(idx);
                }
                tr.appendChild(td);
            }
            body.appendChild(tr);
        }
    }

    // Check Line Logic: पुराने 10 हफ्तों को स्कैन करना
    function checkLine(idx) {
        render(); // रिसेट
        let target = data[idx];
        let cells = document.querySelectorAll('td');
        let found = false;

        // पिछले 50 पदों (10 हफ्ते) की गहराई से खोज
        for(let i = 1; i <= 50; i++) {
            let prevIdx = idx - i;
            if(prevIdx >= 0 && data[prevIdx] === target) {
                // विजुअल मार्क
                let tdIdx = (Math.floor(prevIdx/5) * 6) + (prevIdx%5) + 1;
                cells[tdIdx].classList.add('match-circle');
                alert(`पैटर्न मैच! यह जोड़ी Week ${Math.floor(prevIdx/5)+1} के पुराने रिकॉर्ड से जुड़ी है।`);
                found = true;
                break;
            }
        }
        if(!found) alert("पिछले 10 हफ्तों में कोई डायरेक्ट कनेक्शन नहीं मिला।");
    }

    // Master AI Scan: वर्तमान चाल को पढ़ना
    function runMasterScan() {
        if(data.length < 3) { alert("स्कैन के लिए कम से कम 3 जोड़ियाँ डालें।"); return; }
        
        document.getElementById('scanStatus').innerText = "स्कैनिंग चालू है... वर्तमान चाल पढ़ी जा रही है।";
        
        setTimeout(() => {
            let last = data[data.length - 1];
            let secondLast = data[data.length - 2];
            
            // चाल विश्लेषण (Simple logic: Difference + Lucky numbers)
            let diff = Math.abs(parseInt(last) - parseInt(secondLast));
            let p1 = (parseInt(last) + diff) % 100;
            let p2 = (parseInt(last) + 5) % 100; // लकी अंक 5 का प्रभाव
            let p3 = (parseInt(last) + 3) % 100; // लकी अंक 3 का प्रभाव

            document.getElementById('futurePairs').innerText = `${p1.toString().padStart(2,'0')} ${p2.toString().padStart(2,'0')} ${p3.toString().padStart(2,'0')}`;
            document.getElementById('scanStatus').innerText = "स्कैन पूर्ण! वर्तमान चाल के अनुसार सुझाव तैयार हैं।";
            document.getElementById('confidence').innerText = "Confidence: " + (data.length > 20 ? "85%" : "50%");
        }, 1000);
    }

    // CSV Features
    function exportCSV() {
        let csv = "Jodi\n" + data.join("\n");
        let blob = new Blob([csv], { type: 'text/csv' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url; a.download = 'Pradeep_Master_Records.csv';
        a.click();
    }

    function importCSV(e) {
        let file = e.target.files[0];
        let reader = new FileReader();
        reader.onload = function(event) {
            let content = event.target.result;
            data = content.split("\n").slice(1).map(r => r.trim()).filter(r => r != "");
            localStorage.setItem('pradeep_master_data', JSON.stringify(data));
            render();
        };
        reader.readAsText(file);
    }

    render();
</script>
</body>
</html>
