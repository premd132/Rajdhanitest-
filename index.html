<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI - Pradeep Edition</title>
<style>
    :root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
    body{ margin:0; background:var(--bg); color:#fff; font-family: 'Segoe UI', sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px; }
    
    .toolbar{ display:flex; gap:10px; margin-bottom:20px; }
    button{ background:var(--panel); color:white; border:1px solid var(--gold); padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold; }
    
    .table-box{ position:relative; background:white; padding:10px; border-radius:8px; }
    table{ border-collapse: collapse; color: black; position: relative; z-index: 2; }
    td, th{ border: 1px solid #ccc; width: 55px; height: 55px; text-align: center; font-size: 20px; font-weight: 800; cursor: pointer; }
    th{ background: #eee; font-size: 12px; height: 30px; }
    
    /* Screenshot matching styles */
    .circle-red { border: 4px solid var(--red) !important; border-radius: 10px; background: rgba(255, 71, 87, 0.1); }
    .circle-blue { border: 4px solid var(--blue) !important; border-radius: 10px; background: rgba(46, 134, 222, 0.1); }
    .marked-yellow { background: #facc15 !important; border: 2px solid #854d0e !important; }
    
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 3; }
    .dashboard { margin-top: 20px; width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 10px; border-top: 4px solid var(--gold); }
    .check-line { background: #2d3748; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; border-left: 4px solid var(--gold); }
</style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="csvFile" style="display:none">
        <button onclick="document.getElementById('csvFile').click()">📂 CSV LOAD</button>
        <button onclick="addRow()">➕ ADD ROW</button>
        <button onclick="saveData()">💾 SAVE</button>
        <button onclick="location.reload()" style="border-color:red">🔄 RESET</button>
    </div>

    <div class="table-box" id="box">
        <canvas id="canvas"></canvas>
        <table id="tbl"></table>
    </div>

    <div class="dashboard">
        <b>✔ CHECK LINES (HISTORY)</b>
        <div id="checkList">Click on any result to see pattern...</div>
    </div>

<script>
const FAMILY = {"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"11":["11","66","16","61"],"22":["22","77","27","72"],"33":["33","88","38","83"],"44":["44","99","49","94"],"55":["55","00","05","50"]};

let data = JSON.parse(localStorage.getItem('pradeepData')) || Array(12).fill().map(()=>Array(5).fill("**"));
let activePattern = null;

function getFam(v){ for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; }

function render(){
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, r)=>{
        h += "<tr>";
        row.forEach((cell, c)=>{
            let style = "";
            if(activePattern){
                if(activePattern.yellowR === r && activePattern.yellowC === c) style = "marked-yellow";
                if(activePattern.reds.some(p => p.r === r && p.c === c)) style = "circle-red";
                if(activePattern.blues.some(p => p.r === r && p.c === c)) style = "circle-blue";
            }
            h += `<td class="${style}" contenteditable onblur="update(${r},${c},this.innerText)" onclick="findPattern(${r},${c})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById('tbl').innerHTML = h;
    setTimeout(drawLines, 50);
}

function update(r,c,v){ 
    v = v.trim();
    data[r][c] = (v.length === 1) ? "0"+v : (v === "" ? "**" : v);
    saveData();
}

function findPattern(r,c){
    if(data[r][c] === "**") return;
    
    let targetFam = getFam(data[r][c]);
    let matches = [];

    // Scan history for same family results
    for(let i=0; i<data.length; i++){
        if(getFam(data[i][c]) === targetFam && i !== r){
            matches.push(i);
        }
    }

    let list = document.getElementById('checkList');
    list.innerHTML = "";
    
    matches.forEach(matchRow => {
        let div = document.createElement('div');
        div.className = "check-line";
        div.innerText = `Pattern Match: Row ${matchRow+1}`;
        div.onclick = () => {
            // Screenshot logic: 2 left (Red), 2 right (Blue) from the row above
            activePattern = {
                yellowR: matchRow, yellowC: c,
                reds: [{r: matchRow-1, c: c-1}, {r: matchRow-1, c: c-2}],
                blues: [{r: matchRow-1, c: c+1}, {r: matchRow-1, c: c}],
                targetR: matchRow, targetC: c
            };
            render();
        };
        list.appendChild(div);
    });
}

function drawLines(){
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const table = document.getElementById('tbl');
    canvas.width = table.offsetWidth;
    canvas.height = table.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(!activePattern) return;

    const rect = table.getBoundingClientRect();
    const targetCell = table.rows[activePattern.yellowR+1].cells[activePattern.yellowC];
    const tRect = targetCell.getBoundingClientRect();
    const tx = tRect.left - rect.left + tRect.width/2;
    const ty = tRect.top - rect.top + tRect.height/2;

    // Draw Red Lines
    ctx.strokeStyle = "#ff4757"; ctx.lineWidth = 3;
    activePattern.reds.forEach(p => {
        if(p.r < 0 || p.c < 0 || p.c > 4) return;
        let cell = table.rows[p.r+1].cells[p.c];
        let cRect = cell.getBoundingClientRect();
        ctx.beginPath();
        ctx.moveTo(cRect.left - rect.left + cRect.width/2, cRect.top - rect.top + cRect.height/2);
        ctx.lineTo(tx, ty);
        ctx.stroke();
    });

    // Draw Blue Lines
    ctx.strokeStyle = "#2e86de";
    activePattern.blues.forEach(p => {
        if(p.r < 0 || p.c < 0 || p.c > 4) return;
        let cell = table.rows[p.r+1].cells[p.c];
        let cRect = cell.getBoundingClientRect();
        ctx.beginPath();
        ctx.moveTo(cRect.left - rect.left + cRect.width/2, cRect.top - rect.top + cRect.height/2);
        ctx.lineTo(tx, ty);
        ctx.stroke();
    });
}

function saveData(){ localStorage.setItem('pradeepData', JSON.stringify(data)); }
function addRow(){ data.push(["**","**","**","**","**"]); render(); }

document.getElementById('csvFile').onchange = e => {
    let reader = new FileReader();
    reader.onload = () => {
        data = reader.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>v.trim()));
        render();
    };
    reader.readAsText(e.target.files[0]);
};

render();
</script>
</body>
</html>
