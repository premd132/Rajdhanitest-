<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI – Fixed Pattern & Check Lines</title>
    <style>
        :root { --bg: #020617; --card: #1e293b; --accent: #3b82f6; --red: #ff4757; --blue: #2e86de; --gold: #f59e0b; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; }
        
        .header { background: #0f172a; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); }
        .btn { background: var(--accent); border: none; color: white; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        
        .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px; max-width: 1500px; margin: auto; }
        
        /* Table Controls */
        .table-box { background: #fff; padding: 20px; border-radius: 12px; position: relative; overflow: auto; min-height: 500px; }
        table { border-collapse: collapse; width: 100%; color: #000; position: relative; z-index: 5; }
        th { background: #334155; color: white; padding: 12px; border: 1px solid #475569; }
        td { border: 1px solid #cbd5e1; width: 55px; height: 55px; text-align: center; font-weight: 800; font-size: 1.1rem; cursor: pointer; position: relative; }
        
        /* Circle Design */
        .circle-red { border: 3px solid var(--red); border-radius: 50%; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; margin: auto; color: var(--red); box-shadow: 0 0 8px rgba(255,71,87,0.3); }
        .circle-blue { border: 3px solid var(--blue); border-radius: 50%; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; margin: auto; color: var(--blue); box-shadow: 0 0 8px rgba(59,130,246,0.3); }
        
        /* Sidebar */
        .side-panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; height: fit-content; }
        .check-card { background: #0f172a; border-left: 4px solid var(--gold); padding: 12px; margin-top: 15px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .check-card:hover { transform: translateX(8px); background: #1e293b; }
        
        .ai-result { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid var(--gold); border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .pair-tag { background: var(--gold); color: #000; padding: 4px 10px; border-radius: 4px; font-weight: 800; margin: 4px; display: inline-block; }

        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 1.4rem; font-weight: 800;">PRADEEP <span style="color:var(--accent)">PRO AI v3</span></div>
    <div style="display:flex; gap:10px;">
        <input type="file" id="csvLoad" style="display:none" onchange="importCSV(this)">
        <button class="btn" style="background:#475569" onclick="document.getElementById('csvLoad').click()">Import CSV</button>
        <button class="btn" onclick="addNewRow()">+ Add Row</button>
        <button class="btn" style="background:#10b981" onclick="exportCSV()">Export CSV</button>
    </div>
</div>

<div class="layout">
    <div class="table-box" id="tableWrapper">
        <svg id="svgLines"></svg>
        <table id="mainTable"></table>
    </div>

    <div class="sidebar">
        <div class="ai-result">
            <h3 style="margin:0; color:var(--gold);">🤖 FUTURE AI (3-PAIR)</h3>
            <div id="aiPairs" style="margin-top:10px; font-weight:bold;">Analyze to Predict</div>
        </div>

        <div class="side-panel">
            <h3 style="margin:0; border-bottom:1px solid #334155; padding-bottom:10px;">🎯 CHECK LINES</h3>
            <div id="checkList"><p style="font-size:0.8rem; color:#94a3b8;">Click on a ** cell to find matches.</p></div>
        </div>
    </div>
</div>

<div id="popup" onclick="this.style.display='none'">
    <div style="background:white; padding:25px; border-radius:15px; color:#000; position:relative;" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Historical Pattern View</h3>
        <div style="position:relative">
            <svg id="popSvg"></svg>
            <table id="popTable" style="border:1px solid #ccc"></table>
        </div>
    </div>
</div>

<script>
const FAMILIES = {
    "01":["01","06","10","15","51","56","60","65"], "02":["02","07","20","25","52","57","70","75"],
    "03":["03","08","30","35","53","58","80","85"], "04":["04","09","40","45","54","59","90","95"],
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "23":["23","28","32","37","73","78","82","87"], "34":["34","39","43","48","84","89","93","98"]
};

let mainData = JSON.parse(localStorage.getItem("pradeep_ai_v3")) || Array(20).fill().map(()=>Array(5).fill("**"));
let currentPattern = null;

const findFam = (v) => { for(let k in FAMILIES) if(FAMILIES[k].includes(v)) return k; return null; };

function drawMain() {
    const tbl = document.getElementById("mainTable");
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    mainData.forEach((row, r) => {
        h += "<tr>";
        row.forEach((cell, c) => {
            let cls = "";
            if(currentPattern) {
                if(currentPattern.p1.some(p => p.r === r && p.c === c)) cls = "circle-red";
                if(currentPattern.p2.some(p => p.r === r && p.c === c)) cls = "circle-blue";
            }
            h += `<td onclick="runAnalysis(${r},${c})" contenteditable="true" onblur="updateData(${r},${c},this.innerText)">
                  <div class="${cls}">${cell}</div></td>`;
        });
        h += "</tr>";
    });
    tbl.innerHTML = h;
    renderLines("svgLines", "mainTable", currentPattern);
}

function updateData(r, c, v) { mainData[r][c] = v.trim(); localStorage.setItem("pradeep_ai_v3", JSON.stringify(mainData)); drawMain(); }
function addNewRow() { mainData.push(["**","**","**","**","**"]); drawMain(); }

function runAnalysis(r, c) {
    if(mainData[r][c] !== "**") return;
    
    let p1 = [], p2 = [], f1 = null, f2 = null;
    // Look back 10 weeks
    for(let i = r-1; i >= 0 && i >= r-10; i--) {
        for(let j=0; j<5; j++) {
            let val = mainData[i][j];
            if(val === "**") continue;
            let fam = findFam(val);
            if(!f1) { f1 = fam; p1.push({r:i, c:j, v:val}); }
            else if((fam === f1 || val === p1[0].v) && p1.length < 3) p1.push({r:i, c:j, v:val});
            else if(!f2 && fam !== f1) { f2 = fam; p2.push({r:i, c:j, v:val}); }
            else if((fam === f2 || val === p2[0].v) && p2.length < 3) p2.push({r:i, c:j, v:val});
        }
    }

    if(p1.length >= 1) {
        currentPattern = { p1, p2, f1, f2 };
        drawMain();
        findMatches(r);
        predictFuture(f1, f2);
    }
}

function renderLines(svgId, tblId, pat) {
    const svg = document.getElementById(svgId);
    const tbl = document.getElementById(tblId);
    svg.innerHTML = "";
    if(!pat) return;

    const drawPath = (pts, color) => {
        if(pts.length < 2) return;
        let d = "";
        pts.forEach((p, i) => {
            const cell = tbl.rows[p.r + 1].cells[p.c];
            const x = cell.offsetLeft + cell.offsetWidth/2;
            const y = cell.offsetTop + cell.offsetHeight/2;
            d += (i===0 ? "M " : " L ") + x + " " + y;
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", color);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-width", "3");
        path.setAttribute("stroke-dasharray", "4");
        svg.appendChild(path);
    };
    drawPath(pat.p1, "#ff4757");
    drawPath(pat.p2, "#3b82f6");
}

function findMatches(currentR) {
    const list = document.getElementById("checkList");
    list.innerHTML = "";
    let matchesFound = 0;

    // Search ALL records before current row
    for(let i = 0; i < currentR - 3; i++) {
        let rowVals = mainData[i];
        // Check if any number in this row matches our active pattern's number or family
        let isMatch = rowVals.some(v => v === currentPattern.p1[0].v || findFam(v) === currentPattern.f1);
        
        if(isMatch) {
            matchesFound++;
            let div = document.createElement("div");
            div.className = "check-card";
            div.innerHTML = `<strong>Pattern Match #${matchesFound}</strong><br><small>Found at Week ${i+1}</small>`;
            div.onclick = () => showPop(i);
            list.appendChild(div);
        }
        if(matchesFound >= 5) break;
    }
    if(matchesFound === 0) list.innerHTML = "<p>No matches found in history.</p>";
}

function showPop(rowIdx) {
    document.getElementById("popup").style.display = "flex";
    const pTbl = document.getElementById("popTable");
    let h = "";
    let hp1 = [], hp2 = [];

    for(let i=0; i<4; i++) {
        let r = rowIdx + i;
        if(!mainData[r]) continue;
        h += "<tr>";
        mainData[r].forEach((v, c) => {
            let cls = "";
            if(v === currentPattern.p1[0].v || findFam(v) === currentPattern.f1) { cls="circle-red"; hp1.push({r:i, c}); }
            h += `<td><div class="${cls}">${v}</div></td>`;
        });
        h += "</tr>";
    }
    pTbl.innerHTML = h;
    setTimeout(() => renderLines("popSvg", "popTable", {p1:hp1, p2:hp2}), 100);
}

function predictFuture(f1, f2) {
    const area = document.getElementById("aiPairs");
    const pool = FAMILIES[f1] || ["00","11","22"];
    const pairs = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
    area.innerHTML = pairs.map(p => `<span class="pair-tag">${p}</span>`).join("");
}

function exportCSV() {
    const csv = mainData.map(r => r.join(",")).join("\n");
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'rajdhani_pro_records.csv';
    a.click();
}

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = () => {
        mainData = reader.result.trim().split("\n").map(l => l.split(","));
        localStorage.setItem("pradeep_ai_v3", JSON.stringify(mainData));
        drawMain();
    };
    reader.readAsText(input.files[0]);
}

drawMain();
</script>
</body>
</html>
