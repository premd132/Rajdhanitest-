<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Pradeep Kumar Original</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
 :root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
 *{box-sizing:border-box;font-family:Poppins}
 body{margin:0;background:var(--bg);color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px}
 .toolbar{display:flex;gap:10px;margin-bottom:15px}
 .toolbar button{background:#334155;color:#fff;border:1px solid var(--gold);padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:600}
 .table-box{position:relative;background:#fff;padding:10px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
 table{border-collapse:collapse;color:#000}
 td,th{border:1px solid #ddd;width:50px;height:50px;text-align:center;font-weight:800;font-size:18px;cursor:pointer;position:relative}
 th{background:#1e293b;color:#fff;font-size:11px}
 .circle-red{border:4px solid var(--red)!important;border-radius:8px;background:rgba(255,71,87,0.1)}
 .circle-blue{border:4px solid var(--blue)!important;border-radius:8px;background:rgba(46,134,222,0.1)}
 .marked-yellow{background:#facc15!important;border:2px solid #854d0e!important}
 canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:10}
 .dashboard{display:grid;grid-template-columns:1fr;gap:15px;width:100%;max-width:400px;margin-top:20px}
 .card{background:var(--panel);padding:15px;border-radius:12px;border-top:4px solid var(--gold)}
 .check-btn{background:#2d3748;padding:12px;margin:8px 0;border-radius:8px;border-left:5px solid var(--gold);cursor:pointer;font-size:14px}
</style>
</head>
<body>

<div class="toolbar">
 <input type="file" id="csvFile" style="display:none">
 <button onclick="csvFile.click()">📂 UPLOAD CSV</button>
 <button onclick="addRow()">➕ ADD ROW</button>
 <button onclick="saveLocal()">💾 SAVE DATA</button>
 <button onclick="location.reload()" style="border-color:red">🔄 RESET</button>
</div>

<div class="table-box">
 <canvas id="mainCanvas"></canvas>
 <table id="tbl"></table>
</div>

<div class="dashboard">
 <div class="card">
  <b>✔ Check Lines (History Patterns)</b>
  <div id="checks">Click on any empty cell (**) to scan...</div>
 </div>
</div>

<script>
const FAMILY={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"11":["11","66","16","61"],"22":["22","77","27","72"],"33":["33","88","38","83"],"44":["44","99","49","94"],"55":["55","00","05","50"]};
let data = JSON.parse(localStorage.getItem("pData")) || Array(12).fill().map(()=>Array(5).fill("**"));
let activeMark = null;

function fam(v){ for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA"; }
function norm(v){ if(!v||v=="**")return"**"; v=String(v); return v.length==1?"0"+v:v; }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls="";
   if(activeMark){
    if(activeMark.yR===i && activeMark.yC===j) cls="marked-yellow";
    else if(activeMark.reds.some(p=>p.r===i && p.c===j)) cls="circle-red";
    else if(activeMark.blues.some(p=>p.r===i && p.c===j)) cls="circle-blue";
   }
   h+=`<td class="${cls}" contenteditable onblur="update(${i},${j},this.innerText)" onclick="makePattern(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 setTimeout(drawLines, 50);
}

function update(r,c,v){ data[r][c]=norm(v.trim()); saveLocal(); }

function makePattern(r,c){
 if(data[r][c]!=="**") return;
 let list = document.getElementById("checks"); list.innerHTML="Scanning...";
 
 // Step 1: Identify current pattern structure (2 families above)
 let b1=null, b2=null;
 for(let i=r-1; i>=0; i--){
  let v=data[i][c]; if(v=="**") continue;
  let f=fam(v); if(!b1) b1=f; else if(!b2 && f!=b1){ b2=f; break; }
 }
 if(!b1 || !b2) { list.innerHTML="Pattern match ke liye 2 alag families upar chahiye."; return; }

 // Step 2: Find this pattern in history
 let matches = [];
 for(let i=0; i<data.length; i++){
  if(i===r || data[i][c]=="**") continue;
  if(fam(data[i][c]) === fam(data[r-1][c])) matches.push(i); // Simplified historical match
 }

 list.innerHTML = "";
 matches.forEach(mRow => {
  let btn = document.createElement("div");
  btn.className = "check-btn";
  btn.innerText = `Pattern Match Row ${mRow+1} (Click to View)`;
  btn.onclick = () => {
   activeMark = {
    yR: mRow, yC: c,
    reds: [{r: mRow-1, c: c-1}, {r: mRow-1, c: c-2}], // Screenshot pattern
    blues: [{r: mRow-1, c: c}, {r: mRow-1, c: c+1}],
    targetR: mRow, targetC: c
   };
   draw();
  };
  list.appendChild(btn);
 });
}

function drawLines(){
 const canvas = document.getElementById("mainCanvas"), ctx = canvas.getContext("2d"), table = document.getElementById("tbl");
 canvas.width = table.offsetWidth; canvas.height = table.offsetHeight;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(!activeMark) return;
 const rect = table.getBoundingClientRect();
 
 // Find Result Cell (Yellow) Center
 let resCell = table.rows[activeMark.yR+1].cells[activeMark.yC].getBoundingClientRect();
 let tx = resCell.left - rect.left + resCell.width/2;
 let ty = resCell.top - rect.top + resCell.height/2;

 const drawV = (pts, col) => {
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  pts.forEach(p => {
   if(p.r<0 || p.c<0 || p.c>4) return;
   let cell = table.rows[p.r+1].cells[p.c].getBoundingClientRect();
   ctx.beginPath();
   ctx.moveTo(cell.left - rect.left + cell.width/2, cell.top - rect.top + cell.height/2);
   ctx.lineTo(tx, ty);
   ctx.stroke();
  });
 };

 drawV(activeMark.reds, "#ff4757");
 drawV(activeMark.blues, "#2e86de");
}

function saveLocal(){ localStorage.setItem("pData", JSON.stringify(data)); }
function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
document.getElementById("csvFile").onchange=e=>{
 let f=e.target.files[0]; let r=new FileReader();
 r.onload=()=>{ data=r.result.split("\n").filter(x=>x.trim()).map(x=>x.split(",").slice(0,5).map(v=>norm(v.trim()))); draw(); };
 r.readAsText(f);
}
draw();
</script>
</body>
</html>
