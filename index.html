<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI - CSV Fixed System</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .menu { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; }
        
        /* Buttons */
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-upload { background: #ff9800; color: #000; }
        .btn-scan { background: #00ffcc; color: #000; }
        .btn-save { background: #4caf50; color: #fff; }

        .chart-area { position: relative; border: 1px solid #444; margin-top: 20px; background: #111; }
        table { border-collapse: collapse; width: 100%; position: relative; z-index: 2; }
        td { border: 1px solid #333; height: 50px; text-align: center; font-size: 1.2em; cursor: pointer; width: 20%; }
        
        /* Visual Patterns */
        .source-circle { border: 2px solid #00ffcc !important; background: rgba(0, 255, 204, 0.2); border-radius: 50%; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        
        .input-box { margin-top: 20px; background: #222; padding: 15px; border-radius: 10px; }
        input { width: 60px; padding: 8px; text-align: center; background: #000; color: #00ffcc; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn btn-upload" onclick="document.getElementById('csvHelper').click()">UPLOAD CSV</button>
        <input type="file" id="csvHelper" style="display:none" accept=".csv" onchange="readCSV(this)">
        
        <button class="btn btn-scan" onclick="autoScan()">SCAN PATTERNS</button>
        <button class="btn btn-save" onclick="downloadCSV()">SAVE CSV</button>
    </div>

    <div class="chart-area" id="chartContainer">
        <canvas id="lineCanvas"></canvas>
        <table id="mainTable">
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="input-box">
        <h3>Nayi Jodi Add Karein (Mon-Fri)</h3>
        <input type="text" id="d1" placeholder="Mon">
        <input type="text" id="d2" placeholder="Tue">
        <input type="text" id="d3" placeholder="Wed">
        <input type="text" id="d4" placeholder="Thu">
        <input type="text" id="d5" placeholder="Fri">
        <button class="btn" onclick="addNewRow()" style="background:#2196f3; color:#fff;">ADD ROW</button>
        <button class="btn" onclick="clearAll()" style="background:red; color:#fff; float:right;">DELETE ALL</button>
    </div>

<script>
let matkaData = JSON.parse(localStorage.getItem('pradeep_matka_v5')) || [];

// 1. CSV Padhne ka tarika (Fixed)
function readCSV(input) {
    let file = input.files[0];
    let reader = new FileReader();
    reader.onload = function(e) {
        let text = e.target.result;
        let rows = text.trim().split("\n");
        matkaData = rows.map(r => r.split(",").map(c => c.trim()));
        saveData();
        render();
        alert("CSV Load Ho Gaya!");
    };
    reader.readAsText(file);
}

// 2. CSV Save karne ka tarika
function downloadCSV() {
    let csvContent = matkaData.map(r => r.join(",")).join("\n");
    let blob = new Blob([csvContent], { type: 'text/csv' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'Pradeep_Records.csv';
    a.click();
}

// 3. Patterns & Check Lines
function showPattern(r, c) {
    resetLines();
    let current = matkaData[r][c];
    if(!current || current == "**") return;

    for(let i = r-1; i >= Math.max(0, r-10); i--) {
        for(let j=0; j<5; j++) {
            let old = matkaData[i][j];
            // 01-02-03 sequence ya single digit logic
            if(isMatch(current, old)) {
                drawCheckLine(i, j, r, c);
            }
        }
    }
}

function isMatch(v1, v2) {
    if(!v2 || v2 == "**") return false;
    let diff = Math.abs(parseInt(v1) - parseInt(v2));
    return (diff <= 3) || (v1[0] == v2[0]) || (v1[1] == v2[1]);
}

function drawCheckLine(r1, c1, r2, c2) {
    const s = document.getElementById(`td-${r1}-${c1}`);
    const e = document.getElementById(`td-${r2}-${c2}`);
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = document.getElementById('chartContainer').offsetWidth;
    canvas.height = document.getElementById('chartContainer').offsetHeight;

    s.classList.add('source-circle');
    
    ctx.beginPath();
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 2;
    ctx.moveTo(s.offsetLeft + (s.offsetWidth/2), s.offsetTop + (s.offsetHeight/2));
    ctx.lineTo(e.offsetLeft + (e.offsetWidth/2), e.offsetTop + (e.offsetHeight/2));
    ctx.stroke();
}

// Helpers
function render() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = "";
    matkaData.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.id = `td-${r}-${c}`;
            td.innerText = cell || "**";
            td.onclick = () => showPattern(r, c);
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function addNewRow() {
    matkaData.push([document.getElementById('d1').value, document.getElementById('d2').value, document.getElementById('d3').value, document.getElementById('d4').value, document.getElementById('d5').value]);
    saveData(); render();
}

function saveData() { localStorage.setItem('pradeep_matka_v5', JSON.stringify(matkaData)); }
function resetLines() {
    const cvs = document.getElementById('lineCanvas');
    cvs.getContext('2d').clearRect(0,0,cvs.width, cvs.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('source-circle'));
}
function autoScan() { if(matkaData.length > 0) showPattern(matkaData.length-1, 0); }
function clearAll() { if(confirm("Data delete karein?")) { matkaData=[]; saveData(); render(); } }

render();
</script>
</body>
</html>
