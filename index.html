<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Dual Premium System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --red: #ff4757; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 11px; }
        .circle-red { border: 3px solid var(--red) !important; border-radius: 50% !important; background: rgba(255, 71, 87, 0.2); z-index: 10; }
        .circle-blue { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); z-index: 10; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .card h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 14px; text-transform: uppercase; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 90%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 15px; }
    </style>
</head>
<body>

<div id="main-app">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
        <h2 style="color:var(--gold); margin:0;">KALYAN PRO AI</h2>
        <button onclick="location.reload()" style="background:none; color:white; border:1px solid #444;">Logout</button>
    </div>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 LOAD CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE DATA</button>
        <button onclick="localStorage.clear(); location.reload();" style="background:#dc3545; color:white;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card"><h3>✔ Check Lines</h3><div id="checks">Click on ** to scan...</div></div>
        <div class="card"><h3>🤖 AI Predict</h3><div id="future">...</div></div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white;">X</button>
    <h3>History Sequence</h3>
    <center><div class="table-container"><canvas id="popCanvas"></canvas><div id="popData"></div></div></center>
</div>

<script>
const STORAGE_KEY="pdata_Kalyan_v2";
const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data=JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(15).fill().map(()=>Array(6).fill("**"));
let activeMark=null, targetCol=null;

function fam(v){for(let k in families) if(families[k].includes(v)) return k; return "NA";}
function norm(v){if(!v || v=="**") return "**"; v=v.toString().trim(); return v.length==1?"0"+v:v;}
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || (a[1]+a[0])===b || fam(a)===fam(b); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = "";
   if(activeMark && ri>=activeMark.start && ri<activeMark.start+activeMark.shape.length){
       let type = activeMark.shape[ri-activeMark.start][ci];
       cls = type==1?"circle-red":(type==2?"circle-blue":"");
   }
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="handleCell(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activeMark) setTimeout(()=>drawLines("mainCanvas", "tbl"), 50);
}

function handleCell(r, c){
    if(data[r][c]=="**") { activeMark=null; makePattern(r,c); }
}

function makePattern(r, c){
    targetCol=c; let f1="**", f2="**", f1c=[], f2c=[];
    let look = Math.max(0, r-10);
    for(let i=r-1; i>=look; i--){
        for(let j=0; j<6; j++){
            let v = data[i][j];
            if(v!="**"){
                if(f1=="**") { f1=v; f1c.push({ri:i, ci:j}); }
                else if(smartMatch(v, f1) && f1c.length<2) { if(!f1c.some(x=>x.ri==i && x.ci==j)) f1c.push({ri:i, ci:j}); }
                else if(f2=="**" && fam(v)!=fam(f1)) { f2=v; f2c.push({ri:i, ci:j}); }
                else if(f2!="**" && smartMatch(v, f2) && f2c.length<2) { if(!f2c.some(x=>x.ri==i && x.ci==j)) f2c.push({ri:i, ci:j}); }
            }
        }
    }
    if(f1c.length<2 || f2c.length<2) { alert("Insufficient Data above!"); return; }
    let shape = Array(r-look).fill().map(()=>Array(6).fill(0));
    f1c.forEach(x=>shape[x.ri-look][x.ci]=1); f2c.forEach(x=>shape[x.ri-look][x.ci]=2);
    activeMark={start:look, shape:shape}; draw(); searchHist(shape, f1, f2, look);
}

function searchHist(shape, f1, f2, limit){
    let matches = [];
    for(let i=0; i<limit; i++){
        let score=0;
        for(let k=0; k<shape.length; k++){
            for(let j=0; j<6; j++){
                if(shape[k][j]==1 && smartMatch(data[i+k][j], f1)) score++;
                if(shape[k][j]==2 && smartMatch(data[i+k][j], f2)) score++;
            }
        }
        if(score==4) matches.push(i);
    }
    let h="", pools=[];
    matches.slice(-3).forEach((m, idx)=>{
        h+=`<div onclick="showPop(${m})" style="background:#2a2a2a; padding:8px; margin:5px; border-left:4px solid var(--gold); cursor:pointer;">Match Line ${idx+1} (Row ${m+1})</div>`;
        if(data[m+shape.length] && data[m+shape.length][targetCol]!="**") pools.push(data[m+shape.length][targetCol]);
    });
    document.getElementById("checks").innerHTML = h || "No pattern matches.";
    document.getElementById("future").innerHTML = pools.length ? "Probables: "+[...new Set(pools)].join(",") : "Scanning...";
}

function showPop(idx){
    let shape = activeMark.shape; let h="<table>";
    for(let i=0; i<shape.length; i++){
        h+="<tr>";
        data[idx+i].forEach((v,j)=>{
            let cls = shape[i][j]==1?"circle-red":(shape[i][j]==2?"circle-blue":"");
            h+=`<td class="${cls}">${v}</td>`;
        });
        h+="</tr>";
    }
    document.getElementById("popData").innerHTML=h+"</table>";
    document.getElementById("popup").style.display="block";
    document.getElementById("overlay").style.display="block";
    setTimeout(()=>drawLines("popCanvas", "popData"), 100);
}

function drawLines(cvsId, containerId){
    let cvs=document.getElementById(cvsId), container=document.getElementById(containerId);
    let ctx=cvs.getContext("2d"); cvs.width=container.offsetWidth; cvs.height=container.offsetHeight;
    let rect=container.getBoundingClientRect();
    [[".circle-red", "#ff4757"], [".circle-blue", "#0084ff"]].forEach(cfg=>{
        let cells=container.querySelectorAll(cfg[0]); if(cells.length<2) return;
        ctx.strokeStyle=cfg[1]; ctx.lineWidth=2; ctx.beginPath();
        cells.forEach((c, i)=>{
            let r=c.getBoundingClientRect(); let x=r.left-rect.left+r.width/2; let y=r.top-rect.top+r.height/2;
            if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    });
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); alert("Saved!"); }
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        let lines = fr.result.split('\n');
        data = lines.filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v)));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};
draw();
</script>
</body>
</html>
