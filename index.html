<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI - Dpboss Style Pro</title>
    <style>
        :root { --bg: #f4f4f4; --header: #2c3e50; --win: #d35400; --line: #2980b9; }
        body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        /* Dpboss Style Header */
        .header { background: var(--header); color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        .controls { background: #ecf0f1; padding: 10px; display: flex; gap: 10px; justify-content: center; border: 1px solid #bdc3c7; }
        
        /* Professional Chart Style */
        .chart-wrapper { position: relative; overflow-x: auto; margin-top: 10px; background: white; }
        table { border-collapse: collapse; width: 100%; min-width: 600px; table-layout: fixed; }
        th { background: #eee; border: 1px solid #ccc; padding: 10px; color: #333; font-size: 14px; }
        td { border: 1px solid #ccc; height: 70px; text-align: center; vertical-align: middle; cursor: pointer; position: relative; }
        
        /* Jodi & Panel Design */
        .panel-text { font-size: 11px; color: #666; display: block; }
        .jodi-text { font-size: 20px; font-weight: bold; color: #000; }
        .red-jodi { color: #e74c3c !important; } /* Red jodi for family matches */

        /* Visual Patterns */
        .selected-cell { background: rgba(52, 152, 219, 0.2); outline: 2px solid var(--line); }
        .pattern-circle { border: 3px solid var(--win) !important; border-radius: 50%; width: 45px; height: 45px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }

        /* Input Styles */
        .input-panel { margin-top: 20px; background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 80px; padding: 8px; margin: 5px; border: 1px solid #bdc3c7; text-align: center; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-import { background: #27ae60; color: white; }
        .btn-scan { background: #2980b9; color: white; }
    </style>
</head>
<body>

<div class="header">
    <h1>RAJDHANI NIGHT - PROFESSIONAL CHART</h1>
    <p>AI Pattern & Check Line System (Pradeep Kumar)</p>
</div>

<div class="controls">
    <button class="btn-import" onclick="document.getElementById('csvIn').click()">IMPORT CSV</button>
    <input type="file" id="csvIn" style="display:none" accept=".csv" onchange="loadCSV(this)">
    <button class="btn-scan" onclick="autoScan()">AUTO SCAN PATTERNS</button>
    <button style="background:#34495e; color:white;" onclick="exportCSV()">DOWNLOAD CSV</button>
</div>

<div class="chart-wrapper" id="chartArea">
    <canvas id="lineCanvas"></canvas>
    <table id="mainTable">
        <thead>
            <tr>
                <th>MONDAY</th><th>TUESDAY</th><th>WEDNESDAY</th><th>THURSDAY</th><th>FRIDAY</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="input-panel">
    <h3>Add New Record (Panel-Jodi-Panel)</h3>
    <small>Format: 123-45-678</small><br>
    <input type="text" id="m1" placeholder="Mon">
    <input type="text" id="m2" placeholder="Tue">
    <input type="text" id="m3" placeholder="Wed">
    <input type="text" id="m4" placeholder="Thu">
    <input type="text" id="m5" placeholder="Fri">
    <button onclick="addRow()" style="background:#8e44ad; color:white;">ADD TO CHART</button>
</div>

<script>
let matkaData = JSON.parse(localStorage.getItem('dpboss_v1')) || [];

function render() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = "";
    matkaData.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.id = `cell-${r}-${c}`;
            
            // Dpboss Style Splitting (Panel-Jodi-Panel)
            let parts = cell.split('-');
            if(parts.length === 3) {
                td.innerHTML = `<span class="panel-text">${parts[0]}</span>
                                <span class="jodi-text ${isRed(parts[1])?'red-jodi':''}">${parts[1]}</span>
                                <span class="panel-text">${parts[2]}</span>`;
            } else {
                td.innerHTML = `<span class="jodi-text">${cell}</span>`;
            }

            td.onclick = () => findConnections(r, c);
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function isRed(jodi) {
    if(!jodi) return false;
    let d = jodi.split('');
    return d[0] === d[1] || Math.abs(d[0]-d[1]) === 5; // Same digit or Cut digit
}

// --- CSV LOGIC ---
function loadCSV(input) {
    let reader = new FileReader();
    reader.onload = (e) => {
        let rows = e.target.result.trim().split("\n");
        matkaData = rows.map(r => r.split(","));
        save(); render();
        alert("Dpboss Records Loaded!");
    };
    reader.readAsText(input.files[0]);
}

function exportCSV() {
    let content = matkaData.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], {type:'text/csv'}));
    a.download = 'Rajdhani_Pro_Chart.csv';
    a.click();
}

// --- PATTERN & CHECK LINE LOGIC ---
function findConnections(r, c) {
    resetCanvas();
    document.getElementById(`cell-${r}-${c}`).classList.add('selected-cell');
    
    let currentCell = matkaData[r][c];
    let currentJodi = currentCell.includes('-') ? currentCell.split('-')[1] : currentCell;

    // Scan last 10 weeks
    for(let i = r-1; i >= Math.max(0, r-10); i--) {
        for(let j=0; j<5; j++) {
            let oldCell = matkaData[i][j];
            let oldJodi = oldCell.includes('-') ? oldCell.split('-')[1] : oldCell;

            if(isMatch(currentJodi, oldJodi)) {
                drawDpbossLine(i, j, r, c);
            }
        }
    }
}

function isMatch(j1, j2) {
    if(!j1 || !j2 || j2=="**") return false;
    // 01-02-03 sequence logic or family
    let diff = Math.abs(parseInt(j1) - parseInt(j2));
    return (diff <= 3) || (j1[0] == j2[0]);
}

function drawDpbossLine(r1, c1, r2, c2) {
    const s = document.getElementById(`cell-${r1}-${c1}`);
    const e = document.getElementById(`cell-${r2}-${c2}`);
    const cvs = document.getElementById('lineCanvas');
    const ctx = cvs.getContext('2d');
    
    cvs.width = document.getElementById('chartArea').scrollWidth;
    cvs.height = document.getElementById('chartArea').scrollHeight;

    // Source Circle
    let circle = document.createElement('div');
    circle.className = 'pattern-circle';
    s.appendChild(circle);

    // Connecting Line
    ctx.beginPath();
    ctx.strokeStyle = "#2980b9";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.moveTo(s.offsetLeft + (s.offsetWidth/2), s.offsetTop + (s.offsetHeight/2));
    ctx.lineTo(e.offsetLeft + (e.offsetWidth/2), e.offsetTop + (e.offsetHeight/2));
    ctx.stroke();
}

function addRow() {
    matkaData.push([document.getElementById('m1').value, document.getElementById('m2').value, document.getElementById('m3').value, document.getElementById('m4').value, document.getElementById('m5').value]);
    save(); render();
}

function save() { localStorage.setItem('dpboss_v1', JSON.stringify(matkaData)); }
function resetCanvas() {
    const cvs = document.getElementById('lineCanvas');
    cvs.getContext('2d').clearRect(0,0,cvs.width, cvs.height);
    document.querySelectorAll('.pattern-circle').forEach(c => c.remove());
    document.querySelectorAll('td').forEach(t => t.classList.remove('selected-cell'));
}

render();
</script>
</body>
</html>
