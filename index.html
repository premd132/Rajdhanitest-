<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI Pattern Predictor</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --predict: #ff7b72; --line: #79c0ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .nav { display: flex; gap: 15px; margin-bottom: 20px; background: #161b22; padding: 15px; border-radius: 10px; border: 1px solid #30363d; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-scan { background: var(--predict); color: white; box-shadow: 0 0 10px rgba(255,123,114,0.5); }
        .btn-save { background: #238636; color: white; }
        
        .chart-box { position: relative; display: inline-block; background: #010409; border: 1px solid #30363d; padding: 5px; }
        table { border-collapse: collapse; position: relative; z-index: 2; }
        td { border: 1px solid #30363d; width: 60px; height: 50px; text-align: center; cursor: pointer; font-size: 1.2em; transition: 0.2s; }
        td:hover { background: #161b22; color: var(--accent); }
        
        .highlight-source { background: rgba(88, 166, 255, 0.2); border: 2px solid var(--accent); }
        .highlight-predict { background: rgba(255, 123, 114, 0.2); border: 2px solid var(--predict); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        
        /* Popup Styling */
        .prediction-popup { display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                           background: #161b22; border: 2px solid var(--predict); padding: 25px; border-radius: 15px; 
                           z-index: 1000; box-shadow: 0 0 30px rgba(0,0,0,0.8); width: 300px; text-align: center; }
        .prediction-popup h2 { color: var(--predict); margin-top: 0; }
        .prediction-popup .jodi-box { font-size: 2em; letter-spacing: 5px; margin: 15px 0; color: #fff; }
    </style>
</head>
<body>

    <div class="nav">
        <button class="btn-scan" onclick="runAIScanner()">AI Prediction Scanner</button>
        <button class="btn-save" onclick="exportCSV()">Save CSV</button>
        <button style="background:#30363d; color:white" onclick="document.getElementById('imp').click()">Edit/Import</button>
        <input type="file" id="imp" style="display:none" onchange="importCSV(this)">
    </div>

    <div class="chart-box" id="chartArea">
        <canvas id="canvas"></canvas>
        <table id="patternTable"></table>
    </div>

    <div id="predictPopup" class="prediction-popup">
        <h2>AI Prediction</h2>
        <p id="patternInfo">Pattern Found in Week 8</p>
        <div class="jodi-box" id="predJodi">--</div>
        <p><i>Check lines are marked on chart</i></p>
        <button onclick="closePopup()" style="background:var(--predict); color:white">Close & View Patterns</button>
    </div>

    <div style="margin-top:20px;">
        <input type="text" id="r1" placeholder="Mon">
        <input type="text" id="r2" placeholder="Tue">
        <input type="text" id="r3" placeholder="Wed">
        <input type="text" id="r4" placeholder="Thu">
        <input type="text" id="r5" placeholder="Fri">
        <button onclick="addNewRow()" style="background:var(--accent); color:white">Add Row</button>
    </div>

<script>
let data = JSON.parse(localStorage.getItem('pradeep_db')) || [];
const rashi = { '0':5, '1':6, '2':7, '3':8, '4':9, '5':0, '6':1, '7':2, '8':3, '9':4 };

function render() {
    const table = document.getElementById('patternTable');
    table.innerHTML = "";
    data.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.id = `cell-${r}-${c}`;
            td.innerText = cell || "**";
            td.onclick = () => showManualPattern(r, c);
            tr.appendChild(td);
        });
        table.appendChild(tr);
    });
}

// 1. AI Scanner & Prediction Logic
function runAIScanner() {
    if(data.length < 2) return alert("Pehle thoda data add karein!");
    
    clearUI();
    let lastRowIdx = data.length - 1;
    let predictions = [];
    
    // Scan logic: Check last 3 entries for patterns
    for(let i = 0; i < 5; i++) {
        let val = data[lastRowIdx][i];
        if(val && val !== "**") {
            // Find Match in Older Data
            for(let prevR = lastRowIdx - 1; prevR >= Math.max(0, lastRowIdx - 10); prevR--) {
                for(let prevC = 0; prevC < 5; prevC++) {
                    let oldVal = data[prevR][prevC];
                    if(isMatch(val, oldVal)) {
                        predictions.push({old: [prevR, prevC], new: [lastRowIdx, i], type: "Fam-to-Fam"});
                        drawCheckLine(prevR, prevC, lastRowIdx, i);
                    }
                }
            }
        }
    }

    // Generate a Probable Jodi based on found patterns
    if(predictions.length > 0) {
        let best = predictions[0];
        document.getElementById('predJodi').innerText = getFamily(data[best.old[0]][best.old[1]])[1]; // Logic to pick a family member
        document.getElementById('patternInfo').innerText = `Based on ${best.type} at Row ${best.old[0]+1}`;
        document.getElementById('predictPopup').style.display = 'block';
    } else {
        alert("No clear pattern found. Add more data!");
    }
}

function isMatch(v1, v2) {
    let fam = getFamily(v1);
    return fam.includes(v2) || Math.abs(parseInt(v1) - parseInt(v2)) <= 2;
}

function getFamily(j) {
    let d1 = j[0], d2 = j[1];
    let f1 = [d1, rashi[d1]], f2 = [d2, rashi[d2]];
    let res = [];
    f1.forEach(a => f2.forEach(b => res.push(`${a}${b}`, `${b}${a}`)));
    return res;
}

// 2. Check Line Drawing
function drawCheckLine(r1, c1, r2, c2) {
    const s = document.getElementById(`cell-${r1}-${c1}`);
    const e = document.getElementById(`cell-${r2}-${c2}`);
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');
    
    cvs.width = document.getElementById('chartArea').offsetWidth;
    cvs.height = document.getElementById('chartArea').offsetHeight;

    s.classList.add('highlight-source');
    e.classList.add('highlight-predict');

    ctx.beginPath();
    ctx.strokeStyle = '#79c0ff';
    ctx.lineWidth = 2;
    ctx.moveTo(s.offsetLeft + 30, s.offsetTop + 25);
    ctx.lineTo(e.offsetLeft + 30, e.offsetTop + 25);
    ctx.stroke();
    
    // Circle on pattern source
    ctx.beginPath();
    ctx.arc(s.offsetLeft + 30, s.offsetTop + 25, 20, 0, Math.PI*2);
    ctx.stroke();
}

// 3. Helpers
function addNewRow() {
    data.push([document.getElementById('r1').value, document.getElementById('r2').value, document.getElementById('r3').value, document.getElementById('r4').value, document.getElementById('r5').value]);
    localStorage.setItem('pradeep_db', JSON.stringify(data));
    render();
}

function clearUI() {
    const cvs = document.getElementById('canvas');
    cvs.getContext('2d').clearRect(0,0,cvs.width, cvs.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('highlight-source', 'highlight-predict'));
}

function closePopup() { document.getElementById('predictPopup').style.display = 'none'; }

function exportCSV() {
    let blob = new Blob([data.map(r=>r.join(",")).join("\n")], {type:'text/csv'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Pradeep_AI_Records.csv';
    a.click();
}

render();
</script>
</body>
</html>
