<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI – Pradeep Kumar Edition</title>
    <style>
        :root { --bg: #010409; --panel: #0d1117; --accent: #238636; --red: #f85149; --blue: #58a6ff; --gold: #d29922; }
        body { margin: 0; background: var(--bg); color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        
        .top-nav { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .btn { background: #21262d; border: 1px solid #363b42; color: #c9d1d9; padding: 7px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn:hover { background: #30363d; }
        .btn-primary { background: var(--accent); border-color: rgba(240,246,252,0.1); color: #fff; }

        .container { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px; }
        
        /* Table Box */
        .chart-card { background: #ffffff; padding: 20px; border-radius: 8px; position: relative; overflow: auto; min-height: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; width: 100%; color: #000; position: relative; z-index: 5; }
        th { background: #f6f8fa; color: #57606a; padding: 10px; border: 1px solid #d0d7de; font-size: 12px; }
        td { border: 1px solid #d0d7de; width: 50px; height: 50px; text-align: center; font-weight: 800; font-size: 1.2rem; cursor: pointer; position: relative; }
        
        /* Visual Markers */
        .circle-red { border: 3px solid var(--red); border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; margin: auto; color: var(--red); }
        .circle-blue { border: 3px solid var(--blue); border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; margin: auto; color: var(--blue); }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

        /* Sidebar Panels */
        .side-stack { display: flex; flex-direction: column; gap: 15px; }
        .panel { background: var(--panel); border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
        .panel-h { color: var(--gold); font-size: 14px; font-weight: 600; margin-bottom: 12px; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        
        .check-line { background: #161b22; border: 1px solid #30363d; padding: 10px; margin-top: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .check-line:hover { border-color: var(--blue); }
        
        .ai-badge { background: #d2992222; color: var(--gold); border: 1px solid var(--gold); padding: 3px 10px; border-radius: 12px; font-weight: 800; margin: 3px; display: inline-block; }

        #popOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .pop-box { background: #fff; padding: 20px; border-radius: 10px; color: #000; width: 90%; max-width: 500px; }
    </style>
</head>
<body>

<div class="top-nav">
    <div style="font-weight: 800; font-size: 18px;">RAJDHANI <span style="color:var(--gold)">AI PRO</span> <small style="font-size:10px; opacity:0.6">v5.0</small></div>
    <div style="display:flex; gap:8px;">
        <input type="file" id="csvFile" style="display:none" onchange="importCSV(this)">
        <button class="btn" onclick="document.getElementById('csvFile').click()">Import</button>
        <button class="btn" onclick="addRow()">+ Add Row</button>
        <button class="btn btn-primary" onclick="exportCSV()">Export</button>
    </div>
</div>

<div class="container">
    <div class="chart-card" id="mainChart">
        <svg id="mainSvg"></svg>
        <table id="mainTable"></table>
    </div>

    <div class="side-stack">
        <div class="panel">
            <div class="panel-h">🤖 FUTURE-AI PREDICTIONS</div>
            <div id="predictionList" style="text-align:center;">
                <span style="font-size:12px; opacity:0.5;">Click ** to analyze...</span>
            </div>
        </div>

        <div class="panel">
            <div class="panel-h">🎯 CHECK LINES (MAX 4)</div>
            <div id="checkLinesBox">
                <span style="font-size:12px; opacity:0.5;">Matches will appear here...</span>
            </div>
        </div>
    </div>
</div>

<div id="popOverlay" onclick="this.style.display='none'">
    <div class="pop-box" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Historical Match Detail</h3>
        <div style="position:relative">
            <svg id="popSvg"></svg>
            <table id="popTable" style="width:100%; border:1px solid #ddd"></table>
        </div>
    </div>
</div>

<script>
const FAM = {
    "01":["01","06","10","15","51","56","60","65"], "02":["02","07","20","25","52","57","70","75"],
    "03":["03","08","30","35","53","58","80","85"], "04":["04","09","40","45","54","59","90","95"],
    "05":["00","05","50","55"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "23":["23","28","32","37","73","78","82","87"]
};

let tableData = JSON.parse(localStorage.getItem("pradeep_data_v5")) || Array(25).fill().map(()=>Array(5).fill("**"));
let currentPattern = null;

const getF = (v) => { for(let k in FAM) if(FAM[k].includes(v)) return k; return null; };
const fixVal = (v) => { 
    let val = v.trim(); 
    if(val === "**" || val === "") return "**";
    return val.length === 1 ? "0" + val : val; 
};

function renderMain() {
    const tbl = document.getElementById("mainTable");
    let html = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    tableData.forEach((row, r) => {
        html += "<tr>";
        row.forEach((cell, c) => {
            let cls = "";
            if(currentPattern) {
                if(currentPattern.p1.some(p => p.r === r && p.c === c)) cls = "circle-red";
                if(currentPattern.p2.some(p => p.r === r && p.c === c)) cls = "circle-blue";
            }
            html += `<td onclick="analyzeCell(${r},${c})" contenteditable="true" onblur="saveCell(${r},${c},this.innerText)">
                <div class="${cls}">${cell}</div></td>`;
        });
        html += "</tr>";
    });
    tbl.innerHTML = html;
    drawSvg("mainSvg", "mainTable", currentPattern);
}

function saveCell(r, c, v) {
    tableData[r][c] = fixVal(v);
    localStorage.setItem("pradeep_data_v5", JSON.stringify(tableData));
    renderMain();
}

function addRow() { tableData.push(["**","**","**","**","**"]); renderMain(); }

function analyzeCell(r, c) {
    if(tableData[r][c] !== "**") return;
    
    // Pattern Scan Logic
    let p1 = [], p2 = [], f1 = null, f2 = null;
    
    // Scanning back 10 rows
    for(let i = r-1; i >= 0 && i >= r-10; i--) {
        for(let j=0; j<5; j++) {
            let val = tableData[i][j];
            if(val === "**") continue;
            let fam = getF(val);
            if(!f1) { f1 = fam; p1.push({r:i, c:j, v:val}); }
            else if((fam === f1 || val === p1[0].v) && p1.length < 3) p1.push({r:i, c:j, v:val});
            else if(!f2 && fam !== f1) { f2 = fam; p2.push({r:i, c:j, v:val}); }
            else if((fam === f2 || val === p2[0].v) && p2.length < 3) p2.push({r:i, c:j, v:val});
        }
    }

    if(p1.length > 0) {
        currentPattern = { p1, p2, f1, f2 };
        renderMain();
        getCheckLines(r);
        setAiPrediction(f1, f2);
    }
}

function drawSvg(svgId, tblId, pat) {
    const svg = document.getElementById(svgId);
    const tbl = document.getElementById(tblId);
    svg.innerHTML = "";
    if(!pat) return;

    const line = (pts, col) => {
        if(pts.length < 2) return;
        let d = "";
        pts.forEach((p, i) => {
            const cell = tbl.rows[p.r + 1].cells[p.c];
            const x = cell.offsetLeft + cell.offsetWidth/2;
            const y = cell.offsetTop + cell.offsetHeight/2;
            d += (i===0 ? "M " : " L ") + x + " " + y;
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", col);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-width", "3");
        path.setAttribute("stroke-dasharray", "5");
        svg.appendChild(path);
    };
    line(pat.p1, "#f85149");
    line(pat.p2, "#58a6ff");
}

function getCheckLines(rowIdx) {
    const box = document.getElementById("checkLinesBox");
    box.innerHTML = "";
    let matches = 0;

    for(let i=0; i < rowIdx - 4; i++) {
        // Soft match: Check if the row contains the same family or number
        let match = tableData[i].some(v => v === currentPattern.p1[0].v || getF(v) === currentPattern.f1);
        if(match) {
            matches++;
            let d = document.createElement("div");
            d.className = "check-line";
            d.innerHTML = `<b>Pattern Match</b><br><small>Week ${i+1}</small>`;
            d.onclick = () => showPop(i);
            box.appendChild(d);
        }
        if(matches >= 4) break;
    }
    if(matches === 0) box.innerHTML = "<small>No matches found.</small>";
}

function showPop(ri) {
    document.getElementById("popOverlay").style.display = "flex";
    const popTbl = document.getElementById("popTable");
    let h = "";
    let hp1 = [], hp2 = [];

    for(let i=0; i<4; i++) {
        let r = ri + i;
        if(!tableData[r]) continue;
        h += "<tr>";
        tableData[r].forEach((v, c) => {
            let cls = "";
            if(v === currentPattern.p1[0].v || getF(v) === currentPattern.f1) { cls="circle-red"; hp1.push({r:i, c}); }
            h += `<td><div class="${cls}">${v}</div></td>`;
        });
        h += "</tr>";
    }
    popTbl.innerHTML = h;
    setTimeout(() => drawSvg("popSvg", "popTable", {p1:hp1, p2:hp2}), 50);
}

function setAiPrediction(f1, f2) {
    const box = document.getElementById("predictionList");
    const pool = FAM[f1] || ["01","11","21"];
    const pairs = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
    box.innerHTML = pairs.map(p => `<span class="ai-badge">${p}</span>`).join("");
}

function exportCSV() {
    let csv = tableData.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'rajdhani_v5.csv';
    a.click();
}

function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        tableData = reader.result.trim().split("\n").map(l => l.split(","));
        localStorage.setItem("pradeep_data_v5", JSON.stringify(tableData));
        renderMain();
    };
    reader.readAsText(input.files[0]);
}

renderMain();
</script>
</body>
</html>
