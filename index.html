<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
    :root { --red: #ff0000; --blue: #0000ff; --green: #008000; --gold: #ffd600; }
    body { font-family: 'Arial', sans-serif; background: #000; color: #fff; margin: 0; text-align: center; }
    .header { background: #b71c1c; padding: 15px; border-bottom: 4px solid var(--gold); font-weight: bold; }
    
    .toolbar { background: #222; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; position: sticky; top: 0; z-index: 100; }
    button { padding: 8px 12px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; }
    
    /* Tools */
    .btn-red { background: var(--red); color: white; }
    .btn-blue { background: var(--blue); color: white; }
    .btn-green { background: var(--green); color: white; }
    .btn-master { background: var(--gold); color: black; font-size: 16px; margin-left: 10px; }
    .active { outline: 3px solid white; box-shadow: 0 0 10px white; }

    /* Table & Shapes */
    .chart-box { position: relative; margin: 20px auto; background: #fff; padding: 10px; display: inline-block; }
    table { border-collapse: collapse; color: #000; position: relative; z-index: 5; }
    td, th { border: 1px solid #aaa; width: 55px; height: 50px; text-align: center; font-weight: 900; font-size: 19px; }
    
    .f-red { border: 3px solid var(--red) !important; color: var(--red); background: rgba(255,0,0,0.1); }
    .f-blue { border: 3px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
    .f-green { border: 3px solid var(--green) !important; background: rgba(0,128,0,0.1); color: var(--green); }
    
    #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }
    .status { background: #111; color: #0f0; padding: 10px; font-family: monospace; text-align: left; }
</style>
</head>
<body>

<div class="header">DPBOSS KING - TOTAL FAMILY PATTERN SET SOLVER</div>

<div class="toolbar">
    <input type="file" id="csv" onchange="loadCSV()" style="color:white">
    <button class="btn-red active" onclick="setT('f-red', this)">RED (Base)</button>
    <button class="btn-green" onclick="setT('f-green', this)">GREEN (Touch 1)</button>
    <button class="btn-blue" onclick="setT('f-blue', this)">BLUE (Touch 2)</button>
    
    <select id="baseDay">
        <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
        <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
    </select>
    
    <button class="btn-master" onclick="matchFullSet()">MATCH FULL HISTORY</button>
    <button onclick="reset()">RESET</button>
</div>

<div class="chart-box" id="wrap">
    <canvas id="canvas"></canvas>
    <table id="mainT">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<div class="status" id="st">Ready. Mark Red, Green, and Blue families to scan history.</div>

<script>
let tool = 'f-red';
let chartData = [["80","30","25","41","51","61"],["12","22","32","42","52","62"],["13","23","33","43","53","63"],["14","24","34","44","54","64"],["85","80","70","45","55","65"]];

const families = {
    "00":["00","05","50","55"], "01":["01","06","10","15","51","56","60","65"],
    "02":["02","07","20","25","52","57","70","75"], "03":["03","08","30","35","53","58","80","85"],
    "04":["04","09","40","45","54","59","90","95"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "34":["34","39","43","48","84","89","93","98"]
};

function getF(v) {
    for(let k in families) if(families[k].includes(v)) return families[k];
    let palti = v.split('').reverse().join('');
    return [v, palti];
}

function render() {
    document.getElementById('tbody').innerHTML = chartData.map((row, r) => `<tr>${row.map((c, d) => 
        `<td onclick="apply(this)" contenteditable="true" onblur="chartData[${r}][${d}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    setTimeout(resz, 100);
}

function setT(t, btn) {
    tool = t;
    document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function apply(td) { td.className = td.className === tool ? "" : tool; }

function resz() {
    const c = document.getElementById('canvas');
    const w = document.getElementById('wrap');
    c.width = w.scrollWidth; c.height = w.scrollHeight;
}

function matchFullSet() {
    const day = parseInt(document.getElementById('baseDay').value);
    const table = document.getElementById('mainT');
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0,0,5000,5000);
    
    // 1. Identify "The Master Set" DNA
    let master = { base: null, relatives: [] };
    
    // Scan all rows to find user marks
    for(let r=0; r < chartData.length; r++) {
        let cell = table.rows[r+1].cells[day];
        if(cell.classList.contains('f-red')) {
            master.base = { val: chartData[r][day], row: r, col: day };
            break; 
        }
    }

    if(!master.base) { alert("Base (Red Box) mark karein!"); return; }

    // Find Green and Blue marks relative to the Red Base
    document.querySelectorAll('.f-green, .f-blue').forEach(m => {
        let mr = m.parentElement.rowIndex - 1;
        let md = m.cellIndex;
        master.relatives.push({
            val: chartData[mr][md],
            rDiff: mr - master.base.row,
            dDiff: md - master.base.col,
            type: m.className
        });
    });

    const baseFamily = getF(master.base.val);

    // 2. Scan History for Triple Family Match
    chartData.forEach((row, rIdx) => {
        // Find a matching Red Base Family
        if(baseFamily.includes(row[day]) && rIdx !== master.base.row) {
            
            let matchCount = 0;
            // Check if Green and Blue FAMILIES also match at the same distance
            master.relatives.forEach(rel => {
                let tr = rIdx + rel.rDiff;
                let td = day + rel.dDiff;
                if(chartData[tr] && chartData[tr][td]) {
                    let targetVal = chartData[tr][td];
                    if(getF(rel.val).includes(targetVal)) {
                        matchCount++;
                    }
                }
            });

            // If ALL relatives match their respective families
            if(matchCount === master.relatives.length) {
                const bCell = table.rows[rIdx+1].cells[day];
                bCell.classList.add('f-red');
                
                master.relatives.forEach(rel => {
                    let tr = rIdx + rel.rDiff;
                    let td = day + rel.dDiff;
                    const resCell = table.rows[tr+1].cells[td];
                    resCell.classList.add(rel.type);
                    
                    // Draw Professional Connection
                    ctx.strokeStyle = (rel.type.includes('green')) ? 'green' : 'blue';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(bCell.offsetLeft+28, bCell.offsetTop+25);
                    ctx.lineTo(resCell.offsetLeft+28, resCell.offsetTop+25);
                    ctx.stroke();
                });
            }
        }
    });
    document.getElementById('st').innerText = "History Scanned: All identical family-sets highlighted.";
}

function loadCSV() {
    const f = document.getElementById('csv').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        chartData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        render();
    };
    r.readAsText(f);
}

function reset() {
    document.querySelectorAll('td').forEach(t => t.className="");
    document.getElementById('canvas').getContext('2d').clearRect(0,0,10000,10000);
}

window.onload = render;
</script>
</body>
</html>
