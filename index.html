<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI – Pradeep Kumar (Fixed)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --red: #ff4757; --blue: #2e86de; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; text-align: center; }
        
        .nav { background: var(--panel); padding: 10px; border-bottom: 3px solid var(--gold); display: flex; gap: 8px; justify-content: center; position: sticky; top: 0; z-index: 100; }
        .table-container { position: relative; background: #fff; border-radius: 12px; padding: 5px; margin: 20px auto; display: inline-block; box-shadow: 0 0 30px #000; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1.5px solid #ccc; padding: 10px; text-align: center; font-weight: 900; width: 48px; height: 48px; cursor: pointer; }
        th { background: #1e293b; color: #fff; }
        
        .circle-red { border: 3.5px solid var(--red) !important; border-radius: 50% !important; background: rgba(255, 71, 87, 0.2); }
        .circle-blue { border: 3.5px solid var(--blue) !important; border-radius: 50% !important; background: rgba(46, 134, 222, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; border-top: 5px solid var(--gold); text-align: left; }
        .check-line { background: #262f3f; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 6px solid var(--blue); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 20px; display: none; z-index: 1000; padding: 25px; color: #000; width: 95%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 999; }
        button { cursor: pointer; font-weight: 800; border: none; border-radius: 8px; padding: 10px 18px; }
    </style>
</head>
<body>

<div class="nav">
    <input type="file" id="csv-file" style="display:none" accept=".csv">
    <button style="background:var(--blue); color:#fff;" onclick="document.getElementById('csv-file').click()">📂 LOAD CSV</button>
    <button style="background:#28a745; color:#fff;" onclick="saveState()">💾 SAVE</button>
    <button style="background:#dc3545; color:#fff;" onclick="hardReset()">🗑️ RESET</button>
</div>

<div class="table-container" id="main-wrap">
    <canvas id="mainCanvas"></canvas>
    <table id="dataTable"></table>
</div>

<div class="dashboard">
    <div class="card">
        <h3>✔ Matches (Check Line 1, 2, 3...)</h3>
        <div id="checks-container">Click any ** cell</div>
    </div>
    <div class="card">
        <h3>🔮 AI Prediction</h3>
        <div id="future-ai" style="font-size:30px; color:#00ff88; font-weight:900; text-align:center;">...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:red; color:#fff;">X</button>
    <h3 style="margin-top:0;">Pattern Trace</h3>
    <div id="popContent"></div>
</div>

<script>
const FAMILY = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["00","05","50","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
const STORAGE_KEY = "PRADEEP_ULTIMATE_V1";

let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(12).fill().map(()=>Array(5).fill("**"));
let currentMatches = [];

// Format 1 into 01, 2 into 02
function norm(v) {
    if(!v || v == "**" || v == "") return "**";
    v = v.trim();
    return v.length == 1 ? "0"+v : v;
}

function getFam(v){ 
    v = norm(v);
    for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; 
    return "NA"; 
}

function render() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    appData.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = "";
            currentMatches.forEach(m => {
                let off = ri - m.start;
                if(off >= 0 && off < m.shape.length && m.shape[off][ci] > 0) {
                    cls = m.shape[off][ci] === 1 ? "circle-red" : "circle-blue";
                }
            });
            h += `<td class="${cls}" contenteditable="true" onblur="updateCell(${ri},${ci},this)" onclick="analyze(${ri},${ci})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("dataTable").innerHTML = h;
    setTimeout(() => drawLines("mainCanvas", "dataTable"), 50);
}

function updateCell(r, c, el) {
    appData[r][c] = norm(el.innerText);
    render();
}

function analyze(r, c) {
    // Only trigger if cell is empty or **
    if(appData[r][c] !== "**" && appData[r][c] !== "") return;
    
    currentMatches = [];
    let b1="**", b2="**";
    let look = 8;
    let shape = Array(look + 1).fill().map(()=>Array(5).fill(0));

    for(let i=r-1; i>=Math.max(0, r-look); i--) {
        for(let j=0; j<5; j++) {
            let v = appData[i][j];
            if(v !== "**") {
                if(b1 === "**") { b1 = v; shape[i-(r-look)][j] = 1; }
                else if(getFam(v) === getFam(b1)) { shape[i-(r-look)][j] = 1; }
                else if(b2 === "**") { b2 = v; shape[i-(r-look)][j] = 2; }
                else if(getFam(v) === getFam(b2)) { shape[i-(r-look)][j] = 2; }
            }
        }
    }

    if(b1 === "**") return alert("Not enough data above to scan!");

    let matches = [];
    for(let i=0; i <= appData.length - shape.length; i++) {
        if(i === (r-look)) continue;
        let ok = true;
        for(let k=0; k<shape.length; k++) {
            for(let j=0; j<5; j++) {
                if(shape[k][j] === 1 && getFam(appData[i+k][j]) !== getFam(b1)) { ok = false; break; }
                if(shape[k][j] === 2 && getFam(appData[i+k][j]) !== getFam(b2)) { ok = false; break; }
            }
            if(!ok) break;
        }
        if(ok) matches.push({ start: i, shape: shape, col: c });
    }

    currentMatches = matches;
    updateDash(matches, c);
    render();
}

function updateDash(matches, col) {
    let list = "";
    let pool = [];
    matches.forEach((m, i) => {
        let resRow = m.start + m.shape.length;
        let val = appData[resRow] ? appData[resRow][col] : "**";
        if(val !== "**") pool.push(val);
        list += `<div class="check-line" onclick="openPop(${i})">
            <span>Check Line ${i+1}</span>
            <b style="color:var(--gold)">➔ ${val}</b>
        </div>`;
    });
    document.getElementById("checks-container").innerHTML = list || "No matches.";
    let top3 = [...new Set(pool)].slice(0, 3);
    document.getElementById("future-ai").innerHTML = top3.length ? top3.join(" - ") : "...";
}

function openPop(idx) {
    let m = currentMatches[idx];
    let h = "<div class='table-container' style='display:block;'><canvas id='popCanvas'></canvas><table id='popTbl'>";
    for(let i=0; i<m.shape.length; i++) {
        h += "<tr>";
        appData[m.start + i].forEach((v, j) => {
            let cls = m.shape[i][j] === 1 ? "circle-red" : (m.shape[i][j] === 2 ? "circle-blue" : "");
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popContent").innerHTML = h + "</table></div>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    setTimeout(() => drawLines("popCanvas", "popTbl"), 100);
}

function drawLines(cvId, containerId) {
    let cv = document.getElementById(cvId), ctx = cv.getContext("2d");
    let container = document.getElementById(containerId);
    if(!container) return;
    cv.width = container.offsetWidth; cv.height = container.offsetHeight;
    ctx.clearRect(0,0,cv.width,cv.height);
    let tRect = container.getBoundingClientRect();
    [".circle-red", ".circle-blue"].forEach(cls => {
        let cells = container.querySelectorAll(cls);
        if(cells.length < 2) return;
        ctx.strokeStyle = cls.includes("red") ? "#ff4757" : "#2e86de";
        ctx.lineWidth = 3; ctx.beginPath();
        cells.forEach((c, idx) => {
            let r = c.getBoundingClientRect();
            let x = r.left - tRect.left + r.width/2;
            let y = r.top - tRect.top + r.height/2;
            if(idx === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    });
}

function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); alert("Saved!"); }
function hardReset(){ if(confirm("Reset all data?")){ localStorage.clear(); location.reload(); }}
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv-file").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        appData = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v.trim())).slice(0,5));
        render();
    };
    fr.readAsText(e.target.files[0]);
};
window.onload = render;
</script>
</body>
</html>
