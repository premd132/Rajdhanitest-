<script>
/* ================= CONFIG ================= */
const STORAGE_KEY="pdata_Kalyan_DUAL";
const families={
 "12":["12","17","21","26","62","67","71","76"],
 "13":["13","18","31","36","63","68","81","86"],
 "14":["14","19","41","46","64","69","91","96"],
 "15":["01","06","10","15","51","56","60","65"],
 "23":["23","28","32","37","73","78","82","87"],
 "24":["24","29","42","47","74","79","92","97"],
 "25":["02","07","20","25","52","57","70","75"],
 "34":["34","39","43","48","84","89","93","98"],
 "35":["03","08","30","35","53","58","80","85"],
 "45":["04","09","40","45","54","59","90","95"],
 "HR":["05","16","27","38","49","50","61","72","83","94"],
 "FR":["00","11","22","33","44","55","66","77","88","99"]
};

/* ================= DATA ================= */
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
 ["40","92","89","81","10"],
 ["29","05","03","87","43"],
 ["19","35","38","36","81"],
 ["20","00","17","57","45"],
 ["42","92","43","57","22"],
 ["37","86","27","80","85"],
 ["41","76","67","47","27"],
 ["63","75","71","05","64"],
 ["86","73","34","46","67"],
 ["33","09","08","84","62"],
 ["**","**","**","**","**"]
];

/* ================= HELPERS ================= */
const fam = v => Object.keys(families).find(f=>families[f].includes(v));
const norm=v=>v=="**"?"**":String(v).padStart(2,"0");

/* ================= DRAW TABLE ================= */
function draw(){
 let h="";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   h+=`<td contenteditable onclick="pickDual(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
}
draw();

/* ================= DUAL PATTERN ================= */
let dualMarks=null;

function pickDual(r,c){
 let base1=null, base2=null;

 // last jodi
 for(let i=r;i>=0;i--) if(data[i][c]!="**"){ base1=data[i][c]; break; }
 // second last jodi
 for(let i=r-1;i>=0;i--) if(data[i][c]!="**"){ base2=data[i][c]; break; }

 if(!base1||!base2) return;

 dualMarks = {
  f1:fam(base1),
  f2:fam(base2),
  points1:[],
  points2:[]
 };

 scanDual();
 drawDual();
 showAI();
}

/* ================= SCAN DUAL FAMILY ================= */
function scanDual(){
 dualMarks.points1=[];
 dualMarks.points2=[];
 data.forEach((row,ri)=>{
  row.forEach((v,ci)=>{
   if(v!="**"){
    if(fam(v)==dualMarks.f1) dualMarks.points1.push({r:ri,c:ci});
    if(fam(v)==dualMarks.f2) dualMarks.points2.push({r:ri,c:ci});
   }
  });
 });
}

/* ================= DRAW CIRCLES + LINES ================= */
function drawDual(){
 document.querySelectorAll("td").forEach(td=>td.className="");

 dualMarks.points1.forEach(p=>{
  tbl.rows[p.r].cells[p.c].style.border="3px solid red";
  tbl.rows[p.r].cells[p.c].style.background="rgba(255,0,0,0.15)";
 });

 dualMarks.points2.forEach(p=>{
  tbl.rows[p.r].cells[p.c].style.border="3px solid blue";
  tbl.rows[p.r].cells[p.c].style.background="rgba(0,132,255,0.15)";
 });

 drawLines("red");
 drawLines("blue");
}

function drawLines(type){
 const cvs=mainCanvas;
 const ctx=cvs.getContext("2d");
 cvs.width=tbl.offsetWidth;
 cvs.height=tbl.offsetHeight;
 ctx.clearRect(0,0,cvs.width,cvs.height);

 let pts = type=="red"?dualMarks.points1:dualMarks.points2;
 if(pts.length<2) return;

 ctx.beginPath();
 ctx.strokeStyle= type=="red" ? "red" : "#0084ff";
 ctx.lineWidth=2.5;

 const rect=tbl.getBoundingClientRect();
 pts.forEach((p,i)=>{
  const td=tbl.rows[p.r].cells[p.c].getBoundingClientRect();
  let x=td.left-rect.left+td.width/2;
  let y=td.top-rect.top+td.height/2;
  if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
 });
 ctx.stroke();
}

/* ================= AI PANEL ================= */
function showAI(){
 ai.innerHTML=`
 <b>Dual Family Detected</b><br>
 🔴 Family-A : ${dualMarks.f1}<br>
 🔵 Family-B : ${dualMarks.f2}<br>
 Pattern Flow : Diagonal / Zig-Zag
 `;
 future.innerHTML=`
 Probable Next Families:<br>
 ${dualMarks.f1} , ${dualMarks.f2}
 `;
}

/* ================= SAVE / LOAD ================= */
function saveData(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
 alert("Saved");
}
function clearData(){
 localStorage.clear(); location.reload();
}
</script>
