<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rajdhani Cross Pattern Pro</title>
<style>
body{font-family:Arial;margin:20px;background:#111;color:#fff}
table{border-collapse:collapse;margin-top:10px}
td{
  border:1px solid #444;
  width:60px;height:40px;
  text-align:center;
  cursor:pointer;
  position:relative;
}
td:hover{background:#222}
input{margin:5px}
button{margin:5px;padding:6px 12px}
#strengthPanel{margin-top:15px;font-size:18px;color:#0f0}
canvas{
  position:absolute;
  top:0;left:0;
  pointer-events:none;
}
</style>
</head>
<body>

<h2>Rajdhani Cross Pattern System</h2>

<input type="file" id="csvFile">
<button onclick="downloadCSV()">Save CSV</button>
<button onclick="addRow()">Add Row</button>

<div id="strengthPanel"></div>

<div style="position:relative">
<table id="dataTable"></table>
<canvas id="canvas"></canvas>
</div>

<script>
let data=[];
let patterns={};
let maxScan=7;

const table=document.getElementById("dataTable");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
  canvas.width=table.offsetWidth;
  canvas.height=table.offsetHeight;
}
window.onresize=resizeCanvas;

document.getElementById("csvFile").addEventListener("change",function(e){
  const reader=new FileReader();
  reader.onload=function(){
    let rows=reader.result.trim().split("\n");
    data=rows.map(r=>r.split(","));
    renderTable();
  }
  reader.readAsText(e.target.files[0]);
});

function renderTable(){
  table.innerHTML="";
  data.forEach((row,r)=>{
    let tr=document.createElement("tr");
    row.forEach((cell,c)=>{
      let td=document.createElement("td");
      td.textContent=cell;
      td.dataset.row=r;
      td.dataset.col=c;
      td.onclick=cellClick;
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  resizeCanvas();
}

function cellClick(e){
  let r=parseInt(this.dataset.row);
  let c=parseInt(this.dataset.col);

  if(this.textContent==="**"){
    let id=r+"_"+c;
    let pattern=buildCrossPattern(r,c);
    patterns[id]=pattern;
    let matches=matchPattern(pattern);
    drawMatches(matches);
    showStrength(matches);
  }else{
    let val=prompt("Edit value:",this.textContent);
    if(val!==null){
      data[r][c]=val.padStart(2,"0");
      renderTable();
    }
  }
}

function addRow(){
  let cols=data[0]?.length||7;
  let newRow=new Array(cols).fill("**");
  data.push(newRow);
  renderTable();
}

function downloadCSV(){
  let csv=data.map(r=>r.join(",")).join("\n");
  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="updated.csv";
  a.click();
}

function fam(num){
  if(num==="**")return null;
  const map={
    "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"],
    "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"],
    "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"],
    "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"],
    "45":["04","09","40","45","54","59","90","95"],
    "HR":["05","16","27","38","49","50","61","72","83","94"],
    "FR":["00","11","22","33","44","55","66","77","88","99"]
  };
  for(let k in map){
    if(map[k].includes(num))return k;
  }
  return null;
}

function buildCrossPattern(r,c){
  let collected=[];
  for(let i=r-1;i>=Math.max(0,r-maxScan);i--){
    let val=data[i][c];
    if(val!=="**")collected.push(val);
  }

  let familyCount={};
  collected.forEach(v=>{
    let f=fam(v);
    if(!familyCount[f])familyCount[f]=[];
    if(familyCount[f].length<2)
      familyCount[f].push(v);
  });

  let sorted=Object.keys(familyCount)
    .sort((a,b)=>familyCount[b].length-familyCount[a].length)
    .slice(0,2);

  return{
    base:[r,c],
    families:sorted,
    leftUp:fam(data[r-1]?.[c-1]),
    rightUp:fam(data[r-1]?.[c+1]),
    topMid:fam(data[r-2]?.[c])
  };
}

function matchPattern(current){
  let matches=[];
  for(let r=2;r<data.length;r++){
    for(let c=1;c<data[0].length-1;c++){
      let test=buildCrossPattern(r,c);
      let score=0;

      if(JSON.stringify(test.families)===JSON.stringify(current.families))
        score+=50;

      if(test.leftUp===current.leftUp &&
         test.rightUp===current.rightUp)
        score+=30;

      if(test.topMid===current.topMid)
        score+=20;

      if(score>=80)
        matches.push({r,c,score});
    }
  }
  return matches;
}

function center(td){
  let rect=td.getBoundingClientRect();
  let parent=table.getBoundingClientRect();
  return{
    x:rect.left-parent.left+rect.width/2,
    y:rect.top-parent.top+rect.height/2
  };
}

function drawMatches(matches){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  matches.forEach(m=>{
    let r=m.r,c=m.c;
    let base=table.rows[r].cells[c];
    let l=table.rows[r-1].cells[c-1];
    let ri=table.rows[r-1].cells[c+1];
    let t=table.rows[r-2].cells[c];

    let b=center(base);
    let cl=center(l);
    let cr=center(ri);
    let ct=center(t);

    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(cl.x,cl.y);
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(cr.x,cr.y);
    ctx.moveTo(cl.x,cl.y);
    ctx.lineTo(ct.x,ct.y);
    ctx.moveTo(cr.x,cr.y);
    ctx.lineTo(ct.x,ct.y);
    ctx.strokeStyle="lime";
    ctx.stroke();
  });
}

function showStrength(matches){
  if(matches.length===0){
    document.getElementById("strengthPanel").innerText="No Strong Match";
  }else{
    let max=Math.max(...matches.map(m=>m.score));
    document.getElementById("strengthPanel").innerText=
      "Strongest Pattern: "+max+"%  | Matches: "+matches.length;
  }
}
</script>

</body>
</html>
