<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
    body { font-family: Arial; background: #1a1a1a; color: white; text-align: center; }
    .header { background: #b71c1c; padding: 10px; border-bottom: 3px solid #ffd600; font-weight: bold; }
    .controls { background: #333; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    
    .chart-box { position: relative; margin: 20px auto; display: inline-block; background: white; padding: 5px; border-radius: 4px; }
    table { border-collapse: collapse; color: black; position: relative; z-index: 2; }
    td, th { border: 1px solid #ccc; width: 55px; height: 50px; text-align: center; font-weight: bold; position: relative; }
    
    /* Box & Circle Styles from Screenshots */
    .base-box { border: 3px solid red !important; background: rgba(255,0,0,0.1); color: red; }
    .pattern-circle { border: 3px solid blue !important; border-radius: 50%; color: blue; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
    
    button { padding: 10px; cursor: pointer; background: #ffd600; border: none; font-weight: bold; border-radius: 4px; }
    .btn-blue { background: #2196F3; color: white; }
</style>
</head>
<body>

<div class="header">ISMART GUESSING - 3rd TOUCH PATTERN</div>

<div class="controls">
    <input type="file" id="csvInp" accept=".csv" onchange="loadCSV()">
    <select id="daySel">
        <option value="0">Mon</option><option value="1">Tue</option><option value="2">Wed</option>
        <option value="3">Thu</option><option value="4">Fri</option><option value="5">Sat</option>
    </select>
    <button class="btn-blue" onclick="runSmartCheck()">RUN CHECK LINE</button>
    <button onclick="saveData()">SAVE CHART</button>
</div>

<div class="chart-box" id="container">
    <canvas id="lineCanvas"></canvas>
    <table id="matkaTable">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
let chartData = JSON.parse(localStorage.getItem('pro_data')) || [
    ["12","37","45","67","89","00"],["56","23","11","90","44","33"],
    ["32","82","77","12","05","99"],["10","20","30","40","50","60"],
    ["87","37","14","25","36","47"],["21","73","00","11","22","33"]
];

const families = {
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"], "45":["04","09","40","45","54","59","90","95"]
};

function getFamilyMembers(jodi) {
    for(let key in families) if(families[key].includes(jodi)) return families[key];
    return [jodi, jodi.split('').reverse().join('')];
}

function initTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = chartData.map((row, r) => `<tr>${row.map((c, i) => 
        `<td contenteditable onblur="updateCell(${r},${i},this.innerText)">${c}</td>`).join('')}</tr>`).join('');
    resizeCanvas();
}

function updateCell(r, i, val) { chartData[r][i] = val; }

function resizeCanvas() {
    const c = document.getElementById('lineCanvas');
    const box = document.getElementById('container');
    c.width = box.clientWidth; c.height = box.clientHeight;
}

function runSmartCheck() {
    clearAll();
    const day = parseInt(document.getElementById('daySel').value);
    const ctx = document.getElementById('lineCanvas').getContext('2d');
    const table = document.getElementById('matkaTable');

    // 1. Niche se Base Jodi uthao (Last Row)
    const baseJodiValue = chartData[chartData.length - 1][day];
    const familyMembers = getFamilyMembers(baseJodiValue);

    // 2. Scan Chart for Family
    chartData.forEach((row, rIdx) => {
        if(familyMembers.includes(row[day])) {
            let baseCell = table.rows[rIdx+1].cells[day];
            baseCell.classList.add('base-box');

            // 3. Pattern Draw (Base ke thik niche wali row ko circle karega)
            if(rIdx + 1 < chartData.length) {
                let resCell = table.rows[rIdx+2].cells[day];
                resCell.classList.add('pattern-circle');

                // Draw Tirchi Line (Diagonal) as per screenshot
                ctx.strokeStyle = "blue"; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(baseCell.offsetLeft + 27, baseCell.offsetTop + 25);
                ctx.lineTo(resCell.offsetLeft + 27, resCell.offsetTop + 25);
                ctx.stroke();
            }
        }
    });
}

function clearAll() {
    document.querySelectorAll('td').forEach(t => t.className = "");
    const canvas = document.getElementById('lineCanvas');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function loadCSV() {
    const file = document.getElementById('csvInp').files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        chartData = e.target.result.split("\n").map(r => r.split(",").map(c => c.trim()));
        initTable();
    };
    reader.readAsText(file);
}

function saveData() { localStorage.setItem('pro_data', JSON.stringify(chartData)); alert("Saved!"); }

window.onload = initTable;
</script>
</body>
</html>
