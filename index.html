<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
    :root { --red: #ff0000; --blue: #0000ff; --green: #008000; }
    body { font-family: 'Arial', sans-serif; background: #111; color: #fff; margin: 0; text-align: center; }
    .nav { background: #b71c1c; padding: 10px; border-bottom: 3px solid #ffd600; font-weight: bold; }
    .toolbar { background: #222; padding: 10px; display: flex; justify-content: center; gap: 10px; sticky: top; }
    
    button { padding: 8px 15px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; }
    .t-red { background: var(--red); color: #fff; }
    .t-green { background: var(--green); color: #fff; }
    .t-blue { background: var(--blue); color: #fff; }
    .btn-exec { background: #ffd600; color: #000; font-size: 15px; }
    .active { outline: 3px solid #fff; scale: 1.1; }

    .chart-box { position: relative; margin: 20px auto; background: #fff; padding: 10px; display: inline-block; border-radius: 4px; }
    table { border-collapse: collapse; color: #000; z-index: 5; position: relative; }
    td, th { border: 1px solid #ccc; width: 55px; height: 50px; text-align: center; font-weight: 900; font-size: 18px; }
    
    .f-red { border: 3px solid var(--red) !important; color: var(--red); background: rgba(255,0,0,0.1); }
    .f-green { border: 3px solid var(--green) !important; background: rgba(0,128,0,0.1); color: var(--green); }
    .f-blue { border: 3px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
    
    #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }
    .log { background: #000; color: #0f0; padding: 8px; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>

<div class="nav">DPBOSS KING - DEEP PATTERN DNA SCANNER</div>

<div class="toolbar">
    <input type="file" id="csv" onchange="loadCSV()" style="color:#fff">
    <button class="t-red active" onclick="setT('f-red', this)">RED (Base)</button>
    <button class="t-green" onclick="setT('f-green', this)">GREEN (Touch)</button>
    <button class="t-blue" onclick="setT('f-blue', this)">BLUE (Touch)</button>
    <select id="day">
        <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
        <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
    </select>
    <button class="btn-exec" onclick="deepSearch()">EXECUTE SEARCH</button>
</div>

<div class="chart-box" id="box">
    <canvas id="canvas"></canvas>
    <table id="mainT">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<div class="log" id="status">Status: Ready. Mark your patterns in the bottom rows.</div>

<script>
let tool = 'f-red';
let chart = [["10","20","30","40","50","60"],["11","21","31","41","51","61"],["12","22","32","42","52","62"],["13","23","33","43","53","63"],["14","24","34","44","54","64"]];

// Advanced Family Map
function getFamily(val) {
    let n = parseInt(val);
    if(isNaN(n)) return [val];
    let d1 = Math.floor(n/10), d2 = n%10;
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let fam = new Set();
    [d1, c1].forEach(a => {
        [d2, c2].forEach(b => {
            fam.add(`${a}${b}`);
            fam.add(`${b}${a}`);
        });
    });
    return Array.from(fam);
}

function render() {
    document.getElementById('tbody').innerHTML = chart.map((r, ri) => `<tr>${r.map((c, ci) => 
        `<td onclick="mark(this)" contenteditable="true" onblur="chart[${ri}][${ci}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    setTimeout(rsz, 100);
}

function setT(t, b) { tool = t; document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }
function mark(td) { td.className = td.className === tool ? "" : tool; }
function rsz() { const c = document.getElementById('canvas'), b = document.getElementById('box'); c.width = b.scrollWidth; c.height = b.scrollHeight; }

function deepSearch() {
    const selDay = parseInt(document.getElementById('day').value);
    const table = document.getElementById('mainT');
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0,0,5000,5000);
    
    let master = { base: null, touches: [] };
    
    // 1. Scan the pattern you created
    for(let r=0; r<chart.length; r++) {
        if(table.rows[r+1].cells[selDay].classList.contains('f-red')) {
            master.base = { val: chart[r][selDay], r: r, c: selDay };
            break;
        }
    }

    if(!master.base) { alert("Pehle niche kisi jodi ko RED karein!"); return; }

    document.querySelectorAll('.f-green, .f-blue').forEach(m => {
        let mr = m.parentElement.rowIndex-1, mc = m.cellIndex;
        master.touches.push({ val: chart[mr][mc], rd: mr - master.base.r, cd: mc - master.base.c, type: m.className });
    });

    const baseFam = getFamily(master.base.val);

    // 2. Scan History
    chart.forEach((row, ri) => {
        if(baseFam.includes(row[selDay]) && ri !== master.base.r) {
            let matchCount = 0;
            master.touches.forEach(t => {
                let tr = ri + t.rd, tc = selDay + t.cd;
                if(chart[tr] && getFamily(t.val).includes(chart[tr][tc])) matchCount++;
            });

            if(matchCount === master.touches.length) {
                const bCell = table.rows[ri+1].cells[selDay];
                bCell.classList.add('f-red');
                master.touches.forEach(t => {
                    const tCell = table.rows[ri+t.rd+1].cells[selDay+t.cd];
                    tCell.classList.add(t.type);
                    ctx.strokeStyle = t.type.includes('green') ? 'green' : 'blue';
                    ctx.beginPath(); ctx.moveTo(bCell.offsetLeft+27, bCell.offsetTop+25);
                    ctx.lineTo(tCell.offsetLeft+27, tCell.offsetTop+25); ctx.stroke();
                });
            }
        }
    });
    document.getElementById('status').innerText = "Search Complete. Identical family sets linked.";
}

function loadCSV() {
    const f = document.getElementById('csv').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        chart = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        render();
    };
    r.readAsText(f);
}

window.onload = render;
</script>
</body>
</html>
