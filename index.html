<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI – Advanced Pattern Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; 
            --red: #ef4444; --blue: #3b82f6; --text: #f8fafc;
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        header { background: var(--card); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .btn { background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }
        .btn-alt { background: #475569; }

        .main-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px; max-width: 1400px; margin: auto; }
        
        /* Table Styling */
        .table-container { background: var(--card); padding: 20px; border-radius: 12px; position: relative; overflow-x: auto; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        table { border-collapse: collapse; width: 100%; position: relative; z-index: 2; }
        th { background: #334155; color: #94a3b8; padding: 12px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        td { border: 1px solid #334155; width: 50px; height: 50px; text-align: center; font-weight: 700; font-size: 1.1rem; cursor: cell; transition: 0.2s; position: relative; }
        td:hover { background: #2d3748; }
        td:focus { outline: 2px solid var(--accent); background: #1e293b; }

        /* Pattern Markers */
        .circle-1 { border: 3px solid var(--red); border-radius: 50%; width: 35px; height: 35px; display: inline-flex; align-items: center; justify-content: center; color: var(--red); box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        .circle-2 { border: 3px solid var(--blue); border-radius: 50%; width: 35px; height: 35px; display: inline-flex; align-items: center; justify-content: center; color: var(--blue); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }

        /* Sidebar Check Lines */
        .sidebar { background: var(--card); border-radius: 12px; padding: 20px; height: fit-content; }
        .check-item { background: #0f172a; border-left: 4px solid var(--accent); padding: 12px; margin-bottom: 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .check-item:hover { background: #1e293b; transform: scale(1.02); }
        .check-item small { color: #94a3b8; display: block; }

        /* Overlay Canvas */
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }

        /* Popup */
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .pop-content { background: var(--card); padding: 30px; border-radius: 16px; position: relative; border: 1px solid #475569; }
        
        .empty-cell { color: #475569; font-weight: 400; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 800; font-size: 1.5rem; color: var(--accent);">RAJDHANI <span style="color:#fff">PRO AI</span></div>
    <div style="display:flex; gap:10px">
        <input type="file" id="csvFile" style="display:none">
        <button class="btn btn-alt" onclick="document.getElementById('csvFile').click()">Import CSV</button>
        <button class="btn btn-alt" onclick="saveCSV()">Export CSV</button>
        <button class="btn" onclick="addRow()">+ New Row</button>
    </div>
</header>

<div class="main-layout">
    <div class="table-container" id="mainContainer">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>

    <div class="sidebar">
        <h3 style="margin-top:0">🎯 Check Lines</h3>
        <p id="noPattern" style="color:#64748b; font-size:0.9rem">Click a blank cell (**) to analyze patterns from previous weeks.</p>
        <div id="checkResults"></div>
    </div>
</div>

<div id="popup" onclick="this.style.display='none'">
    <div class="pop-content" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Old Record Match</h3>
        <div style="position:relative">
            <canvas id="popCanvas"></canvas>
            <table id="popTbl"></table>
        </div>
        <button class="btn" style="margin-top:20px; width:100%" onclick="document.getElementById('popup').style.display='none'">Close View</button>
    </div>
</div>

<script>
/* FAMILY LOGIC */
const FAMILY = {
    "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"],
    "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"],
    "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"],
    "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"],
    "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem("rajdhani_v2")) || Array(30).fill().map(() => Array(5).fill("**"));
let currentPattern = null;

const getFam = (v) => {
    for (let k in FAMILY) if (FAMILY[k].includes(v)) return k;
    return null;
};

/* RENDER TABLE */
function render() {
    const tbl = document.getElementById("tbl");
    let html = "<thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr></thead><tbody>";
    
    data.forEach((row, rIdx) => {
        html += "<tr>";
        row.forEach((cell, cIdx) => {
            let content = cell;
            let cls = "";
            if(currentPattern) {
                if(currentPattern.p1.some(p => p.r === rIdx && p.c === cIdx)) cls = "circle-1";
                if(currentPattern.p2.some(p => p.r === rIdx && p.c === cIdx)) cls = "circle-2";
            }
            const display = content === "**" ? `<span class="empty-cell">**</span>` : content;
            html += `<td contenteditable="true" onblur="updateCell(${rIdx},${cIdx},this.innerText)" onclick="handleCellClick(${rIdx},${cIdx})">
                <div class="${cls}">${display}</div>
            </td>`;
        });
        html += "</tr>";
    });
    tbl.innerHTML = html + "</tbody>";
    
    if(currentPattern) drawLines("mainCanvas", "tbl", currentPattern);
}

function updateCell(r, c, val) {
    data[r][c] = val.trim();
    localStorage.setItem("rajdhani_v2", JSON.stringify(data));
    currentPattern = null;
    render();
}

function addRow() {
    data.push(["**","**","**","**","**"]);
    render();
}

/* PATTERN ENGINE */
function handleCellClick(r, c) {
    if (data[r][c] !== "**") return;
    
    // Look back 10 weeks for patterns
    let p1 = [], p2 = [];
    let foundFams = [];

    for (let i = r - 1; i >= 0 && i >= r - 10; i--) {
        for (let j = 0; j < 5; j++) {
            let f = getFam(data[i][j]);
            if (f) {
                if (foundFams.length === 0) {
                    foundFams.push(f);
                    p1.push({r: i, c: j, f: f});
                } else if (f === foundFams[0] && p1.length < 3) {
                    p1.push({r: i, c: j, f: f});
                } else if (foundFams.length === 1 && f !== foundFams[0]) {
                    foundFams.push(f);
                    p2.push({r: i, c: j, f: f});
                } else if (f === foundFams[1] && p2.length < 3) {
                    p2.push({r: i, c: j, f: f});
                }
            }
        }
    }

    if (p1.length >= 2) {
        currentPattern = { p1, p2 };
        document.getElementById("noPattern").style.display = "none";
        render();
        generateCheckLines();
    } else {
        alert("No clear pattern found in the last 10 rows.");
    }
}

/* DRAWING LOGIC */
function drawLines(canvasId, tableId, pattern) {
    const canvas = document.getElementById(canvasId);
    const table = document.getElementById(tableId);
    const ctx = canvas.getContext("2d");
    
    canvas.width = table.offsetWidth;
    canvas.height = table.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const drawPath = (points, color) => {
        if (points.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);

        points.forEach((p, i) => {
            const cell = table.rows[p.r + 1].cells[p.c];
            const x = cell.offsetLeft + cell.offsetWidth / 2;
            const y = cell.offsetTop + cell.offsetHeight / 2;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();
    };

    drawPath(pattern.p1, "#ef4444");
    drawPath(pattern.p2, "#3b82f6");
}

/* CHECK LINES SEARCH */
function generateCheckLines() {
    const container = document.getElementById("checkResults");
    container.innerHTML = "";
    
    // Logic: Look for where these same families appeared together in history
    let matches = [];
    for (let i = 0; i < data.length - 5; i++) {
        let rowFams = data[i].map(v => getFam(v));
        if (rowFams.includes(currentPattern.p1[0].f)) {
            matches.push(i);
        }
    }

    matches.slice(0, 4).forEach((matchRow, idx) => {
        const div = document.createElement("div");
        div.className = "check-item";
        div.innerHTML = `<small>Pattern Match #${idx+1}</small>Row Found: ${matchRow + 1}`;
        div.onclick = () => showOldRecord(matchRow);
        container.appendChild(div);
    });
}

function showOldRecord(startRow) {
    const popTbl = document.getElementById("popTbl");
    const popup = document.getElementById("popup");
    popup.style.display = "flex";
    
    let html = "<tr><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th></tr>";
    let popPattern = { p1: [], p2: [] };

    for (let i = 0; i < 3; i++) {
        let rIdx = startRow + i;
        if (!data[rIdx]) continue;
        html += "<tr>";
        data[rIdx].forEach((cell, cIdx) => {
            let f = getFam(cell);
            let cls = "";
            if (f === currentPattern.p1[0].f) {
                cls = "circle-1";
                popPattern.p1.push({r: i, c: cIdx});
            }
            html += `<td><div class="${cls}">${cell}</div></td>`;
        });
        html += "</tr>";
    }
    popTbl.innerHTML = html;
    
    setTimeout(() => drawLines("popCanvas", "popTbl", popPattern), 100);
}

/* CSV EXPORT */
function saveCSV() {
    let content = data.map(r => r.join(",")).join("\n");
    let blob = new Blob([content], {type: 'text/csv'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `Rajdhani_Records_${new Date().toLocaleDateString()}.csv`;
    a.click();
}

// File Upload
document.getElementById('csvFile').addEventListener('change', function(e) {
    let reader = new FileReader();
    reader.onload = function() {
        data = reader.result.trim().split("\n").map(line => line.split(","));
        render();
    };
    reader.readAsText(e.target.files[0]);
});

render();
</script>
</body>
</html>
