<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI – Real Pattern Fixed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --red: #ff4757; --blue: #2e86de; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; }
        
        /* Header & Controls */
        .header { background: #1e293b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
        .btn { background: var(--accent); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-left: 10px; }
        
        .main-container { display: flex; gap: 20px; padding: 20px; }
        
        /* Table Styling */
        .table-wrap { position: relative; background: #fff; border-radius: 8px; overflow: hidden; height: fit-content; }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 2; }
        th { background: #1e293b; color: #fff; width: 60px; height: 40px; }
        td { border: 1px solid #ddd; width: 60px; height: 60px; text-align: center; font-weight: 800; font-size: 1.2rem; cursor: pointer; position: relative; }
        
        /* Circles */
        .circle-red { border: 4px solid var(--red); border-radius: 50%; width: 45px; height: 45px; display: inline-flex; align-items: center; justify-content: center; margin: auto; }
        .circle-blue { border: 4px solid var(--blue); border-radius: 50%; width: 45px; height: 45px; display: inline-flex; align-items: center; justify-content: center; margin: auto; }

        /* SVG Connection Lines */
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .line-red { stroke: var(--red); stroke-width: 3; fill: none; stroke-dasharray: 5; }
        .line-blue { stroke: var(--blue); stroke-width: 3; fill: none; stroke-dasharray: 5; }

        /* Check Lines Sidebar */
        .sidebar { width: 300px; background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        .check-card { background: #0f172a; border-left: 5px solid var(--accent); padding: 12px; margin-bottom: 12px; cursor: pointer; transition: 0.3s; }
        .check-card:hover { transform: translateX(5px); background: #1e293b; }

        /* Popup */
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .pop-box { background: white; padding: 20px; border-radius: 15px; color: #000; position: relative; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 1.5rem; font-weight: 800;">RAJDHANI <span style="color:var(--accent)">PRO AI</span></div>
    <div>
        <input type="file" id="csvInput" style="display:none" onchange="loadCSV(this)">
        <button class="btn" onclick="document.getElementById('csvInput').click()">Upload CSV</button>
        <button class="btn" style="background:#475569" onclick="addRow()">Add Row</button>
        <button class="btn" style="background:#10b981" onclick="exportCSV()">Save CSV</button>
    </div>
</div>

<div class="main-container">
    <div class="table-wrap" id="mainWrapper">
        <svg id="mainSvg"></svg>
        <table id="mainTbl"></table>
    </div>

    <div class="sidebar">
        <h3 style="margin-top:0; border-bottom: 1px solid #334155; padding-bottom:10px;">✔ Check Lines</h3>
        <div id="checkList">
            <p style="color:#64748b; font-size:0.9rem;">Click on a blank cell (**) to generate patterns and check lines.</p>
        </div>
    </div>
</div>

<div id="popup" onclick="this.style.display='none'">
    <div class="pop-box" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Historical Match Found</h3>
        <div class="table-wrap" id="popWrapper">
            <svg id="popSvg"></svg>
            <table id="popTbl"></table>
        </div>
    </div>
</div>

<script>
const FAMILY = {
    "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"],
    "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"],
    "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"],
    "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"],
    "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem("rajdhani_data")) || Array(20).fill().map(() => Array(5).fill("**"));
let activePattern = null;

function getFam(val) {
    for (let k in FAMILY) if (FAMILY[k].includes(val)) return k;
    return null;
}

function initTable() {
    const tbl = document.getElementById("mainTbl");
    let html = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, r) => {
        html += "<tr>";
        row.forEach((cell, c) => {
            let cls = "";
            if (activePattern) {
                if (activePattern.p1.some(p => p.r === r && p.c === c)) cls = "circle-red";
                if (activePattern.p2.some(p => p.r === r && p.c === c)) cls = "circle-blue";
            }
            html += `<td onclick="cellClick(${r},${c})" contenteditable="true" onblur="editCell(${r},${c},this.innerText)">
                        <div class="${cls}">${cell}</div>
                     </td>`;
        });
        html += "</tr>";
    });
    tbl.innerHTML = html;
    drawLines("mainSvg", "mainTbl", activePattern);
}

function editCell(r, c, val) {
    data[r][c] = val.trim();
    localStorage.setItem("rajdhani_data", JSON.stringify(data));
    activePattern = null;
    initTable();
}

function addRow() {
    data.push(["**","**","**","**","**"]);
    initTable();
}

function cellClick(r, c) {
    if (data[r][c] !== "**") return;

    // Logic: Look back 10 weeks for 1, 2, 3 patterns
    let p1 = [], p2 = [];
    let fam1 = null, fam2 = null;

    for (let i = r - 1; i >= 0 && i >= r - 10; i--) {
        for (let j = 0; j < 5; j++) {
            let f = getFam(data[i][j]);
            if (!f) continue;

            if (!fam1) { fam1 = f; p1.push({r:i, c:j}); }
            else if (f === fam1 && p1.length < 3) { p1.push({r:i, c:j}); }
            else if (!fam2 && f !== fam1) { fam2 = f; p2.push({r:i, c:j}); }
            else if (f === fam2 && p2.length < 3) { p2.push({r:i, c:j}); }
        }
    }

    if (p1.length > 0) {
        activePattern = { p1, p2, fam1, fam2 };
        initTable();
        findCheckLines();
    }
}

function drawLines(svgId, tblId, pattern) {
    const svg = document.getElementById(svgId);
    const tbl = document.getElementById(tblId);
    svg.innerHTML = "";
    if (!pattern) return;

    const createPath = (points, cls) => {
        if (points.length < 2) return;
        let d = "";
        points.forEach((p, i) => {
            const cell = tbl.rows[p.r + 1].cells[p.c];
            const x = cell.offsetLeft + cell.offsetWidth / 2;
            const y = cell.offsetTop + cell.offsetHeight / 2;
            d += (i === 0 ? "M " : " L ") + x + " " + y;
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("class", cls);
        svg.appendChild(path);
    };

    createPath(pattern.p1, "line-red");
    createPath(pattern.p2, "line-blue");
}

function findCheckLines() {
    const list = document.getElementById("checkList");
    list.innerHTML = "";
    let matches = 0;

    for (let i = 0; i < data.length - 10; i++) {
        // Look for historical rows containing the same family
        let found = false;
        for(let col=0; col<5; col++) {
            if(getFam(data[i][col]) === activePattern.fam1) found = true;
        }

        if (found && matches < 5) {
            matches++;
            const div = document.createElement("div");
            div.className = "check-card";
            div.innerHTML = `<strong>Check Line ${matches}</strong><br><small>Found at Row ${i+1}</small>`;
            div.onclick = () => openMatch(i);
            list.appendChild(div);
        }
    }
}

function openMatch(startRow) {
    document.getElementById("popup").style.display = "flex";
    const pTbl = document.getElementById("popTbl");
    let html = "<tr><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th></tr>";
    
    let popP1 = [], popP2 = [];

    // Show 3 rows of historical data
    for (let i = 0; i < 3; i++) {
        let rIdx = startRow + i;
        if (!data[rIdx]) continue;
        html += "<tr>";
        data[rIdx].forEach((cell, cIdx) => {
            let cls = "";
            let f = getFam(cell);
            if(f === activePattern.fam1) { cls="circle-red"; popP1.push({r:i, c:cIdx}); }
            if(f === activePattern.fam2) { cls="circle-blue"; popP2.push({r:i, c:cIdx}); }
            html += `<td><div class="${cls}">${cell}</div></td>`;
        });
        html += "</tr>";
    }
    pTbl.innerHTML = html;
    setTimeout(() => drawLines("popSvg", "popTbl", {p1:popP1, p2:popP2}), 50);
}

function loadCSV(input) {
    const reader = new FileReader();
    reader.onload = () => {
        data = reader.result.trim().split("\n").map(line => line.split(","));
        localStorage.setItem("rajdhani_data", JSON.stringify(data));
        initTable();
    };
    reader.readAsText(input.files[0]);
}

function exportCSV() {
    const csv = data.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rajdhani_records.csv';
    a.click();
}

initTable();
</script>

</body>
</html>
