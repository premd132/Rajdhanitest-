<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DPBoss King Style 3rd Touch System</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; }
        .header { background: #d32f2f; padding: 15px; font-size: 22px; font-weight: bold; border-bottom: 4px solid #ffeb3b; }
        
        .search-area { background: #333; padding: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid #444; }
        input, select, button { padding: 10px; border-radius: 5px; border: none; font-weight: bold; }
        button { cursor: pointer; background: #ffeb3b; color: #000; }
        button:hover { background: #fbc02d; }

        .chart-container { position: relative; margin: 20px auto; display: inline-block; background: #fff; padding: 10px; border-radius: 8px; }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 2; background: transparent; }
        th, td { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-weight: bold; font-size: 16px; position: relative; }
        th { background: #eee; font-size: 12px; }
        td[contenteditable]:focus { background: #fffde7; outline: 2px solid #d32f2f; }

        /* Specific DPBoss Styling */
        .base-jodi { border: 3px solid red !important; background: rgba(255,0,0,0.1); color: red; }
        .touch-result { border: 3px solid blue !important; border-radius: 50%; background: rgba(0,0,255,0.1); color: blue; }
        
        /* Canvas for drawing lines */
        #lineCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        
        .footer-tools { margin: 20px; }
        .status { color: #4caf50; font-family: monospace; }
    </style>
</head>
<body>

<div class="header">SMART GUESSING - 3rd TOUCH LINE TRICK</div>

<div class="search-area">
    <select id="dayIdx">
        <option value="0">Mon</option><option value="1">Tue</option><option value="2">Wed</option>
        <option value="3">Thu</option><option value="4">Fri</option><option value="5">Sat</option>
    </select>
    <input type="text" id="findJodi" placeholder="Base Jodi (eg 37)" size="15">
    <button onclick="runTouchSearch()">RUN 3rd TOUCH</button>
    <button onclick="resetChart()" style="background:#666; color:#fff;">RESET</button>
</div>

<div class="chart-container" id="chartBox">
    <canvas id="lineCanvas"></canvas>
    <table id="matkaTable">
        <thead>
            <tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<div class="footer-tools">
    <button onclick="addNewRow()">+ Add New Week Row</button>
    <button onclick="saveData()" style="background:#4caf50; color:#fff;">Save Data</button>
    <p class="status" id="msg">System Ready...</p>
</div>

<script>
    // Initial Demo Data
    let chartData = JSON.parse(localStorage.getItem('dp_data')) || [
        ["51","37","41","57","19","95"], ["05","74","37","06","19","63"],
        ["90","37","82","09","28","19"], ["11","82","12","34","37","67"],
        ["70","37","90","56","12","34"], ["52","10","37","10","10","10"],
        ["25","37","41","57","19","95"], ["79","10","10","10","10","10"],
        ["57","37","41","57","19","95"]
    ];

    function initTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        chartData.forEach((row, rIdx) => {
            let tr = document.createElement('tr');
            row.forEach((cell, cIdx) => {
                let td = document.createElement('td');
                td.innerText = cell;
                td.contentEditable = true;
                td.onblur = () => { chartData[rIdx][cIdx] = td.innerText; };
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        resizeCanvas();
    }

    function addNewRow() {
        chartData.push(["**","**","**","**","**","**"]);
        initTable();
    }

    function saveData() {
        localStorage.setItem('dp_data', JSON.stringify(chartData));
        document.getElementById('msg').innerText = "Data Saved Successfully!";
    }

    function resizeCanvas() {
        const canvas = document.getElementById('lineCanvas');
        const box = document.getElementById('chartBox');
        canvas.width = box.clientWidth;
        canvas.height = box.clientHeight;
    }

    function runTouchSearch() {
        resetChart();
        const target = document.getElementById('findJodi').value;
        const day = document.getElementById('dayIdx').value;
        const ctx = document.getElementById('lineCanvas').getContext('2d');
        const table = document.getElementById('matkaTable');
        
        let matches = [];
        for(let i=0; i<chartData.length; i++) {
            if(chartData[i][day] == target) matches.push(i);
        }

        if(matches.length < 3) {
            document.getElementById('msg').innerText = "3rd Touch ke liye 3 baar same jodi honi chahiye!";
            return;
        }

        ctx.strokeStyle = "blue";
        ctx.lineWidth = 2;

        matches.forEach((rowIndex, index) => {
            if(index > 2) return; // Only top 3 touches

            // Highlight Base
            let baseCell = table.rows[rowIndex + 1].cells[day];
            baseCell.classList.add('base-jodi');

            // Draw Line to Result (Assuming result is 1 row below, same column)
            if(rowIndex + 1 < chartData.length) {
                let resCell = table.rows[rowIndex + 2].cells[day];
                resCell.classList.add('touch-result');

                // Canvas coordinates
                const r1 = baseCell.getBoundingClientRect();
                const r2 = resCell.getBoundingClientRect();
                const container = document.getElementById('chartBox').getBoundingClientRect();

                ctx.beginPath();
                ctx.moveTo(r1.left - container.left + r1.width/2, r1.top - container.top + r1.height/2);
                ctx.lineTo(r2.left - container.left + r2.width/2, r2.top - container.top + r2.height/2);
                ctx.stroke();
            }
        });
        document.getElementById('msg').innerText = "3rd Touch Pattern Applied!";
    }

    function resetChart() {
        const tds = document.querySelectorAll('td');
        tds.forEach(t => t.className = '');
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('msg').innerText = "Chart Reset.";
    }

    window.onload = initTable;
    window.onresize = resizeCanvas;
</script>

</body>
</html>
