<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI - Pradeep Special v7</title>
    <style>
        :root { --bg: #0f172a; --gold: #fbbf24; --red: #ef4444; --blue: #3b82f6; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .nav { background: #1e293b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .container { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 20px; }
        
        /* Buttons */
        .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-upload { background: #3b82f6; color: white; }
        .btn-row { background: var(--gold); color: black; }
        .btn-export { background: #10b981; color: white; }

        /* Table Box */
        .chart-card { background: white; padding: 20px; border-radius: 12px; position: relative; overflow: auto; min-height: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        table { border-collapse: collapse; width: 100%; color: #334155; position: relative; z-index: 10; }
        th { background: #334155; color: white; padding: 12px; border: 1px solid #475569; }
        td { border: 1px solid #cbd5e1; width: 55px; height: 55px; text-align: center; font-weight: 800; font-size: 1.2rem; cursor: pointer; position: relative; }
        
        /* Pattern Markers */
        .circle-red { border: 3px solid var(--red); border-radius: 50%; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--red); }
        .circle-blue { border: 3px solid var(--blue); border-radius: 50%; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--blue); }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

        /* Sidebar Panels */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
        .check-card { background: #0f172a; border-left: 5px solid var(--gold); padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 4px; }
        .ai-badge { background: var(--gold); color: black; padding: 5px 12px; border-radius: 6px; font-weight: 900; margin: 4px; display: inline-block; }

        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

<div class="nav">
    <div style="font-size: 1.4rem; font-weight: 800; letter-spacing: 1px;">PRADEEP <span style="color:var(--gold)">AI v7</span></div>
    <div style="display:flex; gap:10px;">
        <input type="file" id="fileIn" style="display:none" onchange="importCSV(this)">
        <button class="btn btn-upload" onclick="document.getElementById('fileIn').click()">📁 Upload CSV File</button>
        <button class="btn btn-row" onclick="addRow()">+ Add Row</button>
        <button class="btn btn-export" onclick="exportCSV()">💾 Export</button>
    </div>
</div>

<div class="container">
    <div class="chart-card" id="mainWrapper">
        <svg id="mainSvg"></svg>
        <table id="mainTbl"></table>
    </div>

    <div class="sidebar">
        <div class="panel">
            <h3 style="margin:0; color:var(--gold)">🤖 Future AI Prediction</h3>
            <div id="aiDisp" style="margin-top:10px; font-weight:bold;">File upload karein...</div>
        </div>
        <div class="panel">
            <h3 style="margin:0">🎯 Check Lines (Max 4)</h3>
            <div id="checkDisp"><p style="font-size:13px; color:#94a3b8">Pattern results yahan dikhenge.</p></div>
        </div>
    </div>
</div>

<div id="popup" onclick="this.style.display='none'">
    <div style="background:white; padding:25px; border-radius:15px; color:black; min-width:350px;" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Historical Match View</h3>
        <div style="position:relative">
            <svg id="popSvg"></svg>
            <table id="popTbl"></table>
        </div>
    </div>
</div>

<script>
const FAMILY = {
    "01":["01","06","10","15","51","56","60","65"], "02":["02","07","20","25","52","57","70","75"],
    "03":["03","08","30","35","53","58","80","85"], "04":["04","09","40","45","54","59","90","95"],
    "05":["00","05","50","55"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"]
};

let tableData = JSON.parse(localStorage.getItem("p_ai_v7")) || Array(10).fill().map(()=>Array(5).fill("**"));
let currentPat = null;

const getFam = (v) => { for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; };
const formatVal = (v) => { v=v.trim(); if(v==="**"||v==="") return "**"; return v.length===1?"0"+v:v; };

function render() {
    const tbl = document.getElementById("mainTbl");
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    tableData.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = "";
            if(currentPat) {
                if(currentPat.p1.some(p => p.r===ri && p.c===ci)) cls = "circle-red";
                if(currentPat.p2.some(p => p.r===ri && p.c===ci)) cls = "circle-blue";
            }
            h += `<td onclick="analyze(${ri},${ci})" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">
                  <div class="${cls}">${cell}</div></td>`;
        });
        h += "</tr>";
    });
    tbl.innerHTML = h;
    drawSVG("mainSvg", "mainTbl", currentPat);
}

function updateCell(r, c, v) { tableData[r][c]=formatVal(v); localStorage.setItem("p_ai_v7", JSON.stringify(tableData)); render(); }
function addRow() { tableData.push(["**","**","**","**","**"]); render(); }

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = () => {
        const rows = reader.result.trim().split("\n");
        tableData = rows.map(r => r.split(",").map(c => formatVal(c)));
        localStorage.setItem("p_ai_v7", JSON.stringify(tableData));
        render();
    };
    reader.readAsText(input.files[0]);
}

function analyze(r, c) {
    if(tableData[r][c] !== "**") return;
    let p1=[], p2=[], f1=null, f2=null;

    for(let i=r-1; i>=0 && i>=r-10; i--) {
        for(let j=0; j<5; j++) {
            let val = tableData[i][j];
            if(val==="**") continue;
            let fam = getFam(val);
            if(!f1) { f1=fam; p1.push({r:i, c:j, v:val}); }
            else if((fam===f1 || val===p1[0].v) && p1.length<3) p1.push({r:i, c:j, v:val});
            else if(!f2 && fam!==f1) { f2=fam; p2.push({r:i, c:j, v:val}); }
            else if((fam===f2 || val===p2[0].v) && p2.length<2) p2.push({r:i, c:j, v:val});
        }
    }

    if(p1.length > 0) {
        currentPat = { p1, p2, f1, f2 };
        render();
        findCheck(r);
        futureAI(f1);
    }
}

function drawSVG(sid, tid, pat) {
    const svg = document.getElementById(sid);
    const tbl = document.getElementById(tid);
    svg.innerHTML = "";
    if(!pat) return;
    const l = (pts, col) => {
        if(pts.length < 2) return;
        let d = "";
        pts.forEach((p, i) => {
            const td = tbl.rows[p.r+1].cells[p.c];
            d += (i===0?"M ":" L ")+(td.offsetLeft+td.offsetWidth/2)+" "+(td.offsetTop+td.offsetHeight/2);
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d); path.setAttribute("stroke", col); path.setAttribute("fill", "none");
        path.setAttribute("stroke-width", "4"); path.setAttribute("stroke-dasharray", "5");
        svg.appendChild(path);
    };
    l(pat.p1, "#ef4444"); l(pat.p2, "#3b82f6");
}

function findCheck(r) {
    const box = document.getElementById("checkDisp");
    box.innerHTML = "";
    let count = 0;
    for(let i=0; i < r - 3; i++) {
        let match = tableData[i].some(v => v===currentPat.p1[0].v || getFam(v)===currentPat.f1);
        if(match) {
            count++;
            let div = document.createElement("div");
            div.className = "check-card";
            div.innerHTML = `Pattern Match: Week ${i+1}`;
            div.onclick = () => showPop(i);
            box.appendChild(div);
        }
        if(count >= 4) break;
    }
}

function showPop(idx) {
    document.getElementById("popup").style.display = "flex";
    const ptbl = document.getElementById("popTbl");
    let h="", hp=[];
    for(let i=0; i<4; i++) {
        let r = idx+i; if(!tableData[r]) continue;
        h += "<tr>";
        tableData[r].forEach((v, c) => {
            let isM = (v===currentPat.p1[0].v || getFam(v)===currentPat.f1);
            if(isM) hp.push({r:i, c});
            h += `<td><div class="${isM?'circle-red':''}">${v}</div></td>`;
        });
        h += "</tr>";
    }
    ptbl.innerHTML = h;
    setTimeout(()=>drawSVG("popSvg", "popTbl", {p1:hp, p2:[]}), 50);
}

function futureAI(f) {
    const box = document.getElementById("aiDisp");
    const pairs = FAMILY[f] || ["01","11","21"];
    box.innerHTML = pairs.sort(()=>0.5-Math.random()).slice(0,3).map(n=>`<span class="ai-badge">${n}</span>`).join("");
}

function exportCSV() {
    const csv = tableData.map(r => r.join(",")).join("\n");
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'rajdhani_ai_data.csv';
    a.click();
}

render();
</script>
</body>
</html>
