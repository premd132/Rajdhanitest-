<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Fixed Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; padding-bottom: 50px; }
        .toolbar { background: var(--panel); padding: 12px; display: flex; gap: 10px; justify-content: center; border-bottom: 2px solid var(--gold); position: sticky; top:0; z-index:100; }
        .table-container { position: relative; background: #fff; border-radius: 8px; padding: 5px; display: inline-block; margin-top: 20px; }
        table { border-collapse: collapse; color: #000; }
        td, th { border: 1px solid #ccc; width: 45px; height: 45px; text-align: center; font-weight: bold; cursor: pointer; position: relative; }
        th { background: #1e293b; color: white; font-size: 10px; }
        .circle { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(0, 132, 255, 0.1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .dashboard { padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .match-item { background: #0f172a; padding: 10px; margin: 5px 0; border-radius: 8px; cursor: pointer; border-left: 4px solid var(--blue); display: flex; justify-content: space-between; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 12px; display: none; z-index: 1000; padding: 20px; color: #000; width: 95%; max-width: 450px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; z-index: 900; }
        button { padding: 8px 15px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csv" hidden>
    <button onclick="csv.click()">📂 CSV</button>
    <button onclick="addRow()">➕ ROW</button>
    <button onclick="saveData()" style="background:var(--green); color:#000;">💾 SAVE</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>✔ Matches</h3>
        <div id="checks">Click ** to analyze...</div>
    </div>
    <div class="card">
        <h3>🔮 Future Prediction</h3>
        <div id="future" style="font-size: 20px; color: var(--green); font-weight: 800;">---</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <h3 style="margin-top:0">Sequence Found</h3>
    <div class="table-container" style="border: 1px solid #ddd;">
        <canvas id="popCanvas"></canvas>
        <div id="popData"></div>
    </div>
    <br>
    <button onclick="closePopup()" style="background:#000; color:#fff; width:100%;">CLOSE</button>
</div>

<script>
const STORAGE_KEY = "kpro_v2_final";
const FAMILY = {"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(10).fill().map(()=>Array(6).fill("**"));
let activeMark = null;
let targetCol = 0;

function norm(v){ v=v.toString().trim(); return (v==""||v=="**")?"**":v.padStart(2,'0').slice(-2); }
function getFam(v){ for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; }

function draw() {
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = (activeMark && ri >= activeMark.start && ri < activeMark.start + activeMark.shape.length && activeMark.shape[ri-activeMark.start][ci]) ? "circle" : "";
            h += `<td class="${cls}" onclick="handleCell(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    if(activeMark) setTimeout(() => drawLines("mainCanvas", "tbl"), 50);
}

function handleCell(ri, ci) {
    if(data[ri][ci] === "**") {
        targetCol = ci;
        makePattern(ri, ci);
    } else {
        let val = prompt("Enter Value:", data[ri][ci]);
        if(val !== null) { data[ri][ci] = norm(val); activeMark = null; draw(); }
    }
}

function makePattern(ri, ci) {
    let limit = Math.max(0, ri-5);
    let shape = [];
    let baseFams = [];

    // Identify families in the last 5 rows to create a pattern
    for(let i = limit; i < ri; i++) {
        let rowShape = [0,0,0,0,0,0];
        for(let j=0; j<6; j++) {
            let f = getFam(data[i][j]);
            if(f) {
                if(!baseFams.includes(f)) baseFams.push(f);
                rowShape[j] = 1;
            }
        }
        shape.push(rowShape);
    }
    
    if(baseFams.length === 0) return;
    searchPattern(shape, baseFams);
}

function searchPattern(shape, baseFams) {
    let matches = [];
    for(let i=0; i <= data.length - shape.length - 1; i++) {
        let score = 0;
        for(let r=0; r < shape.length; r++) {
            for(let c=0; c<6; c++) {
                if(shape[r][c] === 1) {
                    let f = getFam(data[i+r][c]);
                    if(baseFams.includes(f)) score++;
                }
            }
        }
        if(score >= 2) matches.push(i);
    }
    
    let checks = document.getElementById("checks");
    checks.innerHTML = "";
    matches.forEach((mIdx, i) => {
        let div = document.createElement("div");
        div.className = "match-item";
        div.innerHTML = `<span>Pattern Match ${i+1}</span><small>Row ${mIdx+1}</small>`;
        div.onclick = () => {
            activeMark = {start: mIdx, shape: shape};
            draw();
            showPopup(shape, mIdx);
        };
        checks.appendChild(div);
    });

    // Future Prediction
    let pool = matches.map(m => data[m + shape.length][targetCol]).filter(v => v !== "**");
    document.getElementById("future").innerText = pool.length ? [...new Set(pool)].join(" - ") : "??";
}

function showPopup(shape, idx) {
    let html = "<table>";
    let snippet = data.slice(idx, idx + shape.length + 1);
    snippet.forEach((r, ri) => {
        html += "<tr>";
        r.forEach((c, ci) => {
            let isMark = (ri < shape.length && shape[ri][ci]);
            html += `<td class="${isMark?'circle':''}">${c}</td>`;
        });
        html += "</tr>";
    });
    document.getElementById("popData").innerHTML = html + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    setTimeout(() => drawLines("popCanvas", "popData"), 100);
}

function drawLines(cvsId, containerId) {
    const cvs = document.getElementById(cvsId);
    const table = document.querySelector(`#${containerId} table`);
    const ctx = cvs.getContext("2d");
    cvs.width = table.offsetWidth; cvs.height = table.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    const dots = table.querySelectorAll(".circle");
    if(dots.length < 2) return;
    
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3; ctx.beginPath();
    dots.forEach((d, i) => {
        let x = d.offsetLeft + d.offsetWidth/2;
        let y = d.offsetTop + d.offsetHeight/2;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); alert("Saved!"); }

csv.onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v.trim())));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};

draw();
</script>
</body>
</html>
