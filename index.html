<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI – Pradeep Edition v4</title>
    <style>
        :root { --bg: #030712; --card: #111827; --accent: #3b82f6; --red: #ef4444; --blue: #3b82f6; --gold: #fbbf24; }
        body { margin: 0; background: var(--bg); color: #f9fafb; font-family: 'Inter', sans-serif; }
        
        .header { background: var(--card); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
        .btn { background: var(--accent); border: none; color: white; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 20px; max-width: 1550px; margin: auto; }
        
        /* Table Box */
        .chart-box { background: #ffffff; padding: 25px; border-radius: 12px; position: relative; overflow: auto; min-height: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; width: 100%; color: #111827; position: relative; z-index: 5; }
        th { background: #1f2937; color: #f9fafb; padding: 12px; border: 1px solid #374151; font-size: 13px; }
        td { border: 1px solid #e5e7eb; width: 55px; height: 55px; text-align: center; font-weight: 800; font-size: 1.2rem; cursor: pointer; position: relative; }
        
        /* Elements */
        .circle-1 { border: 3px solid var(--red); border-radius: 50%; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; margin: auto; color: var(--red); }
        .circle-2 { border: 3px solid var(--blue); border-radius: 50%; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; margin: auto; color: var(--blue); }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #374151; }
        .check-item { background: #1f2937; border-left: 4px solid var(--gold); padding: 12px; margin-top: 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .check-item:hover { background: #374151; transform: translateX(5px); }
        
        .ai-title { color: var(--gold); font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .pair-chip { background: var(--gold); color: #000; padding: 6px 12px; border-radius: 6px; font-weight: 900; margin: 4px; display: inline-block; }

        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 1.5rem; font-weight: 800; letter-spacing: 1px;">RAJDHANI <span style="color:var(--gold)">AI PRO</span></div>
    <div style="display:flex; gap:10px;">
        <input type="file" id="csvIn" style="display:none" onchange="importData(this)">
        <button class="btn" style="background:#4b5563" onclick="document.getElementById('csvIn').click()">Import CSV</button>
        <button class="btn" onclick="addNewRow()">+ Add Row</button>
        <button class="btn" style="background:#059669" onclick="exportData()">Export CSV</button>
    </div>
</div>

<div class="main-grid">
    <div class="chart-box" id="chartArea">
        <svg id="connLines"></svg>
        <table id="dataTable"></table>
    </div>

    <div class="sidebar">
        <div class="panel">
            <div class="ai-title">🤖 Future-AI Prediction</div>
            <div id="aiPrediction">Click on ** to generate...</div>
        </div>

        <div class="panel">
            <div class="ai-title">🎯 Check Lines (Max 4)</div>
            <div id="checkLinesContainer">
                <p style="color:#9ca3af; font-size: 13px;">Historical patterns will appear here.</p>
            </div>
        </div>
    </div>
</div>

<div id="popup" onclick="this.style.display='none'">
    <div style="background:#fff; padding:30px; border-radius:15px; color:#111; min-width: 400px;" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Historical Match Found</h3>
        <div style="position:relative">
            <svg id="popSvg"></svg>
            <table id="popTable" style="border:1px solid #ccc; width:100%"></table>
        </div>
    </div>
</div>

<script>
const FAMILY = {
    "01":["01","06","10","15","51","56","60","65"], "02":["02","07","20","25","52","57","70","75"],
    "03":["03","08","30","35","53","58","80","85"], "04":["04","09","40","45","54","59","90","95"],
    "05":["00","05","50","55"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "23":["23","28","32","37","73","78","82","87"]
};

let records = JSON.parse(localStorage.getItem("pradeep_raj_v4")) || Array(20).fill().map(()=>Array(5).fill("**"));
let currentActivePattern = null;

const getFamily = (v) => { for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; };
const formatVal = (v) => { 
    v = v.trim(); 
    if(v === "**" || v === "") return "**";
    return v.length === 1 ? "0" + v : v; 
};

function renderTable() {
    const tbl = document.getElementById("dataTable");
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    records.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = "";
            if(currentActivePattern) {
                if(currentActivePattern.p1.some(p => p.r === ri && p.c === ci)) cls = "circle-1";
                if(currentActivePattern.p2.some(p => p.r === ri && p.c === ci)) cls = "circle-2";
            }
            h += `<td onclick="processClick(${ri},${ci})" contenteditable="true" onblur="cellUpdate(${ri},${ci},this.innerText)">
                  <div class="${cls}">${cell}</div></td>`;
        });
        h += "</tr>";
    });
    tbl.innerHTML = h;
    drawSVG("connLines", "dataTable", currentActivePattern);
}

function cellUpdate(r, c, v) { 
    records[r][c] = formatVal(v); 
    localStorage.setItem("pradeep_raj_v4", JSON.stringify(records)); 
    renderTable(); 
}

function addNewRow() { records.push(["**","**","**","**","**"]); renderTable(); }

function processClick(r, c) {
    if(records[r][c] !== "**") return;
    
    // Naya Pattern Logic (Search back 10 weeks)
    let p1 = [], p2 = [], f1 = null, f2 = null;
    
    for(let i = r-1; i >= 0 && i >= r-10; i--) {
        for(let j=0; j<5; j++) {
            let val = records[i][j];
            if(val === "**") continue;
            let fam = getFamily(val);
            if(!f1) { f1 = fam; p1.push({r:i, c:j, v:val}); }
            else if((fam === f1 || val === p1[0].v) && p1.length < 3) p1.push({r:i, c:j, v:val});
            else if(!f2 && fam !== f1) { f2 = fam; p2.push({r:i, c:j, v:val}); }
            else if((fam === f2 || val === p2[0].v) && p2.length < 3) p2.push({r:i, c:j, v:val});
        }
    }

    if(p1.length > 0) {
        currentActivePattern = { p1, p2, f1, f2 };
        renderTable();
        generateCheckLines(r);
        updateFutureAI(f1, f2);
    }
}

function drawSVG(svgId, tblId, pat) {
    const svg = document.getElementById(svgId);
    const tbl = document.getElementById(tblId);
    svg.innerHTML = "";
    if(!pat) return;

    const createLine = (pts, color) => {
        if(pts.length < 2) return;
        let d = "";
        pts.forEach((p, i) => {
            const cell = tbl.rows[p.r + 1].cells[p.c];
            const x = cell.offsetLeft + cell.offsetWidth/2;
            const y = cell.offsetTop + cell.offsetHeight/2;
            d += (i===0 ? "M " : " L ") + x + " " + y;
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", color);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-width", "3");
        path.setAttribute("stroke-dasharray", "4,4");
        svg.appendChild(path);
    };
    createLine(pat.p1, "#ef4444");
    createLine(pat.p2, "#3b82f6");
}

function generateCheckLines(targetR) {
    const container = document.getElementById("checkLinesContainer");
    container.innerHTML = "";
    let foundCount = 0;

    // Search historical data for matches
    for(let i=0; i < targetR - 3; i++) {
        let isMatch = records[i].some(v => v === currentActivePattern.p1[0].v || getFamily(v) === currentActivePattern.f1);
        
        if(isMatch) {
            foundCount++;
            let div = document.createElement("div");
            div.className = "check-item";
            div.innerHTML = `<strong>Pattern Found</strong><br><small>Week No: ${i+1}</small>`;
            div.onclick = () => showHistoricalPopup(i);
            container.appendChild(div);
        }
        if(foundCount >= 4) break; // Max 4 check lines
    }
}

function showHistoricalPopup(rowIdx) {
    document.getElementById("popup").style.display = "flex";
    const popTbl = document.getElementById("popTable");
    let h = "";
    let hp1 = [], hp2 = [];

    for(let i=0; i<4; i++) {
        let r = rowIdx + i;
        if(!records[r]) continue;
        h += "<tr>";
        records[r].forEach((v, c) => {
            let cls = "";
            if(v === currentActivePattern.p1[0].v || getFamily(v) === currentActivePattern.f1) { cls="circle-1"; hp1.push({r:i, c}); }
            h += `<td><div class="${cls}">${v}</div></td>`;
        });
        h += "</tr>";
    }
    popTbl.innerHTML = h;
    setTimeout(() => drawSVG("popSvg", "popTable", {p1:hp1, p2:hp2}), 100);
}

function updateFutureAI(f1, f2) {
    const box = document.getElementById("aiPrediction");
    const pool = FAMILY[f1] || ["01","11","21"];
    const pairs = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
    box.innerHTML = pairs.map(p => `<span class="pair-chip">${p}</span>`).join("");
}

function exportData() {
    const csv = records.map(r => r.join(",")).join("\n");
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'rajdhani_ai_records.csv';
    a.click();
}

function importData(input) {
    const reader = new FileReader();
    reader.onload = () => {
        records = reader.result.trim().split("\n").map(l => l.split(","));
        localStorage.setItem("pradeep_raj_v4", JSON.stringify(records));
        renderTable();
    };
    reader.readAsText(input.files[0]);
}

renderTable();
</script>
</body>
</html>
