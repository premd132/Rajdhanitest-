<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBK I-Smart Auto-Pilot</title>
    <style>
        :root { --red: #ff0000; --green: #008800; --blue: #0000ff; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; margin: 0; text-align: center; }
        header { background: #b71c1c; padding: 15px; border-bottom: 4px solid var(--gold); font-size: 22px; font-weight: 900; }
        
        .controls { background: #1a1a1a; padding: 20px; display: flex; justify-content: center; gap: 15px; border-bottom: 1px solid #333; }
        input, select { padding: 12px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-weight: bold; }
        
        .btn-smart { background: var(--gold); color: #000; padding: 12px 25px; border: none; font-weight: 900; cursor: pointer; border-radius: 4px; }
        
        .chart-container { position: relative; display: inline-block; background: #fff; padding: 15px; margin-top: 20px; border-radius: 8px; box-shadow: 0 0 50px #000; }
        table { border-collapse: collapse; color: #000; z-index: 10; position: relative; }
        td, th { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-size: 20px; font-weight: 900; }
        th { background: #eee; font-size: 11px; height: 30px; }

        /* Auto-Generated Styles */
        .s-red { border: 4px solid var(--red) !important; color: var(--red); background: rgba(255,0,0,0.05); }
        .s-green { border: 4px solid var(--green) !important; color: var(--green); }
        .s-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        #status { color: #0f0; font-family: monospace; margin: 10px; }
    </style>
</head>
<body>

<header>DPBK I-SMART AUTO-GENERATOR</header>

<div class="controls">
    <div>
        <label style="font-size: 11px; display: block;">STEP 1: BASE JODI</label>
        <input type="text" id="baseJodi" placeholder="E.g. 80" maxlength="2">
    </div>
    <div>
        <label style="font-size: 11px; display: block;">STEP 2: ANCHOR DAY</label>
        <select id="anchorDay">
            <option value="0">MONDAY</option><option value="1">TUESDAY</option>
            <option value="2">WEDNESDAY</option><option value="3">THURSDAY</option>
            <option value="4">FRIDAY</option><option value="5">SATURDAY</option>
        </select>
    </div>
    <button class="btn-smart" onclick="runAutoSmart()">GENERATE I-SMART PATTERN</button>
</div>

<div id="status">Ready: Waiting for Base Jodi...</div>

<div class="chart-container" id="box">
    <canvas id="canvas"></canvas>
    <table id="itbl">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
// Sample Record (Ideally loaded from CSV)
let chart = [
    ["10","20","35","40","51","61"],
    ["12","30","32","42","52","62"],
    ["13","23","33","43","53","63"],
    ["14","24","34","44","54","64"],
    ["80","85","70","45","55","65"], // Current Set
    ["**","**","**","**","**","**"]
];

function getFamily(v) {
    let n = v.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let res = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => {
        res.add(`${a[0]}${b[0]}`); res.add(`${b[0]}${a[0]}`);
    }));
    return Array.from(res);
}

function render() {
    const b = document.getElementById('tbody');
    b.innerHTML = chart.map((row, r) => `<tr>${row.map(v => `<td>${v}</td>`).join('')}</tr>`).join('');
    setTimeout(sync, 100);
}

function sync() {
    const c = document.getElementById('canvas'), b = document.getElementById('box');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

// 🚀 AUTO-PILOT LOGIC: Sirf Base Jodi par pura pattern banana
function runAutoSmart() {
    const baseVal = document.getElementById('baseJodi').value;
    const day = parseInt(document.getElementById('anchorDay').value);
    const table = document.getElementById('itbl');
    const ctx = document.getElementById('canvas').getContext('2d');
    
    // Clear old marks
    document.querySelectorAll('td').forEach(t => t.className = "");
    ctx.clearRect(0,0,5000,5000);
    
    if(!baseVal) return alert("Base Jodi likhiye!");

    let baseFam = getFamily(baseVal);
    let currentBaseRow = 4; // Current week row index

    // Step 1: Mark Base Red
    const baseCell = table.rows[currentBaseRow+1].cells[day];
    baseCell.classList.add('s-red');

    // Step 2: Auto-Scan History for Patterns
    chart.forEach((row, ri) => {
        if(baseFam.includes(row[day]) && ri < currentBaseRow) {
            
            // Internal Pattern Logic (Triangle Pattern Example)
            // System looks for specific relative gaps
            let searchGaps = [
                {rd: -1, cd: 1, type: 's-green'}, // 1 week up, 1 day right
                {rd: -4, cd: 2, type: 's-blue'}   // 4 weeks up, 2 days right
            ];

            searchGaps.forEach(gap => {
                let tr = ri + gap.rd;
                let tc = day + gap.cd;
                
                if(chart[tr] && chart[tr][tc]) {
                    const targetCell = table.rows[tr+1].cells[tc];
                    targetCell.classList.add(gap.type);

                    // Draw the I-Smart connection lines
                    ctx.strokeStyle = gap.type.includes('green') ? 'green' : 'blue';
                    ctx.lineWidth = 3; ctx.beginPath();
                    ctx.moveTo(baseCell.offsetLeft + 30, baseCell.offsetTop + 27);
                    ctx.lineTo(targetCell.offsetLeft + 30, targetCell.offsetTop + 27);
                    ctx.stroke();
                }
            });
            document.getElementById('status').innerText = "I-Smart Pattern Generated from History!";
        }
    });
}

window.onload = render;
</script>
</body>
</html>
