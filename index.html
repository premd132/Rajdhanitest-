<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Dual Family Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; 
            --blue-circle: #0084ff; 
            --red-circle: #ff4757;
            --green-line: #00ff88; 
            --bg: #0f172a; 
            --panel: #1e293b; 
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        #home-screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .hero-title { font-size: 3rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .enter-btn { background: var(--gold); color: #000; padding: 15px 40px; font-size: 1.2rem; font-weight: 800; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top:20px; }
        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 11px; }
        .circle-red { border: 3px solid var(--red-circle) !important; border-radius: 50% !important; background: rgba(255, 71, 87, 0.2); }
        .circle-blue { border: 3px solid var(--blue-circle) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .card h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 14px; text-transform: uppercase; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 90%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        .check-item { background:#2a2a2a; color:white; margin:5px 0; padding:10px; cursor:pointer; border-radius:6px; font-size:12px; border-left:4px solid var(--gold); }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">Kalyan PRO AI</h1>
    <p style="opacity:0.7;">DYNAMIC DUAL PATTERN RECOGNITION</p>
    <button class="enter-btn" onclick="startApp()">START ANALYSIS</button>
</div>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white; padding:8px 15px;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white; padding:8px 15px;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white; padding:8px 15px;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545; color:white; padding:8px 15px;">🗑️ RESET</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card"><h3>✔ Matches Found</h3><div id="checks"></div></div>
        <div class="card"><h3>🤖 AI Analysis</h3><div id="ai">Click ** to start</div></div>
        <div class="card"><h3>🔮 Prediction</h3><div id="future">---</div></div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:red; color:white; border:none; padding:5px 10px; border-radius:4px;">X</button>
    <h3 style="margin: 0 0 15px 0;">Sequence Trace</h3>
    <div class="table-container" style="border: 1px solid #ddd; width:100%;"><canvas id="popCanvas"></canvas><div id="popData"></div></div>
</div>

<script>
const STORAGE_KEY="pdata_Kalyan_v2";
const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data=JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(10).fill().map(()=>Array(6).fill("**"));
let activeMark=null;
let targetCol=null;

function startApp(){ document.getElementById('home-screen').style.display='none'; document.getElementById('main-app').style.display='block'; draw(); }
function fam(v){ for(let k in families) if(families[k].includes(v)) return k; return "NA"; }
function norm(v){ let s=String(v).trim(); if(!s || s=="**") return "**"; return s.length==1?"0"+s:s; }
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return fam(a)===fam(b); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = "";
   if(activeMark) {
       let i = ri - activeMark.start;
       if(i >= 0 && i < activeMark.shape.length) {
           if(activeMark.shape[i][ci] === 1) cls = "circle-red";
           else if(activeMark.shape[i][ci] === 2) cls = "circle-blue";
       }
   }
   h+=`<td class="${cls}" onclick="${c=='**'?'makePattern('+ri+','+ci+')':'focusEdit(this)'}" onblur="edit(${ri},${ci},this)" contenteditable="true">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 setTimeout(()=>drawLines("mainCanvas", "tbl"), 50);
}

function focusEdit(el){ el.focus(); }
function edit(r,c,el){ data[r][c]=norm(el.innerText); draw(); }

function makePattern(r,c){
 targetCol=c;
 activeMark=null; // Reset purana pattern
 let b1="**", b2="**";
 let look = 6;
 let shape = Array(look + 1).fill().map(()=>Array(6).fill(0));

 for(let i=r-1; i>=Math.max(0, r-look); i--) {
    for(let j=0; j<3; j++) {
        let v = data[i][j];
        if(v!=="**") {
            if(b1=="**") { b1=v; shape[i-(r-look)][j]=1; }
            else if(smartMatch(v,b1)) { shape[i-(r-look)][j]=1; }
            else if(b2=="**" && fam(v)!=fam(b1)) { b2=v; shape[i-(r-look)][j]=2; }
            else if(smartMatch(v,b2)) { shape[i-(r-look)][j]=2; }
        }
    }
 }
 if(b1=="**") return alert("Not enough data to form pattern");
 searchPattern(shape, b1, b2, r-look);
}

function searchPattern(shape, b1, b2, excludeIndex){
 let matches=[];
 for(let i=0; i <= data.length-shape.length; i++){
  if(i === excludeIndex) continue;
  let ok=true;
  for(let k=0; k<shape.length; k++){
   for(let j=0; j<3; j++){
    if(shape[k][j]===1 && !smartMatch(data[i+k][j],b1)) { ok=false; break; }
    if(shape[k][j]===2 && !smartMatch(data[i+k][j],b2)) { ok=false; break; }
   }
   if(!ok) break;
  }
  if(ok) matches.push({index:i, shape:shape});
 }
 
 if(matches.length > 0) {
     activeMark = {start: matches[0].index, shape: shape}; // Auto-show first match
     draw();
 }
 showChecks(shape, matches);
}

function showChecks(shape, matches){
 let ctn = document.getElementById("checks");
 ctn.innerHTML = matches.length ? "" : "No history found";
 matches.forEach((m,i)=>{
  let div = document.createElement("div");
  div.className = "check-item";
  div.innerText = `Trace Match ${i+1} (Row ${m.index+1})`;
  div.onclick = (e) => { e.stopPropagation(); activeMark={start:m.index, shape:shape}; draw(); showOne(shape, m.index); };
  ctn.appendChild(div);
 });
 updateAI(shape, matches);
}

function showOne(shape, idx){
 let html="<table id='popTbl' style='color:#000; width:100%'>";
 for(let i=0; i<shape.length; i++){
  html+="<tr>";
  data[idx+i].forEach((v,j)=>{
   let cls = shape[i][j]===1 ? "circle-red" : (shape[i][j]===2 ? "circle-blue" : "");
   html+=`<td class="${cls}">${v}</td>`;
  });
  html+="</tr>";
 }
 document.getElementById("popData").innerHTML=html+"</table>";
 document.getElementById("popup").style.display="block";
 document.getElementById("overlay").style.display="block";
 setTimeout(()=>drawLines("popCanvas", "popTbl"), 100);
}

function drawLines(cvId, tblId){
 let cv=document.getElementById(cvId), ctx=cv.getContext("2d"), tbl=document.getElementById(tblId);
 if(!tbl) return;
 cv.width=tbl.offsetWidth; cv.height=tbl.offsetHeight;
 ctx.clearRect(0,0,cv.width,cv.height);
 let rect=tbl.getBoundingClientRect();
 [".circle-red", ".circle-blue"].forEach((cls, i)=>{
  let cells=tbl.querySelectorAll(cls);
  if(cells.length < 2) return;
  ctx.strokeStyle = i===0 ? "#ff4757" : "#0084ff";
  ctx.lineWidth=3; ctx.beginPath();
  cells.forEach((c, idx)=>{
   let r=c.getBoundingClientRect();
   let x=r.left-rect.left+r.width/2, y=r.top-rect.top+r.height/2;
   if(idx==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
 });
}

function updateAI(shape, matches){
 let pool=[];
 matches.forEach(m => {
  let r = m.index + shape.length;
  if(data[r] && data[r][targetCol]!="**") pool.push(data[r][targetCol]);
 });
 document.getElementById("ai").innerHTML = `<b>Found:</b> ${matches.length} Records`;
 document.getElementById("future").innerHTML = pool.length ? [...new Set(pool)].join(" , ") : "---";
}

function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Saved!"); }
function clearData(){ if(confirm("Clear Data?")){ localStorage.clear(); location.reload(); }}
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v.trim())));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
