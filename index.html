<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milan PRO AI – Stable Final</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
 --gold:#ffd700; --blue:#0084ff; --green:#00ff88;
 --bg:#0f172a; --panel:#1e293b;
}
*{box-sizing:border-box;font-family:Poppins}
body{margin:0;background:var(--bg);color:#fff}

#home-screen{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
.hero-title{font-size:3rem;color:var(--gold)}
.enter-btn{padding:15px 40px;border:none;border-radius:40px;background:var(--gold);font-weight:800;cursor:pointer}

#main-app{display:none;padding:10px}
.toolbar{background:var(--panel);padding:10px;border-radius:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,select,input{padding:6px 10px;border-radius:6px;border:none;font-weight:bold}

.table-container{position:relative;background:#fff;padding:5px;border-radius:10px}
table{border-collapse:collapse;color:#000}
td,th{border:1px solid #ccc;width:45px;height:45px;text-align:center;font-weight:bold}
th{background:#1e293b;color:#fff;font-size:11px}

.circle{border:3px solid var(--blue)!important;border-radius:50%!important;background:rgba(0,132,255,.15)}
canvas{position:absolute;top:0;left:0;pointer-events:none}

.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:15px}
.card{background:var(--panel);padding:12px;border-radius:10px;border-top:3px solid var(--gold)}
.card h3{margin:0 0 8px;color:var(--gold);font-size:13px}
</style>
</head>

<body>

<div id="home-screen">
 <h1 class="hero-title">Milan PRO AI</h1>
 <button class="enter-btn" onclick="startApp()">START</button>
</div>

<div id="main-app">

<div class="toolbar">
 <button onclick="addRow()">ROW</button>
 <button onclick="saveData()" style="background:#28a745">SAVE</button>
 <button onclick="clearData()" style="background:#dc3545">CLEAR</button>
</div>

<div class="toolbar" style="background:#111">
 <select id="sType">
  <option value="1">1 JODI</option>
  <option value="2">2 JODI</option>
  <option value="3">3 JODI</option>
 </select>
 <input id="sJodi" placeholder="12 or 12,45">
 <button onclick="runSearch()" style="background:var(--gold)">SEARCH</button>
</div>

<center>
<div class="table-container">
 <canvas id="mainCanvas"></canvas>
 <table id="tbl"></table>
</div>
</center>

<div class="dashboard">
 <div class="card"><h3>✔ STRONG CHECK LINE</h3><div id="checks"></div></div>
 <div class="card"><h3>🤖 AI</h3><div id="ai">---</div></div>
 <div class="card"><h3>🔮 NEXT</h3><div id="future">---</div></div>
</div>

</div>

<script>
/* ================= DATA ================= */
const families={
"12":["12","17","21","26","62","67","71","76"],
"13":["13","18","31","36","63","68","81","86"],
"14":["14","19","41","46","64","69","91","96"],
"15":["01","06","10","15","51","56","60","65"],
"23":["23","28","32","37","73","78","82","87"],
"24":["24","29","42","47","74","79","92","97"],
"25":["02","07","20","25","52","57","70","75"],
"34":["34","39","43","48","84","89","93","98"],
"35":["03","08","30","35","53","58","80","85"],
"45":["04","09","40","45","54","59","90","95"],
"HR":["05","16","27","38","49","50","61","72","83","94"],
"FR":["00","11","22","33","44","55","66","77","88","99"]
};

let data=[
["51","91","41","57","19","95"],
["05","90","74","06","19","63"],
["90","34","82","09","28","19"],
["**","**","**","**","**","**"]
];

let activeMark=null;

/* ================= HELPERS ================= */
const norm=v=>v=="**"?"**":String(v).padStart(2,"0");
const palti=v=>v[1]+v[0];
const fam=v=>{for(let k in families)if(families[k].includes(v))return k;return"";}
const smart=(a,b)=>a!="**"&&(a==b||palti(a)==b||fam(a)==fam(b));

function startApp(){
 document.getElementById("home-screen").style.display="none";
 document.getElementById("main-app").style.display="block";
 draw();
}

/* ================= DRAW ================= */
function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls=activeMark && activeMark.shape[i-activeMark.start]?.[j]?"circle":"";
   h+=`<td class="${cls}" contenteditable oninput="data[${i}][${j}]=norm(this.innerText)">${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
 if(activeMark)setTimeout(drawLines,50);
}

function drawLines(){
 let c=mainCanvas,ctx=c.getContext("2d");
 c.width=tbl.offsetWidth;c.height=tbl.offsetHeight;
 ctx.clearRect(0,0,c.width,c.height);
 let cells=tbl.querySelectorAll(".circle");
 if(cells.length<2)return;
 let tr=tbl.getBoundingClientRect();
 ctx.strokeStyle="#00ff88";ctx.lineWidth=2.5;ctx.beginPath();
 cells.forEach((e,i)=>{
  let r=e.getBoundingClientRect();
  let x=r.left-tr.left+r.width/2;
  let y=r.top-tr.top+r.height/2;
  i?ctx.lineTo(x,y):ctx.moveTo(x,y);
 });
 ctx.stroke();
}

/* ================= STRONG SEARCH ONLY ================= */
function runSearch(){
 activeMark=null;
 checks.innerHTML="";
 ai.innerHTML="---";

 let jodis=sJodi.value.split(",").map(v=>norm(v.trim())).filter(Boolean);
 if(!jodis.length)return alert("Jodi enter karo");

 let need=+sType.value;
 let shapes={};

 for(let i=0;i<data.length;i++){
  let hit=0;
  data[i].forEach(v=>jodis.some(j=>smart(v,j))&&hit++);
  if(hit>=need){
   let key=hit+"-"+need;
   if(!shapes[key]){
    let shape=[];
    for(let k=i;k<i+need&&k<data.length;k++)
     shape.push(data[k].map(v=>jodis.some(j=>smart(v,j))?1:0));
    shapes[key]={start:i,shape};
   }
  }
 }

 let strong=Object.values(shapes);
 if(!strong.length){
  ai.innerHTML="❌ No strong pattern";
  return;
 }

 strong.forEach((o,idx)=>{
  let d=document.createElement("div");
  d.style="cursor:pointer;margin:5px 0;padding:6px;background:#222;border-left:4px solid #00ff88";
  d.innerText="STRONG CHECK LINE #"+(idx+1);
  d.onclick=()=>{
    activeMark=o;
    draw();
    ai.innerHTML="🟢 STRONG PATTERN ACTIVE";
    future.innerHTML="Next row: same family / palti expected";
  };
  checks.appendChild(d);
 });
}

/* ================= DATA ================= */
function addRow(){data.push(["**","**","**","**","**","**"]);draw()}
function saveData(){alert("Saved (demo)")}
function clearData(){location.reload()}
</script>
</body>
</html>
