<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rajdhani Pro AI – Pradeep Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --panel: #1e293b; --accent: #3b82f6; --red: #ff4757; --blue: #2e86de; --gold: #fbbf24; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        
        /* Layout */
        .app-container { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px; max-width: 1600px; margin: auto; }
        header { background: #0f172a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        
        /* Table Styling */
        .table-area { background: #fff; padding: 20px; border-radius: 12px; position: relative; overflow: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; color: #000; width: 100%; position: relative; z-index: 5; }
        th { background: #0f172a; color: #f8fafc; padding: 12px; font-size: 0.9rem; border: 1px solid #334155; }
        td { border: 1px solid #e2e8f0; width: 65px; height: 65px; text-align: center; font-weight: 800; font-size: 1.3rem; cursor: pointer; position: relative; transition: 0.2s; }
        td:hover { background: #f1f5f9; }

        /* Circles & Lines */
        .circle { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: auto; position: relative; z-index: 10; }
        .c-1 { border: 4px solid var(--red); color: var(--red); box-shadow: 0 0 10px rgba(255,71,87,0.4); }
        .c-2 { border: 4px solid var(--blue); color: var(--blue); box-shadow: 0 0 10px rgba(46,134,222,0.4); }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

        /* Sidebars */
        .sidebar-box { background: var(--panel); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .check-card { background: #0f172a; border-left: 4px solid var(--accent); padding: 12px; margin: 10px 0; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .check-card:hover { transform: scale(1.03); background: #1e293b; }
        
        .ai-prediction { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 2px solid var(--gold); padding: 15px; border-radius: 12px; text-align: center; }
        .pred-pair { display: inline-block; background: var(--gold); color: #000; padding: 5px 15px; border-radius: 20px; font-weight: 800; margin: 5px; font-size: 1.2rem; }

        /* Popup */
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px); }
        .pop-content { background: white; padding: 30px; border-radius: 20px; position: relative; width: 80%; max-width: 600px; color: #000; }
        
        .btn { background: var(--accent); border: none; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <div><span style="color:var(--gold)">PRADEEP</span> RAJDHANI AI</div>
    <div style="display:flex; gap:10px;">
        <input type="file" id="csvIn" style="display:none" onchange="loadCSV(this)">
        <button class="btn" style="background:#475569" onclick="document.getElementById('csvIn').click()">Import</button>
        <button class="btn" onclick="addRow()">+ Row</button>
        <button class="btn" style="background:#10b981" onclick="saveCSV()">Export</button>
    </div>
</header>

<div class="app-container">
    <div class="table-area" id="mainWrapper">
        <svg id="mainSvg"></svg>
        <table id="mainTbl"></table>
    </div>

    <div class="right-bar">
        <div class="ai-prediction">
            <h3 style="margin:0; color:var(--gold)">🤖 Future AI Pairs</h3>
            <p style="font-size:0.8rem; opacity:0.8">Calculated from 1-2-3 Patterns</p>
            <div id="predResult">-- -- --</div>
        </div>

        <div class="sidebar-box">
            <h3 style="margin:0; border-bottom:1px solid #334155; padding-bottom:10px">🎯 Check Lines</h3>
            <div id="checkList"><p style="font-size:0.8rem; color:#94a3b8">Click any blank cell (**) to start analysis.</p></div>
        </div>
    </div>
</div>

<div id="popup" onclick="this.style.display='none'">
    <div class="pop-content" onclick="event.stopPropagation()">
        <h2 style="margin-top:0">Historical Pattern</h2>
        <div class="table-area" id="popWrapper" style="border:1px solid #ccc">
            <svg id="popSvg"></svg>
            <table id="popTbl"></table>
        </div>
        <button class="btn" style="width:100%; margin-top:20px" onclick="document.getElementById('popup').style.display='none'">Close</button>
    </div>
</div>

<script>
const FAMILY = {
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"], "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem("pro_ai_data")) || Array(25).fill().map(() => Array(5).fill("**"));
let currentPattern = null;

const getFam = (v) => { for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; };

function render() {
    const tbl = document.getElementById("mainTbl");
    let html = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, rIdx) => {
        html += "<tr>";
        row.forEach((cell, cIdx) => {
            let cls = "";
            if(currentPattern) {
                if(currentPattern.p1.some(p => p.r === rIdx && p.c === cIdx)) cls = "circle c-1";
                if(currentPattern.p2.some(p => p.r === rIdx && p.c === cIdx)) cls = "circle c-2";
            }
            html += `<td onclick="analyze(${rIdx},${cIdx})" contenteditable="true" onblur="update(${rIdx},${cIdx},this.innerText)">
                <div class="${cls}">${cell}</div></td>`;
        });
        html += "</tr>";
    });
    tbl.innerHTML = html;
    draw("mainSvg", "mainTbl", currentPattern);
}

function update(r, c, v) { 
    data[r][c] = v.trim(); 
    localStorage.setItem("pro_ai_data", JSON.stringify(data)); 
    render(); 
}

function addRow() { data.push(["**","**","**","**","**"]); render(); }

function analyze(r, c) {
    if(data[r][c] !== "**") return;
    
    let p1 = [], p2 = [], fam1 = null, fam2 = null;

    // Search last 10 weeks
    for(let i = r-1; i >= 0 && i >= r-10; i--) {
        for(let j=0; j<5; j++) {
            let f = getFam(data[i][j]);
            if(!f) continue;
            if(!fam1) { fam1 = f; p1.push({r:i, c:j, v:data[i][j]}); }
            else if(f === fam1 && p1.length < 3) p1.push({r:i, c:j, v:data[i][j]});
            else if(!fam2 && f !== fam1) { fam2 = f; p2.push({r:i, c:j, v:data[i][j]}); }
            else if(f === fam2 && p2.length < 3) p2.push({r:i, c:j, v:data[i][j]});
        }
    }

    if(p1.length >= 2) {
        currentPattern = { p1, p2, fam1, fam2 };
        render();
        findCheckLines();
        generateFutureAI();
    }
}

function draw(svgId, tblId, pat) {
    const svg = document.getElementById(svgId);
    const tbl = document.getElementById(tblId);
    svg.innerHTML = "";
    if(!pat) return;

    const makePath = (points, color) => {
        if(points.length < 2) return;
        let d = "";
        points.forEach((p, i) => {
            const cell = tbl.rows[p.r + 1].cells[p.c];
            const x = cell.offsetLeft + cell.offsetWidth/2;
            const y = cell.offsetTop + cell.offsetHeight/2;
            d += (i===0 ? "M " : " L ") + x + " " + y;
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", color);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-width", "3");
        path.setAttribute("stroke-dasharray", "6");
        svg.appendChild(path);
    };
    makePath(pat.p1, "#ff4757");
    makePath(pat.p2, "#2e86de");
}

function findCheckLines() {
    const list = document.getElementById("checkList");
    list.innerHTML = "";
    let count = 0;

    for(let i=0; i<data.length-3; i++) {
        let matches = data[i].filter(v => getFam(v) === currentPattern.fam1);
        if(matches.length > 0 && i < currentPattern.p1[0].r - 2) {
            count++;
            let div = document.createElement("div");
            div.className = "check-card";
            div.innerHTML = `<b>Match #${count}</b><br><small>Historical Row: ${i+1}</small>`;
            div.onclick = () => showPop(i);
            list.appendChild(div);
        }
    }
}

function showPop(rowIdx) {
    document.getElementById("popup").style.display = "flex";
    const popTbl = document.getElementById("popTbl");
    let html = "";
    let popP1 = [], popP2 = [];

    for(let i=0; i<3; i++) {
        let r = rowIdx + i;
        html += "<tr>";
        data[r].forEach((v, c) => {
            let cls = "";
            if(getFam(v) === currentPattern.fam1) { cls="circle c-1"; popP1.push({r:i, c}); }
            if(getFam(v) === currentPattern.fam2) { cls="circle c-2"; popP2.push({r:i, c}); }
            html += `<td><div class="${cls}">${v}</div></td>`;
        });
        html += "</tr>";
    }
    popTbl.innerHTML = html;
    setTimeout(() => draw("popSvg", "popTbl", {p1:popP1, p2:popP2}), 50);
}

function generateFutureAI() {
    const res = document.getElementById("predResult");
    // Logic: Picking random numbers from the detected families as prediction
    let f1 = FAMILY[currentPattern.fam1];
    let f2 = FAMILY[currentPattern.fam2] || f1;
    let p = [f1[0], f2[1], f1[2]];
    res.innerHTML = p.map(n => `<span class="pred-pair">${n}</span>`).join("");
}

function saveCSV() {
    const csv = data.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], {type: 'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Rajdhani_AI_${Date.now()}.csv`;
    a.click();
}

function loadCSV(input) {
    const reader = new FileReader();
    reader.onload = () => {
        data = reader.result.trim().split("\n").map(l => l.split(","));
        localStorage.setItem("pro_ai_data", JSON.stringify(data));
        render();
    };
    reader.readAsText(input.files[0]);
}

render();
</script>
</body>
</html>
