<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
    :root { --red: #ff0000; --blue: #0000ff; --gold: #ffd600; }
    body { font-family: 'Arial', sans-serif; background: #000; color: #fff; margin: 0; text-align: center; }
    .header { background: #b71c1c; padding: 15px; border-bottom: 4px solid var(--gold); font-weight: bold; font-size: 20px; }
    
    /* Control Panel */
    .controls { background: #222; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; sticky; top: 0; z-index: 100; }
    button { padding: 10px 15px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; transition: 0.2s; }
    .btn-master { background: var(--gold); color: #000; }
    .tool { background: #444; color: #fff; border: 1px solid #666; }
    .active-tool { background: #fff !important; color: #000 !important; border: 2px solid var(--gold); }

    /* The Real Chart */
    .chart-box { position: relative; margin: 20px auto; background: #fff; padding: 10px; display: inline-block; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    table { border-collapse: collapse; color: #000; position: relative; z-index: 5; }
    td, th { border: 1px solid #aaa; width: 55px; height: 50px; text-align: center; font-weight: 900; font-size: 19px; position: relative; }
    th { background: #eee; font-size: 11px; height: 30px; }

    /* Drawing Shapes from Screenshots */
    .box-red { border: 3px solid var(--red) !important; background: rgba(255,0,0,0.1) !important; color: var(--red); }
    .circle-blue { border: 3px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
    .diamond-green { border: 3px solid #008000 !important; background: rgba(0,128,0,0.1); color: #008000; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
    
    #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }
    .log-panel { background: #111; color: #0f0; padding: 10px; font-family: monospace; text-align: left; border-top: 1px solid #333; }
</style>
</head>
<body>

<div class="header">DPBOSS KING - ALL-IN-ONE PATTERN CLONER</div>

<div class="controls">
    <input type="file" id="csv" onchange="loadCSV()" style="color:white">
    <div style="border-right: 2px solid #555; padding: 0 10px;">
        <button id="t1" class="tool active-tool" onclick="setTool('box-red')">RED BOX (Base)</button>
        <button id="t2" class="tool" onclick="setTool('circle-blue')">BLUE CIRCLE (Pattern)</button>
        <button id="t3" class="tool" onclick="setTool('diamond-green')">GREEN TRICK</button>
    </div>
    <select id="baseDay">
        <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
        <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
    </select>
    <button class="btn-master" onclick="scanAndClone()">EXECUTE 100% PATTERN MATCH</button>
    <button onclick="resetUI()">RESET</button>
</div>

<div class="chart-box" id="chartWrapper">
    <canvas id="canvas"></canvas>
    <table id="mainTable">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="chartBody"></tbody>
    </table>
</div>

<div class="log-panel" id="log">Ready: Create any complex pattern in the last row and hit Execute.</div>

<script>
let currentTool = 'box-red';
let chartData = [["10","20","30","40","50","60"],["11","21","31","41","51","61"],["12","22","32","42","52","62"],["13","23","33","43","53","63"],["14","24","34","44","54","64"],["15","25","35","45","55","65"]];

// Master Family Groups (100% Coverage)
const familyGroups = {
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"], "45":["04","09","40","45","54","59","90","95"]
};

function renderTable() {
    const tbody = document.getElementById('chartBody');
    tbody.innerHTML = chartData.map((row, r) => `<tr>${row.map((c, d) => 
        `<td onclick="applyShape(this)" contenteditable="true" onblur="chartData[${r}][${d}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    setTimeout(resizeCanvas, 100);
}

function setTool(t) {
    currentTool = t;
    document.querySelectorAll('.tool').forEach(b => b.classList.remove('active-tool'));
    event.target.classList.add('active-tool');
}

function applyShape(td) {
    td.className = td.className === currentTool ? "" : currentTool;
}

function resizeCanvas() {
    const c = document.getElementById('canvas');
    const wrap = document.getElementById('chartWrapper');
    c.width = wrap.scrollWidth; c.height = wrap.scrollHeight;
}

function getFamily(v) {
    for(let k in familyGroups) if(familyGroups[k].includes(v)) return familyGroups[k];
    return [v, v.split('').reverse().join('')];
}

// THE MASTER LOGIC: Scans Geometry DNA
function scanAndClone() {
    const day = parseInt(document.getElementById('baseDay').value);
    const table = document.getElementById('mainTable');
    const ctx = document.getElementById('canvas').getContext('2d');
    
    // 1. "Pattern DNA" Extraction
    let master = null;
    for(let r = chartData.length-1; r >= 0; r--) {
        if(table.rows[r+1].cells[day].classList.contains('box-red')) {
            master = { val: chartData[r][day], row: r, col: day, trickDNA: [] };
            
            // Scan for ALL other shapes relative to this Base
            document.querySelectorAll('.circle-blue, .diamond-green').forEach(mark => {
                let mRow = mark.parentElement.rowIndex - 1;
                let mCol = mark.cellIndex;
                master.trickDNA.push({ rDiff: mRow - r, dDiff: mCol - day, type: mark.className });
            });
            break;
        }
    }

    if(!master) { alert("Pehle niche kisi jodi ko Red Box banayein!"); return; }

    const family = getFamily(master.val);
    ctx.clearRect(0,0,5000,5000);
    ctx.lineWidth = 2.5;

    // 2. Multi-Pattern Cloning Engine
    chartData.forEach((row, rIdx) => {
        if(family.includes(row[day])) {
            const baseCell = table.rows[rIdx+1].cells[day];
            baseCell.classList.add('box-red');

            master.trickDNA.forEach(dna => {
                let tR = rIdx + dna.rDiff;
                let tC = day + dna.dDiff;
                if(table.rows[tR+1] && table.rows[tR+1].cells[tC]) {
                    const targetCell = table.rows[tR+1].cells[tC];
                    targetCell.classList.add(dna.type);
                    
                    // Drawing Logic for EACH trick
                    ctx.strokeStyle = (dna.type === 'circle-blue') ? 'blue' : 'green';
                    ctx.beginPath();
                    ctx.moveTo(baseCell.offsetLeft + 28, baseCell.offsetTop + 25);
                    ctx.lineTo(targetCell.offsetLeft + 28, targetCell.offsetTop + 25);
                    ctx.stroke();
                }
            });
        }
    });
    document.getElementById('log').innerText = "Status: Universal Engine successfully cloned the pattern to all sets.";
}

function loadCSV() {
    const file = document.getElementById('csv').files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        chartData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        renderTable();
    };
    reader.readAsText(file);
}

function resetUI() {
    document.querySelectorAll('td').forEach(td => td.className = "");
    document.getElementById('canvas').getContext('2d').clearRect(0,0,10000,10000);
}

window.onload = renderTable;
</script>
</body>
</html>
