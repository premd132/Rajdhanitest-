<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYAN SMART SYSTEM</title>

<style>
:root { --gold: #ffd700; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; }
.container { max-width: 500px; margin: 0 auto; }

.box { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 15px; border: 1px solid #334155; }
h2 { color: var(--gold); text-align: center; margin: 5px 0 15px 0; font-size: 18px; text-transform: uppercase; }

.label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: #fff; font-size: 14px; box-sizing: border-box; }
button { background: var(--gold); color: #000; font-weight: bold; border: none; cursor: pointer; }

/* Result Style */
.result-box { background: #020617; padding: 15px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; display: none; margin-bottom: 15px; position: relative; }
.target-tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 2px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; }
.fig-wrap { margin: 10px 0; }
.fig { display: inline-block; background: var(--gold); color: #000; padding: 8px 15px; margin: 4px; border-radius: 6px; font-size: 22px; font-weight: 800; }
.jodi-suggest { background: #1e293b; padding: 8px; border-radius: 6px; margin-top: 10px; font-size: 13px; color: #00ff88; letter-spacing: 1px; }

/* History Style */
.record-card { background: var(--card); border-radius: 10px; padding: 12px; border: 1px solid #334155; }
.history-row { background: #0f172a; border-radius: 6px; padding: 8px; margin-bottom: 8px; display: grid; grid-template-columns: 25px 1fr 50px; align-items: center; gap: 8px; }
.jodi-grid { display: flex; gap: 4px; flex-wrap: wrap; }
.jodi-item { background: #1e293b; color: var(--gold); padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 14px; border: 1px solid #334155; }
.btn-use { background: #3b82f6; color: white; font-size: 10px; padding: 5px; cursor: pointer; border: none; border-radius: 4px; }
</style>
</head>

<body>

<div class="container">
    <div class="box">
        <h2>🔮 Kalyan Next Day Predictor</h2>
        
        <div class="label">Step 1: Upload CSV or History</div>
        <input type="file" id="csvFile" accept=".csv">

        <div class="label">Step 2: Last 6 Jodis (Oldest to Newest)</div>
        <input id="jodiInput" placeholder="Ex: 23,45,67,89,12,34">

        <div class="label">Step 3: Select Calculation</div>
        <select id="mode">
            <option value="2">Auto (Last Jodi Total)</option>
            <option value="3">Auto (Common Total)</option>
            <option value="4">Strong All-Rounder</option>
            <option value="1">Manual Base Figure</option>
        </select>
        <input id="baseAnk" type="number" placeholder="Enter Base (0-9)" style="display:none">

        <button id="calcBtn">CALCULATE NEXT DAY FIGURES</button>

        <div id="resultArea" class="result-box">
            <div class="target-tag">TARGET: NEXT MARKET DAY</div>
            <div class="label" style="color:var(--gold)">POWERFUL OTC FIGURES</div>
            <div id="figOutput"></div>
            
            <div class="label" style="margin-top:10px">SUGGESTED JODIS (CROSSING)</div>
            <div id="jodiOutput" class="jodi-suggest"></div>
            
            <div id="detailOutput" style="font-size:11px; color:#94a3b8; margin-top:8px"></div>
        </div>

        <button id="saveBtn" style="background: #22c55e; color: white; font-size: 12px;">SAVE TO RECORD</button>
    </div>

    <div class="record-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <span style="font-size:13px; font-weight:bold; color:var(--gold)">📊 HISTORY RECORDS</span>
            <button onclick="clearAll()" style="width:auto; padding:5px 10px; background:#ef4444; font-size:10px">CLEAR</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<script>
const DB_KEY = "KALYAN_SMART_V3";
let historyData = JSON.parse(localStorage.getItem(DB_KEY)) || [];

const modeSelect = document.getElementById("mode");
const baseAnk = document.getElementById("baseAnk");

modeSelect.onchange = () => {
    baseAnk.style.display = (modeSelect.value === "1") ? "block" : "none";
};

window.onload = renderHistory;

/* --- Logic Functions --- */
function getJodis(str) {
    return str.replace(/[^0-9]/g, ",").split(",").filter(v => v.length === 2).slice(0, 6);
}

function getTotal(j) { return (parseInt(j[0]) + parseInt(j[1])) % 10; }

function getOTC(n) { 
    // Powerful formula: Neighbors + Cut
    let a = (n + 1) % 10;
    let b = (n + 9) % 10;
    let c = (a + 5) % 10;
    let d = (b + 5) % 10;
    return [...new Set([a, b, c, d])].sort();
}

function makeJodis(figs) {
    let list = [];
    for(let i=0; i<figs.length; i++) {
        for(let j=0; j<figs.length; j++) {
            list.push("" + figs[i] + figs[j]);
        }
    }
    return list.join(", ");
}

/* --- Actions --- */
document.getElementById("calcBtn").onclick = () => {
    const list = getJodis(document.getElementById("jodiInput").value);
    if (list.length < 6) { alert("Please input 6 Jodis first!"); return; }

    const totals = list.map(getTotal);
    const mode = modeSelect.value;
    let base;

    if (mode === "1") base = parseInt(baseAnk.value);
    else if (mode === "2") base = totals[5];
    else if (mode === "3") {
        let counts = {};
        totals.forEach(t => counts[t] = (counts[t] || 0) + 1);
        base = parseInt(Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b));
    } else {
        base = (totals[5] + totals[0]) % 10; // Strong All-Rounder Mix
    }

    const finalFigs = getOTC(base);
    const jodiCrossing = makeJodis(finalFigs);
    
    document.getElementById("figOutput").innerHTML = finalFigs.map(f => `<span class="fig">${f}</span>`).join("");
    document.getElementById("jodiOutput").innerHTML = jodiCrossing;
    document.getElementById("detailOutput").innerHTML = `Base Used: ${base} | Week Totals: ${totals.join(",")}`;
    document.getElementById("resultArea").style.display = "block";
    window.scrollTo({top: 200, behavior: 'smooth'});
};

/* --- History & Storage --- */
document.getElementById("csvFile").onchange = (e) => {
    const reader = new FileReader();
    reader.onload = (f) => {
        const lines = f.target.result.split(/\r?\n/);
        lines.forEach(line => {
            const jodis = getJodis(line);
            if (jodis.length === 6) historyData.unshift(jodis.join(","));
        });
        saveData();
    };
    reader.readAsText(e.target.files[0]);
};

document.getElementById("saveBtn").onclick = () => {
    const jodis = getJodis(document.getElementById("jodiInput").value);
    if (jodis.length === 6) {
        historyData.unshift(jodis.join(","));
        saveData();
    }
};

function saveData() {
    localStorage.setItem(DB_KEY, JSON.stringify(historyData));
    renderHistory();
}

function renderHistory() {
    const listDiv = document.getElementById("historyList");
    listDiv.innerHTML = historyData.length ? "" : "<div style='text-align:center; padding:10px; opacity:0.5'>No Records</div>";
    
    historyData.forEach((row, idx) => {
        const jodis = row.split(",");
        listDiv.innerHTML += `
            <div class="history-row">
                <div style="font-size:10px; opacity:0.5">${historyData.length - idx}</div>
                <div class="jodi-grid">${jodis.map(j => `<span class="jodi-item">${j}</span>`).join("")}</div>
                <button class="btn-use" onclick="loadRow('${row}')">USE</button>
            </div>`;
    });
}

function loadRow(str) {
    document.getElementById("jodiInput").value = str;
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function clearAll() {
    if (confirm("Clear all data?")) { historyData = []; saveData(); }
}
</script>

</body>
</html>
