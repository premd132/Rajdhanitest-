<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pattern Engine Full</title>

<style>

body{
    font-family:Arial;
    background:#111;
    color:white;
}

#topbar{
    background:#222;
    padding:10px;
}

button{
    margin:3px;
    padding:6px;
}

#tableBox{
    height:80vh;
    overflow:auto;
    border:1px solid #555;
}

table{
    border-collapse:collapse;
}

td{
    width:45px;
    height:35px;
    border:1px solid #444;
    text-align:center;
    cursor:pointer;
}

.blank{background:#333;}

.line{background:red!important;}
.diag{background:blue!important;}
.cross{background:green!important;}
.family{background:orange!important;}

#panel{

position:fixed;
right:0;
top:60px;
width:230px;
height:80vh;
background:#000;
border-left:2px solid #555;
overflow:auto;
padding:10px;

}

</style>
</head>


<body>


<div id="topbar">

<input type="file" id="file">

<button onclick="loadCSV()">Upload</button>

<button onclick="mode('line')">Line</button>
<button onclick="mode('diag')">Diag</button>
<button onclick="mode('cross')">Cross</button>

<button onclick="clearDraw()">Clear</button>

<button onclick="aiScan()">AI Scan</button>

</div>



<div id="tableBox">
<table id="grid"></table>
</div>



<div id="panel">

<h3>AI Result</h3>

<div id="result"></div>

</div>



<script>

let data=[]
let selected=[]
let drawMode="line"



/* ---------------- CSV ---------------- */

function loadCSV(){

let f=file.files[0]

if(!f)return

let r=new FileReader()

r.onload=e=>{

parseCSV(e.target.result)
drawTable()

}

r.readAsText(f)

}



function parseCSV(text){

data=[]

let rows=text.split(/\r?\n/)

for(let row of rows){

if(!row.trim())continue

let cols=row.split(".")

while(cols.length<6)cols.push("**")

data.push(cols)

}

}



function drawTable(){

let g=grid
g.innerHTML=""

for(let r=0;r<data.length;r++){

let tr=document.createElement("tr")

for(let c=0;c<6;c++){

let td=document.createElement("td")

let v=data[r][c]

td.innerText=v

if(v=="**")td.classList.add("blank")

td.onclick=()=>cellClick(r,c)

tr.appendChild(td)

}

g.appendChild(tr)

}

}



/* ------------ draw system ------------ */

function mode(m){

drawMode=m
selected=[]

}


function cellClick(r,c){

selected.push({r,c})

if(selected.length==2)drawPattern()

}


function drawPattern(){

let t=grid

let a=selected[0]
let b=selected[1]

let c1=t.rows[a.r].cells[a.c]
let c2=t.rows[b.r].cells[b.c]

if(drawMode=="line"){
c1.classList.add("line")
c2.classList.add("line")
}

if(drawMode=="diag"){
c1.classList.add("diag")
c2.classList.add("diag")
}

if(drawMode=="cross"){
c1.classList.add("cross")
c2.classList.add("cross")
}

selected=[]

}


function clearDraw(){

document.querySelectorAll("td").forEach(x=>{

x.classList.remove(
"line","diag","cross","family"
)

})

}



/* ------------ FAMILY ENGINE ----------- */

let family={

"12":["12","17","21","26","62","67","71","76"],
"13":["13","18","31","36","63","68","81","86"],
"14":["14","19","41","46","64","69","91","96"],
"15":["01","06","10","15","51","56","60","65"],
"23":["23","28","32","37","73","78","82","87"],
"24":["24","29","42","47","74","79","92","97"],
"25":["02","07","20","25","52","57","70","75"],
"34":["34","39","43","48","84","89","93","98"],
"35":["03","08","30","35","53","58","80","85"],
"45":["04","09","40","45","54","59","90","95"]

}


function fam(v){

for(let k in family){

if(family[k].includes(v))return k

}

return "X"

}



/* ------------ TRICK ENGINE ----------- */


function aiScan(){

clearDraw()

let last=data.length-1

let res=""

for(let depth=2;depth<=10;depth++){

if(last-depth<0)continue

if(trickRepeat(last,depth)){

res+="Repeat depth "+depth+"<br>"

highlight(last,depth)

}

if(trickFamily(last,depth)){

res+="Family depth "+depth+"<br>"

highlight(last,depth)

}

if(trickDiagonal(last,depth)){

res+="Diagonal "+depth+"<br>"

highlight(last,depth)

}

}

if(res=="")res="No pattern"

result.innerHTML=res

}



/* -------- trick 1 repeat -------- */

function trickRepeat(last,depth){

for(let c=0;c<6;c++){

if(data[last][c]!=data[last-depth][c])return false

}

return true

}


/* -------- trick 2 family -------- */

function trickFamily(last,depth){

for(let c=0;c<6;c++){

let a=fam(data[last][c])
let b=fam(data[last-depth][c])

if(a!=b)return false

}

return true

}


/* -------- trick 3 diagonal -------- */

function trickDiagonal(last,depth){

for(let c=0;c<5;c++){

if(data[last][c]!=data[last-depth][c+1])return false

}

return true

}



/* ---------- highlight ----------- */

function highlight(last,depth){

for(let c=0;c<6;c++){

grid.rows[last].cells[c].classList.add("line")

grid.rows[last-depth].cells[c].classList.add("diag")

}

}


</script>

</body>
</html>
