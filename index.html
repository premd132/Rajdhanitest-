<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milan Pro V36 - Pattern Recall</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue-c: #0084ff; --red-c: #ff3131; --green-l: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        /* Dashboard */
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; color: #000; font-size: 13px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 6px; text-align: center; font-weight: bold; width: 42px; height: 42px; }
        th { background: #1e293b; color: white; font-size: 10px; }
        
        /* Circles */
        .circle-b { border: 3px solid var(--blue-c) !important; border-radius: 50%; background: rgba(0,132,255,0.1); }
        .circle-r { border: 3px solid var(--red-c) !important; border-radius: 50%; background: rgba(255,49,49,0.1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        /* Matches List */
        .match-btn { background: #2a3a50; padding: 10px; margin: 5px 0; border-radius: 8px; cursor: pointer; border-left: 4px solid var(--gold); font-size: 13px; transition: 0.2s; }
        .match-btn:hover { background: var(--gold); color: #000; }

        /* Popup Styling [cite: 2026-02-03] */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 100; }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 101; padding: 20px; color: #000; width: 95%; max-width: 500px; text-align: center; }
        .close-pop { background: #f00; color: #fff; border: none; padding: 5px 15px; border-radius: 5px; float: right; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csvIn" accept=".csv" style="display:none" onchange="handleCSV(this)">
        <button onclick="document.getElementById('csvIn').click()" style="background:#444; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">📂 UPLOAD CSV</button>
        <button onclick="addRow()" style="background:#444; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">💾 SAVE</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCvs"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div style="margin-top:20px; background:var(--panel); padding:15px; border-radius:12px;">
        <h3 style="color:var(--gold); margin-top:0;">🔍 PATTERN CHECK LINES (1.2.3)</h3>
        <div id="check-list">Click a blank cell to find old records...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePop()"></div>
<div id="popup">
    <button class="close-pop" onclick="closePop()">CLOSE</button>
    <h3 style="margin-bottom:15px;">Real Record Evidence</h3>
    <div class="table-container" style="border:1px solid #ccc;">
        <canvas id="popCvs"></canvas>
        <div id="popContent"></div>
    </div>
    <p style="font-size:12px; color:#555; margin-top:10px;">Showing identical 2+2 pattern from history.</p>
</div>

<script>
const KEY = "Milan_V36_Pradeep";
let data = JSON.parse(localStorage.getItem(KEY)) || Array(10).fill(["**","**","**","**","**","**"]);
let activeShape = null;
let currentTbl = "tbl";

const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

function fam(v){for(let k in families) if(families[k].includes(v)) return k; return "NA";}
function palti(v){return v.length==2 ? v[1]+v[0] : v;}
function norm(v){ v=String(v).replace(/[^0-9]/g,''); return v.length==1?"0"+v:(v||"**");}
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || palti(a)===b || fam(a)===fam(b); }

function handleCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        data = e.target.result.split('\n').filter(r=>r.trim()).map(r => r.split(',').map(c => norm(c.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}

function draw(targetId="tbl", customData=data, shape=activeShape) {
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    customData.forEach((r,ri) => {
        h+="<tr>";
        r.forEach((c,ci) => {
            let type = (shape && ri >= shape.start && ri < shape.start + shape.matrix.length) ? shape.matrix[ri-shape.start][ci] : 0;
            let cls = type==1 ? "circle-b" : (type==2 ? "circle-r" : "");
            let act = targetId=="tbl" ? `onblur="data[${ri}][${ci}]=norm(this.innerText);draw();" onclick="${c=='**'?'findPatterns('+ri+','+ci+')':''}"` : "";
            h+=`<td class="${cls}" contenteditable="${targetId=='tbl'}" ${act}>${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById(targetId).innerHTML=h;
    let cvsId = targetId == "tbl" ? "mainCvs" : "popCvs";
    setTimeout(()=>drawLines(cvsId, targetId), 60);
}

function drawLines(cId, tId) {
    const cvs=document.getElementById(cId), tbl=document.getElementById(tId), ctx=cvs.getContext("2d");
    if(!tbl) return;
    cvs.width=tbl.offsetWidth; cvs.height=tbl.offsetHeight; ctx.clearRect(0,0,cvs.width,cvs.height);
    const cells=tbl.querySelectorAll(".circle-b, .circle-r");
    ctx.strokeStyle="#00ff88"; ctx.lineWidth=2; ctx.beginPath();
    cells.forEach((c,i)=>{ 
        const r=c.getBoundingClientRect(), tr=tbl.getBoundingClientRect();
        const x=r.left-tr.left+r.width/2, y=r.top-tr.top+r.height/2;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function findPatterns(r,c) {
    // 1. Logic to define current shape
    let b1="**", b2="**", b1R=-1;
    for(let i=r; i>=0; i--){ if(data[i][c]!="**"){ b1=data[i][c]; b1R=i; break; } }
    if(b1=="**") return;
    for(let i=b1R-1; i>=0; i--){
        for(let j=0; j<6; j++){ if(data[i][j]!="**" && fam(data[i][j])!==fam(b1)){ b2=data[i][j]; break; } }
        if(b2!="**") break;
    }

    let matrix=[]; let c1=0, c2=0;
    let startRow = Math.max(0, r-8);
    for(let i=startRow; i<=r; i++){
        let row=[0,0,0,0,0,0];
        for(let j=0; j<6; j++){
            if(data[i][j]!="**"){
                if(smartMatch(data[i][j],b1) && c1<2){ row[j]=1; c1++; }
                else if(b2!="**" && smartMatch(data[i][j],b2) && c2<2){ row[j]=2; c2++; }
            }
        }
        matrix.push(row);
    }

    // 2. Search history for this matrix [cite: 2026-02-03]
    let matches = [];
    for(let i=0; i <= data.length - matrix.length - 1; i++) {
        let ok = true;
        for(let k=0; k<matrix.length; k++){
            for(let j=0; j<6; j++){
                if(matrix[k][j]==1 && !smartMatch(data[i+k][j], b1)) ok=false;
                if(matrix[k][j]==2 && !smartMatch(data[i+k][j], b2)) ok=false;
            }
        }
        if(ok) matches.push(i);
    }

    // 3. Show "Check Lines"
    const list = document.getElementById("check-list");
    list.innerHTML = matches.length ? "" : "No similar patterns in old records.";
    matches.slice(0, 3).forEach((idx, i) => {
        let div = document.createElement("div");
        div.className = "match-btn";
        div.innerHTML = `<b>Check Line ${i+1}:</b> Similar pattern found at Row ${idx+1} ➔ (Click to view Real Record)`;
        div.onclick = () => showPopup(idx, matrix);
        list.appendChild(div);
    });
}

function showPopup(idx, matrix) {
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    document.getElementById("popContent").innerHTML = '<table id="popTbl"></table>';
    
    // Create a sub-data slice for the popup to show the "Real Record"
    let subData = data.slice(idx, idx + matrix.length + 1);
    draw("popTbl", subData, {start: 0, matrix: matrix});
}

function closePop() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("popup").style.display = "none";
}

function addRow() { data.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem(KEY, JSON.stringify(data)); alert("Record Saved!"); }

draw();
</script>
</body>
</html>
