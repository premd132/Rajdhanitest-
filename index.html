<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ULTRA AI ENGINE</title>

<style>

body{
background:#111;
color:#fff;
font-family:Arial;
}

#topbar{
background:#222;
padding:10px;
}

button{
margin:3px;
padding:6px;
}

#tableBox{
height:80vh;
overflow:auto;
border:1px solid #555;
}

table{
border-collapse:collapse;
}

td{
border:1px solid #444;
width:45px;
height:35px;
text-align:center;
cursor:pointer;
}

.blank{background:#333;}
.line{background:red!important;}
.diag{background:blue!important;}
.cross{background:green!important;}

#panel{
position:fixed;
right:0;
top:60px;
width:260px;
height:80vh;
background:#000;
border-left:2px solid #555;
overflow:auto;
padding:10px;
}

</style>
</head>


<body>


<div id="topbar">

<input type="file" id="file">

<button onclick="loadCSV()">Upload</button>

<button onclick="aiScan()">AI Scan</button>

<button onclick="predictNext()">Predict</button>

<button onclick="clearDraw()">Clear</button>

</div>


<div id="tableBox">

<table id="grid"></table>

</div>


<div id="panel">

<h3>ULTRA AI</h3>

<div id="result"></div>

</div>



<script>


let data=[]
let maxCol=0



/* ===== CSV ===== */

function loadCSV(){

let f=file.files[0]

if(!f)return

let r=new FileReader()

r.onload=e=>{

parseCSV(e.target.result)
drawTable()

}

r.readAsText(f)

}



function parseCSV(text){

data=[]
maxCol=0

let rows=text.split(/\r?\n/)

for(let row of rows){

if(!row.trim())continue

let cols=row.trim().split(".")

if(cols.length>maxCol)maxCol=cols.length

data.push(cols)

}


for(let r=0;r<data.length;r++){

while(data[r].length<maxCol){

data[r].push("**")

}

}

}



function drawTable(){

grid.innerHTML=""

for(let r=0;r<data.length;r++){

let tr=document.createElement("tr")

for(let c=0;c<maxCol;c++){

let td=document.createElement("td")

let v=data[r][c]

td.innerText=v

if(v=="**")td.classList.add("blank")

tr.appendChild(td)

}

grid.appendChild(tr)

}

}



/* ===== CLEAR ===== */

function clearDraw(){

document.querySelectorAll("td").forEach(x=>{

x.classList.remove(
"line","diag","cross"
)

})

}



/* ===== AI SCAN ===== */

function aiScan(){

clearDraw()

let last=data.length-1

let res="Scan:<br>"

for(let d=2;d<20;d++){

if(last-d<0)continue

if(repeatCheck(last,d)){

res+="Repeat "+d+"<br>"
highlight(last,d)

}

if(diagCheck(last,d)){

res+="Diagonal "+d+"<br>"
highlight(last,d)

}

}

result.innerHTML=res

}



function repeatCheck(last,d){

for(let c=0;c<maxCol;c++){

if(data[last][c]!=data[last-d][c])
return false

}

return true

}



function diagCheck(last,d){

for(let c=0;c<maxCol-1;c++){

if(data[last][c]!=data[last-d][c+1])
return false

}

return true

}



function highlight(last,d){

for(let c=0;c<maxCol;c++){

grid.rows[last].cells[c].classList.add("line")

grid.rows[last-d].cells[c].classList.add("diag")

}

}



/* ===== PREDICTION ===== */

function predictNext(){

clearDraw()

let last=data.length-1
let prev=last-1

if(prev<0)return

let res="Prediction:<br>"

for(let d=2;d<20;d++){

if(prev-d<0)continue

if(repeatCheck(prev,d)){

let r=prev-d+1

res+="Repeat "+d+" → "

for(let c=0;c<maxCol;c++){

res+=data[r][c]+" "

highlightCell(last,c)

}

res+="<br>"

}

if(diagCheck(prev,d)){

let r=prev-d+1

res+="Diag "+d+" → "

for(let c=0;c<maxCol;c++){

res+=data[r][c]+" "

highlightCell(last,c)

}

res+="<br>"

}

}

result.innerHTML=res

}



function highlightCell(r,c){

if(grid.rows[r] && grid.rows[r].cells[c]){

grid.rows[r].cells[c].classList.add("cross")

}

}


</script>


</body>
</html>
