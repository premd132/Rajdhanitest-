<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBOSS Style - PRO AI LOGIC</title>
    <style>
        :root { --gold: #ffd700; --bg: #0a0e17; --panel: #161c2e; --blue: #00d2ff; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        .nav { background: var(--panel); padding: 10px; border-bottom: 3px solid var(--gold); display: flex; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        
        .main-chart { background: #fff; display: inline-block; padding: 5px; border-radius: 4px; margin: 20px; position: relative; }
        table { border-collapse: collapse; color: #000; font-weight: bold; }
        td, th { border: 1px solid #ccc; width: 42px; height: 42px; text-align: center; cursor: pointer; position: relative; }
        th { background: #161c2e; color: #fff; font-size: 10px; }

        /* जादुई गोले और लाइनें */
        .circle-match { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(0, 210, 255, 0.2); z-index: 10; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }

        .dashboard { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--panel); border-radius: 10px; padding: 15px; border-top: 4px solid var(--gold); }
        
        /* Check Line स्टाइल */
        .check-line { background: #0a0e17; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 5px solid var(--gold); cursor: pointer; display: flex; justify-content: space-between; }
        .check-line:hover { background: #232d45; }

        #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center; }
        .pop-box { background:#fff; padding:20px; border-radius:10px; color:#000; position:relative; }
        .close-btn { position:absolute; top:-40px; right:0; background:red; color:white; border:none; padding:10px; cursor:pointer; }
        button { padding: 10px 15px; cursor:pointer; font-weight:bold; border-radius:5px; border:none; }
    </style>
</head>
<body>

<div class="nav">
    <input type="file" id="csvInp" hidden onchange="loadCSV(this)">
    <button onclick="document.getElementById('csvInp').click()" style="background:#444; color:#fff;">📂 CSV UPLOAD</button>
    <button onclick="save()" style="background:var(--gold); color:#000;">💾 SAVE DATA</button>
    <button onclick="addRow()" style="background:#444; color:#fff;">➕ ROW</button>
</div>

<center>
    <div class="main-chart" id="chart-area">
        <canvas id="mainCvs"></canvas>
        <table id="mainTbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3 style="margin:0; color:var(--gold);">🎯 SMART CHECK LINES (1, 2, 3)</h3>
        <div id="check-list" style="margin-top:10px;">किसी भी खाली सेल (**) पर क्लिक करें...</div>
    </div>
    <div class="card">
        <h3 style="margin:0; color:#00ff88;">🔮 AI PREDICTION</h3>
        <div id="ai-res" style="font-size: 30px; text-align: center; margin-top: 15px;">-- -- --</div>
    </div>
</div>

<div id="modal">
    <div class="pop-box">
        <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">CLOSE X</button>
        <div class="main-chart" style="margin:0">
            <canvas id="popCvs"></canvas>
            <div id="popContent"></div>
        </div>
    </div>
</div>

<script>
const FAMILY = {"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let chartData = JSON.parse(localStorage.getItem("db_smart_v1")) || Array(12).fill().map(()=>Array(6).fill("**"));
let currentScheme = null;

const getF = v => { for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return null; };
const fix = v => { v=v.toString().trim(); return (v==""||v=="**")?"**":v.padStart(2,'0').slice(-2); };

function loadCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        chartData = e.target.result.split("\n").filter(l=>l.trim()).map(l=>l.split(",").map(c=>fix(c)).slice(0,6));
        render("mainTbl", "mainCvs", null, chartData);
    };
    reader.readAsText(input.files[0]);
}

function render(tid, cid, pat, data, offset=0) {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((row, ri) => {
        let realR = ri + offset;
        h += "<tr>";
        row.forEach((cell, ci) => {
            let isCircle = (pat && pat.points.some(p => p.r === realR && p.c === ci));
            h += `<td class="${isCircle?'circle-match':''}" onclick="cellClick(${realR},${ci})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById(tid).innerHTML = h;
    if(pat) setTimeout(() => drawLines(cid, tid), 50);
}

function cellClick(r, c) {
    if(chartData[r][c] === "**") {
        findSmartPattern(r, c);
    } else {
        let v = prompt("Value:", chartData[r][c]);
        if(v!==null) { chartData[r][c]=fix(v); render("mainTbl", "mainCvs", null, chartData); }
    }
}

function findSmartPattern(ri, ci) {
    let points = [];
    // पिछले 10 हफ्तों की "Geometry" पकड़ना
    for(let i=ri-1; i>=Math.max(0, ri-10); i--) {
        for(let j=0; j<6; j++) {
            let f = getF(chartData[i][j]);
            if(f && points.length < 2) {
                points.push({r:i, c:j, k:f, distR: ri-i, distC: ci-j});
            }
        }
    }
    if(points.length < 2) return alert("कम से कम 2 जोड़ियाँ रिकॉर्ड में होनी चाहिए!");
    
    currentScheme = {points, targetPos: {r:ri, c:ci}};
    render("mainTbl", "mainCvs", currentScheme, chartData);
    searchHistory(currentScheme);
}

function searchHistory(scheme) {
    let matches = [];
    // यह असली "स्मार्ट सर्च" है जो दूरी को भी मैच करता है
    for(let i=0; i < scheme.targetPos.r - 5; i++) {
        let ok = true;
        scheme.points.forEach(p => {
            let checkR = i - p.distR;
            if(!chartData[checkR] || getF(chartData[checkR][p.c]) !== p.k) ok = false;
        });
        if(ok) matches.push(i);
    }

    let list = document.getElementById("check-list");
    list.innerHTML = "";
    matches.slice(0,3).forEach((mIdx, i) => {
        let div = document.createElement("div");
        div.className = "check-line";
        div.innerHTML = `<span>Check Line ${i+1} (Strong Match)</span> <span>Row: ${mIdx+1} ➔</span>`;
        div.onclick = () => {
            document.getElementById("modal").style.display = "flex";
            let start = Math.max(0, mIdx - 5);
            let snippet = chartData.slice(start, mIdx + 1);
            let popPat = { points: scheme.points.map(p => ({r: mIdx - p.distR, c: p.c})) };
            render("popContent", "popCvs", popPat, snippet, start);
        };
        list.appendChild(div);
    });

    let preds = matches.map(m => chartData[m][scheme.targetPos.c]).filter(v => v!=="**");
    document.getElementById("ai-res").innerText = preds.length ? [...new Set(preds)].join(" - ") : "No Match";
}

function drawLines(cid, tid) {
    const cvs = document.getElementById(cid), tbl = document.getElementById(tid), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let dots = [...tbl.querySelectorAll(".circle-match")];
    if(dots.length < 2) return;
    ctx.strokeStyle = "#00d2ff"; ctx.lineWidth = 3; ctx.beginPath();
    dots.forEach((d, i) => {
        let x = d.offsetLeft + 21, y = d.offsetTop + 21;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function addRow() { chartData.push(Array(6).fill("**")); render("mainTbl", "mainCvs", null, chartData); }
function save() { localStorage.setItem("db_smart_v1", JSON.stringify(chartData)); alert("Data Saved!"); }

render("mainTbl", "mainCvs", null, chartData);
</script>
</body>
</html>
