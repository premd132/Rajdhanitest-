<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Pradeep Kumar Original</title>
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:'Poppins', sans-serif}
body{margin:0;background:var(--bg);color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px}

/* TABLE & CANVAS */
.table-box{position:relative;background:#fff;padding:10px;border-radius:12px;margin-bottom:20px}
table{border-collapse:collapse;color:#000}
td,th{border:1px solid #ddd;width:50px;height:50px;text-align:center;font-weight:800;font-size:18px;cursor:pointer;position:relative}
th{background:#1e293b;color:#fff;font-size:11px}
canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:10}

/* MARKING STYLES */
.circle-red{border:3px solid var(--red)!important;border-radius:8px;background:rgba(255,71,87,0.1)}
.circle-blue{border:3px solid var(--blue)!important;border-radius:8px;background:rgba(46,134,222,0.1)}
.marked-yellow{background:#facc15!important;border:2px solid #854d0e!important}

/* POPUP / DUAL VIEW */
#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center}
.popup-content{background:#fff;padding:20px;border-radius:15px;position:relative;max-width:95%}
.close-btn{position:absolute;top:-15px;right:-15px;background:#000;color:#fff;border:none;padding:10px 15px;border-radius:50%;cursor:pointer;font-weight:bold}

/* DASHBOARD */
.dashboard{width:100%;max-width:450px}.card{background:var(--panel);padding:15px;border-radius:12px;border-top:4px solid var(--gold);margin-bottom:10px}
.check-line{background:#2d3748;padding:12px;margin:8px 0;border-radius:8px;border-left:5px solid var(--gold);cursor:pointer}
</style>
</head>
<body>

<div class="table-box">
    <canvas id="mainCanvas"></canvas>
    <table id="tblMain"></table>
</div>

<div class="dashboard">
    <div class="card">
        <b>✔ CHECK LINES (HISTORY PATTERNS)</b>
        <div id="checkList">Click (**) to scan history...</div>
    </div>
</div>

<div id="overlay">
    <div class="popup-content">
        <button class="close-btn" onclick="closePopup()">X</button>
        <h3 style="color:#000;text-align:center;margin-top:0">Dual-Pattern View</h3>
        <div style="position:relative">
            <canvas id="popupCanvas"></canvas>
            <table id="tblPopup" style="color:#000"></table>
        </div>
    </div>
</div>

<script>
const FAMILY={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"11":["11","66","16","61"],"22":["22","77","27","72"],"33":["33","88","38","83"],"44":["44","99","49","94"],"55":["55","00","05","50"]};
let data = Array(15).fill().map(()=>Array(5).fill("**")); // Dummy data for example
let activePattern = null;

function fam(v){for(let k in FAMILY)if(FAMILY[k].includes(v))return k; return "NA";}
function norm(v){v=String(v); return v.length==1?"0"+v:v;}

// Draw main table
function renderTable(tableId, targetData, patternObj = null){
    const table = document.getElementById(tableId);
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    targetData.forEach((r,i)=>{
        h += "<tr>";
        r.forEach((c,j)=>{
            let cls = "";
            if(patternObj){
                if(patternObj.yR===i && patternObj.yC===j) cls="marked-yellow";
                if(patternObj.reds.some(p=>p.r===i && p.c===j)) cls="circle-red";
                if(patternObj.blues.some(p=>p.r===i && p.c===j)) cls="circle-blue";
            }
            h += `<td class="${cls}" onclick="handleCell(${i},${j})">${c}</td>`;
        });
        h += "</tr>";
    });
    table.innerHTML = h;
}

function handleCell(r,c){
    if(data[r][c] === "**") scanHistory(r,c);
}

function scanHistory(r,c){
    let results = [];
    // Identify families above the clicked cell
    let b1 = fam(data[r-1]?.[c-1]), b2 = fam(data[r-2]?.[c+1]);
    
    // Scan entire data for matches
    for(let i=3; i<data.length; i++){
        if(data[i][c] !== "**" && i !== r){
            results.push(i);
        }
    }

    let div = document.getElementById("checkList"); div.innerHTML = "";
    results.slice(0,5).forEach(mRow => {
        let btn = document.createElement("div"); btn.className = "check-line";
        btn.innerText = `View Pattern: Row ${mRow+1}`;
        btn.onclick = () => openDualView(mRow, c);
        div.appendChild(btn);
    });
}

function openDualView(mRow, c){
    document.getElementById("overlay").style.display = "flex";
    // Setup pattern object for the popup (screenshot style)
    let pattern = {
        yR: mRow, yC: c,
        reds: [{r: mRow-4, c: c-1}, {r: mRow-6, c: c}], // Tircha example
        blues: [{r: mRow-3, c: c+1}, {r: mRow-5, c: c+2}]
    };
    renderTable("tblPopup", data, pattern);
    setTimeout(() => drawPatternLines("popupCanvas", "tblPopup", pattern), 100);
}

function drawPatternLines(canvasId, tableId, p){
    const canvas = document.getElementById(canvasId);
    const table = document.getElementById(tableId);
    const ctx = canvas.getContext("2d");
    canvas.width = table.offsetWidth; canvas.height = table.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const rect = table.getBoundingClientRect();

    // Target (Yellow) center
    let tCell = table.rows[p.yR+1].cells[p.yC].getBoundingClientRect();
    let tx = tCell.left - rect.left + tCell.width/2;
    let ty = tCell.top - rect.top + tCell.height/2;

    const drawLine = (pts, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 3;
        pts.forEach(pt => {
            if(pt.r < 0 || pt.r >= table.rows.length-1) return;
            let cCell = table.rows[pt.r+1].cells[pt.c].getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(cCell.left-rect.left+cCell.width/2, cCell.top-rect.top+cCell.height/2);
            ctx.lineTo(tx, ty); // TIRCHA CONNECTION
            ctx.stroke();
        });
    };
    drawLine(p.reds, "#ff4757");
    drawLine(p.blues, "#2e86de");
}

function closePopup(){ document.getElementById("overlay").style.display="none"; }

// Initial Load
renderTable("tblMain", data);
</script>
</body>
</html>
