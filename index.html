<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBoss King - CSV & 3rd Touch System</title>
    <style>
        body { font-family: Arial; background: #1a1a1a; color: #fff; text-align: center; margin: 0; }
        .header { background: #d32f2f; padding: 15px; font-size: 20px; font-weight: bold; border-bottom: 4px solid #ffeb3b; }
        
        .tools { background: #333; padding: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        input, select, button { padding: 10px; border-radius: 5px; border: none; font-weight: bold; }
        
        /* Buttons Color */
        .btn-search { background: #ffeb3b; color: #000; }
        .btn-csv { background: #2196F3; color: #fff; }
        .btn-save { background: #4CAF50; color: #fff; }

        .chart-container { position: relative; margin: 20px auto; display: inline-block; background: #fff; padding: 10px; border-radius: 8px; overflow: auto; max-width: 95%; }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 2; }
        th, td { border: 1px solid #ccc; width: 55px; height: 50px; text-align: center; font-weight: bold; }
        th { background: #f0f0f0; font-size: 12px; }

        /* Pattern Styles */
        .base-box { border: 3px solid red !important; color: red; background: rgba(255,0,0,0.1); }
        .touch-circle { border: 3px solid blue !important; border-radius: 50%; color: blue; }
        #lineCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>

<div class="header">PRO CHART TOOL - CSV UPLOAD & 3rd TOUCH</div>

<div class="tools">
    <div style="border-right: 2px solid #555; padding-right: 15px;">
        <label>Upload CSV: </label>
        <input type="file" id="csvFile" accept=".csv" class="btn-csv" onchange="handleCSV()">
    </div>

    <select id="dayIdx">
        <option value="0">Mon</option><option value="1">Tue</option><option value="2">Wed</option>
        <option value="3">Thu</option><option value="4">Fri</option><option value="5">Sat</option>
    </select>
    <input type="text" id="findJodi" placeholder="Jodi (eg 37)" size="10">
    <button class="btn-search" onclick="runTouch()">SEARCH TOUCH</button>
    <button onclick="resetChart()">RESET</button>
</div>

<div class="chart-container" id="chartBox">
    <canvas id="lineCanvas"></canvas>
    <table id="matkaTable">
        <thead>
            <tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div style="margin-bottom: 50px;">
    <button class="btn-save" onclick="saveData()">SAVE DATA</button>
    <button onclick="addRow()">+ ADD ROW</button>
    <p id="status" style="color: #4caf50;"></p>
</div>

<script>
    let chartData = JSON.parse(localStorage.getItem('dp_data')) || [
        ["00","00","00","00","00","00"],["00","00","00","00","00","00"]
    ];

    // --- CSV UPLOAD LOGIC ---
    function handleCSV() {
        const file = document.getElementById('csvFile').files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const content = e.target.result;
            const rows = content.split("\n");
            chartData = rows.map(row => {
                let cols = row.split(",");
                // Sirf 6 columns rakhenge (Mon-Sat)
                return cols.slice(0, 6).map(c => c.trim() || "**");
            }).filter(row => row.length >= 1);

            initTable();
            document.getElementById('status').innerText = "CSV Uploaded Successfully!";
        };
        reader.readAsText(file);
    }

    function initTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        chartData.forEach((row, rIdx) => {
            let tr = document.createElement('tr');
            row.forEach((cell, cIdx) => {
                let td = document.createElement('td');
                td.innerText = cell;
                td.contentEditable = true;
                td.onblur = () => { chartData[rIdx][cIdx] = td.innerText; };
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        setTimeout(resizeCanvas, 100);
    }

    function resizeCanvas() {
        const canvas = document.getElementById('lineCanvas');
        const box = document.getElementById('chartBox');
        canvas.width = box.scrollWidth;
        canvas.height = box.scrollHeight;
    }

    function runTouch() {
        resetChart();
        const target = document.getElementById('findJodi').value;
        const day = document.getElementById('dayIdx').value;
        const ctx = document.getElementById('lineCanvas').getContext('2d');
        const table = document.getElementById('matkaTable');
        const container = document.getElementById('chartBox');
        
        let matches = [];
        for(let i=0; i<chartData.length; i++) {
            if(chartData[i][day] == target) matches.push(i);
        }

        if(matches.length < 3) {
            alert("Kam se kam 3 match chahiye!");
            return;
        }

        ctx.strokeStyle = "blue";
        ctx.lineWidth = 3;

        matches.forEach((rowIndex, index) => {
            if(index > 2) return; 

            let baseCell = table.rows[rowIndex + 1].cells[day];
            baseCell.classList.add('base-box');

            if(rowIndex + 1 < chartData.length) {
                let resCell = table.rows[rowIndex + 2].cells[day];
                resCell.classList.add('touch-circle');

                // Coordinate calculation
                const x = baseCell.offsetLeft + baseCell.offsetWidth / 2;
                const y1 = baseCell.offsetTop + baseCell.offsetHeight / 2;
                const y2 = resCell.offsetTop + resCell.offsetHeight / 2;

                ctx.beginPath();
                ctx.moveTo(x, y1);
                ctx.lineTo(x, y2);
                ctx.stroke();
            }
        });
    }

    function resetChart() {
        document.querySelectorAll('td').forEach(t => t.className = '');
        const canvas = document.getElementById('lineCanvas');
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    function addRow() { chartData.push(["**","**","**","**","**","**"]); initTable(); }
    function saveData() { localStorage.setItem('dp_data', JSON.stringify(chartData)); alert("Saved!"); }

    window.onload = initTable;
</script>
</body>
</html>
