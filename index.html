<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rajdhani Pro AI - Column Wise</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#ffd700; --blue:#0084ff; --red:#ff4757; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:Poppins,sans-serif}
body{margin:0;background:var(--bg);color:#fff; overflow-x: hidden; padding-bottom: 50px;}
.toolbar{ background:var(--panel);padding:10px; display:flex;gap:8px;justify-content:center; border-bottom: 2px solid var(--gold); position: sticky; top:0; z-index:100; }
.table-wrap{position:relative;background:#fff;border-radius:8px;padding:5px; display: inline-block; margin-top: 15px;}
table{border-collapse:collapse;color:#000}
td,th{ border:1px solid #ccc; width:45px;height:45px; text-align:center;font-weight:bold; cursor: pointer; position: relative; font-size: 14px;}
th{background:#1e293b;color:#fff; font-size: 10px;}
.circle-red { border:3px solid var(--red)!important; border-radius:50%; background:rgba(255,71,87,.25); z-index: 5;}
.circle-blue { border:3px solid var(--blue)!important; border-radius:50%; background:rgba(0,132,255,.25); z-index: 5;}
canvas{position:absolute;top:0;left:0;pointer-events:none; z-index: 4;}
.dashboard{ padding: 15px; display: grid; grid-template-columns: 1fr; gap: 10px; }
.card{ background:var(--panel);padding:12px;border-radius:10px; border-top:3px solid var(--gold); min-height: 80px;}
button{cursor:pointer;font-weight:bold;border-radius:4px;border:none; padding: 8px 12px; font-size: 12px;}
.match-btn { background: #1e293b; color: var(--gold); border: 1px solid var(--gold); padding: 12px; margin: 8px 0; width: 100%; text-align: left; border-radius: 8px; font-size: 13px; font-weight:bold; cursor:pointer;}
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csv" hidden>
    <button onclick="csv.click()" style="background:#444; color:white;">📂 CSV</button>
    <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
    <button onclick="save()" style="background:#28a745; color:white;">💾 SAVE</button>
    <button onclick="clearAll()" style="background:#dc3545; color:white;">🗑 CLEAR</button>
</div>

<center>
    <div class="table-wrap">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
    <p style="font-size: 11px; color: #aaa; margin: 10px 0;">Click any <b>**</b> to generate specific pattern for that column.</p>
</center>

<div class="dashboard">
    <div class="card">
        <h3 style="margin:0 0 10px 0; font-size: 14px; color:var(--gold);">✔ CHECK LINES (History)</h3>
        <div id="checks">Click on any blank cell to scan history...</div>
    </div>
    <div class="card">
        <h3 style="margin:0 0 5px 0; font-size: 14px; color:var(--gold);">🤖 AI ANALYSIS</h3>
        <div id="ai" style="font-size: 13px;">Waiting for selection...</div>
    </div>
</div>

<script>
const STORE="rajdhani_dual_v4";
const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data = JSON.parse(localStorage.getItem(STORE)) || Array(15).fill().map(()=>Array(5).fill("**"));
let activePattern=null, targetCol=null;

const norm=v=> (!v || v=="**") ? "**" : v.toString().padStart(2,"0").slice(-2);
function famOf(v){ for(let k in families) if(families[k].includes(v)) return k; return "NA"; }
function isFamMatch(a, b) { if(a=="**" || b=="**") return false; return famOf(a)===famOf(b); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls="";
   if(activePattern && ri >= activePattern.start && ri < activePattern.start + activePattern.shape.length){
       let type = activePattern.shape[ri-activePattern.start][ci];
       if(type === 1) cls = "circle-red";
       if(type === 2) cls = "circle-blue";
   }
   h+=`<td class="${cls}" onclick="cellAction(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activePattern) setTimeout(drawLines, 50);
}

function cellAction(ri, ci) {
    if(data[ri][ci] === "**") {
        activePattern = null; // Clear previous
        generateColumnPattern(ri, ci);
    } else {
        let newVal = prompt("Edit Number:", data[ri][ci]);
        if(newVal !== null) {
            data[ri][ci] = norm(newVal);
            activePattern = null;
            draw();
        }
    }
}

function drawLines(){
 const cvs=document.getElementById("mainCanvas"), ctx=cvs.getContext("2d");
 const tbl=document.getElementById("tbl");
 cvs.width=tbl.offsetWidth; cvs.height=tbl.offsetHeight;
 ctx.clearRect(0,0,cvs.width,cvs.height);
 const t=tbl.getBoundingClientRect();

 [[".circle-red", "#ff4757"], [".circle-blue", "#0084ff"]].forEach(cfg => {
     let cells = [...tbl.querySelectorAll(cfg[0])];
     if(cells.length < 2) return;
     ctx.strokeStyle=cfg[1]; ctx.lineWidth=3; ctx.beginPath();
     cells.forEach((c,i)=>{
      let r=c.getBoundingClientRect();
      let x = r.left - t.left + r.width/2;
      let y = r.top - t.top + r.height/2;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
     });
     ctx.stroke();
 });
}

function generateColumnPattern(ri, ci){
 targetCol=ci;
 let f1="**", f2="**", f1c=[], f2c=[];
 let lookLimit = Math.max(0, ri-10);

 // स्कैनिंग जो हर बार नया पैटर्न बनाएगी
 for(let i=ri-1; i>=lookLimit; i--){
  for(let j=0; j<5; j++){
   let v = data[i][j];
   if(v!="**"){
    if(f1=="**") { f1=v; f1c.push({r:i, c:j}); }
    else if(isFamMatch(v, f1) && f1c.length < 2 && !f1c.some(x=>x.r==i)) { f1c.push({r:i, c:j}); }
    else if(f2=="**" && famOf(v)!=famOf(f1)) { f2=v; f2c.push({r:i, c:j}); }
    else if(f2!="**" && isFamMatch(v, f2) && f2c.length < 2 && !f2c.some(x=>x.r==i)) { f2c.push({r:i, c:j}); }
   }
  }
 }

 if(f1c.length < 2 || f2c.length < 2) { 
     document.getElementById("ai").innerHTML = "Insufficient pairs for this column.";
     return; 
 }

 let shape = Array(ri-lookLimit).fill().map(()=>Array(5).fill(0));
 f1c.forEach(x => shape[x.r-lookLimit][x.c] = 1);
 f2c.forEach(x => shape[x.r-lookLimit][x.c] = 2);

 activePattern={start:lookLimit, shape:shape};
 draw();
 searchHistory(shape, f1, f2, lookLimit);
}

function searchHistory(shape, f1, f2, limit){
 let matches=[];
 for(let i=0; i<limit; i++){
  let score=0;
  for(let r=0; r<shape.length; r++){
   for(let c=0; c<5; c++){
    if(shape[r][c]==1 && isFamMatch(data[i+r][c], f1)) score++;
    if(shape[r][c]==2 && isFamMatch(data[i+r][c], f2)) score++;
   }
  }
  if(score >= 4) matches.push(i);
 }
 
 let checksUI = document.getElementById("checks");
 checksUI.innerHTML="";
 
 if(matches.length === 0) {
     checksUI.innerHTML = "No family matches found in records.";
 } else {
     matches.forEach((mIdx, i)=>{
      let btn=document.createElement("div");
      btn.className = "match-btn";
      btn.innerHTML = `⭐ Check Match ${i+1} (Row ${mIdx+1})`;
      btn.onclick = () => { activePattern={start:mIdx, shape:shape}; draw(); };
      checksUI.appendChild(btn);
     });
 }
 document.getElementById("ai").innerHTML = `<b>Searching:</b> Fam(${f1}) & Fam(${f2})`;
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function save(){ localStorage.setItem(STORE,JSON.stringify(data)); alert("Saved!"); }
function clearAll(){ if(confirm("Clear Data?")){localStorage.clear(); location.reload();} }

document.getElementById("csv").onchange=e=>{
 let fr=new FileReader();
 fr.onload=()=>{
  data=fr.result.split("\n").filter(x=>x.trim()).map(l=>l.split(",").map(v=>norm(v.trim())).slice(0,5));
  draw();
 };
 fr.readAsText(e.target.files[0]);
};
draw();
</script>
</body>
</html>
