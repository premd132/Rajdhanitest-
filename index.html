<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep Patterns - Advanced AI Tool</title>
    <style>
        :root { --bg: #121212; --text: #e0e0e0; --accent: #00e5ff; --old: #2962ff; --new: #ffd600; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; cursor: pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button:hover { background: #444; border-color: var(--accent); }
        
        .chart-wrapper { position: relative; display: inline-block; padding: 10px; background: #1a1a1a; border-radius: 8px; }
        table { border-collapse: collapse; position: relative; z-index: 2; }
        td { border: 1px solid #333; width: 60px; height: 45px; text-align: center; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        td:hover { background: #222; }
        
        .highlight-old { background: rgba(41, 98, 255, 0.4) !important; box-shadow: inset 0 0 10px var(--old); }
        .highlight-new { background: rgba(255, 214, 0, 0.4) !important; box-shadow: inset 0 0 10px var(--new); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        .input-form { margin-top: 20px; background: #222; padding: 15px; border-radius: 8px; max-width: 400px; }
        input { padding: 8px; margin-right: 5px; width: 80px; background: #000; color: var(--accent); border: 1px solid #444; }
    </style>
</head>
<body>

    <h2>Rajdhani Night Pattern Logic</h2>
    
    <div class="controls">
        <button onclick="exportCSV()">Download CSV</button>
        <input type="file" id="csvImport" style="display:none" onchange="importCSV(this)">
        <button onclick="document.getElementById('csvImport').click()">Import CSV</button>
        <button onclick="clearData()" style="color:red">Clear All</button>
    </div>

    <div class="chart-wrapper" id="container">
        <canvas id="lineCanvas"></canvas>
        <table id="mainTable"></table>
    </div>

    <div class="input-form">
        <h3>Add New Row</h3>
        <input type="text" id="j1" placeholder="Mon">
        <input type="text" id="j2" placeholder="Tue">
        <input type="text" id="j3" placeholder="Wed">
        <input type="text" id="j4" placeholder="Thu">
        <input type="text" id="j5" placeholder="Fri">
        <button onclick="addRow()">Add Row</button>
    </div>

<script>
let matkaData = JSON.parse(localStorage.getItem('pradeep_matka_data')) || [];

// 1. Initial Render
function renderTable() {
    const table = document.getElementById('mainTable');
    table.innerHTML = "";
    matkaData.forEach((row, rIndex) => {
        let tr = document.createElement('tr');
        row.forEach((cell, cIndex) => {
            let td = document.createElement('td');
            td.innerText = cell || "**";
            td.id = `cell-${rIndex}-${cIndex}`;
            td.onclick = () => findPatterns(rIndex, cIndex);
            tr.appendChild(td);
        });
        table.appendChild(tr);
    });
    clearCanvas();
}

// 2. Pattern Logic (1-2-3 and Cross Row)
function findPatterns(r, c) {
    clearCanvas();
    const cells = document.querySelectorAll('td');
    cells.forEach(cell => cell.classList.remove('highlight-old', 'highlight-new'));
    
    const currentVal = matkaData[r][c];
    if(!currentVal || currentVal === "**") return;

    document.getElementById(`cell-${r}-${c}`).classList.add('highlight-new');

    // Search last 10 weeks
    for(let i = r - 1; i >= Math.max(0, r - 10); i--) {
        for(let j = 0; j < 5; j++) {
            let oldVal = matkaData[i][j];
            if(!oldVal || oldVal === "**") continue;

            // Logic: 1-2-3 Sequence or Family
            let diff = Math.abs(parseInt(currentVal) - parseInt(oldVal));
            if(diff === 1 || diff === 2 || diff === 3 || isFamily(currentVal, oldVal)) {
                markPattern(i, j, r, c);
            }
        }
    }
}

function isFamily(v1, v2) {
    const rashi = {'0':5,'1':6,'2':7,'3':8,'4':9,'5':0,'6':1,'7':2,'8':3,'9':4};
    let d1 = v1.split(''), d2 = v2.split('');
    return d1.some(d => rashi[d] == d2[0] || rashi[d] == d2[1] || d == d2[0] || d == d2[1]);
}

// 3. Visuals: Circle & Connection Line
function markPattern(or, oc, nr, nc) {
    const oldCell = document.getElementById(`cell-${or}-${oc}`);
    const newCell = document.getElementById(`cell-${nr}-${nc}`);
    oldCell.classList.add('highlight-old');

    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = document.getElementById('container').offsetWidth;
    canvas.height = document.getElementById('container').offsetHeight;

    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);

    // Draw Line
    ctx.beginPath();
    ctx.moveTo(oldCell.offsetLeft + 30, oldCell.offsetTop + 22);
    ctx.lineTo(newCell.offsetLeft + 30, newCell.offsetTop + 22);
    ctx.stroke();
    
    // Draw Circle on Source
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(oldCell.offsetLeft + 30, oldCell.offsetTop + 22, 18, 0, Math.PI * 2);
    ctx.stroke();
}

// 4. Data Management (Add, CSV, Storage)
function addRow() {
    let newRow = [
        document.getElementById('j1').value,
        document.getElementById('j2').value,
        document.getElementById('j3').value,
        document.getElementById('j4').value,
        document.getElementById('j5').value
    ];
    matkaData.push(newRow);
    saveAndRefresh();
}

function saveAndRefresh() {
    localStorage.setItem('pradeep_matka_data', JSON.stringify(matkaData));
    renderTable();
}

function exportCSV() {
    let csvContent = matkaData.map(e => e.join(",")).join("\n");
    let blob = new Blob([csvContent], { type: 'text/csv' });
    let url = window.URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'matka_records.csv';
    a.click();
}

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = function() {
        const rows = reader.result.split("\n");
        matkaData = rows.map(r => r.split(","));
        saveAndRefresh();
    };
    reader.readAsText(input.files[0]);
}

function clearData() { if(confirm("Sab delete karein?")) { matkaData = []; saveAndRefresh(); } }
function clearCanvas() {
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

renderTable();
</script>
</body>
</html>
