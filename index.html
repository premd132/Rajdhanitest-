<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI – Pradeep Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; --red: #ff4757; --blue: #2e86de; 
            --green: #00ff88; --bg: #0f172a; --panel: #1e293b; 
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; }
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; }
        
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; }
        
        .circle-red { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 71, 87, 0.2); }
        .circle-blue { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(46, 134, 222, 0.2); }
        .source-mark { background-color: #a29bfe !important; border: 2px solid #6c5ce7 !important; border-radius: 10px; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        
        .check-line { background: #2d3436; margin: 5px 0; padding: 12px; border-radius: 8px; border-left: 5px solid var(--green); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 20px; color: #000; width: 95%; max-width: 500px; box-shadow: 0 0 50px #000; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 90; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
    </style>
</head>
<body>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 Load CSV</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 Save</button>
        <button onclick="clearAll()" style="background:#d63031; color:white;">🗑️ Clear</button>
    </div>

    <center>
        <div class="table-container">
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3>🔍 1, 2, 3 Pattern Check Lines</h3>
            <div id="checks" style="max-height: 200px; overflow-y: auto;">Click a cell to analyze...</div>
        </div>
        <div class="card">
            <h3>🤖 Advanced AI Result</h3>
            <div id="advanced-ai" style="color:var(--green); font-weight:600;">System ready...</div>
        </div>
        <div class="card" style="border-top-color: var(--blue);">
            <h3>🔮 Future AI Prediction</h3>
            <div id="future-ai" style="font-size: 1.8rem; color: var(--gold); text-align: center; font-weight: 800;">-- -- --</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <h3 id="popTitle">Pattern Connection View</h3>
    <div id="popData" style="position:relative; background:#fff; padding:10px; border-radius:10px; min-height:100px;"></div>
    <button onclick="closePopup()" style="width:100%; margin-top:15px; padding:10px; background:#000; color:#fff; border:none; border-radius:5px;">CLOSE</button>
</div>

<script>
const STORAGE_KEY = "Rajdhani_Pradeep_AI";
const FAMILY = {
    "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], 
    "99":["99","44","49","94"], "55":["50","00","05","55"], "12":["12","17","21","26","62","67","71","76"],
    "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],
    "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"],
    "24":["24","29","42","47","74","79","92","97"], "25":["02","07","20","25","52","57","70","75"],
    "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],
    "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(12).fill().map(()=>Array(5).fill("**"));

function fam(v){ for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA"; }
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return fam(a)===fam(b); }
function norm(v){ v=String(v).trim(); return (v.length==1 && v!=="*")?"0"+v:v; }

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            h+=`<td contenteditable="true" oninput="edit(${ri},${ci},this)" onclick="handleCell(${ri},${ci})">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Saved!"); }
function clearAll(){ if(confirm("Clear all?")){ localStorage.clear(); location.reload(); }}

function handleCell(r, c) {
    // 1. अगर भरा हुआ सेल है, तो मार्क करें कि यह पैटर्न किस पुराने रिकॉर्ड से आया
    if(data[r][c] !== "**") {
        markOldRecordSource(r, c);
    }
    // 2. 1, 2, 3 पैटर्न सर्च (पूरे रिकॉर्ड में)
    runPatternSearch(r, c);
}

function markOldRecordSource(r, c) {
    draw(); // Reset classes
    let targetVal = data[r][c];
    let table = document.getElementById("tbl");
    
    // पूरे पुराने रिकॉर्ड में ढूंढें कहाँ ये जोड़ी (Family) पहले आई थी
    for(let i=0; i<r; i++) {
        for(let j=0; j<5; j++) {
            if(smartMatch(data[i][j], targetVal)) {
                table.rows[i+1].cells[j].classList.add("source-mark");
            }
        }
    }
    document.getElementById("advanced-ai").innerHTML = `Found source family for ${targetVal} in older records.`;
}

function runPatternSearch(r, c) {
    let checkContainer = document.getElementById("checks");
    checkContainer.innerHTML = "Scanning history...";
    
    // पैटर्न: पिछली रो (Row directly above) या पिछली जोड़ी
    let prevVal = (c > 0) ? data[r][c-1] : (r > 0 ? data[r-1][4] : "**");
    let aboveVal = (r > 0) ? data[r-1][c] : "**";

    let matches = [];
    // पिछले 10 हफ्तों के भीतर या पूरे रिकॉर्ड में सिमिलर 1,2,3 पैटर्न
    for(let i=0; i < data.length - 2; i++) {
        if(i >= r-1) break; 
        
        let matchScore = 0;
        if(smartMatch(data[i][c], aboveVal)) matchScore++;
        if(prevVal !== "**" && smartMatch(data[i][c==0?4:c-1], prevVal)) matchScore++;

        if(matchScore >= 1) {
            matches.push({ index: i, result: data[i+1][c] });
        }
    }

    checkContainer.innerHTML = "";
    let predictions = [];
    
    matches.forEach(m => {
        let div = document.createElement("div");
        div.className = "check-line";
        div.innerHTML = `<span>Pattern at Row ${m.index + 1}</span> <b>CHECK ➔</b>`;
        div.onclick = () => showVisualPopup(m.index, r, c);
        checkContainer.appendChild(div);
        if(m.result !== "**") predictions.push(m.result);
    });

    // Future AI logic
    let unique = [...new Set(predictions)].slice(0, 3);
    document.getElementById("future-ai").innerText = unique.length > 0 ? unique.join(" - ") : "-- -- --";
}

function showVisualPopup(matchIdx, targetR, targetC) {
    let h = "<table id='popTbl' style='width:100%'>";
    // पिछले हफ़्ते और वर्तमान हफ़्ते का दृश्य
    for(let i = matchIdx; i <= matchIdx + 1; i++) {
        h += "<tr>";
        data[i].forEach((v, colIdx) => {
            let cls = (i === matchIdx && colIdx === targetC) ? "circle-red" : "";
            if(i === matchIdx+1 && colIdx === targetC) cls = "circle-blue";
            h += `<td class="${cls}">${v}</td>`;
        });
        h += "</tr>";
    }
    h += "</table><canvas id='popCanvas'></canvas>";
    
    document.getElementById("popData").innerHTML = h;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    
    setTimeout(() => drawConnectionLines(), 100);
}

function drawConnectionLines() {
    const canvas = document.getElementById("popCanvas");
    const table = document.getElementById("popTbl");
    canvas.width = table.offsetWidth;
    canvas.height = table.offsetHeight;
    const ctx = canvas.getContext("2d");
    
    const reds = table.querySelectorAll(".circle-red");
    const blues = table.querySelectorAll(".circle-blue");
    
    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 3;
    
    if(reds.length && blues.length) {
        const r1 = reds[0].getBoundingClientRect();
        const r2 = blues[0].getBoundingClientRect();
        const t = table.getBoundingClientRect();
        
        ctx.beginPath();
        ctx.moveTo(r1.left - t.left + r1.width/2, r1.top - t.top + r1.height/2);
        ctx.lineTo(r2.left - t.left + r2.width/2, r2.top - t.top + r2.height/2);
        ctx.stroke();
    }
}

function closePopup() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("popup").style.display = "none";
}

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v.trim())).slice(0,5));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};

window.onload = draw;
</script>
</body>
</html>
