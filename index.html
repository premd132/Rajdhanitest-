<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBK I-Smart - Sirf Jodi Pattern</title>
    <style>
        :root { --red: #ff0000; --green: #00aa00; --blue: #0000ff; --gold: #ffd700; }
        body { font-family: 'Arial', sans-serif; background: #000; color: #fff; margin: 0; text-align: center; }
        header { background: #b71c1c; padding: 15px; border-bottom: 4px solid var(--gold); font-size: 20px; font-weight: 900; }
        
        .controls { background: #1a1a1a; padding: 20px; display: flex; justify-content: center; gap: 20px; border-bottom: 1px solid #333; }
        input, select { padding: 10px; border-radius: 4px; border: none; font-weight: bold; }
        .btn-smart { background: var(--gold); color: #000; padding: 10px 25px; border: none; font-weight: 900; cursor: pointer; border-radius: 4px; }
        
        .chart-area { position: relative; display: inline-block; background: #fff; padding: 15px; margin-top: 25px; border-radius: 8px; box-shadow: 0 0 40px #000; }
        table { border-collapse: collapse; color: #000; z-index: 10; position: relative; }
        td, th { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-size: 20px; font-weight: 900; }
        th { background: #f0f0f0; font-size: 11px; height: 30px; }

        /* Automatic Marker Styles */
        .s-red { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); color: var(--red); }
        .s-green { border: 4px solid var(--green) !important; color: var(--green); }
        .s-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        #status { color: #0f0; margin: 10px; font-family: monospace; }
    </style>
</head>
<body>

<header>DPBK I-SMART: SIRF JODI AUTO-PATTERN</header>

<div class="controls">
    <div>
        <label style="display:block; font-size:10px;">LOAD JODI CSV</label>
        <input type="file" id="csvInp" onchange="loadJodiCSV()">
    </div>
    <div>
        <label style="display:block; font-size:10px;">BASE JODI</label>
        <input type="text" id="baseJodi" placeholder="E.g. 80" size="5">
    </div>
    <div>
        <label style="display:block; font-size:10px;">DAY</label>
        <select id="dayIdx">
            <option value="0">MON</option><option value="1">TUE</option>
            <option value="2">WED</option><option value="3">THU</option>
            <option value="4">FRI</option><option value="5">SAT</option>
        </select>
    </div>
    <button class="btn-smart" onclick="generateISmart()">GENERATE PATTERN</button>
</div>

<div id="status">Status: Load CSV to Start</div>

<div class="chart-area" id="box">
    <canvas id="canvas"></canvas>
    <table id="itbl">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
let jodiData = [];

// Family Calculator
function getFamily(v) {
    let n = v.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let s = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => { s.add(`${a[0]}${b[0]}`); s.add(`${b[0]}${a[0]}`); }));
    return Array.from(s);
}

function loadJodiCSV() {
    const file = document.getElementById('csvInp').files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        jodiData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        render();
        document.getElementById('status').innerText = "Jodi Chart Loaded.";
    };
    reader.readAsText(file);
}

function render() {
    const b = document.getElementById('tbody');
    b.innerHTML = jodiData.map(row => `<tr>${row.map(j => `<td>${j}</td>`).join('')}</tr>`).join('');
    setTimeout(sync, 100);
}

function sync() {
    const c = document.getElementById('canvas'), b = document.getElementById('box');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

// 🚀 AUTO-CIRCLE LOGIC
function generateISmart() {
    const baseVal = document.getElementById('baseJodi').value;
    const day = parseInt(document.getElementById('dayIdx').value);
    const table = document.getElementById('itbl');
    const ctx = document.getElementById('canvas').getContext('2d');
    
    document.querySelectorAll('td').forEach(t => t.className = "");
    ctx.clearRect(0,0,5000,5000);

    if(!baseVal || jodiData.length === 0) return alert("Jodi daalein aur CSV load karein!");

    const fam = getFamily(baseVal);
    const lastRow = jodiData.length - 1; 
    const baseCell = table.rows[lastRow+1].cells[day];
    baseCell.classList.add('s-red');

    jodiData.forEach((row, ri) => {
        if(fam.includes(row[day]) && ri < lastRow) {
            // I-Smart Automatic Pattern Geometry
            let jumps = [
                {rd: -1, cd: 0, type: 's-green'}, // Direct Up
                {rd: -4, cd: 2, type: 's-blue'}   // Long Diagonal Circle
            ];

            jumps.forEach(j => {
                let tr = ri + j.rd, tc = day + j.cd;
                if(jodiData[tr] && jodiData[tr][tc]) {
                    const targetCell = table.rows[tr+1].cells[tc];
                    targetCell.classList.add(j.type);
                    
                    ctx.strokeStyle = j.type.includes('green') ? 'green' : 'blue';
                    ctx.lineWidth = 2.5; ctx.setLineDash([5, 3]); ctx.beginPath();
                    ctx.moveTo(baseCell.offsetLeft + 30, baseCell.offsetTop + 27);
                    ctx.lineTo(targetCell.offsetLeft + 30, targetCell.offsetTop + 27);
                    ctx.stroke();
                }
            });
            document.getElementById('status').innerText = "I-Smart Logic Applied Successfully!";
        }
    });
}
</script>
</body>
</html>
