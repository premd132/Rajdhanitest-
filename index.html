<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI - Pro Pattern Master</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --accent: #58a6ff; --predict: #ff7b72; --gold: #f2cc60; }
        body { font-family: 'Segoe UI', Tahoma; background: var(--bg); color: #c9d1d9; margin: 0; padding: 20px; }
        
        /* Layout */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
        .controls { display: flex; gap: 10px; }
        
        /* Table Styling */
        .chart-container { position: relative; overflow-x: auto; background: #010409; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        table { border-collapse: collapse; width: 100%; min-width: 500px; z-index: 2; position: relative; }
        th { background: var(--card); color: var(--accent); padding: 10px; border: 1px solid var(--border); }
        td { border: 1px solid var(--border); width: 20%; height: 55px; text-align: center; font-size: 1.3em; cursor: cell; transition: 0.2s; font-weight: bold; }
        td:focus { outline: 2px solid var(--accent); background: #1f2937; }
        
        /* Pattern Visuals */
        .source-circle { background: rgba(88, 166, 255, 0.25) !important; color: var(--accent); border: 2px solid var(--accent) !important; border-radius: 4px; }
        .target-box { background: rgba(255, 123, 114, 0.25) !important; color: var(--predict); border: 2px solid var(--predict) !important; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }

        /* Buttons */
        button { padding: 10px 18px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-weight: 600; background: #21262d; color: #c9d1d9; }
        button:hover { background: #30363d; border-color: #8b949e; }
        .btn-ai { background: var(--predict); color: white; border: none; }
        .btn-ai:hover { background: #da3633; }

        .form-box { margin-top: 20px; padding: 20px; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
        input { background: #0d1117; border: 1px solid var(--border); color: var(--gold); padding: 12px; width: 80px; text-align: center; font-size: 1.1em; border-radius: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div><h2 style="margin:0; color:var(--accent);">Rajdhani Night Pro</h2><span>Pradeep Kumar Dehariya System</span></div>
    <div class="controls">
        <button onclick="runAIScanner()" class="btn-ai">Scan 1-2-3 Patterns</button>
        <button onclick="downloadCSV()" style="background:#238636; color:white;">Save CSV</button>
        <button onclick="document.getElementById('fileIn').click()">Import CSV</button>
        <input type="file" id="fileIn" style="display:none" onchange="importCSV(this)">
    </div>
</div>

<div class="chart-container" id="chartWrapper">
    <canvas id="lineCanvas"></canvas>
    <table id="mainTable">
        <thead>
            <tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="form-box">
    <h3>Add New Week Records</h3>
    <input type="text" id="m1" placeholder="00">
    <input type="text" id="m2" placeholder="00">
    <input type="text" id="m3" placeholder="00">
    <input type="text" id="m4" placeholder="00">
    <input type="text" id="m5" placeholder="00">
    <button onclick="addNewRow()" style="background:var(--accent); color:white; margin-left:10px;">Add New Row</button>
    <button onclick="clearHistory()" style="background:#da3633; color:white; float:right;">Clear All</button>
</div>

<script>
let matkaData = JSON.parse(localStorage.getItem('pradeep_pro_v3')) || [];
const rashi = { '0':5, '1':6, '2':7, '3':8, '4':9, '5':0, '6':1, '7':2, '8':3, '9':4 };

function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = "";
    matkaData.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.innerText = cell || "**";
            td.contentEditable = true; // DIRECT EDITING ENABLED
            td.id = `cell-${r}-${c}`;
            td.onblur = () => updateCell(r, c, td.innerText);
            td.onclick = () => showConnection(r, c);
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    resetCanvas();
}

// 1. IMPROVED CSV DOWNLOAD (Direct Blob method)
function downloadCSV() {
    if (matkaData.length === 0) return alert("No data to save!");
    let csvStr = matkaData.map(r => r.join(",")).join("\n");
    let blob = new Blob([csvStr], { type: 'text/csv' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `Rajdhani_Night_Pradeep_1986.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = () => {
        matkaData = reader.result.trim().split("\n").map(line => line.split(","));
        saveAndRender();
    };
    reader.readAsText(input.files[0]);
}

// 2. PATTERN LOGIC: Fam-to-Fam & 1-2-3
function getFam(j) {
    if(!j || j.length < 2) return [];
    let d = j.split('').map(Number);
    let f1 = [d[0], rashi[d[0]]], f2 = [d[1], rashi[d[1]]];
    let res = [];
    f1.forEach(a => f2.forEach(b => { res.push(`${a}${b}`); res.push(`${b}${a}`); }));
    return [...new Set(res)];
}

function showConnection(r, c) {
    resetCanvas();
    const current = matkaData[r][c];
    if(!current || current == "**") return;

    const currentFam = getFam(current);
    
    // Scan previous 10 weeks
    for(let i = r - 1; i >= Math.max(0, r - 10); i--) {
        for(let j = 0; j < 5; j++) {
            let old = matkaData[i][j];
            if(currentFam.includes(old) || Math.abs(parseInt(current) - parseInt(old)) <= 3) {
                drawLink(i, j, r, c);
            }
        }
    }
}

function drawLink(r1, c1, r2, c2) {
    const s = document.getElementById(`cell-${r1}-${c1}`);
    const e = document.getElementById(`cell-${r2}-${c2}`);
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    
    const wrapper = document.getElementById('chartWrapper');
    canvas.width = wrapper.scrollWidth;
    canvas.height = wrapper.scrollHeight;

    s.classList.add('source-circle');
    e.classList.add('target-box');

    ctx.beginPath();
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.moveTo(s.offsetLeft + (s.offsetWidth/2), s.offsetTop + (s.offsetHeight/2));
    ctx.lineTo(e.offsetLeft + (e.offsetWidth/2), e.offsetTop + (e.offsetHeight/2));
    ctx.stroke();
    
    // Draw Circle on Source
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(s.offsetLeft + (s.offsetWidth/2), s.offsetTop + (s.offsetHeight/2), 22, 0, Math.PI*2);
    ctx.stroke();
}

// 3. AI SCANNER
function runAIScanner() {
    alert("Scanning 100+ patterns... Check the chart for lines!");
    let lastRow = matkaData.length - 1;
    for(let i=0; i<5; i++) showConnection(lastRow, i);
}

// Helpers
function updateCell(r, c, val) { matkaData[r][c] = val; localStorage.setItem('pradeep_pro_v3', JSON.stringify(matkaData)); }
function addNewRow() {
    let row = [document.getElementById('m1').value, document.getElementById('m2').value, document.getElementById('m3').value, document.getElementById('m4').value, document.getElementById('m5').value];
    matkaData.push(row);
    saveAndRender();
}
function saveAndRender() { localStorage.setItem('pradeep_pro_v3', JSON.stringify(matkaData)); renderTable(); }
function resetCanvas() {
    const canvas = document.getElementById('lineCanvas');
    canvas.getContext('2d').clearRect(0,0,canvas.width, canvas.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('source-circle', 'target-box'));
}
function clearHistory() { if(confirm("Data delete karein?")) { matkaData = []; saveAndRender(); } }

renderTable();
</script>
</body>
</html>
