<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Milan Pro AI – 2+2 Jodi System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; --blue-circle: #0084ff; --red-circle: #ff3131; 
            --green-line: #00ff88; --bg: #0f172a; --panel: #1e293b; 
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        /* Home Page */
        #home-screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .hero-title { font-size: 3rem; color: var(--gold); margin: 0; }
        .enter-btn { background: var(--gold); color: #000; padding: 15px 40px; font-size: 1.2rem; font-weight: 800; border: none; border-radius: 50px; cursor: pointer; margin-top: 20px; }

        #main-app { display: none; padding: 15px; }
        .toolbar { background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        
        /* Table Marking */
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; outline: none; }
        th { background: #1e293b; color: white; }
        
        .circle-b { border: 3px solid var(--blue-circle) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.1); }
        .circle-r { border: 3px solid var(--red-circle) !important; border-radius: 50% !important; background: rgba(255, 49, 49, 0.1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">Milan PRO AI</h1>
    <p style="opacity:0.7">PRADEEP SPECIAL: 2+2 JODI SYSTEM</p>
    <button class="enter-btn" onclick="startApp()">START ANALYSIS</button>
</div>

<div id="main-app">
    <div class="toolbar">
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card"><h3>Matches</h3><div id="checks"></div></div>
        <div class="card"><h3>AI Logic</h3><div id="ai">2+2 Family Filter Active</div></div>
        <div class="card"><h3>Prediction</h3><div id="future">...</div></div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup"><button onclick="closePopup()" style="float:right;">X</button><h3>Evidence</h3><div id="popData"></div></div>

<script>
const STORAGE_KEY="pdata_Milan_2_2_v3";
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(10).fill(["**","**","**","**","**","**"]);
let activeMark=null;
let targetCol=0;

const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

function startApp() { document.getElementById('home-screen').style.display='none'; document.getElementById('main-app').style.display='block'; draw(); }
function fam(v){for(let k in families) if(families[k].includes(v)) return k; return "NA";}
function palti(v){return v[1]+v[0];}
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || palti(a)===b || fam(a)===fam(b); }
function norm(v){ v=String(v).replace(/[^0-9]/g,''); return v.length==1?"0"+v:(v||"**");}

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{
            let type = activeMark && (ri-activeMark.start >=0 && ri-activeMark.start < activeMark.shape.length) ? activeMark.shape[ri-activeMark.start][ci] : 0;
            let cls = type==1 ? "circle-b" : (type==2 ? "circle-r" : "");
            h+=`<td class="${cls}" contenteditable onblur="data[${ri}][${ci}]=norm(this.innerText);draw();" onclick="${c=='**'?'makePattern('+ri+','+ci+')':''}">${c}</td>`;
        });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
    if(activeMark) setTimeout(()=>drawLines("mainCanvas","tbl"),50);
}

function drawLines(cId, tId) {
    const cvs=document.getElementById(cId), tbl=document.getElementById(tId), ctx=cvs.getContext("2d");
    cvs.width=tbl.offsetWidth; cvs.height=tbl.offsetHeight; ctx.clearRect(0,0,cvs.width,cvs.height);
    const cells=tbl.querySelectorAll(".circle-b, .circle-r");
    ctx.strokeStyle="#00ff88"; ctx.lineWidth=2; ctx.beginPath();
    cells.forEach((c,i)=>{ 
        const r=c.getBoundingClientRect(), tr=tbl.getBoundingClientRect();
        const x=r.left-tr.left+r.width/2, y=r.top-tr.top+r.height/2;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function makePattern(r,c){
    targetCol=c; let b1="**", b2="**", b1R=-1;
    for(let i=r;i>=0;i--){ if(data[i][c]!="**"){b1=data[i][c]; b1R=i; break;}}
    if(b1=="**") return;
    for(let i=b1R-1; i>=0; i--){
        for(let j=0; j<6; j++){ if(data[i][j]!="**" && fam(data[i][j])!==fam(b1)){b2=data[i][j]; break;}}
        if(b2!="**") break;
    }
    let shape=[]; let c1=0, c2=0;
    for(let i=Math.max(0,r-8); i<=r; i++){
        let row=[0,0,0,0,0,0];
        for(let j=0; j<6; j++){
            if(data[i][j]!="**"){
                if(smartMatch(data[i][j],b1) && c1 < 2){ row[j]=1; c1++; }
                else if(b2!="**" && smartMatch(data[i][j],b2) && c2 < 2){ row[j]=2; c2++; }
            }
        }
        shape.push(row);
    }
    searchPattern(shape, b1, b2);
}

function searchPattern(shape, b1, b2){
    let matches=[];
    for(let i=0; i<=data.length-shape.length; i++){
        let ok=true;
        for(let k=0; k<shape.length; k++){
            for(let j=0; j<6; j++){
                if(shape[k][j]==1 && !smartMatch(data[i+k][j],b1)) ok=false;
                if(shape[k][j]==2 && !smartMatch(data[i+k][j],b2)) ok=false;
            }
        }
        if(ok) matches.push({index:i});
    }
    const cont=document.getElementById("checks"); cont.innerHTML="";
    matches.forEach(m=>{
        let d=document.createElement("div"); d.style="background:#333; padding:8px; margin:4px; cursor:pointer;";
        d.innerText="Match Row: "+(m.index+1);
        d.onclick=()=>{ activeMark={start:m.index, shape:shape}; draw(); };
        cont.appendChild(d);
    });
}

function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Saved!"); }
function closePopup(){ document.getElementById("popup").style.display='none'; document.getElementById("overlay").style.display='none'; }
</script>
</body>
</html>
