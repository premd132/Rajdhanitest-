<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYAN FIGURE SYSTEM - FINAL FIX</title>

<style>
:root { --gold: #ffd700; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; }
.container { max-width: 500px; margin: 0 auto; }

.box { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 15px; border: 1px solid #334155; }
h2 { color: var(--gold); text-align: center; margin: 5px 0 15px 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }

.label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: #fff; font-size: 14px; box-sizing: border-box; }
button { background: var(--gold); color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
button:hover { background: #eab308; }

/* Result Style */
.result-box { background: #020617; padding: 15px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; display: none; margin-bottom: 15px; position: relative; }
.target-tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 2px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; }
.fig { display: inline-block; background: var(--gold); color: #000; padding: 8px 15px; margin: 4px; border-radius: 6px; font-size: 24px; font-weight: 800; }
.jodi-suggest { background: #1e293b; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 14px; color: #00ff88; letter-spacing: 1px; font-weight: bold; word-spacing: 5px; }

/* History Style */
.record-card { background: var(--card); border-radius: 10px; padding: 12px; border: 1px solid #334155; }
.history-row { background: #0f172a; border-radius: 6px; padding: 8px; margin-bottom: 8px; display: grid; grid-template-columns: 25px 1fr 50px; align-items: center; gap: 8px; border-left: 3px solid var(--gold); }
.jodi-grid { display: flex; gap: 4px; flex-wrap: wrap; }
.jodi-item { background: #1e293b; color: var(--gold); padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 14px; border: 1px solid #475569; }
.btn-use { background: #3b82f6; color: white; font-size: 10px; padding: 6px; cursor: pointer; border: none; border-radius: 4px; }
</style>
</head>

<body>

<div class="container">
    <div class="box">
        <h2>🔮 Kalyan Smart System</h2>
        
        <div class="label">Step 1: Upload CSV (6 Jodis Per Line)</div>
        <input type="file" id="csvFile" accept=".csv, .txt">

        <div class="label">Step 2: Last Week 6 Jodis</div>
        <input id="jodiInput" placeholder="Ex: 11,22,33,44,55,66">

        <div class="label">Step 3: Calculation Mode</div>
        <select id="mode">
            <option value="2">Auto (Last Total)</option>
            <option value="3">Auto (Common Total)</option>
            <option value="4">Strong All-Rounder</option>
            <option value="1">Manual Base Figure</option>
        </select>
        <input id="baseAnk" type="number" placeholder="Base Figure (0-9)" style="display:none">

        <button id="calcBtn">CALCULATE NEXT DAY GAME</button>

        <div id="resultArea" class="result-box">
            <div class="target-tag">TARGET: NEXT MARKET DAY</div>
            <div class="label" style="color:var(--gold)">POWERFUL OTC FIGURES</div>
            <div id="figOutput"></div>
            
            <div class="label" style="margin-top:10px">SUGGESTED JODIS (CROSSING)</div>
            <div id="jodiOutput" class="jodi-suggest"></div>
            
            <div id="detailOutput" style="font-size:11px; color:#94a3b8; margin-top:8px"></div>
        </div>

        <button id="saveBtn" style="background: #22c55e; color: white;">SAVE TO LOCAL RECORD</button>
    </div>

    <div class="record-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <span style="font-size:13px; font-weight:bold; color:var(--gold)">📊 CSV VIEW RECORD</span>
            <button onclick="clearAll()" style="width:auto; padding:5px 10px; background:#ef4444; font-size:10px">CLEAR ALL</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<script>
const DB_KEY = "KALYAN_V4_FINAL";
let historyData = JSON.parse(localStorage.getItem(DB_KEY)) || [];

const modeSelect = document.getElementById("mode");
const baseAnk = document.getElementById("baseAnk");

modeSelect.onchange = () => {
    baseAnk.style.display = (modeSelect.value === "1") ? "block" : "none";
};

window.onload = renderHistory;

/* --- Logic Functions --- */
function getJodis(str) {
    // Ye function kisi bhi text se 2-digit numbers nikal leta hai
    return str.replace(/[^0-9]/g, " ").trim().split(/\s+/).filter(v => v.length === 2);
}

function getTotal(j) { return (parseInt(j[0]) + parseInt(j[1])) % 10; }

function getOTC(n) { 
    let a = (n + 1) % 10;
    let b = (n + 9) % 10;
    let c = (a + 5) % 10;
    let d = (b + 5) % 10;
    return [...new Set([a, b, c, d])].sort();
}

function makeJodis(figs) {
    let list = [];
    for(let i=0; i<figs.length; i++) {
        for(let j=0; j<figs.length; j++) {
            list.push("" + figs[i] + figs[j]);
        }
    }
    return list.join(" ");
}

/* --- CSV Upload Fixed --- */
document.getElementById("csvFile").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const text = event.target.result;
        const lines = text.split(/\r?\n/);
        let addedCount = 0;

        lines.forEach(line => {
            if(line.trim() === "") return;
            const found = getJodis(line);
            // Agar line me 6 ya 6 se zyada jodi hai to pehli 6 utha lo
            if (found.length >= 6) {
                historyData.unshift(found.slice(0,6).join(","));
                addedCount++;
            }
        });

        if(addedCount > 0) {
            saveData();
            alert("✅ " + addedCount + " Records Uploaded!");
        } else {
            alert("❌ Valid 6-jodi data not found in file.");
        }
    };
    reader.readAsText(file);
    this.value = ""; 
});

/* --- Actions --- */
document.getElementById("calcBtn").onclick = () => {
    const list = getJodis(document.getElementById("jodiInput").value);
    if (list.length < 6) { alert("Please enter at least 6 Jodis!"); return; }

    const totals = list.map(getTotal);
    const mode = modeSelect.value;
    let base;

    if (mode === "1") base = parseInt(baseAnk.value);
    else if (mode === "2") base = totals[totals.length-1];
    else if (mode === "3") {
        let counts = {};
        totals.forEach(t => counts[t] = (counts[t] || 0) + 1);
        base = parseInt(Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b));
    } else {
        base = (totals[totals.length-1] + totals[0]) % 10;
    }

    const finalFigs = getOTC(base);
    const jodiCrossing = makeJodis(finalFigs);
    
    document.getElementById("figOutput").innerHTML = finalFigs.map(f => `<span class="fig">${f}</span>`).join("");
    document.getElementById("jodiOutput").innerHTML = jodiCrossing;
    document.getElementById("detailOutput").innerHTML = `Calculated Base: ${base} | Week Totals: ${totals.join(",")}`;
    document.getElementById("resultArea").style.display = "block";
    window.scrollTo({top: 150, behavior: 'smooth'});
};

document.getElementById("saveBtn").onclick = () => {
    const jodis = getJodis(document.getElementById("jodiInput").value);
    if (jodis.length >= 6) {
        historyData.unshift(jodis.slice(0,6).join(","));
        saveData();
        alert("Saved!");
    } else { alert("Input 6 Jodis first."); }
};

function saveData() {
    localStorage.setItem(DB_KEY, JSON.stringify(historyData));
    renderHistory();
}

function renderHistory() {
    const listDiv = document.getElementById("historyList");
    listDiv.innerHTML = historyData.length ? "" : "<div style='text-align:center; padding:10px; opacity:0.5'>Empty Record</div>";
    
    historyData.forEach((row, idx) => {
        const jodis = row.split(",");
        listDiv.innerHTML += `
            <div class="history-row">
                <div style="font-size:10px; opacity:0.5">${historyData.length - idx}</div>
                <div class="jodi-grid">${jodis.map(j => `<span class="jodi-item">${j}</span>`).join("")}</div>
                <button class="btn-use" onclick="loadRow('${row}')">USE</button>
            </div>`;
    });
}

function loadRow(str) {
    document.getElementById("jodiInput").value = str;
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function clearAll() {
    if (confirm("Delete all history?")) { historyData = []; saveData(); }
}
</script>

</body>
</html>
