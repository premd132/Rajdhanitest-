<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>PRADEEP DYNAMIC AI v9</title>
<style>
:root{--bg:#020617;--gold:#fbbf24;--red:#ef4444;--blue:#3b82f6;--text:#f8fafc;}
body{background:var(--bg);color:var(--text);font-family:Segoe UI;margin:0;}
.nav{background:#1e293b;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);}
.container{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:20px;}
.btn{padding:10px 18px;border-radius:6px;border:none;font-weight:bold;cursor:pointer;}
.btn-upload{background:#3b82f6;color:white;}
.chart-card{background:white;padding:20px;border-radius:12px;position:relative;overflow:auto;}
table{border-collapse:collapse;width:100%;color:#334155;position:relative;z-index:10;}
th{background:#334155;color:white;padding:12px;border:1px solid #475569;}
td{border:1px solid #cbd5e1;width:55px;height:55px;text-align:center;font-weight:800;font-size:1.1rem;cursor:pointer;}
.circle-red{border:3px solid var(--red);border-radius:50%;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;color:var(--red);}
.circle-blue{border:3px solid var(--blue);border-radius:50%;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);}
svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.panel{background:#1e293b;padding:20px;border-radius:10px;margin-bottom:20px;}
.check-card{background:#0f172a;border-left:5px solid var(--gold);padding:10px;margin-top:8px;cursor:pointer;}
.ai-badge{background:var(--gold);color:black;padding:5px 12px;border-radius:6px;font-weight:900;margin:4px;display:inline-block;}
#pop{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:1000;}
</style>
</head>
<body>

<div class="nav">
<div style="font-size:1.4rem;font-weight:800;">PRADEEP <span style="color:var(--gold)">DYNAMIC AI v9</span></div>
<div style="display:flex;gap:10px;">
<input type="file" id="fileIn" style="display:none" onchange="importCSV(this)">
<button class="btn btn-upload" onclick="fileIn.click()">📁 Upload CSV</button>
<button class="btn" style="background:var(--gold)" onclick="addRow()">+ Row</button>
</div>
</div>

<div class="container">
<div class="chart-card">
<svg id="mainSvg"></svg>
<table id="mainTbl"></table>
</div>

<div>
<div class="panel">
<h3 style="margin:0;color:var(--gold)">🤖 Future AI</h3>
<div id="aiDisp">Blank par click karein</div>
</div>

<div class="panel">
<h3 style="margin:0;">🎯 Check Lines</h3>
<div id="checkDisp"></div>
</div>
</div>
</div>

<div id="pop" onclick="this.style.display='none'">
<div style="background:white;padding:25px;border-radius:15px;color:black;" onclick="event.stopPropagation()">
<h3>Historical Pattern</h3>
<div style="position:relative">
<svg id="popSvg"></svg>
<table id="popTbl"></table>
</div>
</div>
</div>

<script>
const FAMILY={
"01":["01","06","10","15","51","56","60","65"],
"02":["02","07","20","25","52","57","70","75"],
"03":["03","08","30","35","53","58","80","85"],
"04":["04","09","40","45","54","59","90","95"],
"12":["12","17","21","26","62","67","71","76"],
"13":["13","18","31","36","63","68","81","86"]
};

let tableData=JSON.parse(localStorage.getItem("p_ai_v9"))||Array(15).fill().map(()=>Array(5).fill("**"));
let currentPat=null;

const getFam=v=>{for(let k in FAMILY)if(FAMILY[k].includes(v))return k;return null;}
const formatVal=v=>{v=v.trim();if(v==="**"||v==="")return"**";return v.length===1?"0"+v:v;}

function render(){
let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
tableData.forEach((row,ri)=>{
h+="<tr>";
row.forEach((cell,ci)=>{
let cls="";
if(currentPat){
if(currentPat.p1.some(p=>p.r===ri&&p.c===ci))cls="circle-red";
if(currentPat.p2.some(p=>p.r===ri&&p.c===ci))cls="circle-blue";
}
h+=`<td onclick="analyze(${ri},${ci})" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">
<div class="${cls}">${cell}</div></td>`;
});
h+="</tr>";
});
mainTbl.innerHTML=h;
drawSVG("mainSvg","mainTbl",currentPat);
}

function updateCell(r,c,v){tableData[r][c]=formatVal(v);localStorage.setItem("p_ai_v9",JSON.stringify(tableData));render();}
function addRow(){tableData.push(["**","**","**","**","**"]);render();}

function importCSV(input){
const reader=new FileReader();
reader.onload=()=>{tableData=reader.result.trim().split("\n").map(r=>r.split(",").map(c=>formatVal(c)));render();}
reader.readAsText(input.files[0]);
}

function analyze(r,c){
if(tableData[r][c]!=="**")return;

let p1=[],p2=[],f1=null,f2=null;

for(let i=r-1;i>=0;i--){
let val=tableData[i][c];
if(val!=="**"){
let fam=getFam(val);
if(!f1){f1=fam;p1.push({r:i,c:c});}
else if(fam===f1&&p1.length<2)p1.push({r:i,c:c});
else if(!f2&&fam!==f1){f2=fam;p2.push({r:i,c:c});}
else if(fam===f2&&p2.length<2)p2.push({r:i,c:c});
}
if(p1.length===2&&p2.length===2)break;
}

currentPat={p1,p2,f1,f2,targetCol:c};
render();
findCheck(r,c);
futureAI(f1,f2);
}

function findCheck(r,c){
checkDisp.innerHTML="";
let count=0;

for(let i=0;i<r-3;i++){
let fams=[];
for(let j=0;j<4;j++){
let v=tableData[i+j][c];
if(v!=="**")fams.push(getFam(v));
}
if(fams.length===4){
let fcount1=fams.filter(x=>x===currentPat.f1).length;
let fcount2=fams.filter(x=>x===currentPat.f2).length;
if(fcount1===2&&fcount2===2){
count++;
let div=document.createElement("div");
div.className="check-card";
div.innerHTML=`Check Line ${count} (Row ${i+1})`;
div.onclick=()=>showPop(i,c);
checkDisp.appendChild(div);
}
}
if(count===4)break;
}
if(count===0)checkDisp.innerHTML="No match found";
}

function showPop(idx,col){
pop.style.display="flex";
let h="",pts1=[],pts2=[];
for(let i=0;i<4;i++){
h+="<tr>";
tableData[idx+i].forEach((v,ci)=>{
let fam=getFam(v);
let cls="";
if(fam===currentPat.f1){cls="circle-red";pts1.push({r:i,c:ci});}
if(fam===currentPat.f2){cls="circle-blue";pts2.push({r:i,c:ci});}
h+=`<td><div class="${cls}">${v}</div></td>`;
});
h+="</tr>";
}
popTbl.innerHTML=h;
setTimeout(()=>drawSVG("popSvg","popTbl",{p1:pts1,p2:pts2}),50);
}

function drawSVG(sid,tid,pat){
if(!pat)return;
const svg=document.getElementById(sid);
const tbl=document.getElementById(tid);
svg.innerHTML="";
const draw=(pts,col)=>{
if(pts.length<2)return;
let d="";
pts.forEach((p,i)=>{
const td=tbl.rows[p.r].cells[p.c];
d+=(i===0?"M ":" L ")+(td.offsetLeft+td.offsetWidth/2)+" "+(td.offsetTop+td.offsetHeight/2);
});
const path=document.createElementNS("http://www.w3.org/2000/svg","path");
path.setAttribute("d",d);
path.setAttribute("stroke",col);
path.setAttribute("fill","none");
path.setAttribute("stroke-width","4");
path.setAttribute("stroke-dasharray","6");
svg.appendChild(path);
};
draw(pat.p1,"#ef4444");
draw(pat.p2,"#3b82f6");
}

function futureAI(f1,f2){
let pairs=[...(FAMILY[f1]||[]),...(FAMILY[f2]||[])];
aiDisp.innerHTML=pairs.sort(()=>0.5-Math.random()).slice(0,3).map(n=>`<span class="ai-badge">${n}</span>`).join("");
}

render();
</script>
</body>
</html>
