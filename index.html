<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Fixed Edition</title>
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box; font-family: 'Poppins', sans-serif;}
body{margin:0; background:var(--bg); color:#fff; display:flex; flex-direction:column; align-items:center; padding:10px;}

.toolbar{display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap; justify-content:center;}
button{background:var(--panel); color:white; border:1px solid var(--gold); padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;}

.table-box{position:relative; background:#fff; padding:5px; border-radius:8px; display:inline-block;}
table{border-collapse:collapse; color:#000; position:relative; z-index:5;}
td, th{border:1px solid #ddd; width:46px; height:46px; text-align:center; font-weight:800; font-size:17px; cursor:pointer;}
th{background:#1e293b; color:#fff; font-size:10px; height:25px;}

/* Pattern Colors */
.circle-red { border: 3px solid var(--red) !important; border-radius: 50%; background:rgba(255, 71, 87, 0.15); }
.circle-blue { border: 3px solid var(--blue) !important; border-radius: 50%; background:rgba(46, 134, 222, 0.15); }
.marked-yellow { background: #facc15 !important; border: 2px solid #854d0e !important; }

canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }

#overlay{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:100; justify-content:center; align-items:center; }
.popup-box{ background:#fff; padding:15px; border-radius:12px; width:95%; max-width:380px; position:relative; }
.close-btn{ background:#ef4444; color:#fff; border:none; padding:5px 15px; border-radius:5px; cursor:pointer; float:right; margin-bottom:10px;}

.card{ background:var(--panel); padding:12px; border-radius:10px; border-top:3px solid var(--gold); width:100%; max-width:400px; margin-top:15px; }
.check-item{ background:#2d3748; padding:10px; margin:5px 0; border-radius:6px; border-left:4px solid var(--gold); cursor:pointer; font-size:13px;}
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvInp" style="display:none" accept=".csv">
    <button onclick="document.getElementById('csvInp').click()">📂 UPLOAD CSV</button>
    <button onclick="exportCSV()">💾 SAVE CSV</button>
    <button onclick="addRow()">➕ ADD ROW</button>
    <button onclick="localStorage.clear(); location.reload();" style="border-color:red">🔄 RESET</button>
</div>

<div class="table-box">
    <canvas id="mainCanvas"></canvas>
    <table id="tblMain"></table>
</div>

<div class="card">
    <b>✔ CHECK LINES (DUAL VIEW)</b>
    <div id="checkList">Click (**) for pattern...</div>
</div>

<div id="overlay">
    <div class="popup-box">
        <button class="close-btn" onclick="closePopup()">CLOSE</button>
        <h4 style="color:#000; margin:0 0 10px 0;">Dual-Pattern View</h4>
        <div style="position:relative; overflow:auto;">
            <canvas id="popupCanvas"></canvas>
            <table id="tblPopup"></table>
        </div>
    </div>
</div>

<script>
const FAMILY={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"11":["11","66","16","61"],"22":["22","77","27","72"],"33":["33","88","38","83"],"44":["44","99","49","94"],"55":["55","00","05","50"]};
let data = JSON.parse(localStorage.getItem('pradeepData')) || Array(12).fill().map(()=>Array(5).fill("**"));

function render(id, targetData, p = null){
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    targetData.forEach((row, r)=>{
        h += "<tr>";
        row.forEach((cell, c)=>{
            let cls = "";
            if(p){
                if(p.yR===r && p.yC===c) cls="marked-yellow";
                if(p.reds.some(pt=>pt.r===r && pt.c===c)) cls="circle-red";
                if(p.blues.some(pt=>pt.r===r && pt.c===c)) cls="circle-blue";
            }
            h += `<td class="${cls}" contenteditable onblur="upd(${r},${c},this.innerText)" onclick="cellClick(${r},${c})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById(id).innerHTML = h;
}

function upd(r,c,v){ 
    data[r][c] = (v.trim().length==1) ? "0"+v.trim() : (v.trim()==""?"**":v.trim()); 
    localStorage.setItem('pradeepData', JSON.stringify(data)); 
}

function cellClick(r,c){
    if(data[r][c] === "**") {
        let list = document.getElementById('checkList');
        list.innerHTML = "";
        for(let i=0; i<data.length; i++){
            if(i !== r && data[i][c] !== "**"){
                let d = document.createElement('div'); d.className="check-item";
                d.innerText = `Pattern Match: Week ${i+1}`;
                d.onclick = () => openDual(i, c);
                list.appendChild(d);
            }
        }
    }
}

function openDual(mR, mC){
    document.getElementById('overlay').style.display = 'flex';
    let p = {
        yR: mR, yC: mC,
        reds: [{r: mR-1, c: mC-1}, {r: mR-1, c: mC-2}],
        blues: [{r: mR-1, c: mC}, {r: mR-1, c: mC+1}]
    };
    render("tblPopup", data, p);
    setTimeout(() => drawLines("popupCanvas", "tblPopup", p), 100);
}

function drawLines(canId, tblId, p){
    const canvas = document.getElementById(canId), table = document.getElementById(tblId), ctx = canvas.getContext('2d');
    canvas.width = table.offsetWidth; canvas.height = table.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const rect = table.getBoundingClientRect();
    const tRect = table.rows[p.yR+1].cells[p.yC].getBoundingClientRect();
    const tx = tRect.left-rect.left+tRect.width/2, ty = tRect.top-rect.top+tRect.height/2;

    const draw = (pts, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        pts.forEach(pt => {
            if(pt.r<0 || pt.c<0 || pt.c>4) return;
            const cRect = table.rows[pt.r+1].cells[pt.c].getBoundingClientRect();
            ctx.beginPath(); ctx.moveTo(cRect.left-rect.left+cRect.width/2, cRect.top-rect.top+cRect.height/2);
            ctx.lineTo(tx, ty); ctx.stroke();
        });
    }
    draw(p.reds, "#ff4757"); draw(p.blues, "#2e86de");
}

function exportCSV(){
    let csv = data.map(r => r.join(",")).join("\n");
    let blob = new Blob([csv], {type:'text/csv'});
    let a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="rajdhani_data.csv"; a.click();
}

document.getElementById('csvInp').onchange = (e) => {
    let reader = new FileReader();
    reader.onload = () => {
        data = reader.result.split("\n").filter(l=>l.trim()).map(l=>l.split(",").map(v=>v.trim()));
        render("tblMain", data);
        localStorage.setItem('pradeepData', JSON.stringify(data));
    };
    reader.readAsText(e.target.files[0]);
};

function addRow(){ data.push(["**","**","**","**","**"]); render("tblMain", data); }
function closePopup(){ document.getElementById('overlay').style.display='none'; }

render("tblMain", data);
</script>
</body>
</html>
