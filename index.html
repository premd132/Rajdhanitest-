<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pattern Engine V1</title>

<style>

body{
    font-family: Arial;
    background:#111;
    color:white;
}

#topbar{
    padding:10px;
    background:#222;
}

button{
    padding:8px;
    margin:5px;
}

#tableBox{
    height:80vh;
    overflow:auto;
    border:1px solid #555;
}

table{
    border-collapse:collapse;
}

td{
    width:50px;
    height:40px;
    border:1px solid #444;
    text-align:center;
    font-size:18px;
    cursor:pointer;
}

.blank{
    background:#333;
}

</style>
</head>


<body>

<div id="topbar">

<input type="file" id="file">

<button onclick="loadCSV()">Upload CSV</button>

</div>


<div id="tableBox">
<table id="grid"></table>
</div>



<script>

let data=[]


function loadCSV(){

    let f=document.getElementById("file").files[0]

    if(!f) return

    let r=new FileReader()

    r.onload=function(e){

        let text=e.target.result

        parseCSV(text)

        drawTable()

    }

    r.readAsText(f)

}



function parseCSV(text){

    data=[]

    let rows=text.split(/\r?\n/)

    for(let row of rows){

        if(row.trim()=="") continue

        let cols=row.trim().split(".")

        while(cols.length<6) cols.push("**")

        data.push(cols)

    }

}



function drawTable(){

    let g=document.getElementById("grid")

    g.innerHTML=""

    for(let r=0;r<data.length;r++){

        let tr=document.createElement("tr")

        for(let c=0;c<6;c++){

            let td=document.createElement("td")

            let v=data[r][c]

            td.innerText=v

            if(v=="**") td.classList.add("blank")

            td.onclick=function(){

                cellClick(r,c)

            }

            tr.appendChild(td)

        }

        g.appendChild(tr)

    }

}



function cellClick(r,c){

    alert("Row "+r+" Col "+c+" = "+data[r][c])

}


</script>


</body>
</html>
