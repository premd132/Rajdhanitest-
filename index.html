<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pradeep AI - Advanced Shape Pattern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; --yellow: #ffff00; --red: #ff4757; --purple: #a4b0be; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; padding: 10px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 10px; }
        
        /* Pattern Colors */
        .base { background-color: var(--yellow) !important; color: #000; }
        .p1 { background-color: var(--red) !important; color: #fff; border-radius: 4px; }
        .p2 { background-color: var(--purple) !important; color: #000; border-radius: 4px; }
        .match-circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); margin-top: 15px; text-align: center; }
        #future { font-size: 26px; color: var(--green); font-weight: 800; letter-spacing: 5px; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 10px 15px; color: white; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
        <button onclick="document.getElementById('csv').click()" style="background:#0084ff;">📂 UPLOAD CSV</button>
        <button onclick="addRow()" style="background:#444;">➕ ADD ROW</button>
        <button onclick="saveData()" style="background:#28a745;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); font-size:12px;">🔮 FUTURE PREDICTION</h3>
        <div id="future">-- -- --</div>
        <div id="matchLog" style="font-size:11px; color:#aaa; margin-top:5px;">खाली सेल पर क्लिक करें (Pattern Scan)</div>
    </div>

<script>
const KEY="pradeep_shape_v3";
const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(KEY)) || [["12","25","36","48","50","60"],["10","20","30","40","50","60"],["**","**","**","**","**","**"]];
let activePattern = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){ v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = "";
   if(activePattern){
       if(ri==activePattern.cur.r && ci==activePattern.cur.c) cls="match-circle";
       else if(ri==activePattern.base.r && ci==activePattern.base.c) cls="base";
       else if(ri==activePattern.p1.r && ci==activePattern.p1.c) cls="p1";
       else if(ri==activePattern.p2.r && ci==activePattern.p2.c) cls="p2";
       else if(ri==activePattern.oldMatch.r && ci==activePattern.oldMatch.c) cls="match-circle";
   }
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="scanShape(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activePattern) setTimeout(drawCheckLines, 50);
}

function scanShape(r, c) {
    if(data[r][c] !== "**") return;
    
    // 1. Define Local Pattern (Today's Shape)
    // Base: Just above, P1: One more above, P2: Side cell
    let basePos = {r: r-1, c: c};
    let p1Pos = {r: r-2, c: c};
    let p2Pos = {r: r-1, c: (c > 0 ? c-1 : c+1)};

    if(basePos.r < 0 || p1Pos.r < 0) return;
    
    let baseVal = data[basePos.r][basePos.c];
    if(baseVal == "**") return;

    let targetFam = fam(baseVal);
    let found = null;

    // 2. Search in Old Records (Last 15 rows)
    for(let i = r-3; i >= Math.max(0, r-15); i--) {
        // Check if Base Family matches in the SAME position
        if(fam(data[i][basePos.c]) === targetFam) {
            // Check if Shape also matches (P1 and P2 positions have data)
            if(data[i-1] && data[i-1][basePos.c] !== "**") {
                found = i; // Old Base Row found
                break;
            }
        }
    }

    if(found !== null) {
        activePattern = {
            cur: {r, c},
            base: basePos,
            p1: p1Pos,
            p2: p2Pos,
            oldBase: {r: found, c: basePos.c},
            oldMatch: {r: found+1, c: c}
        };
        draw();
        
        let oldVal = data[found+1][c];
        document.getElementById("future").innerText = `${norm((parseInt(oldVal)+5)%100)} - ${oldVal.split('').reverse().join('')} - ${oldVal}`;
        document.getElementById("matchLog").innerText = `Shape Match Found at Row ${found+2}`;
    } else {
        alert("Same Shape Pattern नहीं मिला।");
    }
}

function drawCheckLines() {
    const cvs = document.getElementById("mainCanvas"), tbl = document.getElementById("tbl"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    // Line 1-2-3-4 (Old Match to Current Match via Pattern)
    const points = tbl.querySelectorAll(".match-circle, .p1, .p2");
    if(points.length < 2) return;

    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3;
    const rect = tbl.getBoundingClientRect();
    
    ctx.beginPath();
    points.forEach((p, i) => {
        let r = p.getBoundingClientRect();
        let x = r.left - rect.left + r.width/2;
        let y = r.top - rect.top + r.height/2;
        if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(KEY,JSON.stringify(data)); alert("Saved!"); }
function clearData(){ if(confirm("Clear?")){ localStorage.clear(); location.reload(); }}
function importCSV(e){
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v)));
        localStorage.setItem(KEY, JSON.stringify(data));
        draw();
    };
    fr.readAsText(e.target.files[0]);
}
draw();
</script>
</body>
</html>
