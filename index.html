<!DOCTYPE html>
<html lang="hi">
<head>
    <title>Pradeep AI Pattern Tool</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; }
        .marked { background-color: #ffeb3b !important; border: 2px solid #f44336; } /* Old record marker */
        .lucky { background-color: #c8e6c9; } /* Prediction color */
        .btn { background: #2196F3; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>प्रदीप AI पैटर्न विश्लेषक (Beta)</h2>
    <p>कर्ज मुक्ति और सही निर्णय के लिए डेटा-आधारित चुनाव करें।</p>
    
    <input type="text" id="pairData" placeholder="Enter Pair (e.g. 25)">
    <button class="btn" onclick="addRow()">Add Row (CSV)</button>
    <button class="btn" style="background:#4CAF50" onclick="getPrediction()">AI Prediction</button>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Week</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('patternData')) || [];

    function addRow() {
        const val = document.getElementById('pairData').value;
        if(!val) return;
        records.push({val: val, date: new Date().toLocaleDateString()});
        localStorage.setItem('patternData', JSON.stringify(records));
        renderTable();
    }

    function renderTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        records.forEach((rec, index) => {
            let row = `<tr>
                <td>${Math.floor(index/5) + 1}</td>
                <td onclick="checkPattern(${index})">${rec.val}</td>
                </tr>`;
            body.innerHTML += row;
        });
    }

    function checkPattern(index) {
        // पुराने 10 हफ्तों के रिकॉर्ड में मिलान का लॉजिक
        alert("Checking connections for: " + records[index].val + "\nLooking back 10 weeks...");
        // Cells को मार्क करने का कोड यहाँ काम करेगा
    }

    function getPrediction() {
        // AI Logic: लकी नंबर्स 3,5,6 के आधार पर
        alert("Future AI Prediction: अगली संभावित जोड़ी आपके लकी अंक 5 या 3 के संयोजन से बन सकती है।");
    }

    renderTable();
</script>
</body>
</html>
