<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rajdhani Pro AI – Dual Family</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#ffd700; --blue:#0084ff; --red:#ff4757; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:Poppins,sans-serif}
body{margin:0;background:var(--bg);color:#fff; overflow-x: hidden;}
#home{ height:100vh;display:flex;flex-direction:column; align-items:center;justify-content:center;text-align:center }
h1{color:var(--gold);font-size:3rem;margin:0}
button{cursor:pointer;font-weight:700;border-radius:6px;border:none; padding: 10px 15px;}
.enter{ background:var(--gold);padding:15px 40px;font-size:1.2rem; margin-top:20px; }
#app{display:none;padding:12px}
.toolbar{ background:var(--panel);padding:10px;border-radius:10px; display:flex;gap:10px;flex-wrap:wrap;justify-content:center; margin-bottom: 20px; }
.table-wrap{position:relative;background:#fff;border-radius:10px;padding:5px; display: inline-block;}
table{border-collapse:collapse;color:#000}
td,th{ border:1px solid #ddd; width:50px;height:50px; text-align:center;font-weight:700; cursor: pointer; }
th{background:#1e293b;color:#fff;font-size:11px}
/* Marking Styles */
.circle-red { border:3px solid var(--red)!important; border-radius:50%!important; background:rgba(255,71,87,.2) }
.circle-blue { border:3px solid var(--blue)!important; border-radius:50%!important; background:rgba(0,132,255,.2) }
canvas{position:absolute;top:0;left:0;pointer-events:none; z-index: 4;}
.dashboard{ display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;margin-top:15px }
.card{ background:var(--panel);padding:12px;border-radius:10px; border-top:3px solid var(--gold) }
.card h3{margin:0 0 8px 0;color:var(--gold);font-size:13px}
</style>
</head>
<body>

<div id="home">
 <h1>Rajdhani PRO AI</h1>
 <p>DUAL FAMILY PATTERN SYSTEM</p>
 <button class="enter" onclick="start()">START ANALYSIS</button>
</div>

<div id="app">
    <div class="toolbar">
        <input type="file" id="csv" hidden>
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#444; color:white;">➕ ROW</button>
        <button onclick="save()" style="background:#28a745; color:white;">💾 SAVE</button>
        <button onclick="clearAll()" style="background:#dc3545; color:white;">🗑 CLEAR</button>
    </div>

    <center>
        <div class="table-wrap">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card"><h3>✔ CHECK LINES</h3><div id="checks"></div></div>
        <div class="card"><h3>🤖 AI ANALYSIS</h3><div id="ai">Ready...</div></div>
        <div class="card"><h3>🔮 FUTURE</h3><div id="future">—</div></div>
    </div>
</div>

<script>
const STORE="rajdhani_dual_family";
const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};

let data = JSON.parse(localStorage.getItem(STORE)) || Array(15).fill().map(()=>Array(5).fill("**"));
let active=null, targetCol=null;

const norm=v=> (v=="**" || !v) ? "**" : v.toString().trim().padStart(2,"0");
const palti=v=>v.length==2 ? v[1]+v[0] : v;
function famOf(v){ for(let k in families) if(families[k].includes(v)) return k; return null; }
function smartMatch(a, b) { if(a=="**" || b=="**") return false; return a===b || palti(a)===b || famOf(a)===famOf(b); }

function start(){
 document.getElementById("home").style.display="none";
 document.getElementById("app").style.display="block";
 draw();
}

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls="";
   if(active && ri >= active.start && ri < active.start + active.shape.length){
       let type = active.shape[ri-active.start][ci];
       if(type === 1) cls = "circle-red";
       if(type === 2) cls = "circle-blue";
   }
   h+=`<td class="${cls}" contenteditable="true" onblur="edit(${ri},${ci},this)" onclick="handleCell(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(active) setTimeout(drawLines, 50);
}

function handleCell(ri, ci) {
    if(data[ri][ci] === "**") {
        active = null; // Reset current pattern to allow new one
        makePattern(ri, ci);
    }
}

function drawLines(){
 const cvs=document.getElementById("mainCanvas"), ctx=cvs.getContext("2d");
 const tbl=document.getElementById("tbl");
 cvs.width=tbl.offsetWidth; cvs.height=tbl.offsetHeight;
 ctx.clearRect(0,0,cvs.width,cvs.height);
 const t=tbl.getBoundingClientRect();

 [[".circle-red", "#ff4757"], [".circle-blue", "#0084ff"]].forEach(cfg => {
     let cells = [...tbl.querySelectorAll(cfg[0])];
     if(cells.length < 2) return;
     ctx.strokeStyle=cfg[1]; ctx.lineWidth=2.5; ctx.beginPath();
     cells.forEach((c,i)=>{
      let r=c.getBoundingClientRect();
      let x=r.left-t.left+r.width/2;
      let y=r.top-t.top+r.height/2;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
     });
     ctx.stroke();
 });
}

function edit(ri,ci,el){ 
    let val = norm(el.innerText.trim());
    data[ri][ci] = val;
    el.innerText = val; // Show normalized value
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function save(){ localStorage.setItem(STORE,JSON.stringify(data)); alert("Saved Successfully"); }
function clearAll(){ if(confirm("Delete all data?")){localStorage.clear();location.reload();} }

function makePattern(ri, ci){
 targetCol=ci;
 let f1="**", f2="**", f1c=[], f2c=[];
 let look = Math.max(0, ri-10);

 for(let i=ri-1; i>=look; i--){
  for(let j=0; j<5; j++){
   let v = data[i][j];
   if(v!="**"){
    if(f1=="**") { f1=v; f1c.push({r:i, c:j}); }
    else if(smartMatch(v, f1) && f1c.length<2) { if(!f1c.some(x=>x.r==i && x.c==j)) f1c.push({r:i, c:j}); }
    else if(f2=="**" && famOf(v)!=famOf(f1)) { f2=v; f2c.push({r:i, c:j}); }
    else if(f2!="**" && smartMatch(v, f2) && f2c.length<2) { if(!f2c.some(x=>x.r==i && x.c==j)) f2c.push({r:i, c:j}); }
   }
  }
 }

 if(f1c.length<2 || f2c.length<2) { 
     document.getElementById("ai").innerText = "Insufficient data above cell!";
     return; 
 }

 let shape = Array(ri-look).fill().map(()=>Array(5).fill(0));
 f1c.forEach(x => shape[x.r-look][x.c] = 1);
 f2c.forEach(x => shape[x.r-look][x.c] = 2);

 active={start:look, shape:shape};
 draw();
 search(shape, f1, f2, look);
}

function search(shape, f1, f2, limit){
 let matches=[];
 for(let i=0; i<limit; i++){
  let score=0;
  for(let r=0; r<shape.length; r++){
   for(let c=0; c<5; c++){
    if(shape[r][c]==1 && smartMatch(data[i+r][c], f1)) score++;
    if(shape[r][c]==2 && smartMatch(data[i+r][c], f2)) score++;
   }
  }
  if(score==4) matches.push(i);
 }
 
 document.getElementById("checks").innerHTML="";
 matches.forEach((m, idx)=>{
  let d=document.createElement("div");
  d.textContent=`Check Line ${idx+1} (Row ${m+1})`;
  d.style="background:#2a2a2a;padding:10px;margin:5px 0;border-left:4px solid var(--gold);cursor:pointer;font-size:12px";
  d.onclick=()=>{ active={start:m, shape:shape}; draw(); };
  document.getElementById("checks").appendChild(d);
 });

 let fut=[];
 matches.forEach(m=>{
  let n=m+shape.length;
  if(n<data.length && data[n][targetCol]!="**") fut.push(data[n][targetCol]);
 });
 document.getElementById("future").innerHTML=fut.length?[...new Set(fut)].join(", "):"Analyzing…";
 document.getElementById("ai").innerHTML=`Families: ${f1} & ${f2} Found!`;
}

document.getElementById("csv").onchange=e=>{
 let fr=new FileReader();
 fr.onload=()=>{
  data=fr.result.split("\n").filter(x=>x.trim())
   .map(l=>l.split(",").map(v=>norm(v.trim())).slice(0,5));
  draw();
 };
 fr.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
