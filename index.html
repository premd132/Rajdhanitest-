<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalyan Pro AI – CSV Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue-c: #0084ff; --red-c: #ff4d4d; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        /* Toolbar */
        .toolbar { background: var(--panel); padding: 15px; display: flex; gap: 10px; justify-content: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        
        /* Table Styling */
        .table-outer { padding: 20px; display: flex; justify-content: center; }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; color: #000; font-size: 15px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; width: 50px; height: 50px; text-align: center; font-weight: bold; position: relative; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 12px; }

        /* Markers */
        .circle-f1 { border: 4px solid var(--blue-c) !important; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: rgba(0, 132, 255, 0.1); }
        .circle-f2 { border: 4px solid var(--red-c) !important; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 77, 77, 0.1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .card { background: var(--panel); margin: 15px; padding: 15px; border-radius: 12px; border-left: 5px solid var(--gold); }
        .check-item { background: #0f172a; padding: 12px; margin-top: 8px; border-radius: 8px; cursor: pointer; border: 1px solid #334155; }
        
        button { cursor: pointer; border: none; font-weight: bold; padding: 10px 20px; border-radius: 5px; transition: 0.3s; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none">
    <button onclick="document.getElementById('csvFile').click()" style="background: var(--gold); color: #000;">📂 UPLOAD CSV</button>
    <button onclick="addRow()" style="background:#444; color:white;">➕ ADD ROW</button>
    <button onclick="saveData()" style="background:#28a745; color:white;">💾 SAVE</button>
    <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ RESET</button>
</div>

<div class="table-outer">
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</div>

<div class="card">
    <h3 style="margin:0; color:var(--gold);">✔ CHECK LINES (2.2 Pattern)</h3>
    <div id="checks">Upload CSV and click a blank cell...</div>
</div>

<script>

const STORAGE_KEY="kalyan_pro_v8";

const FAMILY={
"01":["01","06","10","15","51","56","60","65"],
"02":["02","07","20","25","52","57","70","75"],
"03":["03","08","30","35","53","58","80","85"],
"04":["04","09","40","45","54","59","90","95"],
"11":["11","16","61","66"],
"22":["22","27","72","77"],
"33":["33","38","83","88"]
};

let data=JSON.parse(localStorage.getItem(STORAGE_KEY))||Array(12).fill().map(()=>Array(6).fill("**"));
let currentPat=null;

function getFam(v){for(let k in FAMILY)if(FAMILY[k].includes(v))return k;return null;}

function draw(){
let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
data.forEach((r,ri)=>{
h+="<tr>";
r.forEach((c,ci)=>{
let content=c;
if(currentPat){
if(currentPat.p1.some(p=>p.r===ri&&p.c===ci))content=`<span class="circle-f1">${c}</span>`;
if(currentPat.p2.some(p=>p.r===ri&&p.c===ci))content=`<span class="circle-f2">${c}</span>`;
}
h+=`<td onclick="${c=='**'?'analyze('+ri+','+ci+')':''}" contenteditable onblur="edit(${ri},${ci},this)">${content}</td>`;
});
h+="</tr>";
});
tbl.innerHTML=h;
if(currentPat)setTimeout(()=>drawLines("mainCanvas","tbl",currentPat),50);
}

function analyze(r,c){

let p1=[],p2=[],f1=null,f2=null;

// fresh scan every click
for(let i=r-1;i>=0 && i>=r-15;i--){
for(let j=0;j<6;j++){
let v=data[i][j];
if(v=="**")continue;
let fam=getFam(v);

if(!f1){f1=fam;p1.push({r:i,c:j});}
else if(fam===f1 && p1.length<2)p1.push({r:i,c:j});
else if(!f2 && fam!==f1){f2=fam;p2.push({r:i,c:j});}
else if(fam===f2 && p2.length<2)p2.push({r:i,c:j});

if(p1.length===2 && p2.length===2)break;
}
if(p1.length===2 && p2.length===2)break;
}

if(p1.length<2||p2.length<2){
alert("2-2 Family Pattern nahi mila.");
return;
}

currentPat={p1,p2,f1,f2};
draw();
findCheckLines();
futureAI();
}

function findCheckLines(){

checks.innerHTML="";
let count=0;

for(let i=0;i<data.length-3;i++){

let fams=[];
for(let k=0;k<4;k++){
for(let j=0;j<6;j++){
let v=data[i+k][j];
if(v!="**")fams.push(getFam(v));
}
}

let f1count=fams.filter(x=>x===currentPat.f1).length;
let f2count=fams.filter(x=>x===currentPat.f2).length;

if(f1count>=2 && f2count>=2){
count++;
let div=document.createElement("div");
div.className="check-item";
div.innerHTML=`Check Line ${count} (Row ${i+1})`;
div.onclick=()=>showPopup(i);
checks.appendChild(div);
}

if(count===4)break;
}

if(count===0)checks.innerHTML="No matching 2.2 pattern found.";
}

function showPopup(start){
alert("Check Line from Row "+(start+1));
}

function futureAI(){

let pool=[...(FAMILY[currentPat.f1]||[]),...(FAMILY[currentPat.f2]||[])];

let picks=[];
while(picks.length<3 && pool.length>0){
let r=Math.floor(Math.random()*pool.length);
picks.push(pool.splice(r,1)[0]);
}

checks.innerHTML+="<div style='margin-top:10px;color:gold;'>Future AI: "+picks.join(" , ")+"</div>";
}

function drawLines(cvsId,tblId,pat){
const cvs=document.getElementById(cvsId);
const tbl=document.getElementById(tblId);
cvs.width=tbl.offsetWidth;
cvs.height=tbl.offsetHeight;
const ctx=cvs.getContext("2d");
ctx.clearRect(0,0,cvs.width,cvs.height);

const connect=(pts,col)=>{
ctx.strokeStyle=col;
ctx.lineWidth=3;
ctx.beginPath();
pts.forEach((p,i)=>{
let cell=tbl.rows[p.r+1].cells[p.c];
let x=cell.offsetLeft+cell.offsetWidth/2;
let y=cell.offsetTop+cell.offsetHeight/2;
if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
};

connect(pat.p1,"#0084ff");
connect(pat.p2,"#ff4d4d");
}

function edit(r,c,el){data[r][c]=el.innerText.trim();}
function addRow(){data.push(["**","**","**","**","**","**"]);draw();}
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));alert("Saved");}
function clearData(){localStorage.clear();location.reload();}

draw();

</script>
</body>
</html>
