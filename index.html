<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Pradeep Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:Poppins}
body{margin:0;background:var(--bg);color:#fff;overflow-x:hidden}
#app{padding:15px;display:flex;flex-direction:column;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.toolbar button{background:#444;color:#fff;border:1px solid var(--gold);padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer}
.table-box{position:relative;background:#fff;border-radius:10px;padding:5px;display:inline-block}
table{border-collapse:collapse;color:#000}
td,th{border:1px solid #ddd;width:48px;height:48px;text-align:center;font-weight:700;cursor:pointer;position:relative}
th{background:#1e293b;color:#fff;font-size:11px}
.circle-red{border:3px solid var(--red)!important;border-radius:50%;background:rgba(255,71,87,.2)}
.circle-blue{border:3px solid var(--blue)!important;border-radius:50%;background:rgba(46,134,222,.2)}
.marked-origin{background:#fef08a!important;border:2px solid #ca8a04!important}
canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:5}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:15px;width:100%;max-width:900px;margin-top:15px}
.card{background:var(--panel);padding:15px;border-radius:10px;border-top:4px solid var(--gold)}
.check-item{background:#2d3748;padding:10px;margin:5px 0;border-radius:6px;cursor:pointer;border-left:4px solid var(--gold);font-size:14px}
</style>
</head>
<body>

<div id="app">
 <div class="toolbar">
  <input type="file" id="csvFile" accept=".csv" style="display:none">
  <button onclick="csvFile.click()">📂 UPLOAD CSV</button>
  <button onclick="addRow()">➕ ADD ROW</button>
  <button onclick="saveData()">💾 SAVE DATA</button>
  <button onclick="location.reload()">🔄 RESET</button>
 </div>

 <div class="table-box">
  <canvas id="mainCanvas"></canvas>
  <table id="tbl"></table>
 </div>

 <div class="dashboard">
  <div class="card">
    <b>✔ Check Lines (Old Records)</b>
    <div id="checks">Click any cell to scan history...</div>
  </div>
  <div class="card">
    <b>🔮 Future AI Prediction</b>
    <div id="future" style="font-size:1.5rem;color:var(--gold);font-weight:800;text-align:center;margin-top:10px">—</div>
  </div>
 </div>
</div>

<script>
const FAMILY={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("pData")) || Array(12).fill().map(()=>Array(5).fill("**"));
let activeMark=null;

function fam(v){for(let k in FAMILY)if(FAMILY[k].includes(v))return k; return "NA";}
function norm(v){if(!v||v=="**")return"**"; v=String(v); return v.length==1?"0"+v:v;}

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls="";
   if(activeMark){
    if(activeMark.map[i]?.[j]==1) cls="circle-red";
    if(activeMark.map[i]?.[j]==2) cls="circle-blue";
    if(activeMark.originR==i && activeMark.originC==j) cls="marked-origin";
   }
   h+=`<td class="${cls}" contenteditable onblur="updateCell(${i},${j},this.innerText)" onclick="handleCellClick(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 setTimeout(drawLines, 50);
}

function updateCell(r,c,v){ data[r][c]=norm(v); saveData(); }

function handleCellClick(r,c){
 if(data[r][c] === "**") scanHistory(r,c);
 else findOrigin(r,c);
}

function findOrigin(r,c){
 let f = fam(data[r][c]);
 for(let i=r-1; i>=0; i--){
  for(let j=0; j<5; j++){
   if(fam(data[i][j]) === f){
    activeMark = { map:[], originR: i, originC: j };
    draw(); return;
   }
  }
 }
}

function scanHistory(r,c){
 let targetFam = fam(data[r-1]?.[c]);
 let matches = [];
 for(let i=0; i<data.length; i++){
  if(i!==r && fam(data[i][c]) === targetFam && data[i][c] !== "**"){
   matches.push(i);
  }
 }
 
 let div = document.getElementById("checks"); div.innerHTML = "";
 matches.forEach(mRow => {
  let item = document.createElement("div"); item.className="check-item";
  item.innerText = `Similar Pattern Found: Row ${mRow+1}`;
  item.onclick = () => {
   let map = Array(data.length).fill().map(()=>Array(5).fill(0));
   let linePts = [];
   // 2+2 logic: get last 2 families from nearby
   for(let i=mRow-1; i>=Math.max(0, mRow-3); i--){
    for(let j=0; j<5; j++){
     if(data[i][j] !== "**"){
      let type = linePts.length < 2 ? 1 : 2;
      map[i][j] = type;
      linePts.push({r:i, c:j, type});
     }
     if(linePts.length >= 4) break;
    }
    if(linePts.length >= 4) break;
   }
   activeMark = {map, linePts, originR: mRow, originC: c};
   draw();
  };
  div.appendChild(item);
 });
}

function drawLines(){
 const ctx=mainCanvas.getContext("2d");
 mainCanvas.width=tbl.offsetWidth; mainCanvas.height=tbl.offsetHeight;
 ctx.clearRect(0,0,mainCanvas.width,mainCanvas.height);
 if(!activeMark || !activeMark.linePts) return;
 const rect=tbl.getBoundingClientRect();

 // Connection logic: Point to Point (Sahi Pattern)
 activeMark.linePts.forEach((p, idx, arr) => {
  if(idx % 2 === 0 && arr[idx+1]){
    let c1 = tbl.rows[p.r+1].cells[p.c].getBoundingClientRect();
    let c2 = tbl.rows[arr[idx+1].r+1].cells[arr[idx+1].c].getBoundingClientRect();
    ctx.strokeStyle = p.type === 1 ? "#ff4757" : "#2e86de";
    ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(c1.left-rect.left+c1.width/2, c1.top-rect.top+c1.height/2);
    ctx.lineTo(c2.left-rect.left+c2.width/2, c2.top-rect.top+c2.height/2);
    ctx.stroke();
  }
 });
}

function saveData(){ localStorage.setItem("pData", JSON.stringify(data)); }
function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
draw();
</script>
</body>
</html>
