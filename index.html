<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>DPBossKing - Professional Login & Analytics</title>
    <style>
        :root { --red: #ff0000; --blue: #0000ff; --gold: #ffd600; --dark: #121212; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }

        /* Login Screen Styles */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #1e1e1e; padding: 40px; border-radius: 10px; border-top: 5px solid #b71c1c; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card h2 { color: var(--gold); margin-bottom: 25px; }
        .login-card input { width: 90%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: #fff; border-radius: 5px; }
        .btn-login { background: #b71c1c; color: #fff; width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }

        /* Main Dashboard Styles */
        #main-app { display: none; } /* Initially hidden */
        .navbar { background: #b71c1c; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
        .user-info { font-size: 14px; color: var(--gold); }

        .layout { display: flex; height: calc(100vh - 65px); }
        .sidebar { width: 300px; background: #1a1a1a; padding: 20px; border-right: 1px solid #333; overflow-y: auto; }
        .workspace { flex: 1; padding: 20px; background: #252525; overflow: auto; position: relative; }

        /* Pattern Tool Styling */
        .tool-btn { width: 100%; padding: 10px; margin: 5px 0; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; text-align: left; }
        .active-t { border: 2px solid #fff; }
        
        .chart-box { position: relative; background: #fff; padding: 15px; display: inline-block; border-radius: 5px; box-shadow: 0 0 40px #000; }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 10; }
        td, th { border: 1px solid #ccc; width: 55px; height: 50px; text-align: center; font-weight: 900; font-size: 19px; }
        
        .f-red { border: 4px solid var(--red) !important; color: var(--red); background: rgba(255,0,0,0.1); }
        .f-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
        .f-green { border: 4px solid #008000 !important; color: #008000; background: rgba(0,128,0,0.1); }
        #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2>DPBK MASTER LOGIN</h2>
        <input type="text" id="username" placeholder="User ID">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-login" onclick="attemptLogin()">ENTER SYSTEM</button>
        <p style="font-size: 10px; color: #888; margin-top: 20px;">ACCESS RESTRICTED TO PREMIUM MEMBERS ONLY</p>
    </div>
</div>

<div id="main-app">
    <div class="navbar">
        <div style="font-weight: 800; font-size: 20px;">DPBOSS KING <span style="color:var(--gold)">PRO</span></div>
        <div class="user-info">Logged in as: <span id="display-user">Admin</span> | <a href="#" onclick="location.reload()" style="color:#fff">Logout</a></div>
    </div>

    <div class="layout">
        <div class="sidebar">
            <h4 style="color:var(--gold)">CONTROLS</h4>
            <input type="file" id="csvInp" onchange="handleCSV()" style="margin-bottom: 20px; font-size: 12px;">
            
            <button class="tool-btn active-t" style="background:var(--red); color:#fff" onclick="setTool('f-red', this)">RED BOX (Base)</button>
            <button class="tool-btn" style="background:#008000; color:#fff" onclick="setTool('f-green', this)">GREEN (Touch 1)</button>
            <button class="tool-btn" style="background:var(--blue); color:#fff" onclick="setTool('f-blue', this)">BLUE (Touch 2)</button>

            <hr style="border:0.5px solid #333; margin: 20px 0;">
            <label style="font-size: 12px;">ANCHOR DAY:</label>
            <select id="anchorDay" style="width:100%; padding:10px; margin-top:5px; background:#333; color:#fff;">
                <option value="0">MONDAY</option><option value="1">TUESDAY</option><option value="2">WEDNESDAY</option>
                <option value="3">THURSDAY</option><option value="4">FRIDAY</option><option value="5">SATURDAY</option>
            </select>

            <button onclick="runAdvancedScan()" style="background:var(--gold); color:#000; margin-top:20px; width:100%; padding:15px; font-weight:800; font-size:16px;">RUN 100% SCAN</button>
            <button onclick="resetApp()" style="background:#444; color:#fff; margin-top:10px;">CLEAR MARKS</button>
        </div>

        <div class="workspace">
            <div class="chart-box" id="chartArea">
                <canvas id="canvas"></canvas>
                <table id="targetTable">
                    <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
                    <tbody id="chartBody"></tbody>
                </table>
            </div>
            <div id="status" style="color:#0f0; margin-top:20px; font-family:monospace;">System Online... Waiting for pattern input.</div>
        </div>
    </div>
</div>

<script>
let tool = 'f-red';
let chartData = [["80","30","25","41","51","61"],["12","22","32","42","52","62"],["13","23","33","43","53","63"],["14","24","34","44","54","64"],["85","80","70","45","55","65"]];

// Login Security Logic
function attemptLogin() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    // Standard secure-access check (Aap ise badal sakte ho)
    if(user === "admin" && pass === "king123") {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('display-user').innerText = user.toUpperCase();
        init();
    } else {
        alert("Invalid Access Credentials!");
    }
}

// 100% Family Logic (Dynamic)
function getFam(v) {
    let n = v.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1+5)%10, c2 = (d2+5)%10;
    let set = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => {
        set.add(`${a[0]}${b[0]}`); set.add(`${b[0]}${a[0]}`);
    }));
    return Array.from(set);
}

function init() {
    const b = document.getElementById('chartBody');
    b.innerHTML = chartData.map((row, r) => `<tr>${row.map((c, d) => 
        `<td onclick="applyTool(this)" contenteditable="true" onblur="chartData[${r}][${d}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    setTimeout(syncCanvas, 100);
}

function setTool(t, btn) {
    tool = t;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-t'));
    btn.classList.add('active-t');
}

function applyTool(td) { td.className = td.className === tool ? "" : tool; }

function syncCanvas() {
    const c = document.getElementById('canvas'), b = document.getElementById('chartArea');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

// The Professional Search Engine
function runAdvancedScan() {
    const day = parseInt(document.getElementById('anchorDay').value);
    const table = document.getElementById('targetTable');
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0,0,5000,5000);

    let dna = { base: null, touches: [] };
    for(let r=0; r<chartData.length; r++) {
        if(table.rows[r+1].cells[day].classList.contains('f-red')) {
            dna.base = { val: chartData[r][day], r: r, c: day };
            break;
        }
    }
    if(!dna.base) return alert("Mark RED base first!");

    document.querySelectorAll('.f-green, .f-blue').forEach(m => {
        let mr = m.parentElement.rowIndex-1, mc = m.cellIndex;
        dna.touches.push({ val: chartData[mr][mc], rd: mr - dna.base.r, cd: mc - dna.base.c, type: m.className });
    });

    const baseFam = getFam(dna.base.val);
    chartData.forEach((row, ri) => {
        if(baseFam.includes(row[day]) && ri !== dna.base.r) {
            let matches = 0;
            dna.touches.forEach(t => {
                let tr = ri + t.rd, tc = day + t.cd;
                if(chartData[tr] && getFam(t.val).includes(chartData[tr][tc])) matches++;
            });
            if(matches === dna.touches.length) {
                const bCell = table.rows[ri+1].cells[day];
                bCell.classList.add('f-red');
                dna.touches.forEach(t => {
                    const tCell = table.rows[ri+t.rd+1].cells[day+t.cd];
                    tCell.classList.add(t.type);
                    ctx.strokeStyle = t.type.includes('green') ? 'green' : 'blue';
                    ctx.lineWidth = 2.5; ctx.beginPath();
                    ctx.moveTo(bCell.offsetLeft+28, bCell.offsetTop+25);
                    ctx.lineTo(tCell.offsetLeft+28, tCell.offsetTop+25); ctx.stroke();
                });
            }
        }
    });
}

function handleCSV() {
    const f = document.getElementById('csvInp').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        chartData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        init();
    };
    r.readAsText(f);
}

function resetApp() {
    document.querySelectorAll('td').forEach(t => t.className = "");
    document.getElementById('canvas').getContext('2d').clearRect(0,0,10000,10000);
}
</script>
</body>
</html>
