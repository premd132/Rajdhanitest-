<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI - Check Line System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; --yellow: #ffff00; --red: #ff4757; --purple: #a4b0be; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; padding: 10px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: inline-block; }
        table { border-collapse: collapse; color: #000; font-size: 14px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 8px 4px; text-align: center; font-weight: bold; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: white; font-size: 10px; }
        
        /* Pattern Highlighters */
        .base { background-color: var(--yellow) !important; color: #000; font-weight: 900; }
        .p1 { background-color: var(--red) !important; color: #fff; }
        .p2 { background-color: var(--purple) !important; color: #000; }
        .target { border: 4px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); }
        .old-hit { border: 4px solid var(--green) !important; border-radius: 50% !important; }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); margin-top: 15px; text-align: center; }
        #future { font-size: 26px; color: var(--green); font-weight: 800; letter-spacing: 5px; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 10px 15px; color: white; transition: 0.2s; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
        <button onclick="document.getElementById('csv').click()" style="background:#0084ff;">📂 UPLOAD CSV</button>
        <button onclick="addRow()" style="background:#444;">➕ ADD ROW</button>
        <button onclick="saveData()" style="background:#28a745;">💾 SAVE</button>
        <button onclick="clearData()" style="background:#dc3545;">🗑️ CLEAR</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); font-size:12px; margin:0;">🤖 AI CHECK LINE PREDICTION</h3>
        <div id="future">-- -- --</div>
        <div id="matchLog" style="font-size:11px; color:var(--green); margin-top:5px; font-weight:bold;"></div>
    </div>

<script>
const KEY="pradeep_checkline_v1";
const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(KEY)) || [["12","25","36","48","50","60"],["10","20","30","40","50","60"],["**","**","**","**","**","**"]];
let activeLine = null;

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v;}
function norm(v){ v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = "";
   if(activeLine){
       if(ri==activeLine.cur.r && ci==activeLine.cur.c) cls="target";
       else if(ri==activeLine.base.r && ci==activeLine.base.c) cls="base";
       else if(ri==activeLine.p1.r && ci==activeLine.p1.c) cls="p1";
       else if(ri==activeLine.p2.r && ci==activeLine.p2.c) cls="p2";
       else if(ri==activeLine.old.r && ci==activeLine.old.c) cls="old-hit";
   }
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="doCheckLine(${ri},${ci})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 if(activeLine) setTimeout(renderCanvas, 50);
}

function doCheckLine(r, c) {
    if(data[r][c] !== "**") return;
    
    // 1. Current Pattern Points
    let base = {r: r-1, c: c};
    let p1 = {r: r-2, c: c};
    let p2 = {r: r-1, c: (c>0 ? c-1 : c+1)};

    if(base.r < 0 || p1.r < 0) return;
    let bVal = data[base.r][base.c];
    if(bVal == "**") return;

    // 2. Scan Old Records for Family Match
    let bFam = fam(bVal);
    let matchRow = -1;
    for(let i = r-3; i >= Math.max(0, r-12); i--) {
        if(fam(data[i][base.c]) === bFam) {
            if(data[i+1] && data[i+1][c] !== "**") {
                matchRow = i;
                break;
            }
        }
    }

    if(matchRow !== -1) {
        activeLine = {
            cur: {r, c},
            base: base,
            p1: p1,
            p2: p2,
            old: {r: matchRow+1, c: c}
        };
        draw();
        let hit = data[matchRow+1][c];
        document.getElementById("future").innerText = `${norm((parseInt(hit)+5)%100)} - ${hit.split('').reverse().join('')} - ${hit}`;
        document.getElementById("matchLog").innerText = `CHECK LINE ACTIVE: Row ${matchRow+2} -> Row ${r+1}`;
    } else {
        alert("कोई मैचिंग चेक लाइन नहीं मिली।");
    }
}

function renderCanvas() {
    const cvs = document.getElementById("mainCanvas"), tbl = document.getElementById("tbl"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    
    // Points to connect: Old Hit -> P1 -> P2 -> Base -> Target
    const classes = [".old-hit", ".p1", ".p2", ".base", ".target"];
    let points = [];
    const rect = tbl.getBoundingClientRect();

    classes.forEach(cls => {
        let el = tbl.querySelector(cls);
        if(el) {
            let r = el.getBoundingClientRect();
            points.push({x: r.left - rect.left + r.width/2, y: r.top - rect.top + r.height/2});
        }
    });

    if(points.length < 2) return;

    // Drawing the Line
    ctx.strokeStyle = "#00ff88"; 
    ctx.lineWidth = 4;
    ctx.setLineDash([5, 5]); // Dash style for clarity
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00ff88";

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    
    // Numbers on the points
    ctx.setLineDash([]);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px Arial";
    points.forEach((p, i) => {
        ctx.fillText(i+1, p.x + 10, p.y - 10);
    });
}

function edit(r,c,el){ data[r][c]=norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(KEY,JSON.stringify(data)); alert("Data Saved!"); }
function clearData(){ if(confirm("सब मिटा दें?")){ localStorage.clear(); location.reload(); }}
function importCSV(e){
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => norm(v)));
        localStorage.setItem(KEY, JSON.stringify(data));
        draw();
    };
    fr.readAsText(e.target.files[0]);
}
draw();
</script>
</body>
</html>
