<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Pro AI – Pradeep Family System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --blue: #0084ff; --green: #00ff88; --bg: #0f172a; --panel: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        /* Dashboard */
        #main-app { padding: 15px; }
        .toolbar { background: var(--panel); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 8px; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .table-container { position: relative; background: #fff; border-radius: 10px; padding: 5px; display: inline-block; box-shadow: 0 0 20px #000; }
        table { border-collapse: collapse; color: #000; font-size: 15px; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 5px; text-align: center; font-weight: 800; width: 45px; height: 45px; cursor: pointer; }
        th { background: #1e293b; color: #fff; font-size: 11px; }
        
        .circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0, 132, 255, 0.2); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--gold); }
        h3 { margin: 0 0 10px 0; color: var(--gold); font-size: 13px; text-transform: uppercase; }

        #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 15px; display: none; z-index: 100; padding: 15px; color: #000; width: 95%; max-width: 450px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 12px; }
    </style>
</head>
<body>

<div id="main-app">
    <h2 style="color:var(--gold); margin:0; text-align:center;">Kalyan Pro AI <small style="color:#888;">(Family Cross)</small></h2>
    
    <div class="toolbar">
        <button onclick="addRow()" style="background:#444; color:#fff;">+ ROW</button>
        <button onclick="saveData()" style="background:#28a745; color:#fff;">SAVE</button>
        <button onclick="clearData()" style="background:#dc3545; color:#fff;">RESET</button>
        <input type="file" id="csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:#fff;">CSV</button>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card">
            <h3>🔍 10-Row Cross Matches</h3>
            <div id="checks">Click (**) to scan 3-row offset...</div>
        </div>
        <div class="card">
            <h3>🔮 Future AI Prediction</h3>
            <div id="future-ai" style="font-size: 22px; color: var(--gold); font-weight: 800; text-align: center;">-- -- --</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:#fff;">X</button>
    <h3 style="color:#000">Tircha Family Trace</h3>
    <div class="table-container" style="width:100%; overflow:auto;">
        <canvas id="popCanvas"></canvas>
        <table id="popTbl" style="width:100%"></table>
    </div>
</div>

<script>
const STORAGE_KEY = "pdata_kalyan_family_v1";
const FAMILY = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["44","49","94","99"],"55":["00","05","50","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || Array(15).fill(["**","**","**","**","**","**"]);
let activeMark = null;

function norm(v){ v=String(v).trim(); return (v==""||v=="**")?"**":(v.length==1?"0"+v:v); }
function isFamily(a, b){
    if(a=="**" || b=="**") return false;
    if(a===b || a===b.split('').reverse().join('')) return true;
    for(let k in FAMILY) if(FAMILY[k].includes(a) && FAMILY[k].includes(b)) return true;
    return false;
}

function draw(){
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = (activeMark && activeMark.some(p => p.r===ri && p.c===ci)) ? "circle" : "";
            h += `<td class="${cls}" contenteditable onblur="data[${ri}][${ci}]=norm(this.innerText)" onclick="handleScan(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    if(activeMark) setTimeout(() => drawLines("mainCanvas", "tbl"), 50);
}

function handleScan(r, c) {
    if(data[r][c] !== "**") return;
    
    let matches = [];
    let startR = r - 3; // Blank se 3 row upar
    if(startR < 0) return;

    // Scan up to 10 rows further up from startR
    let limitR = Math.max(0, startR - 10);

    for(let i = startR; i >= limitR; i--) {
        // Tircha Check (Left Diagonal and Right Diagonal)
        let colsToCheck = [c-1, c+1]; 
        colsToCheck.forEach(tc => {
            if(tc >= 0 && tc < 6 && data[i][tc] !== "**") {
                // Family connection check
                for(let prevIdx = i-1; prevIdx >= 0; prevIdx--) {
                    for(let prevCol=0; prevCol<6; prevCol++) {
                        if(isFamily(data[i][tc], data[prevIdx][prevCol])) {
                            matches.push({
                                anchorR: i, anchorC: tc,
                                sourceR: prevIdx, sourceC: prevCol,
                                nextVal: data[i+1] ? data[i+1][c] : "**"
                            });
                        }
                    }
                }
            }
        });
    }
    displayResults(matches, r, c);
}

function displayResults(matches, tr, tc) {
    let html = "";
    matches.slice(0, 5).forEach((m, idx) => {
        html += `<div style="background:#334155; padding:10px; margin-bottom:5px; border-radius:8px; cursor:pointer; border-left:4px solid var(--green);" 
                 onclick="showPopup(${m.anchorR}, ${m.anchorC}, ${m.sourceR}, ${m.sourceC})">
                 Tircha Match: Row ${m.anchorR+1} & ${m.sourceR+1} ➔</div>`;
    });
    document.getElementById("checks").innerHTML = html || "No Family Cross Pattern in 10-row range.";
    
    // Future AI Prediction (3 pairs)
    let preds = [...new Set(matches.map(m => m.nextVal))].filter(v => v!=="**").slice(0,3);
    document.getElementById("future-ai").innerHTML = preds.length ? preds.join("  ") : "05  50  55";
}

function showPopup(r1, c1, r2, c2) {
    let minR = Math.min(r1, r2);
    let maxR = Math.max(r1, r2);
    let h = "";
    for(let i = minR; i <= maxR; i++) {
        h += "<tr>";
        data[i].forEach((v, j) => {
            let isCir = (i===r1 && j===c1) || (i===r2 && j===c2);
            h += `<td class="${isCir?'circle':''}">${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popTbl").innerHTML = h;
    document.getElementById("popup").style.display="block";
    document.getElementById("overlay").style.display="block";
    setTimeout(() => drawLines("popCanvas", "popTbl"), 100);
}

function drawLines(cvsId, tblId) {
    let cvs = document.getElementById(cvsId);
    let tbl = document.getElementById(tblId);
    let ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let dots = tbl.querySelectorAll(".circle");
    if(dots.length < 2) return;
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3;
    ctx.beginPath();
    dots.forEach((d, i) => {
        let x = d.offsetLeft + d.offsetWidth/2;
        let y = d.offsetTop + d.offsetHeight/2;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function addRow() { data.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); alert("Saved!"); }
function clearData() { if(confirm("Clear All?")) { localStorage.clear(); location.reload(); } }
function closePopup() { document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        data = fr.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>norm(v)));
        draw();
    };
    fr.readAsText(e.target.files[0]);
};

draw();
</script>
</body>
</html>
