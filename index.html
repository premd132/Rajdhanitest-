<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI - Family Pattern Match</title>
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box; font-family: sans-serif;}
body{margin:0; background:var(--bg); color:#fff; display:flex; flex-direction:column; align-items:center; padding:10px;}
.toolbar{display:flex; gap:10px; margin-bottom:15px;}
button{background:#1e293b; color:white; border:1px solid var(--gold); padding:8px 12px; border-radius:5px; cursor:pointer; font-weight:bold;}
.table-box{position:relative; background:white; padding:5px; border-radius:5px; display:inline-block;}
table{border-collapse:collapse; color:black; position:relative; z-index:5;}
td, th{border:1px solid #ccc; width:45px; height:45px; text-align:center; font-weight:bold; font-size:18px; cursor:pointer;}
th{background:#1e293b; color:white; font-size:10px;}

.circle-red { border: 4px solid var(--red) !important; border-radius: 50%; background:rgba(255,71,87,0.2); }
.circle-blue { border: 4px solid var(--blue) !important; border-radius: 50%; background:rgba(46,134,222,0.2); }
.marked-origin { background: #9c27b0 !important; color: white !important; } 
.marked-result { background: #facc15 !important; border: 2px solid #000 !important; }

canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
#overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center; }
.popup-box { background:#fff; padding:15px; border-radius:10px; width:95%; max-width:550px; position:relative; color: black; }
.card{ background:var(--panel); padding:10px; border-radius:8px; border-top:3px solid var(--gold); margin-top:15px; width:100%; max-width:900px;}
.check-item{ background:#2d3748; padding:10px; margin:5px 0; border-radius:5px; border-left:4px solid var(--gold); cursor:pointer; color:white;}
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvInp" style="display:none" accept=".csv">
    <button onclick="document.getElementById('csvInp').click()">📂 UPLOAD CSV</button>
    <button onclick="addRow()">➕ ADD ROW</button>
    <button onclick="exportCSV()">💾 SAVE CSV</button>
</div>

<div class="table-box">
    <canvas id="mainCanvas"></canvas>
    <table id="tblMain"></table>
</div>

<div class="card">
    <b>✔ FAMILY MATCH CHECK LINES (HISTORY)</b>
    <div id="checkList">Click (**) cell to find Family Patterns...</div>
</div>

<div id="overlay">
    <div class="popup-box">
        <button style="float:right; background:red; color:white; border:none; padding:5px 12px; border-radius:5px;" onclick="closePopup()">CLOSE</button>
        <h3 id="popTitle">Family Pattern Match</h3>
        <div style="position:relative; overflow:auto; max-height:450px; border:1px solid #ccc;">
            <canvas id="popupCanvas"></canvas>
            <table id="tblPopup"></table>
        </div>
    </div>
</div>

<script>
// FULL FAMILY DATA LOGIC
const FAMILIES = {
    "01":["01","06","10","15","51","56","60","65"], "02":["02","07","20","25","52","57","70","75"],
    "03":["03","08","30","35","53","58","80","85"], "04":["04","09","40","45","54","59","90","95"],
    "00":["00","05","50","55"], "11":["11","16","61","66"], "22":["22","27","72","77"],
    "33":["33","38","83","88"], "44":["44","49","94","99"],
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "23":["23","28","32","37","73","78","82","87"],
    "24":["24","29","42","47","74","79","92","97"], "34":["34","39","43","48","84","89","93","98"]
};

let data = JSON.parse(localStorage.getItem('pData')) || Array(40).fill().map(()=>Array(5).fill("**"));

function getFamilyKey(val) {
    if(!val || val === "**") return null;
    for (let key in FAMILIES) {
        if (FAMILIES[key].includes(val)) return key;
    }
    return null;
}

function render(tid, tdata, p = null){
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    tdata.forEach((row, r)=>{
        h += "<tr>";
        row.forEach((cell, c)=>{
            let cls = "";
            if(p){
                if(p.yR===r && p.yC===c) cls="marked-result";
                if(p.reds.some(pt=>pt.r===r && pt.c===c)) cls="circle-red";
                if(p.blues.some(pt=>pt.r===r && pt.c===c)) cls="circle-blue";
                if(p.origin && p.origin.r===r && p.origin.c===c) cls="marked-origin";
            }
            h += `<td class="${cls}" contenteditable onblur="upd(${r},${c},this.innerText)" onclick="cellClick(${r},${c})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById(tid).innerHTML = h;
    if(tid === "tblMain") setTimeout(() => drawLines("mainCanvas", "tblMain", p), 50);
}

function upd(r,c,v){ data[r][c]=v.trim(); localStorage.setItem('pData', JSON.stringify(data)); }

function cellClick(r,c){
    if(data[r][c] !== "**") return;
    
    // Pattern from last 10 weeks
    let p = {
        yR: r, yC: c,
        reds: [{r: r-2, c: c-1}, {r: r-4, c: c-2}],
        blues: [{r: r-1, c: c}, {r: r-3, c: c}]
    };
    render("tblMain", data, p);

    let list = document.getElementById('checkList');
    list.innerHTML = "";
    
    // Get Family of the pattern cells
    let famR = getFamilyKey(data[r-2]?.[c-1]);
    
    for(let i=5; i<data.length; i++){
        if(i !== r && data[i][c] !== "**"){
            // Check if history also has a family member in same spot
            let histFam = getFamilyKey(data[i-2]?.[c-1]);
            if(histFam && histFam === famR) {
                let div = document.createElement('div');
                div.className = "check-item";
                div.innerText = `Family Match Found! Week ${i+1} (Value: ${data[i-2][c-1]} is Family of ${data[r-2][c-1]})`;
                div.onclick = () => openPopup(i, c);
                list.appendChild(div);
            }
        }
    }
}

function openPopup(mR, mC){
    document.getElementById('overlay').style.display = 'flex';
    let p = {
        yR: mR, yC: mC,
        reds: [{r: mR-2, c: mC-1}, {r: mR-4, c: mC-2}],
        blues: [{r: mR-1, c: mC}, {r: mR-3, c: mC}],
        origin: {r: mR-2, c: mC-1} 
    };
    let start = Math.max(0, mR - 9);
    let subData = data.slice(start, mR + 2);
    let adjP = {
        yR: mR - start, yC: mC,
        reds: p.reds.map(pt => ({r: pt.r - start, c: pt.c})),
        blues: p.blues.map(pt => ({r: pt.r - start, c: pt.c})),
        origin: {r: p.origin.r - start, c: p.origin.c}
    };
    render("tblPopup", subData, adjP);
    setTimeout(() => drawLines("popupCanvas", "tblPopup", adjP), 100);
}

function drawLines(canId, tblId, p){
    const canvas = document.getElementById(canId), table = document.getElementById(tblId), ctx = canvas.getContext('2d');
    if(!p) return;
    canvas.width = table.offsetWidth; canvas.height = table.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const rect = table.getBoundingClientRect();
    const tCell = table.rows[p.yR+1].cells[p.yC].getBoundingClientRect();
    const tx = tCell.left-rect.left+tCell.width/2, ty = tCell.top-rect.top+tCell.height/2;

    const draw = (pts, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 3;
        pts.forEach(pt => {
            if(pt.r<0 || pt.r >= table.rows.length-1 || pt.c<0 || pt.c>4) return;
            const cRect = table.rows[pt.r+1].cells[pt.c].getBoundingClientRect();
            ctx.beginPath(); ctx.moveTo(cRect.left-rect.left+cRect.width/2, cRect.top-rect.top+cRect.height/2);
            ctx.lineTo(tx, ty); ctx.stroke();
        });
    }
    draw(p.reds, "#ff4757"); draw(p.blues, "#2e86de");
}

function exportCSV(){
    let csv = data.map(r => r.join(",")).join("\n");
    let a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download="rajdhani_family.csv"; a.click();
}

document.getElementById('csvInp').onchange = e => {
    let r = new FileReader();
    r.onload = () => { data=r.result.split("\n").filter(l=>l.trim()).map(l=>l.split(",").map(v=>v.trim())); render("tblMain",data); };
    r.readAsText(e.target.files[0]);
};

function addRow(){ data.push(["**","**","**","**","**"]); render("tblMain", data); }
function closePopup(){ document.getElementById('overlay').style.display='none'; }
render("tblMain", data);
</script>
</body>
</html>
