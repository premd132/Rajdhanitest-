<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan AI – Pradeep Pro FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
 --gold:#ffd700; --f1:#0084ff; --f2:#ff4757;
 --bg:#0f172a; --panel:#1e293b;
}
*{box-sizing:border-box;font-family:Poppins}
body{margin:0;background:var(--bg);color:#fff}

#app{padding:10px;padding-bottom:120px}

.toolbar{
 background:var(--panel);padding:10px;border-radius:12px;
 display:flex;gap:10px;justify-content:center;
 position:sticky;top:0;z-index:30;
}

.table-container{
 position:relative;background:#fff;border-radius:8px;
 padding:5px;display:inline-block;
}

table{border-collapse:collapse;color:#000;font-size:13px;z-index:5;position:relative}
td,th{
 border:1px solid #ddd;width:45px;height:45px;
 text-align:center;font-weight:bold;cursor:pointer;
}
th{background:#1e293b;color:#fff;font-size:10px}

.f1-mark{border:3px solid var(--f1)!important;border-radius:50%;background:rgba(0,132,255,.25)}
.f2-mark{border:3px solid var(--f2)!important;border-radius:50%;background:rgba(255,71,87,.25)}

canvas{
 position:absolute;top:0;left:0;z-index:2;
 pointer-events:none;
}

.card{
 background:var(--panel);padding:15px;border-radius:15px;
 margin-top:15px;border:1px solid rgba(255,255,255,.1)
}

.check-btn{
 background:#2d3748;padding:14px;margin:8px 0;
 border-radius:10px;cursor:pointer;
 border-left:6px solid #00ff88;
 font-weight:600;display:flex;justify-content:space-between
}

.prediction-box{
 font-size:28px;font-weight:800;color:#00ff88;
 text-align:center;margin-top:10px
}

#popup{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 background:#fff;color:#000;
 border-radius:18px;display:none;
 z-index:100;padding:15px;
 border:5px solid var(--gold)
}
.overlay{
 position:fixed;top:0;left:0;
 width:100%;height:100%;
 background:rgba(0,0,0,.85);
 display:none;z-index:90
}
</style>
</head>

<body>
<div id="app">

<div class="toolbar">
<button onclick="addRow()">➕ ROW</button>
<button onclick="saveData()">💾 SAVE</button>
<button onclick="csv.click()">📂 CSV</button>
<input type="file" id="csv" hidden>
</div>

<center>
<div class="table-container">
<canvas id="mainCanvas"></canvas>
<table id="tbl"></table>
</div>
</center>

<div class="card">
<h3 style="color:var(--gold)">🔮 Future 3 Pair</h3>
<div id="future" class="prediction-box">-- -- --</div>
</div>

<div class="card">
<h3>✔ Check Lines</h3>
<div id="check-list">Click bottom ** cell</div>
</div>

</div>

<div class="overlay" onclick="closePopup()"></div>
<div id="popup">
<button onclick="closePopup()" style="float:right">CLOSE</button>
<div id="popContent"></div>
</div>

<script>
const FAMILY={
"00":["00","05","50","55"],"11":["11","16","61","66"],
"22":["22","27","72","77"],"33":["33","38","83","88"],
"44":["44","49","94","99"],
"12":["12","17","21","26","62","67","71","76"],
"13":["13","18","31","36","63","68","81","86"],
"14":["14","19","41","46","64","69","91","96"],
"15":["01","06","10","15","51","56","60","65"],
"23":["23","28","32","37","73","78","82","87"],
"24":["24","29","42","47","74","79","92","97"],
"25":["02","07","20","25","52","57","70","75"],
"34":["34","39","43","48","84","89","93","98"],
"35":["03","08","30","35","53","58","80","85"],
"45":["04","09","40","45","54","59","90","95"]
};

let data=JSON.parse(localStorage.getItem("kalyan_fix"))||
[["00","00","00","00","00","00"],["**","**","**","**","**","**"]];

let active=null;

const getFam=v=>{
 for(let k in FAMILY) if(FAMILY[k].includes(v)) return k;
 return v;
};

const norm=v=>v=="**"?"**":v.padStart(2,"0");

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls="";
   if(active && i>=active.s && i<active.s+6){
    if(getFam(c)==active.f1)cls="f1-mark";
    if(getFam(c)==active.f2)cls="f2-mark";
   }
   h+=`<td class="${cls}" onclick="cell(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
 setTimeout(()=>lines("mainCanvas","tbl"),30);
}

function cell(r,c){
 if(data[r][c]=="**") scan(r,c);
 else{
  let v=prompt("Jodi",data[r][c]);
  if(v!=null){data[r][c]=norm(v);draw();}
 }
}

function scan(r,c){
 let fams=[];
 for(let i=r-1;i>=Math.max(0,r-6);i--){
  let f=getFam(data[i][c]);
  if(!fams.includes(f)&&f!="**")fams.push(f);
 }
 if(fams.length<2)return alert("2 family required");

 let blueprint=[];
 for(let i=0;i<6;i++){
  let rr=r-1-i;if(rr<0)break;
  blueprint.push({i,f:getFam(data[rr][c])});
 }

 let matches=[];
 for(let i=0;i<=data.length-7;i++){
  let score=0;
  blueprint.forEach((p,idx)=>{
   if(getFam(data[i+5-idx][c])==p.f)score++;
  });
  if(score>=3)matches.push({i,score});
 }

 checkList(matches,fams,c);
}

function checkList(arr,fams,col){
 let cl=document.getElementById("check-list");
 cl.innerHTML="";
 arr.sort((a,b)=>b.score-a.score).slice(0,5).forEach((m,i)=>{
  let d=document.createElement("div");
  d.className="check-btn";
  d.innerHTML=`Check ${i+1} ( ${m.score} ) ➜`;
  d.onclick=()=>{
   active={s:m.i,f1:fams[0],f2:fams[1]};
   draw();popup(m.i,fams);
   let nx=data[m.i+6]?.[col];
   let fam=getFam(nx||"");
   future.innerText=(FAMILY[fam]||[]).slice(0,3).join(" ");
  };
  cl.appendChild(d);
 });
}

function popup(s,f){
 let h="<table>";
 for(let i=s;i<s+6;i++){
  h+="<tr>";
  data[i].forEach(v=>{
   let c=getFam(v)==f[0]?"f1-mark":getFam(v)==f[1]?"f2-mark":"";
   h+=`<td class="${c}">${v}</td>`;
  });
  h+="</tr>";
 }
 popContent.innerHTML=h+"</table>";
 popup.style.display=overlay.style.display="block";
}

function lines(cvs,tblId){
 let cvsEl=document.getElementById(cvs);
 let tbl=document.getElementById(tblId);
 if(!tbl)return;
 cvsEl.width=tbl.offsetWidth;
 cvsEl.height=tbl.offsetHeight;
 let ctx=cvsEl.getContext("2d");
 ctx.clearRect(0,0,cvsEl.width,cvsEl.height);
 ["f1-mark","#0084ff","f2-mark","#ff4757"].forEach((v,i,a)=>{
  if(i%2)return;
  let d=tbl.querySelectorAll("."+v);
  if(d.length<2)return;
  ctx.strokeStyle=a[i+1];ctx.lineWidth=3;ctx.beginPath();
  d.forEach((x,j)=>{
   let r=x.getBoundingClientRect(),p=tbl.getBoundingClientRect();
   let X=r.left-p.left+r.width/2;
   let Y=r.top-p.top+r.height/2;
   j?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  });
  ctx.stroke();
 });
}

function addRow(){data.push(["**","**","**","**","**","**"]);draw();}
function saveData(){localStorage.setItem("kalyan_fix",JSON.stringify(data));alert("Saved")}
function closePopup(){popup.style.display=overlay.style.display="none"}

csv.onchange=e=>{
 let fr=new FileReader();
 fr.onload=()=>{data=fr.result.split("\n").map(r=>r.split(",").map(norm));draw();}
 fr.readAsText(e.target.files[0]);
};

draw();
</script>
</body>
</html>
