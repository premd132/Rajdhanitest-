<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajdhani Pro AI - V300 Auto-Scan</title>
    <style>
        :root { --gold: #ffd700; --blue: #00a8ff; --green: #00ff88; --bg: #050a18; --panel: #111b36; --neon-pink: #ff00ff; --neon-cyan: #00f2ff; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 10px; }
        
        .toolbar { background: rgba(17, 27, 54, 0.9); padding: 12px; border-radius: 15px; margin-bottom: 15px; display: flex; gap: 8px; justify-content: center; border-bottom: 2px solid var(--green); }
        
        .table-outer { position: relative; padding: 5px; background: #fff; border-radius: 8px; display: inline-block; box-shadow: 0 0 30px rgba(0,255,136,0.3); }
        table { border-collapse: collapse; color: #000; position: relative; z-index: 5; }
        td, th { border: 1px solid #ddd; padding: 10px; text-align: center; font-weight: 900; width: 42px; height: 42px; cursor: pointer; font-size: 16px; }
        th { background: #334155; color: #fff; font-size: 10px; }
        
        /* Scan Highlights */
        .f1-circle { border: 3px solid var(--neon-pink) !important; border-radius: 50% !important; background: rgba(255,0,255,0.1); }
        .f2-circle { border: 3px solid var(--blue) !important; border-radius: 50% !important; background: rgba(0,168,255,0.1); }
        .match-glow { background: var(--green) !important; box-shadow: 0 0 20px var(--green); color: #000 !important; border-radius: 5px; }
        .target-cell { border: 3px solid var(--gold) !important; background: #ffff00; }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; opacity: 0.7; }
        
        .ai-card { background: var(--panel); padding: 20px; border-radius: 20px; margin-top: 15px; text-align: center; border: 1px solid #334155; }
        #future-display { font-size: 38px; color: var(--green); font-weight: 900; margin: 5px 0; text-shadow: 0 0 10px var(--green); }
        
        .btn { cursor: pointer; border: none; font-weight: bold; padding: 10px 15px; border-radius: 8px; color: white; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn" style="background:#334155" onclick="addRow()">➕ Add Row</button>
        <button class="btn" style="background:var(--green); color:#000" onclick="saveData()">💾 Save</button>
        <button class="btn" style="background:var(--blue)" onclick="document.getElementById('csv').click()">📂 Import CSV</button>
        <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
    </div>

    <center>
        <div class="table-outer">
            <canvas id="lineCanvas"></canvas>
            <table id="mainTable"></table>
        </div>
    </center>

    <div class="ai-card">
        <div id="status" style="color:var(--gold); font-size:12px; font-weight:bold;">SYSTEM READY - V300</div>
        <div id="future-display">-- -- --</div>
        <div id="log" style="color:#94a3b8; font-size:11px;">Click on (**) to start Smart Scan</div>
    </div>

<script>
const FAMILY = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let records = JSON.parse(localStorage.getItem("pradeep_v300")) || [["12","34","56","78","90","11"],["67","89","22","44","66","88"],["**","**","**","**","**","**"]];
let activeSet = null;

function getFam(v){ for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return v; }
function clean(v){ v=v.replace(/[^0-9*]/g,''); return (v=="**"||v=="")?"**":v.padStart(2,'0').slice(-2); }

function render(){
    let html="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    records.forEach((row, rIdx)=>{
        html += "<tr>";
        row.forEach((val, cIdx)=>{
            let cls = "";
            if(activeSet){
                if(rIdx==activeSet.target.r && cIdx==activeSet.target.c) cls="target-cell";
                else if(rIdx==activeSet.f1.r && cIdx==activeSet.f1.c) cls="f1-circle";
                else if(rIdx==activeSet.f2.r && cIdx==activeSet.f2.c) cls="f2-circle";
                else if(rIdx==activeSet.match.r && cIdx==activeSet.match.c) cls="match-glow";
            }
            html += `<td class="${cls}" contenteditable="true" onblur="update(${rIdx},${cIdx},this)" onclick="smartScan(${rIdx},${cIdx})">${val}</td>`;
        });
        html += "</tr>";
    });
    document.getElementById("mainTable").innerHTML = html;
    if(activeSet) setTimeout(drawDpbossLines, 50);
}

function update(r,c,el){ records[r][c]=clean(el.innerText); el.innerText=records[r][c]; }

function smartScan(r, c) {
    if(records[r][c] !== "**") return;
    
    // 1. Check Multiple Shapes (Tircha & Straight)
    let searchShapes = [
        {f1: {r: r-1, c: c}, f2: {r: r-2, c: c}}, // Straight
        {f1: {r: r-1, c: c-1}, f2: {r: r-1, c: c+1}}, // Wide
        {f1: {r: r-1, c: c-1}, f2: {r: r-2, c: c}} // Tircha L
    ];

    let found = null;
    let usedShape = null;

    for(let shape of searchShapes) {
        if(shape.f1.r < 0 || shape.f1.c < 0 || shape.f1.c > 5) continue;
        if(shape.f2.r < 0 || shape.f2.c < 0 || shape.f2.c > 5) continue;
        
        let v1 = records[shape.f1.r][shape.f1.c], v2 = records[shape.f2.r][shape.f2.c];
        if(v1=="**" || v2=="**") continue;

        let fam1 = getFam(v1), fam2 = getFam(v2);

        // Scan 12 Weeks
        for(let i = r-2; i >= Math.max(0, r-12); i--) {
            if(getFam(records[i][shape.f1.c]) === fam1 && records[i+1] && records[i+1][c] !== "**") {
                found = {r: i+1, c: c};
                usedShape = shape;
                break;
            }
        }
        if(found) break;
    }

    if(found) {
        activeSet = { target: {r, c}, f1: usedShape.f1, f2: usedShape.f2, match: found };
        render();
        let val = records[found.r][found.c];
        document.getElementById("future-display").innerText = `${val} • ${val.split('').reverse().join('')}`;
        document.getElementById("status").innerText = "PATTERN DETECTED";
    } else {
        alert("कोई पैटर्न नहीं मिला। कृपया डेटा अपडेट करें या 12 हफ़्तों का रिकॉर्ड चेक करें।");
    }
}

function drawDpbossLines() {
    const cvs = document.getElementById("lineCanvas"), tbl = document.getElementById("mainTable"), ctx = cvs.getContext("2d");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();
    const pos = (p) => {
        let el = tbl.rows[p.r+1].cells[p.c];
        let r = el.getBoundingClientRect();
        return {x: r.left - rect.left + r.width/2, y: r.top - rect.top + r.height/2};
    };
    let start = pos(activeSet.match), p1 = pos(activeSet.f2), p2 = pos(activeSet.f1), end = pos(activeSet.target);
    ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 4; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(start.x, start.y);
    ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, end.x, end.y);
    ctx.stroke();
}

function addRow(){ records.push(["**","**","**","**","**","**"]); render(); }
function saveData(){ localStorage.setItem("pradeep_v300", JSON.stringify(records)); alert("Saved!"); }
function importCSV(e){
    let fr = new FileReader();
    fr.onload = () => {
        records = fr.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v => clean(v)));
        localStorage.setItem("pradeep_v300", JSON.stringify(records));
        render();
    };
    fr.readAsText(e.target.files[0]);
}
render();
</script>
</body>
</html>
