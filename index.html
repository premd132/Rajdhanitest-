<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep Advanced Pattern Tool</title>
    <style>
        :root { --bg: #0a0a0a; --text: #f0f0f0; --accent: #00ff88; --fam-line: #ff00ff; --check-line: #00e5ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .dashboard { display: flex; gap: 20px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 8px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-csv { background: var(--accent); color: black; }
        .btn-edit { background: #555; color: white; }
        
        .chart-container { position: relative; display: inline-block; background: #000; padding: 10px; border: 2px solid #333; }
        table { border-collapse: collapse; z-index: 2; position: relative; }
        td { border: 1px solid #222; width: 65px; height: 50px; text-align: center; font-size: 1.2em; cursor: crosshair; }
        
        .fam-match { background: rgba(255, 0, 255, 0.2) !important; border: 2px solid var(--fam-line); }
        .old-record { background: rgba(0, 229, 255, 0.2) !important; border: 2px solid var(--check-line); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        .input-panel { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
        input { background: #222; border: 1px solid #444; color: var(--accent); padding: 10px; width: 70px; text-align: center; }
    </style>
</head>
<body>

    <div class="dashboard">
        <button class="btn-csv" onclick="exportToCSV()">Save CSV</button>
        <button class="btn-edit" onclick="document.getElementById('fileInput').click()">Import/Edit Records</button>
        <input type="file" id="fileInput" style="display:none" onchange="handleImport(this)">
        <div style="margin-left: auto;"><b>User:</b> Pradeep Kumar | <b>Market:</b> Rajdhani Night</div>
    </div>

    <div class="chart-container" id="chartBox">
        <canvas id="patternCanvas"></canvas>
        <table id="dataTable"></table>
    </div>

    <div class="input-panel">
        <input type="text" id="m" placeholder="Mon">
        <input type="text" id="t" placeholder="Tue">
        <input type="text" id="w" placeholder="Wed">
        <input type="text" id="th" placeholder="Thu">
        <input type="text" id="f" placeholder="Fri">
        <button onclick="addNewData()" style="background: #0088ff; color:white;">Add Row</button>
    </div>

<script>
// 1. Core Data & Rashi Logic
let records = JSON.parse(localStorage.getItem('matka_db')) || [];
const rashiMap = { '0':5, '1':6, '2':7, '3':8, '4':9, '5':0, '6':1, '7':2, '8':3, '9':4 };

function getFamily(jodi) {
    if(!jodi || jodi == "**") return [];
    let d1 = parseInt(jodi[0]), d2 = parseInt(jodi[1]);
    let f1 = [d1, rashiMap[d1]], f2 = [d2, rashiMap[d2]];
    let family = [];
    f1.forEach(a => f2.forEach(b => family.push(`${a}${b}`, `${b}${a}`)));
    return [...new Set(family)];
}

// 2. Rendering & UI
function render() {
    const table = document.getElementById('dataTable');
    table.innerHTML = "";
    records.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.id = `c-${r}-${c}`;
            td.innerText = cell || "**";
            td.onclick = () => runAnalysis(r, c);
            tr.appendChild(td);
        });
        table.appendChild(tr);
    });
}

// 3. Fam to Fam & Old Check Line Logic
function runAnalysis(currR, currC) {
    clearVisuals();
    const currentJodi = records[currR][currC];
    if(!currentJodi || currentJodi == "**") return;

    const currentFam = getFamily(currentJodi);
    document.getElementById(`c-${currR}-${currC}`).classList.add('fam-match');

    // Scan old records (Last 10 weeks)
    for(let i = currR - 1; i >= Math.max(0, currR - 10); i--) {
        for(let j = 0; j < 5; j++) {
            let oldJodi = records[i][j];
            if(currentFam.includes(oldJodi)) {
                drawConnection(i, j, currR, currC, "fam");
            } else {
                // Check 1-2-3 Pattern or Direct Old Check Line
                let diff = Math.abs(parseInt(currentJodi) - parseInt(oldJodi));
                if(diff <= 3) drawConnection(i, j, currR, currC, "old");
            }
        }
    }
}

function drawConnection(or, oc, nr, nc, type) {
    const start = document.getElementById(`c-${or}-${oc}`);
    const end = document.getElementById(`c-${nr}-${nc}`);
    const canvas = document.getElementById('patternCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = document.getElementById('chartBox').offsetWidth;
    canvas.height = document.getElementById('chartBox').offsetHeight;

    start.classList.add('old-record');
    
    ctx.beginPath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = (type === "fam") ? "#ff00ff" : "#00e5ff";
    ctx.setLineDash(type === "fam" ? [] : [5, 5]);

    // Draw Line
    ctx.moveTo(start.offsetLeft + 32, start.offsetTop + 25);
    ctx.lineTo(end.offsetLeft + 32, end.offsetTop + 25);
    ctx.stroke();

    // Draw Circle on Old Record
    ctx.beginPath();
    ctx.arc(start.offsetLeft + 32, start.offsetTop + 25, 20, 0, Math.PI * 2);
    ctx.stroke();
}

// 4. Utilities (CSV/Save)
function addNewData() {
    let row = [document.getElementById('m').value, document.getElementById('t').value, 
               document.getElementById('w').value, document.getElementById('th').value, 
               document.getElementById('f').value];
    records.push(row);
    localStorage.setItem('matka_db', JSON.stringify(records));
    render();
}

function exportToCSV() {
    let content = records.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURI(content);
    a.download = 'Rajdhani_Night_Pradeep.csv';
    a.click();
}

function handleImport(input) {
    const reader = new FileReader();
    reader.onload = () => {
        records = reader.result.split("\n").map(line => line.split(","));
        render();
    };
    reader.readAsText(input.files[0]);
}

function clearVisuals() {
    const canvas = document.getElementById('patternCanvas');
    canvas.getContext('2d').clearRect(0,0,canvas.width, canvas.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('fam-match', 'old-record'));
}

render();
</script>
</body>
</html>
