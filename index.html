<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Dynamic Pattern Master</title>
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box; font-family: sans-serif;}
body{margin:0; background:var(--bg); color:#fff; display:flex; flex-direction:column; align-items:center; padding:10px;}
.toolbar{display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; justify-content:center;}
button{background:#1e293b; color:white; border:1px solid var(--gold); padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold; transition: 0.3s;}
button:hover{background:var(--gold); color:black;}
.table-box{position:relative; background:white; padding:5px; border-radius:5px; display:inline-block; overflow:hidden;}
table{border-collapse:collapse; color:black; position:relative; z-index:5;}
td, th{border:1px solid #ccc; width:45px; height:45px; text-align:center; font-weight:bold; font-size:18px; cursor:pointer;}
th{background:#1e293b; color:white; font-size:10px; height:25px;}
.circle-red { border: 4px solid var(--red) !important; border-radius: 50%; background:rgba(255,71,87,0.2); }
.circle-blue { border: 4px solid var(--blue) !important; border-radius: 50%; background:rgba(46,134,222,0.2); }
.marked-yellow { background: #facc15 !important; border: 2px solid #854d0e !important; }
canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
#overlay{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center; }
.popup-box{ background:#fff; padding:15px; border-radius:10px; width:95%; max-width:450px; position:relative; }
.dashboard{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; width:100%; max-width:900px; margin-top:15px; }
.card{ background:var(--panel); padding:10px; border-radius:8px; border-top:3px solid var(--gold); min-height:120px; }
.check-item{ background:#2d3748; padding:8px; margin:5px 0; border-radius:5px; border-left:4px solid var(--gold); cursor:pointer; font-size:12px; }
.ai-box{ font-size: 20px; color: var(--gold); text-align:center; font-weight:800; padding:10px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvInp" style="display:none" accept=".csv">
    <button onclick="document.getElementById('csvInp').click()">📂 UPLOAD CSV</button>
    <button onclick="addRow()">➕ ADD ROW</button>
    <button onclick="exportCSV()">💾 SAVE CSV</button>
    <button onclick="location.reload()" style="border-color: #ff4757;">🔄 RESET VIEW</button>
</div>

<div class="table-box">
    <canvas id="mainCanvas"></canvas>
    <table id="tblMain"></table>
</div>

<div class="dashboard">
    <div class="card">
        <b>✔ CHECK LINES (DYNAMIC SCAN)</b>
        <div id="checkList">Click any blank cell to scan unique patterns...</div>
    </div>
    <div class="card">
        <b>🔮 FUTURE AI PREDICTOR</b>
        <div id="futureAI" class="ai-box">-- -- -- --</div>
    </div>
</div>

<div id="overlay">
    <div class="popup-box">
        <button style="float:right; background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;" onclick="closePopup()">CLOSE</button>
        <h3 style="color:#000; margin-top:0;">Historical Pattern Match</h3>
        <div style="position:relative; overflow:auto; max-height:400px; border: 1px solid #ddd;">
            <canvas id="popupCanvas"></canvas>
            <table id="tblPopup"></table>
        </div>
    </div>
</div>

<script>
const FAM = {"01":["01","06","10","15","51","56","60","65"],"02":["02","07","20","25","52","57","70","75"],"03":["03","08","30","35","53","58","80","85"],"04":["04","09","40","45","54","59","90","95"],"00":["00","55","05","50"],"11":["11","66","16","61"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"22":["22","77","27","72"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"33":["33","88","38","83"],"34":["34","39","43","48","84","89","93","98"],"44":["44","99","49","94"]};

let data = JSON.parse(localStorage.getItem('pData')) || Array(30).fill().map(()=>Array(5).fill("**"));

function getF(v) { 
    if(!v || v === "**") return null;
    for (let k in FAM) { if (FAM[k].includes(v)) return k; } 
    return null; 
}

function render(tid, tdata, p = null){
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    tdata.forEach((row, r)=>{
        h += "<tr>";
        row.forEach((cell, c)=>{
            let cls = "";
            if(p){
                if(p.yR===r && p.yC===c) cls="marked-yellow";
                if(p.reds.some(pt=>pt.r===r && pt.c===c)) cls="circle-red";
                if(p.blues.some(pt=>pt.r===r && pt.c===c)) cls="circle-blue";
            }
            h += `<td class="${cls}" contenteditable onblur="upd(${r},${c},this.innerText)" onclick="cellClick(${r},${c})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById(tid).innerHTML = h;
    if(tid === "tblMain") setTimeout(() => drawLines("mainCanvas", "tblMain", p), 50);
}

function upd(r,c,v){ data[r][c]=v.trim(); localStorage.setItem('pData', JSON.stringify(data)); }

function cellClick(r,c){
    if(data[r][c] !== "**") return;
    
    // Dynamic Logic: Har click ke liye alag shape
    // Scan up to 7 rows above to find pairs that exist
    let reds = [], blues = [];
    
    // Try to find slanting red pattern
    for(let d=1; d<=7; d++){
        if(data[r-d]?.[c-1] && data[r-d][c-1] !== "**") {
            reds.push({r: r-d, c: c-1});
            if(data[r-d-2]?.[c-2] && data[r-d-2][c-2] !== "**") reds.push({r: r-d-2, c: c-2});
            break;
        }
    }
    // Try to find slanting blue pattern
    for(let d=1; d<=7; d++){
        if(data[r-d]?.[c+1] && data[r-d][c+1] !== "**") {
            blues.push({r: r-d, c: c+1});
            if(data[r-d-2]?.[c+2] && data[r-d-2][c+2] !== "**") blues.push({r: r-d-2, c: c+2});
            break;
        }
    }

    let p = { yR: r, yC: c, reds, blues };
    render("tblMain", data, p);

    // History Matching
    let list = document.getElementById('checkList');
    list.innerHTML = "";
    let matches = [];

    for(let i=10; i<data.length; i++){
        if(i !== r && data[i][c] !== "**"){
            // Check if same diagonal offsets have data in history
            let matchCount = 0;
            reds.forEach(pt => { if(getF(data[i-(r-pt.r)]?.[pt.c])) matchCount++; });
            blues.forEach(pt => { if(getF(data[i-(r-pt.r)]?.[pt.c])) matchCount++; });
            
            if(matchCount >= 1) matches.push(i);
        }
    }

    matches.slice(-4).forEach((mRow, idx) => {
        let div = document.createElement('div');
        div.className = "check-item";
        div.innerText = `${idx+1}. Check Line: Match at Row ${mRow+1}`;
        div.onclick = () => openPopup(mRow, c, reds.map(pt=>r-pt.r), blues.map(pt=>r-pt.r));
        list.appendChild(div);
    });

    // Simple Future Prediction
    let f1 = reds[0] ? FAM[getF(data[reds[0].r][reds[0].c]) || "12"][0] : "24";
    document.getElementById('futureAI').innerText = `${f1}  ${FAM["01"][1]}  ${FAM["44"][0]}  59`;
}

function openPopup(mR, mC, rOffsets, bOffsets){
    document.getElementById('overlay').style.display = 'flex';
    let p = {
        yR: mR, yC: mC,
        reds: rOffsets.map((off,idx) => ({r: mR-off, c: mC-(idx===0?1:2)})),
        blues: bOffsets.map((off,idx) => ({r: mR-off, c: mC+(idx===0?1:2)}))
    };
    let start = Math.max(0, mR - 10);
    let subData = data.slice(start, mR + 2);
    let adjP = {
        yR: mR - start, yC: mC,
        reds: p.reds.map(pt => ({r: pt.r - start, c: pt.c})),
        blues: p.blues.map(pt => ({r: pt.r - start, c: pt.c}))
    };
    render("tblPopup", subData, adjP);
    setTimeout(() => drawLines("popupCanvas", "tblPopup", adjP), 100);
}

function drawLines(canId, tblId, p){
    const canvas = document.getElementById(canId), table = document.getElementById(tblId), ctx = canvas.getContext('2d');
    if(!p) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }
    canvas.width = table.offsetWidth; canvas.height = table.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const rect = table.getBoundingClientRect();
    const tCell = table.rows[p.yR+1].cells[p.yC].getBoundingClientRect();
    const tx = tCell.left-rect.left+tCell.width/2, ty = tCell.top-rect.top+tCell.height/2;

    const draw = (pts, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 3;
        pts.forEach(pt => {
            if(pt.r<0 || pt.r >= table.rows.length-1 || pt.c<0 || pt.c>4) return;
            const cRect = table.rows[pt.r+1].cells[pt.c].getBoundingClientRect();
            ctx.beginPath(); ctx.moveTo(cRect.left-rect.left+cRect.width/2, cRect.top-rect.top+cRect.height/2);
            ctx.lineTo(tx, ty); ctx.stroke();
        });
    }
    draw(p.reds, "#ff4757"); draw(p.blues, "#2e86de");
}

function exportCSV(){
    let csv = data.map(r => r.join(",")).join("\n");
    let a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download="rajdhani_pro.csv"; a.click();
}

document.getElementById('csvInp').onchange = e => {
    let r = new FileReader();
    r.onload = () => { data=r.result.split("\n").filter(l=>l.trim()).map(l=>l.split(",").map(v=>v.trim())); render("tblMain",data); };
    r.readAsText(e.target.files[0]);
};

function addRow(){ data.push(["**","**","**","**","**"]); render("tblMain", data); }
function closePopup(){ document.getElementById('overlay').style.display='none'; }
render("tblMain", data);
</script>
</body>
</html>
