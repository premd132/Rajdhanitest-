<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Pradeep Kumar System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:Poppins}
body{margin:0;background:var(--bg);color:#fff;overflow-x:hidden}
#home{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#home h1{color:var(--gold);font-size:3.5rem;margin:0}
#app{display:none;padding:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;justify-content:center}
.toolbar button{background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer}
.table-box{position:relative;background:#fff;border-radius:12px;padding:8px;display:inline-block;box-shadow: 0 10px 40px rgba(0,0,0,0.6)}
table{border-collapse:collapse;color:#000}
td,th{border:1px solid #cbd5e1;width:50px;height:50px;text-align:center;font-weight:800;font-size:18px;cursor:pointer;position:relative}
th{background:#1e293b;color:#fff;font-size:12px}
.circle-red{border:4px solid var(--red)!important;border-radius:50%;background:rgba(255,71,87,0.3);z-index:2}
.circle-blue{border:4px solid var(--blue)!important;border-radius:50%;background:rgba(46,134,222,0.3);z-index:2}
.marked-origin{background: #fde047 !important; color: #000 !important; border: 2px solid #ca8a04 !important; font-style: italic;}
canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:20px;margin-top:20px}
.card{background:var(--panel);padding:18px;border-radius:15px;border-top:5px solid var(--gold)}
.match-btn{background:#2d3748;padding:15px;margin:8px 0;border-radius:10px;border-left:5px solid var(--gold);cursor:pointer;font-size:14px;font-weight:600}
</style>
</head>
<body>

<div id="home">
 <h1>Rajdhani PRO AI</h1>
 <p>Personalized for Pradeep Kumar Dehariya</p>
 <button onclick="start()" style="background:var(--gold);padding:15px 50px;border-radius:40px;font-weight:800;border:none;cursor:pointer;margin-top:20px;font-size:1.2rem">START AI</button>
</div>

<div id="app">
 <div class="toolbar">
  <input type="file" id="csvFile" accept=".csv" style="display:none">
  <button onclick="csvFile.click()">📂 UPLOAD RECORD</button>
  <button onclick="addRow()">➕ ADD ROW</button>
  <button onclick="saveData()">💾 LOCAL STORAGE</button>
  <button onclick="location.reload()" style="background:#dc2626">🔄 RESET</button>
 </div>
 
 <center><div class="table-box"><canvas id="mainCanvas"></canvas><table id="tbl"></table></div></center>
 
 <div class="dashboard">
  <div class="card"><b>✔ CHECK LINES (CLICK TO SEE PATTERN)</b><div id="checks">Click any (**) cell to scan history...</div></div>
  <div class="card"><b>🔮 FUTURE AI (3-PAIR PREDICTION)</b><div id="future" style="font-size:2rem;text-align:center;color:var(--gold);font-weight:800;padding:10px">--</div></div>
 </div>
</div>

<script>
const FAMILY={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"11":["11","66","16","61"],"22":["22","77","27","72"],"33":["33","88","38","83"],"44":["44","99","49","94"],"55":["55","00","05","50"]};
let data = JSON.parse(localStorage.getItem("raj_final_data")) || Array(10).fill().map(()=>Array(5).fill("**"));
let activeMark=null;

function fam(v){for(let k in FAMILY)if(FAMILY[k].includes(v))return k; return "NA";}
function norm(v){if(!v||v=="**")return"**"; v=String(v); return v.length==1?"0"+v:v;}
function start(){document.getElementById("home").style.display="none";document.getElementById("app").style.display="block";draw();}

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls="";
   if(activeMark && activeMark.map[i] && activeMark.map[i][j]) cls = activeMark.map[i][j]===1 ? "circle-red" : "circle-blue";
   if(activeMark && activeMark.originR === i && activeMark.originC === j) cls += " marked-origin";
   h+=`<td class="${cls}" contenteditable onblur="data[${i}][${j}]=norm(this.innerText);saveData()" onclick="cellClick(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 setTimeout(drawLines, 50);
}

function cellClick(r,c){
 if(data[r][c] === "**") scanStrict2Plus2(r,c);
 else findPatternOrigin(r,c);
}

// Click on cell shows where the pair came from in old records
function findPatternOrigin(r,c){
 let currentFam = fam(data[r][c]);
 for(let i=r-1; i>=0; i--){
  for(let j=0; j<5; j++){
   if(fam(data[i][j]) === currentFam){
    activeMark = { map:[], originR: i, originC: j };
    draw(); return;
   }
  }
 }
}

function scanStrict2Plus2(r,c){
 let patterns = [];
 // Logic: Get last 2 families from rows above (Monday-Friday) within 10 weeks
 let foundFams = [];
 for(let i=r-1; i>=Math.max(0, r-10); i--){
  for(let j=0; j<5; j++){
   let f = fam(data[i][j]);
   if(f!=="NA" && !foundFams.find(x=>x.f === f)){
    foundFams.push({f, dr: i-r, dc: j});
   }
   if(foundFams.length >= 2) break;
  }
  if(foundFams.length >= 2) break;
 }

 if(foundFams.length < 2) return alert("Pichli kam se kam 2 alag family ki jodi chahiye!");

 // Find similar 1, 2, 3 patterns in old records
 for(let i=0; i<data.length; i++){
  if(i===r) continue;
  let score = 0;
  foundFams.forEach(f => {
   let checkR = i + f.dr;
   if(checkR >=0 && checkR < data.length && fam(data[checkR][f.dc]) === f.f) score++;
  });
  if(score >= 1) patterns.push({row: i, score, foundFams});
 }

 let div = document.getElementById("checks"); div.innerHTML = "";
 patterns.sort((a,b)=>b.score-a.score).slice(0,5).forEach(m => {
  let b = document.createElement("div"); b.className = "match-btn";
  b.innerText = `Check Line: Row ${m.row+1} Pattern Found`;
  b.onclick = () => {
   let map = Array(data.length).fill().map(()=>Array(5).fill(0));
   let o1=[], o2=[];
   m.foundFams.forEach((f, idx) => {
    let nr = m.row + f.dr;
    if(nr>=0 && nr<data.length){
        map[nr][f.dc] = (idx === 0) ? 1 : 2;
        if(idx===0) o1.push({r:nr, c:f.dc}); else o2.push({r:nr, c:f.dc});
        // Connect to the target cell row to show pattern logic
        map[m.row][c] = 0; 
    }
   });
   activeMark = {map, o1, o2, originR: m.row, originC: c};
   draw();
  };
  div.appendChild(b);
 });

 if(patterns.length > 0) {
  let val = data[patterns[0].row][c];
  if(val !== "**") document.getElementById("future").innerText = val + " - " + norm(String((parseInt(val)+11)%100)) + " - " + norm(String(Math.abs(parseInt(val)-11)%100));
 }
}

function drawLines(){
 const cvs=document.getElementById("mainCanvas"), ctx=cvs.getContext("2d"), table=document.getElementById("tbl");
 if(!table.rows.length || !activeMark) return;
 cvs.width=table.offsetWidth; cvs.height=table.offsetHeight;
 const rect=table.getBoundingClientRect();
 ctx.clearRect(0,0,cvs.width,cvs.height);
 
 const drawP = (pts, col) => {
  if(!pts || pts.length < 1) return;
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath();
  pts.forEach((p,i) => {
   let cell = table.rows[p.r].cells[p.c].getBoundingClientRect();
   let x = cell.left - rect.left + cell.width/2;
   let y = cell.top - rect.top + cell.height/2;
   // Draw line from the pair to the result cell (originR, originC)
   let resCell = table.rows[activeMark.originR].cells[activeMark.originC].getBoundingClientRect();
   let rx = resCell.left - rect.left + resCell.width/2;
   let ry = resCell.top - rect.top + resCell.height/2;
   ctx.moveTo(x,y); ctx.lineTo(rx, ry);
  });
  ctx.stroke();
 };
 drawP(activeMark.o1, "#ff4757"); drawP(activeMark.o2, "#2e86de");
}

function saveData(){ localStorage.setItem("raj_final_data", JSON.stringify(data)); }
function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
document.getElementById("csvFile").onchange = e => {
 let reader = new FileReader();
 reader.onload = () => {
  data = reader.result.split("\n").filter(x=>x.trim()).map(l=>l.split(",").slice(0,5).map(v=>norm(v.trim())));
  draw(); saveData();
 };
 reader.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
