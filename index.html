<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI - Blank Pattern Scanner</title>
    <style>
        :root { --line: #00ffcc; --circle: #ff3366; --bg: #0d1117; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        
        /* Professional Grid */
        .chart-frame { position: relative; background: #000; border: 2px solid #30363d; display: inline-block; }
        table { border-collapse: collapse; position: relative; z-index: 10; }
        td { border: 1px solid #30363d; width: 80px; height: 65px; text-align: center; cursor: pointer; font-size: 1.4em; font-weight: bold; }
        td:empty::before { content: '?'; color: #444; } /* Blank cell marker */
        
        /* Visual Lines & Circles */
        .source-mark { position: relative; color: var(--circle) !important; }
        .source-mark::after { content: ''; position: absolute; width: 50px; height: 50px; border: 3px solid var(--circle); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        
        .controls { background: #161b22; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-bottom: 3px solid var(--line); }
        button { padding: 12px 20px; cursor: pointer; background: var(--line); color: black; border: none; font-weight: bold; border-radius: 5px; }
        input { padding: 10px; width: 85px; text-align: center; background: #000; color: #00ffcc; border: 1px solid #30363d; font-size: 1.1em; }
        .info-text { color: #8b949e; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

<div class="controls">
    <h2>BLANK CLICK PREDICTION SYSTEM</h2>
    <p class="info-text">Kisi bhi <b>Khali (Blank)</b> cell par click karein uske piche ki <b>Check Lines</b> dekhne ke liye.</p>
    <button onclick="document.getElementById('csvPicker').click()">IMPORT RECORDS (CSV)</button>
    <input type="file" id="csvPicker" style="display:none" onchange="loadCSV(this)">
    <button onclick="exportCSV()" style="background:#30363d; color:white; margin-left:10px;">SAVE DATA</button>
</div>

<div class="chart-frame" id="mainContainer">
    <canvas id="lineCanvas"></canvas>
    <table id="matkaTable">
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="controls" style="margin-top:20px;">
    <h3>Add New Week</h3>
    <input type="text" id="w1" placeholder="Mon">
    <input type="text" id="w2" placeholder="Tue">
    <input type="text" id="w3" placeholder="Wed">
    <input type="text" id="w4" placeholder="Thu">
    <input type="text" id="w5" placeholder="Fri">
    <button onclick="addNewWeek()">Add Row</button>
</div>

<script>
let matkaData = JSON.parse(localStorage.getItem('pradeep_blank_db')) || [];
const rashi = {'0':5,'1':6,'2':7,'3':8,'4':9,'5':0,'6':1,'7':2,'8':3,'9':4};

function render() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = "";
    matkaData.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.id = `cell-${r}-${c}`;
            td.innerText = (cell && cell !== "**") ? cell : "";
            td.onclick = () => scanBlankPattern(r, c);
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

// 1. Logic for Blank Cell Pattern Discovery
function scanBlankPattern(r, c) {
    resetCanvas();
    let currentVal = matkaData[r][c];
    
    // Agar cell khali hai, toh hum prediction mode mein hain
    alert("Scanning historical patterns for this position...");

    // Scan previous 10 weeks same column (Vertical) and cross
    for (let i = r - 1; i >= Math.max(0, r - 10); i--) {
        for (let j = 0; j < 5; j++) {
            let oldVal = matkaData[i][j];
            if (!oldVal || oldVal === "**") continue;

            // Check if this old record could be the basis (Check Line)
            // Logic: Fam-to-Fam or 0-prefix Sequence
            if (isPotentialPattern(oldVal, i, j, r, c)) {
                drawCheckLine(i, j, r, c);
            }
        }
    }
}

function isPotentialPattern(oldVal, oldR, oldC, newR, newC) {
    // 1. Vertical Same Day Pattern (Strong)
    if (oldC === newC) return true;
    
    // 2. Cross Connection (Diagonal)
    if (Math.abs(oldR - newR) === Math.abs(oldC - newC)) return true;

    return false;
}

// 2. Drawing Check Lines for Proof
function drawCheckLine(r1, c1, r2, c2) {
    const s = document.getElementById(`cell-${r1}-${c1}`);
    const e = document.getElementById(`cell-${r2}-${c2}`);
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = document.getElementById('mainContainer').offsetWidth;
    canvas.height = document.getElementById('mainContainer').offsetHeight;

    s.classList.add('source-mark'); // Circle on the historical proof

    ctx.beginPath();
    ctx.strokeStyle = (c1 === c2) ? "#00ffcc" : "#ff3366"; // Cyan for Vertical, Red for Cross
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.moveTo(s.offsetLeft + 40, s.offsetTop + 32);
    ctx.lineTo(e.offsetLeft + 40, e.offsetTop + 32);
    ctx.stroke();
}

// Data Management
function loadCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        matkaData = e.target.result.trim().split("\n").map(l => l.split(",").map(v => v.trim()));
        save(); render();
        alert("Records Loaded! Now click any cell to see check lines.");
    };
    reader.readAsText(input.files[0]);
}

function exportCSV() {
    let csv = matkaData.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'Pradeep_Pattern_Data.csv';
    a.click();
}

function addNewWeek() {
    matkaData.push([document.getElementById('w1').value, document.getElementById('w2').value, document.getElementById('w3').value, document.getElementById('w4').value, document.getElementById('w5').value]);
    save(); render();
}

function save() { localStorage.setItem('pradeep_blank_db', JSON.stringify(matkaData)); }
function resetCanvas() {
    const cvs = document.getElementById('lineCanvas');
    cvs.getContext('2d').clearRect(0,0,cvs.width, cvs.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('source-mark'));
}

render();
</script>
</body>
</html>
