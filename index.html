<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>DPBossKing Professional Master System</title>
<style>
    :root { --red: #ff0000; --blue: #0000ff; --green: #008000; --gold: #ffd600; --dark-bg: #0d0d0d; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark-bg); color: #fff; margin: 0; user-select: none; }
    
    /* Premium Sidebar & Header */
    header { background: #b71c1c; padding: 15px; border-bottom: 4px solid var(--gold); text-align: center; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .main-grid { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 65px); }
    
    .sidebar { background: #1a1a1a; padding: 20px; border-right: 1px solid #333; overflow-y: auto; }
    .tool-group { margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
    .tool-title { font-size: 12px; color: var(--gold); margin-bottom: 10px; display: block; font-weight: bold; }
    
    /* Button & Input Styles */
    button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-run { background: var(--gold); color: #000; font-size: 16px; margin-top: 15px; box-shadow: 0 5px 0 #b89b00; }
    .active { border: 3px solid #fff !important; box-shadow: 0 0 15px rgba(255,255,255,0.3); }

    /* Chart Area */
    .content { padding: 20px; overflow: auto; background: #222; position: relative; }
    .chart-wrapper { position: relative; display: inline-block; background: #fff; padding: 15px; border-radius: 5px; box-shadow: 0 0 30px #000; }
    table { border-collapse: collapse; color: #000; z-index: 10; position: relative; background: transparent; }
    th, td { border: 1px solid #ccc; width: 60px; height: 55px; text-align: center; font-size: 20px; font-weight: 900; position: relative; }
    th { background: #f4f4f4; font-size: 11px; height: 30px; }

    /* Drawing Assets */
    .f-red { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); color: var(--red); }
    .f-blue { border: 4px solid var(--blue) !important; border-radius: 50% !important; color: var(--blue); }
    .f-green { border: 4px solid var(--green) !important; background: rgba(0,128,0,0.1); color: var(--green); }
    #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }

    /* Log Panel */
    .footer-log { position: fixed; bottom: 0; right: 0; width: calc(100% - 280px); background: #000; color: #0f0; padding: 8px; font-family: monospace; border-top: 1px solid #333; font-size: 12px; }
</style>
</head>
<body>

<header>DPBOSS KING - ADVANCED ANALYTICS & PATTERN CLONER PRO</header>

<div class="main-grid">
    <div class="sidebar">
        <div class="tool-group">
            <span class="tool-title">LOAD DATA</span>
            <input type="file" id="csvFile" onchange="loadData()" style="color:#fff; font-size: 12px;">
        </div>
        
        <div class="tool-group">
            <span class="tool-title">SELECT MARKER</span>
            <button class="btn-red active" id="r-btn" onclick="setTool('f-red', 'r-btn')">BASE (RED BOX)</button>
            <button class="btn-green" id="g-btn" onclick="setTool('f-green', 'g-btn')">TOUCH 1 (GREEN)</button>
            <button class="btn-blue" id="b-btn" onclick="setTool('f-blue', 'b-btn')">TOUCH 2 (BLUE CIRCLE)</button>
        </div>

        <div class="tool-group">
            <span class="tool-title">ANCHOR DAY</span>
            <select id="anchorDay" style="width:100%; padding:10px; background:#333; color:#fff; border:1px solid #444;">
                <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
                <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
            </select>
        </div>

        <button class="btn-run" onclick="executeProScan()">EXECUTE PATTERN CLONE</button>
        <button onclick="location.reload()" style="background:#444; color:#fff; margin-top:20px;">FULL RESET</button>
    </div>

    <div class="content">
        <div class="chart-wrapper" id="box">
            <canvas id="canvas"></canvas>
            <table id="mainTable">
                <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="footer-log" id="log">System Status: Online | Family Database: Loaded (100% Coverage)</div>

<script>
let currentTool = 'f-red';
let chartData = [["10","20","30","40","50","60"],["11","21","31","41","51","61"],["12","22","32","42","52","62"],["13","23","33","43","53","63"],["80","35","25","**","**","**"]];

// The Real Family Logic (Calculated dynamically for 00-99)
function getFamily(val) {
    let n = val.toString().padStart(2, '0');
    let d1 = parseInt(n[0]), d2 = parseInt(n[1]);
    let c1 = (d1 + 5) % 10, c2 = (d2 + 5) % 10;
    let set = new Set();
    [[d1,c1],[c1,d1]].forEach(a => [[d2,c2],[c2,d2]].forEach(b => {
        set.add(`${a[0]}${b[0]}`); set.add(`${b[0]}${a[0]}`);
    }));
    return Array.from(set);
}

function init() {
    const b = document.getElementById('tbody');
    b.innerHTML = chartData.map((row, r) => `<tr>${row.map((c, d) => 
        `<td onclick="applyTool(this)" contenteditable="true" onblur="chartData[${r}][${d}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    setTimeout(syncCanvas, 100);
}

function setTool(t, id) {
    currentTool = t;
    document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function applyTool(td) { td.className = td.className === currentTool ? "" : currentTool; }

function syncCanvas() {
    const c = document.getElementById('canvas'), b = document.getElementById('box');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

// THE CLONE ENGINE: Matching Set-to-Set Family
function executeProScan() {
    const day = parseInt(document.getElementById('anchorDay').value);
    const table = document.getElementById('mainTable');
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.clearRect(0,0,5000,5000);

    let masterDNA = { base: null, pattern: [] };

    // 1. Capture the DNA of your current set
    for(let r=0; r<chartData.length; r++) {
        if(table.rows[r+1].cells[day].classList.contains('f-red')) {
            masterDNA.base = { val: chartData[r][day], r: r, c: day };
            break;
        }
    }

    if(!masterDNA.base) { document.getElementById('log').innerText = "ERROR: Set a Red Base!"; return; }

    document.querySelectorAll('.f-green, .f-blue').forEach(m => {
        let mr = m.parentElement.rowIndex-1, mc = m.cellIndex;
        masterDNA.pattern.push({ val: chartData[mr][mc], rd: mr - masterDNA.base.r, cd: mc - masterDNA.base.c, type: m.className });
    });

    const baseFam = getFamily(masterDNA.base.val);

    // 2. Scan History and CLONE
    chartData.forEach((row, ri) => {
        if(baseFam.includes(row[day]) && ri !== masterDNA.base.r) {
            let matchCount = 0;
            masterDNA.pattern.forEach(p => {
                let tr = ri + p.rd, tc = day + p.cd;
                if(chartData[tr] && getFamily(p.val).includes(chartData[tr][tc])) matchCount++;
            });

            if(matchCount === masterDNA.pattern.length) {
                const bCell = table.rows[ri+1].cells[day];
                bCell.classList.add('f-red');
                masterDNA.pattern.forEach(p => {
                    const tCell = table.rows[ri+p.rd+1].cells[day+p.cd];
                    tCell.classList.add(p.type);
                    ctx.strokeStyle = p.type.includes('green') ? 'green' : 'blue';
                    ctx.lineWidth = 2.5; ctx.beginPath();
                    ctx.moveTo(bCell.offsetLeft+30, bCell.offsetTop+27);
                    ctx.lineTo(tCell.offsetLeft+30, tCell.offsetTop+27); ctx.stroke();
                });
            }
        }
    });
    document.getElementById('log').innerText = "PRO SCAN COMPLETE: Found Identical DNA Sets.";
}

function loadData() {
    const f = document.getElementById('csvFile').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        chartData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        init();
    };
    r.readAsText(f);
}

window.onload = init;
</script>
</body>
</html>
