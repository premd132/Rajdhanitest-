<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI - 0-Sequence Master</title>
    <style>
        :root { --line: #00e5ff; --circle: #ffd700; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; padding: 20px; }
        
        /* Master Chart Style */
        .chart-frame { position: relative; background: #111; border: 2px solid #333; display: inline-block; box-shadow: 0 0 20px rgba(0,229,255,0.2); }
        table { border-collapse: collapse; position: relative; z-index: 10; }
        td { border: 1px solid #222; width: 75px; height: 65px; text-align: center; cursor: pointer; font-size: 1.6em; font-weight: bold; transition: 0.3s; }
        td:hover { background: #1a1a1a; color: var(--line); }
        
        /* Check Line & Circle */
        .source-circle { position: relative; color: var(--circle) !important; }
        .source-circle::after { content: ''; position: absolute; width: 50px; height: 50px; border: 3px solid var(--circle); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        
        /* Controls */
        .header-panel { background: #111; padding: 20px; border-radius: 10px; border-bottom: 4px solid var(--line); margin-bottom: 20px; }
        button { padding: 12px 24px; cursor: pointer; background: var(--line); color: black; border: none; font-weight: bold; border-radius: 5px; margin-right: 10px; }
        .btn-predict { background: var(--circle); }
        input { padding: 10px; width: 80px; text-align: center; background: #000; color: var(--line); border: 1px solid #444; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="header-panel">
    <h1 style="margin:0; color:var(--line);">01-02-03 SEQUENCE ANALYZER</h1>
    <p>Pradeep ji, yahan aapke <b>0-prefix patterns</b> ki automatic <b>Check Lines</b> banegi.</p>
    <button onclick="document.getElementById('csvIn').click()">IMPORT CSV DATA</button>
    <input type="file" id="csvIn" style="display:none" onchange="importData(this)">
    <button class="btn-predict" onclick="scanZeroPatterns()">SCAN 0-SEQUENCE LINES</button>
</div>

<div class="chart-frame" id="chartBox">
    <canvas id="patternCanvas"></canvas>
    <table id="mainTable">
        <tbody id="gridBody"></tbody>
    </table>
</div>

<div class="header-panel" style="margin-top:20px;">
    <h3>Add Fresh Row (01, 02, 03...)</h3>
    <input type="text" id="m1" placeholder="Mon">
    <input type="text" id="m2" placeholder="Tue">
    <input type="text" id="m3" placeholder="Wed">
    <input type="text" id="m4" placeholder="Thu">
    <input type="text" id="m5" placeholder="Fri">
    <button onclick="addRow()">Add Row</button>
    <button onclick="exportCSV()" style="background:#555; color:white;">Download CSV</button>
</div>

<script>
let records = JSON.parse(localStorage.getItem('pradeep_zero_db')) || [];

function render() {
    const body = document.getElementById('gridBody');
    body.innerHTML = "";
    records.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.id = `cell-${r}-${c}`;
            // Automating 0 prefix if only single digit is entered
            let displayVal = cell.length === 1 ? '0' + cell : cell;
            td.innerText = displayVal || "**";
            td.onclick = () => findZeroLine(r, c);
            tr.appendChild(td);
        });
        body.appendChild(tr);
    });
}

// 1. Zero-Sequence Check Line Logic
function findZeroLine(r, c) {
    clearUI();
    let current = records[r][c];
    if(!current || current == "**") return;
    
    // Scan last 10 weeks specifically for 01-09 patterns
    for(let i = r - 1; i >= Math.max(0, r - 10); i--) {
        for(let j = 0; j < 5; j++) {
            let old = records[i][j];
            if(isZeroPattern(current, old)) {
                drawCheckLine(i, j, r, c);
            }
        }
    }
}

function isZeroPattern(val1, val2) {
    if(!val2 || val2 == "**") return false;
    // Check if it's a sequence: 01->02, 02->03, etc.
    let n1 = parseInt(val1);
    let n2 = parseInt(val2);
    let diff = Math.abs(n1 - n2);
    
    // Strong Pattern: Difference of 1, 2, or 3 in the 0-prefix series
    return (diff >= 1 && diff <= 3);
}

// 2. Professional Check Line Visuals
function drawCheckLine(r1, c1, r2, c2) {
    const s = document.getElementById(`cell-${r1}-${c1}`);
    const e = document.getElementById(`cell-${r2}-${c2}`);
    const canvas = document.getElementById('patternCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = document.getElementById('chartBox').offsetWidth;
    canvas.height = document.getElementById('chartBox').offsetHeight;

    s.classList.add('source-circle'); // Highlight with Circle

    ctx.beginPath();
    ctx.strokeStyle = "#00e5ff"; // Cyan Check Line
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 5]); // Dashed line for professional look
    ctx.moveTo(s.offsetLeft + 37, s.offsetTop + 32);
    ctx.lineTo(e.offsetLeft + 37, e.offsetTop + 32);
    ctx.stroke();
}

// --- CSV & Data Management ---
function importData(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        records = e.target.result.trim().split("\n").map(l => l.split(","));
        localStorage.setItem('pradeep_zero_db', JSON.stringify(records));
        render();
        alert("0-Sequence Data Loaded!");
    };
    reader.readAsText(input.files[0]);
}

function exportCSV() {
    let csv = records.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'Pradeep_Zero_Patterns.csv';
    a.click();
}

function addRow() {
    records.push([document.getElementById('m1').value, document.getElementById('m2').value, document.getElementById('m3').value, document.getElementById('m4').value, document.getElementById('m5').value]);
    localStorage.setItem('pradeep_zero_db', JSON.stringify(records));
    render();
}

function clearUI() {
    const cvs = document.getElementById('patternCanvas');
    cvs.getContext('2d').clearRect(0,0,cvs.width, cvs.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('source-circle'));
}

function scanZeroPatterns() {
    if(records.length > 0) findZeroLine(records.length-1, 0);
}

render();
</script>
</body>
</html>
