<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYAN FIGURE SYSTEM & RECORD</title>

<style>
body{background:#0f172a;color:#fff;font-family:Arial;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.box{width:100%;max-width:480px;background:#1e293b;padding:20px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.5);margin-bottom:20px}
h2{color:#ffd700;text-align:center;margin-bottom:15px;text-transform:uppercase}
input,button,select{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;font-size:15px;box-sizing:border-box}
input,select{background:#334155;color:#fff;border:1px solid #475569}
button{background:#ffd700;color:#000;font-weight:bold;cursor:pointer;transition:0.3s}
button:hover{background:#e6c200}
.result{background:#020617;padding:15px;border-radius:10px;margin-top:15px;border:1px solid #ffd700;text-align:center}
.fig{display:inline-block;background:#ffd700;color:#000;padding:10px 15px;margin:5px;border-radius:8px;font-size:22px;font-weight:bold}
.small{font-size:12px;opacity:.8;display:block;color:#94a3b8}
.btn-group{display:flex;gap:10px}
#save{background:#22c55e;color:#fff}
#clear{background:#ef4444;color:#fff;margin-top:10px}

/* Table Style */
.record-box{width:100%;max-width:480px;background:#1e293b;padding:15px;border-radius:15px;overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border:1px solid #475569;text-align:center;font-size:14px}
th{background:#334155;color:#ffd700}
tr:nth-child(even){background:#1e293b}
tr:nth-child(odd){background:#0f172a}
</style>
</head>

<body>

<div class="box">
    <h2>🔮 FIGURE SYSTEM</h2>

    <div class="small">Upload Record (CSV)</div>
    <input type="file" id="csv" accept=".csv">

    <div class="small">Input Jodis (6)</div>
    <input id="jodi" placeholder="12,34,56,78,90,22">

    <select id="mode">
        <option value="1">Manual Base Figure</option>
        <option value="2">Auto (Last Total)</option>
        <option value="3">Auto (Common Total)</option>
        <option value="4">All Strong Base</option>
    </select>

    <input id="base" type="number" min="0" max="9" placeholder="Base Figure (0-9)">

    <button id="searchBtn">SEARCH FIGURE</button>

    <div id="out" class="result" style="display:none">
        <div id="fig"></div>
        <div id="info" class="small"></div>
    </div>

    <div class="btn-group">
        <button id="save" onclick="saveToHistory()">SAVE TO RECORD</button>
    </div>
</div>

<div class="record-box">
    <h3 style="color:#ffd700;text-align:center;margin:0">📊 RECENT RECORDS</h3>
    <table id="recordTable">
        <thead>
            <tr>
                <th>S.N.</th>
                <th>Jodis (6)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="recordBody"></tbody>
    </table>
    <button id="clear" onclick="clearHistory()">CLEAR ALL HISTORY</button>
</div>

<script>
const KEY = "kalyan_v2_history";
let rows = JSON.parse(localStorage.getItem(KEY)) || [];

window.onload = updateTable;

/* --- Helpers --- */
function cleanJodiList(raw) {
    return raw.replace(/[^0-9]/g, ",").split(",").map(v => v.trim()).filter(v => v.length === 2);
}

function totalAnk(j) { return (parseInt(j[0]) + parseInt(j[1])) % 10; }

function pm(n) { return [(n + 1) % 10, (n + 9) % 10]; }

/* --- CSV Logic --- */
document.getElementById("csv").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        let text = e.target.result.replace(/\t/g, ",").replace(/ +/g, ",");
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        lines.forEach(line => {
            const parts = cleanJodiList(line);
            if (parts.length === 6) {
                rows.push(parts.join(","));
                document.getElementById("jodi").value = parts.join(",");
            }
        });
        saveAndRefresh();
        alert("Record Updated!");
    };
    reader.readAsText(file);
});

/* --- Search Logic --- */
document.getElementById("searchBtn").onclick = function() {
    const jInput = document.getElementById("jodi").value;
    const list = cleanJodiList(jInput);
    if (list.length !== 6) { alert("Enter 6 Jodis"); return; }

    const totals = list.map(totalAnk);
    const mode = document.getElementById("mode").value;
    let figures = [];

    if (mode === "1") {
        const b = parseInt(document.getElementById("base").value);
        if (isNaN(b)) { alert("Enter Base"); return; }
        figures = [...pm(b), (b+2)%10, (b+8)%10];
    } else if (mode === "2") {
        const b = totals[5];
        figures = [...pm(b), (b+2)%10, (b+8)%10];
    } else if (mode === "3") {
        const freq = {};
        totals.forEach(t => freq[t] = (freq[t]||0)+1);
        const b = parseInt(Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0]);
        figures = [...pm(b), (b+2)%10, (b+8)%10];
    } else {
        [...new Set(totals)].slice(0,2).forEach(b => figures.push(...pm(b)));
    }

    const final = [...new Set(figures)].sort();
    document.getElementById("fig").innerHTML = final.map(f => `<span class="fig">${f}</span>`).join("");
    document.getElementById("info").innerHTML = "Totals: " + totals.join("-");
    document.getElementById("out").style.display = "block";
};

/* --- History Functions --- */
function saveToHistory() {
    const val = document.getElementById("jodi").value;
    const list = cleanJodiList(val);
    if (list.length === 6) {
        rows.push(list.join(","));
        saveAndRefresh();
    } else {
        alert("Invalid Data");
    }
}

function useRecord(str) {
    document.getElementById("jodi").value = str;
    window.scrollTo(0,0);
}

function saveAndRefresh() {
    localStorage.setItem(KEY, JSON.stringify(rows));
    updateTable();
}

function updateTable() {
    const body = document.getElementById("recordBody");
    body.innerHTML = "";
    rows.slice().reverse().forEach((row, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${rows.length - index}</td>
            <td style="font-size:12px">${row}</td>
            <td><button style="padding:4px 8px; font-size:11px" onclick="useRecord('${row}')">USE</button></td>
        `;
        body.appendChild(tr);
    });
}

function clearHistory() {
    if (confirm("Delete all records?")) {
        rows = [];
        saveAndRefresh();
    }
}
</script>

</body>
</html>
