<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Pradeep AI - Strong Single Pattern</title>
    <style>
        :root { --bg: #050505; --card: #111; --border: #333; --accent: #00ffcc; --predict: #ff3366; --gold: #ffd700; --single: #00ff00; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: #fff; margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--card); border-bottom: 2px solid var(--accent); margin-bottom: 15px; }
        .btn-strong { background: var(--single); color: #000; font-weight: bold; border: none; padding: 12px 25px; cursor: pointer; border-radius: 5px; box-shadow: 0 0 15px var(--single); }
        
        .chart-container { position: relative; background: #000; border: 1px solid var(--border); overflow: hidden; }
        table { border-collapse: collapse; width: 100%; z-index: 5; position: relative; background: transparent; }
        td { border: 1px solid #222; width: 20%; height: 60px; text-align: center; font-size: 1.5em; cursor: pointer; transition: 0.3s; }
        
        /* Clear Marking */
        .source-circle { position: relative; color: var(--accent) !important; font-weight: 900; }
        .source-circle::after { content: ''; position: absolute; width: 45px; height: 45px; border: 3px solid var(--accent); border-radius: 50%; top: 5px; left: 50%; transform: translateX(-50%); }
        .prediction-box { border: 2px solid var(--predict) !important; background: rgba(255, 51, 102, 0.2); }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        .input-row { margin-top: 20px; background: #111; padding: 20px; border-radius: 10px; border: 1px solid var(--accent); }
        input { background: #000; border: 1px solid var(--accent); color: var(--gold); padding: 10px; width: 85px; text-align: center; font-size: 1.2em; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <div><h2>PRO PATTERN: 01-02-03 SEQUENCE</h2><span>User: Pradeep Kumar</span></div>
    <div class="controls">
        <button onclick="scanStrongPatterns()" class="btn-strong">SCAN STRONG SINGLE</button>
        <button onclick="downloadCSV()" style="background:#444; color:white;">SAVE CSV</button>
    </div>
</div>

<div class="chart-container" id="wrapper">
    <canvas id="lineCanvas"></canvas>
    <table id="mainTable">
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="input-row">
    <h3>Add Fresh Records (Jodi)</h3>
    <input type="text" id="i1" placeholder="Mon">
    <input type="text" id="i2" placeholder="Tue">
    <input type="text" id="i3" placeholder="Wed">
    <input type="text" id="i4" placeholder="Thu">
    <input type="text" id="i5" placeholder="Fri">
    <button onclick="addNewRow()" style="padding: 10px 20px; cursor: pointer;">Add Row</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('pradeep_v4_strong')) || [];
const rashi = {'0':5,'1':6,'2':7,'3':8,'4':9,'5':0,'6':1,'7':2,'8':3,'9':4};

function render() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = "";
    data.forEach((row, r) => {
        let tr = document.createElement('tr');
        row.forEach((cell, c) => {
            let td = document.createElement('td');
            td.innerText = cell || "**";
            td.id = `c-${r}-${c}`;
            td.onclick = () => checkSingleDigitPattern(r, c);
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

// 1. Strong Single Digit & Sequence Logic (01-02-03)
function checkSingleDigitPattern(r, c) {
    resetAll();
    const current = data[r][c];
    if(!current || current == "**") return;

    let op = current[0]; // Open Digit
    let cl = current[1]; // Close Digit

    for(let i = r - 1; i >= Math.max(0, r - 10); i--) {
        for(let j = 0; j < 5; j++) {
            let old = data[i][j];
            if(!old || old == "**") continue;

            // Pattern 1: Single Digit Repeat/Cut (Strong)
            if(old.includes(op) || old.includes(rashi[op]) || old.includes(cl)) {
                drawStrongLine(i, j, r, c, "single");
            }
            
            // Pattern 2: 01-02-03 Difference Pattern
            let diff = Math.abs(parseInt(current) - parseInt(old));
            if(diff === 1 || diff === 2 || diff === 3) {
                drawStrongLine(i, j, r, c, "sequence");
            }
        }
    }
}

function drawStrongLine(r1, c1, r2, c2, type) {
    const s = document.getElementById(`c-${r1}-${c1}`);
    const e = document.getElementById(`c-${r2}-${c2}`);
    const cvs = document.getElementById('lineCanvas');
    const ctx = cvs.getContext('2d');
    
    cvs.width = document.getElementById('wrapper').scrollWidth;
    cvs.height = document.getElementById('wrapper').scrollHeight;

    s.classList.add('source-circle');
    e.classList.add('prediction-box');

    ctx.beginPath();
    ctx.lineWidth = (type === "sequence") ? 3 : 1.5;
    ctx.strokeStyle = (type === "sequence") ? "#ffd700" : "#00ffcc";
    if(type === "single") ctx.setLineDash([10, 5]); else ctx.setLineDash([]);
    
    ctx.moveTo(s.offsetLeft + (s.offsetWidth/2), s.offsetTop + (s.offsetHeight/2));
    ctx.lineTo(e.offsetLeft + (e.offsetWidth/2), e.offsetTop + (e.offsetHeight/2));
    ctx.stroke();
}

function scanStrongPatterns() {
    if(data.length < 1) return;
    let lastRow = data.length - 1;
    for(let i=0; i<5; i++) checkSingleDigitPattern(lastRow, i);
}

// Helpers
function addNewRow() {
    data.push([document.getElementById('i1').value, document.getElementById('i2').value, document.getElementById('i3').value, document.getElementById('i4').value, document.getElementById('i5').value]);
    localStorage.setItem('pradeep_v4_strong', JSON.stringify(data));
    render();
}

function downloadCSV() {
    let csv = data.map(r => r.join(",")).join("\n");
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'Pradeep_Strong_Pattern.csv';
    a.click();
}

function resetAll() {
    const cvs = document.getElementById('lineCanvas');
    cvs.getContext('2d').clearRect(0,0,cvs.width, cvs.height);
    document.querySelectorAll('td').forEach(t => t.classList.remove('source-circle', 'prediction-box'));
}

render();
</script>
</body>
</html>
