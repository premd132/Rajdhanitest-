<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
    body { font-family: 'Trebuchet MS', sans-serif; background: #0f0f0f; color: #eee; margin: 0; }
    .nav { background: #d32f2f; padding: 15px; border-bottom: 4px solid #ffd600; font-size: 20px; font-weight: bold; text-align: center; position: sticky; top: 0; z-index: 100; }
    
    .tool-box { background: #222; padding: 15px; display: flex; justify-content: center; gap: 10px; border-bottom: 2px solid #444; }
    button { padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; }
    .btn-run { background: #ffd600; color: #000; }
    .btn-reset { background: #555; color: #fff; }

    .chart-wrapper { position: relative; margin: 30px auto; display: inline-block; background: #fff; padding: 10px; border-radius: 4px; }
    table { border-collapse: collapse; color: #000; z-index: 5; position: relative; }
    td, th { border: 1px solid #bbb; width: 55px; height: 50px; text-align: center; font-weight: 800; font-size: 18px; }
    th { background: #f4f4f4; font-size: 11px; height: 30px; }

    /* Exact Styling as per your Screenshot */
    .base-red { border: 3px solid #ff0000 !important; background: rgba(255,0,0,0.1) !important; color: #ff0000; }
    .touch-blue { border: 3px solid #0000ff !important; border-radius: 50% !important; color: #0000ff; background: rgba(0,0,255,0.05); }
    
    #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }
</style>
</head>
<body>

<div class="nav">DPBOSS KING - ADVANCED TABLE TRICK ENGINE</div>

<div class="tool-box">
    <input type="file" id="csv" accept=".csv" onchange="uploadCSV()">
    <select id="selDay">
        <option value="0">MON</option><option value="1">TUE</option><option value="2">WED</option>
        <option value="3">THU</option><option value="4">FRI</option><option value="5">SAT</option>
    </select>
    <button class="btn-run" onclick="cloneRealPattern()">RUN CHECK LINE (PATTERN CLONE)</button>
    <button class="btn-reset" onclick="resetUI()">RESET</button>
</div>

<div class="chart-wrapper" id="box">
    <canvas id="canvas"></canvas>
    <table id="targetTable">
        <thead><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
// Family Groups Logic
const families = {
    "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"],
    "14":["14","19","41","46","64","69","91","96"], "15":["01","06","10","15","51","56","60","65"],
    "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"],
    "35":["03","08","30","35","53","58","80","85"], "45":["04","09","40","45","54","59","90","95"]
};

let mainData = [["00","00","00","00","00","00"]];

function render() {
    const b = document.getElementById('tbody');
    b.innerHTML = mainData.map((row, r) => `<tr>${row.map((c, d) => 
        `<td onclick="markMe(this)" contenteditable="true" onblur="mainData[${r}][${d}]=this.innerText">${c}</td>`).join('')}</tr>`).join('');
    setTimeout(fixCanvas, 100);
}

function markMe(td) {
    if(td.classList.contains('base-red')) { td.classList.remove('base-red'); td.classList.add('touch-blue'); }
    else if(td.classList.contains('touch-blue')) { td.classList.remove('touch-blue'); }
    else { td.classList.add('base-red'); }
}

function fixCanvas() {
    const c = document.getElementById('canvas');
    const b = document.getElementById('box');
    c.width = b.scrollWidth; c.height = b.scrollHeight;
}

function getFam(v) {
    for(let k in families) if(families[k].includes(v)) return families[k];
    return [v, v.split('').reverse().join('')];
}

function cloneRealPattern() {
    const day = parseInt(document.getElementById('selDay').value);
    const table = document.getElementById('targetTable');
    const ctx = document.getElementById('canvas').getContext('2d');
    
    // Step 1: Niche wale pattern (Master) ko scan karo
    let master = null;
    for(let r = mainData.length-1; r >= 0; r--) {
        if(table.rows[r+1].cells[day].classList.contains('base-red')) {
            master = { val: mainData[r][day], row: r, day: day, shapes: [] };
            // Aas-paas ke sabhi blue circles dhoondo jo pattern bana rahe hain
            document.querySelectorAll('.touch-blue').forEach(b => {
                let br = b.parentElement.rowIndex - 1;
                let bd = b.cellIndex;
                master.shapes.push({ rDiff: br - r, dDiff: bd - day });
            });
            break;
        }
    }

    if(!master) { alert("Niche 'Current Set' mein Red Box lagayein!"); return; }

    const famList = getFam(master.val);
    ctx.clearRect(0,0,10000,10000);
    ctx.strokeStyle = "blue"; ctx.lineWidth = 2.5;

    // Step 2: History mein jahan bhi Family mile, wahan exact "Geometry" copy karo
    mainData.forEach((row, rIdx) => {
        if(famList.includes(row[day])) {
            const baseCell = table.rows[rIdx+1].cells[day];
            baseCell.classList.add('base-red');

            master.shapes.forEach(s => {
                let targetR = rIdx + s.rDiff;
                let targetD = day + s.dDiff;
                if(table.rows[targetR+1] && table.rows[targetR+1].cells[targetD]) {
                    const resCell = table.rows[targetR+1].cells[targetD];
                    resCell.classList.add('touch-blue');
                    
                    // Draw Line exactly like Dpbossking
                    ctx.beginPath();
                    ctx.moveTo(baseCell.offsetLeft + 28, baseCell.offsetTop + 25);
                    ctx.lineTo(resCell.offsetLeft + 28, resCell.offsetTop + 25);
                    ctx.stroke();
                }
            });
        }
    });
}

function uploadCSV() {
    const f = document.getElementById('csv').files[0];
    const r = new FileReader();
    r.onload = (e) => {
        mainData = e.target.result.split("\n").map(l => l.split(",").map(c => c.trim())).filter(l => l.length > 1);
        render();
    };
    r.readAsText(f);
}

function resetUI() {
    document.querySelectorAll('td').forEach(t => t.className = "");
    document.getElementById('canvas').getContext('2d').clearRect(0,0,10000,10000);
}

window.onload = render;
</script>
</body>
</html>
