<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani Pro AI – Pradeep Kumar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#ffd700; --red:#ff4757; --blue:#2e86de; --bg:#0f172a; --panel:#1e293b; }
*{box-sizing:border-box;font-family:Poppins}
body{margin:0;background:var(--bg);color:#fff;overflow-x:hidden}
#home{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#home h1{color:var(--gold);font-size:3rem;margin:0}
#app{display:none;padding:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;justify-content:center}
.toolbar button{background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer}
.table-box{position:relative;background:#fff;border-radius:12px;padding:8px;display:inline-block;box-shadow: 0 10px 40px rgba(0,0,0,0.6)}
table{border-collapse:collapse;color:#000}
td,th{border:1px solid #cbd5e1;width:48px;height:48px;text-align:center;font-weight:800;font-size:17px;cursor:pointer}
th{background:#1e293b;color:#fff;font-size:11px}
.circle-red{border:4px solid var(--red)!important;border-radius:50%;background:rgba(255,71,87,0.3)}
.circle-blue{border:4px solid var(--blue)!important;border-radius:50%;background:rgba(46,134,222,0.3)}
.marked-origin{background: #fef08a !important; color: #000 !important; border: 2px solid #ca8a04 !important;}
canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:5}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:20px;margin-top:20px}
.card{background:var(--panel);padding:18px;border-radius:15px;border-top:5px solid var(--gold)}
.match-btn{background:#2d3748;padding:12px;margin:6px 0;border-radius:8px;border-left:5px solid var(--gold);cursor:pointer;font-size:13px}
</style>
</head>
<body>

<div id="home">
 <h1>Rajdhani PRO AI</h1>
 <p>SYSTEM FOR PRADEEP KUMAR</p>
 <button onclick="start()" style="background:var(--gold);padding:15px 40px;border-radius:30px;font-weight:800;border:none;cursor:pointer;margin-top:20px">START</button>
</div>

<div id="app">
 <div class="toolbar">
  <input type="file" id="csvFile" accept=".csv" style="display:none">
  <button onclick="csvFile.click()">📂 UPLOAD CSV</button>
  <button onclick="addRow()">➕ ADD ROW</button>
  <button onclick="saveData()">💾 SAVE LOCAL</button>
  <button onclick="location.reload()" style="background:#dc2626">🔄 RESET</button>
 </div>
 
 <center><div class="table-box"><canvas id="mainCanvas"></canvas><table id="tbl"></table></div></center>
 
 <div class="dashboard">
  <div class="card"><b>✔ CHECK LINES (HISTORY)</b><div id="checks">Click (**) to find family patterns...</div></div>
  <div class="card"><b>🔮 FUTURE AI (3-PAIRS)</b><div id="future" style="font-size:1.8rem;text-align:center;color:var(--gold);font-weight:800">--</div></div>
 </div>
</div>

<script>
const FAMILY={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"11":["11","66","16","61"],"22":["22","77","27","72"],"33":["33","88","38","83"],"44":["44","99","49","94"],"55":["55","00","05","50"]};
let data = JSON.parse(localStorage.getItem("raj_ai_data")) || Array(10).fill().map(()=>Array(5).fill("**"));
let activeMark=null;

function fam(v){for(let k in FAMILY)if(FAMILY[k].includes(v))return k; return "NA";}
function norm(v){if(!v||v=="**")return"**"; v=String(v); return v.length==1?"0"+v:v;}
function start(){document.getElementById("home").style.display="none";document.getElementById("app").style.display="block";draw();}

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
 data.forEach((r,i)=>{
  h+="<tr>";
  r.forEach((c,j)=>{
   let cls="";
   if(activeMark && activeMark.map[i] && activeMark.map[i][j]) cls = activeMark.map[i][j]===1 ? "circle-red" : "circle-blue";
   if(activeMark && activeMark.originR === i && activeMark.originC === j) cls += " marked-origin";
   h+=`<td class="${cls}" contenteditable onblur="data[${i}][${j}]=norm(this.innerText);saveData()" onclick="cellClick(${i},${j})">${c}</td>`;
  });
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 setTimeout(drawLines, 50);
}

function cellClick(r,c){
 if(data[r][c] === "**") findFamilyPattern(r,c);
 else highlightFamilyOrigin(r,c);
}

function highlightFamilyOrigin(r,c){
 let targetFam = fam(data[r][c]);
 for(let i=r-1; i>=0; i--){
  for(let j=0; j<5; j++){
   if(fam(data[i][j]) === targetFam){
    activeMark = { map:[], originR: i, originC: j };
    draw(); return;
   }
  }
 }
}

function findFamilyPattern(r,c){
 let scanResults = [];
 let baseFamilies = [];
 
 // Get last 5 active rows
 for(let i=r-1; i>=0 && baseFamilies.length < 4; i--){
  for(let j=0; j<5; j++){
   let f = fam(data[i][j]);
   if(f!=="NA") baseFamilies.push({f, dr: i-r, dc: j});
  }
 }

 if(baseFamilies.length < 2) return alert("Please enter more record data first.");

 // Scan entire record
 for(let i=0; i<data.length; i++){
  if(i === r) continue;
  let matches = 0;
  baseFamilies.forEach(b => {
   let checkR = i + b.dr, checkC = b.dc;
   if(checkR >=0 && checkR < data.length && fam(data[checkR][checkC]) === b.f) matches++;
  });
  if(matches >= 2) scanResults.push({row: i, score: matches, baseFamilies});
 }

 let div = document.getElementById("checks"); div.innerHTML = "";
 scanResults.sort((a,b)=>b.score - a.score).slice(0,5).forEach(m => {
  let btn = document.createElement("div"); btn.className = "match-btn";
  btn.innerText = `Family Match Row ${m.row+1} (Score: ${m.score})`;
  btn.onclick = () => {
   let map = Array(data.length).fill().map(()=>Array(5).fill(0));
   let o1=[], o2=[];
   m.baseFamilies.forEach((b, idx) => {
    let nr = m.row + b.dr;
    if(nr>=0 && nr<data.length){
        map[nr][b.dc] = (idx < 2) ? 1 : 2;
        if(idx < 2) o1.push({r:nr, c:b.dc}); else o2.push({r:nr, c:b.dc});
    }
   });
   activeMark = {map, o1, o2, originR: m.row, originC: c};
   draw();
  };
  div.appendChild(btn);
 });

 if(scanResults.length > 0) {
    let pred = data[scanResults[0].row][c];
    document.getElementById("future").innerText = pred !== "**" ? pred + " - " + norm(String((parseInt(pred)+5)%100)) : "12-67-17";
 } else { div.innerHTML = "No patterns found yet."; }
}

function drawLines(){
 const cvs=document.getElementById("mainCanvas"), ctx=cvs.getContext("2d"), table=document.getElementById("tbl");
 if(!table.rows.length || !activeMark || !activeMark.o1) return;
 cvs.width=table.offsetWidth; cvs.height=table.offsetHeight;
 const rect=table.getBoundingClientRect();
 ctx.clearRect(0,0,cvs.width,cvs.height);
 
 const drawP = (pts, col) => {
  if(pts.length < 2) return;
  pts.sort((a,b)=>a.r - b.r);
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath();
  pts.forEach((p,i) => {
   let cell = table.rows[p.r].cells[p.c].getBoundingClientRect();
   let x = cell.left - rect.left + cell.width/2;
   let y = cell.top - rect.top + cell.height/2;
   i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
 };
 drawP(activeMark.o1, "#ff4757"); drawP(activeMark.o2, "#2e86de");
}

function saveData(){ localStorage.setItem("raj_ai_data", JSON.stringify(data)); alert("Saved!"); }
function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
document.getElementById("csvFile").onchange = e => {
 let reader = new FileReader();
 reader.onload = () => {
  data = reader.result.split("\n").filter(x=>x.trim()).map(l=>l.split(",").slice(0,5).map(v=>norm(v.trim())));
  draw();
 };
 reader.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
